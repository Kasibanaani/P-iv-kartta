<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appi-appi</title>
<style>
:root{
  --bg:#F5F3EE;--cell:#FFFEFA;--tint:#F9F7F2;--label:#252B28;--label2:#5E685F;--label3:#8A938B;--sep:#DDE2D9;--sep2:#E9ECE5;
  --accent:#39775A;--accent2:#2F6449;--fill:#E7F0E7;--fill2:#CBDDD0;--on:#FFFFFF;--dot:#D6DBD2;--bar:rgba(245,243,238,.9);
  --shadow:0 1px 2px rgba(40,50,40,.06),0 6px 18px -6px rgba(40,50,40,.18);--shadow2:0 2px 6px rgba(40,50,40,.08),0 18px 44px -12px rgba(40,50,40,.28);
  --ok:#2F8A55;--okf:#E0F2E6;--no:#8A938B;--nof:#EEF0EC;--warn:#B4561E;--vtc:#B4530A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --h0:#68716C;--s0:#EEF0EC;--h1:#C2453A;--s1:#FBE4E0;--h2:#C46A1E;--s2:#FCEBDB;--h3:#A8820E;--s3:#FBF1C7;
  --h4:#39775A;--s4:#E2EFE5;--h5:#1F7C80;--s5:#DCEFEE;--h6:#386EA2;--s6:#E1EBF6;--h7:#7B5A9E;--s7:#EEE6F6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151B18;--cell:#202922;--tint:#1A211D;--label:#EEF1E9;--label2:#ACB8AE;--label3:#7F8B82;--sep:#3B473E;--sep2:#2C352F;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#0F1A13;--dot:#2E3831;--bar:rgba(21,27,24,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.6);--shadow2:0 18px 44px -12px rgba(0,0,0,.7);
  --ok:#7FD39E;--okf:#1E3A28;--no:#7F8B82;--nof:#262E29;--warn:#F2A06A;--vtc:#F5A35C;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h2:#F5A25E;--s2:#3D2A1A;--h3:#E8C454;--s3:#3A3218;
  --h4:#8FD3AE;--s4:#1F3528;--h5:#6FD0D2;--s5:#163536;--h6:#8FBCEB;--s6:#1B2C3F;--h7:#C5A6EA;--s7:#2F2440;
}}
:root[data-theme="dark"]{
  --bg:#151B18;--cell:#202922;--tint:#1A211D;--label:#EEF1E9;--label2:#ACB8AE;--label3:#7F8B82;--sep:#3B473E;--sep2:#2C352F;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#0F1A13;--dot:#2E3831;--bar:rgba(21,27,24,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.6);--shadow2:0 18px 44px -12px rgba(0,0,0,.7);
  --ok:#7FD39E;--okf:#1E3A28;--no:#7F8B82;--nof:#262E29;--warn:#F2A06A;--vtc:#F5A35C;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h2:#F5A25E;--s2:#3D2A1A;--h3:#E8C454;--s3:#3A3218;
  --h4:#8FD3AE;--s4:#1F3528;--h5:#6FD0D2;--s5:#163536;--h6:#8FBCEB;--s6:#1B2C3F;--h7:#C5A6EA;--s7:#2F2440;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.h0{--hc:var(--h0);--hs:var(--s0)}.h1{--hc:var(--h1);--hs:var(--s1)}.h2{--hc:var(--h2);--hs:var(--s2)}.h3{--hc:var(--h3);--hs:var(--s3)}
.h4{--hc:var(--h4);--hs:var(--s4)}.h5{--hc:var(--h5);--hs:var(--s5)}.h6{--hc:var(--h6);--hs:var(--s6)}.h7{--hc:var(--h7);--hs:var(--s7)}

/* ---------- Yläpalkki ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--sep);z-index:30}
.tb{border:0;background:transparent;border-radius:9px;padding:7px 11px;font-weight:600;color:var(--label)}
.tb:hover{background:var(--sep2)}
.tb.pri{background:var(--accent);color:var(--on)}
.tb.pri:hover{background:var(--accent2)}
#projbtn{font-size:15px;font-weight:700;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#projbtn small{font-weight:500;color:var(--label3);margin-left:4px}
.seg{display:inline-flex;background:var(--sep2);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 16px;font-weight:600;color:var(--label2)}
.seg button.on{background:var(--cell);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
.kstat{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;color:var(--label2)}
.kstat.dirty{color:var(--h1);font-weight:600}
#top>.tb.ghchip.bad,.tb.ghchip.bad{color:var(--h1)}
.ghf{display:block;margin:0 0 8px}.ghf>span{display:block;font-size:12px;color:var(--label2);margin-bottom:3px}.ghf input[type=text],.ghf input[type=password]{width:100%;border:1px solid var(--sep);border-radius:9px;padding:8px 10px;background:var(--tint);color:var(--label)}
.ghmsg{font-size:13px;margin:8px 0 0;color:var(--label2);min-height:1em}.ghmsg.bad{color:var(--h1)}
.ghhelp summary{cursor:pointer;font-weight:600;font-size:13px;margin-top:10px}.ghhelp p{font-size:12.5px;color:var(--label2);margin:6px 0}
#redobtn{min-width:34px;padding:7px 9px}#redobtn:disabled{opacity:.4}
#lockbtn.locked{background:var(--fill);color:var(--accent)}

/* ---------- Runko ---------- */
#body{position:fixed;left:0;right:0;top:52px;bottom:0;display:flex}
#pal{width:232px;flex:none;border-right:1px solid var(--sep);background:var(--tint);overflow-y:auto;padding:12px 12px 40px}
#insp{width:320px;flex:none;border-left:1px solid var(--sep);background:var(--tint);overflow-y:auto;padding:14px 16px 60px}
#stage{flex:1;position:relative;overflow:hidden}
.hidepanels #pal,.hidepanels #insp{display:none}
.pt-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label3);margin:16px 2px 7px}
.pt-h:first-child,.pks+.pt-h{margin-top:2px}
.seg.pks{display:flex;margin-bottom:12px}.seg.pks button{flex:1;padding:5px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--cell);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:550;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.chip:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.chip .ci{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--hs);color:var(--hc)}
.chip.sym{min-width:38px;justify-content:center;font-size:16px;font-weight:700;padding:4px 8px}
.chip.qk{cursor:pointer}
.hrows{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.hrow{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-areas:'m a b' 'r t h';gap:5px;align-items:center;padding:6px;border-radius:10px;border:1px solid var(--sep2)}
.hrow .hm{grid-area:m}.hrow .ha{grid-area:a}.hrow .hbb{grid-area:b}.hrow .hr{grid-area:r;text-align:right;color:var(--label2);font-weight:650;padding-right:4px}.hrow .ht{grid-area:t}.hrow .hb{grid-area:h;justify-content:flex-end}
.hrow.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.hrow input,.hrow select{min-width:0;width:100%}
.hrow .hb{display:flex;gap:2px}
.hrow .hb button{border:0;background:transparent;color:var(--label2);font-size:14px;padding:2px 5px;border-radius:6px;cursor:pointer}
.hrow .hb button:hover{background:var(--tint);color:var(--label)}
.qkf textarea,.qkf input[type=text]{width:100%;border:1px solid var(--sep);border-radius:9px;padding:8px 10px;background:var(--tint);color:var(--label);font:inherit}
.chip.on{border-color:var(--accent);background:var(--fill)}
.chip.wide{width:100%}
.plist{display:flex;flex-direction:column;gap:3px}
.plist .chip{width:100%;justify-content:flex-start}
.plist .chip small{margin-left:auto;color:var(--label3);font-weight:500;font-size:11px}
.psearch{width:100%;border:1px solid var(--sep);background:var(--cell);border-radius:9px;padding:6px 9px;margin-bottom:6px}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:var(--shadow2)}

/* ---------- Kanvaasi ---------- */
.vp{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.6px);touch-action:none;cursor:default}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}
.world.anim{transition:transform .5s cubic-bezier(.3,.8,.25,1)}
.vp svg.lay{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.zoomc{position:absolute;right:14px;bottom:14px;display:flex;gap:2px;background:var(--cell);border:1px solid var(--sep);border-radius:11px;padding:3px;box-shadow:var(--shadow);z-index:6}
.zoomc button{border:0;background:transparent;border-radius:8px;min-width:30px;height:28px;font-weight:700;color:var(--label2)}
.zoomc button:hover{background:var(--sep2)}
.coords{position:absolute;left:36px;bottom:14px;font:12px ui-monospace,Menlo,monospace;color:var(--label2);background:var(--cell);border:1px solid var(--sep);border-radius:8px;padding:4px 8px;z-index:6;box-shadow:var(--shadow)}
.ruler{position:absolute;z-index:5;background:var(--bar);overflow:hidden;font:10px ui-monospace,Menlo,monospace;color:var(--label3);pointer-events:none}
.ruler.rx{left:22px;right:0;top:40px;height:18px;border-bottom:1px solid var(--sep)}
.ruler.ry{left:0;top:58px;bottom:0;width:22px;border-right:1px solid var(--sep)}
.ruler span{position:absolute;white-space:nowrap}
.ruler.rx span{top:3px;border-left:1px solid var(--sep);padding-left:3px;height:15px}
.ruler.ry span{left:0;width:22px;border-top:1px solid var(--sep);padding-top:2px;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--label);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:7;box-shadow:var(--shadow2)}
.empty-c{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--label3);pointer-events:none;max-width:420px;line-height:1.5}
.empty-c b{display:block;color:var(--label2);font-size:16px;margin-bottom:4px}

/* Näkymien välilehdet */
#vtabs{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:4px;padding:0 10px;z-index:8;background:var(--bar);border-bottom:1px solid var(--sep);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto}
#vtabs .vt{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--label2);white-space:nowrap}
#vtabs .vt.on{background:var(--cell);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#vtabs .vt:hover{color:var(--label)}
#vtabs input{border:1px solid var(--accent);border-radius:7px;padding:4px 8px;width:150px;background:var(--cell)}
.locked-ui #vtabs.one{display:none}
.uvp{top:40px}
.locked-ui .uvp.one{top:0}
/* Laitemuoto (Pajakone): muokatessa laitteen ruutu kehyksenä kanvaasilla, käytössä laitteen muotoinen ikkuna */
.edit .ue.krlock{pointer-events:none;opacity:.55}
.krl{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.krr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:5px 6px;border:1px solid var(--sep);border-radius:10px;background:var(--tint)}
.krr .krb{flex-basis:100%;display:flex;align-items:center;flex-wrap:wrap;gap:0;padding-left:22px;min-width:0}
.krr.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.krr input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;padding:3px 4px;border-radius:6px}
.krr input:focus{background:var(--cell);outline:1px solid var(--accent)}
.krr button{border:0;background:transparent;border-radius:7px;min-width:26px;height:26px;color:var(--label2);cursor:pointer;font-size:13px}
.krr button:hover{background:var(--sep2)}
.krr button.off{opacity:.35}
.krr select{max-width:108px;margin-right:auto;font-size:12px;border:1px solid var(--sep);border-radius:7px;background:var(--cell);padding:2px}
.krr small{color:var(--label3);font-size:11px;min-width:18px;text-align:right}
.w-tatti{flex:1;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.w-tatti .tkr{position:absolute;inset:4%;border-radius:50%;background:color-mix(in srgb,var(--hc) 12%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hc) 30%,transparent)}
.w-tatti .tk{position:absolute;width:36%;height:36%;border-radius:50%;transform:translate(-50%,-50%);background:var(--hc);box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none}
.w-kuva{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:inherit}
.w-kuva img{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.w-kuva.tyhja{border:1.5px dashed var(--sep);border-radius:12px;color:var(--label3);font-size:13px;text-align:center;padding:8px}
.ue .w-btn.w-inv{background:transparent;box-shadow:none;color:transparent}
.ue .w-btn.w-inv:active{background:rgba(127,127,127,.12)}
.edit .ue .w-btn.w-inv{outline:1.5px dashed var(--vtc);outline-offset:-2px;color:var(--vtc);font-size:12px;font-weight:600;background:color-mix(in srgb,var(--vtc) 7%,transparent)}
.ue.rvlock{outline:1.5px dashed var(--vtc);outline-offset:3px}
.dupc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.dupc input{width:58px;border:1px solid var(--sep);border-radius:8px;padding:5px 7px;background:var(--tint)}
.dframe{position:absolute;left:0;top:0;border:2px solid var(--accent);border-radius:44px;box-shadow:0 0 0 100000px rgba(0,0,0,.05);pointer-events:none}
.dframe.dworld{box-shadow:none;border-style:dashed}
.ue .hitb{position:absolute;border:1.5px dashed var(--label3);pointer-events:none;z-index:3}
.ue .hitb.mv{border-color:var(--accent)}
.ksl{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.ksr{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--sep);border-radius:9px;background:var(--tint)}
.ksr img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:var(--cell)}
.ksr .ksn{min-width:16px;font:600 12px var(--font,system-ui);color:var(--label2)}
.ksr small{flex:1;color:var(--label3);font-size:11px}.ksr .kse{width:34px;font-size:10px;color:var(--label3)}
.ksr button{border:0;background:transparent;border-radius:7px;min-width:24px;height:24px;color:var(--label2);cursor:pointer}
.ksr button:disabled{opacity:.3}
.w-kuva{position:relative}
.w-kuva .ksbadge{position:absolute;right:4px;bottom:4px;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--cell);color:var(--label2);opacity:.85}
#ksuusi{flex:1;min-width:0}
.rgrid{position:absolute;pointer-events:none;--rg1:color-mix(in srgb,var(--accent) 38%,transparent);--rg2:color-mix(in srgb,var(--accent) 14%,transparent)}
.rgrid.use{--rg1:color-mix(in srgb,var(--label3) 30%,transparent)}
.krr .krg{gap:4px;font-size:12px;color:var(--label2);flex-wrap:wrap}
.krr .krg input[data-krg="rk"]{flex:none;width:48px;font-weight:400;border:1px solid var(--sep);background:var(--cell)}
.krr .krg label{display:flex;align-items:center;gap:3px;font-size:12px}
.krr .krg select{max-width:none;margin-right:0}
.krr .krg input[type=checkbox]{flex:none;width:auto}
.ue.k-reitti>.in{overflow:visible}.ue.k-reitti .rh{display:none}.uvp:not(.edit) .ue.k-reitti{pointer-events:none}
.w-reitti .rl{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.75}.w-reitti .rl.u{stroke-width:2;stroke-dasharray:6 6;opacity:.5}
.w-reitti .rpt{fill:var(--cell);stroke:var(--accent);stroke-width:2}.w-reitti .rpt.r0{fill:var(--accent)}.edit .ue.k-reitti .rpt{pointer-events:auto;cursor:move}
.hint .ib{margin-left:8px}
.tgtm{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;opacity:.7;z-index:1}
.dframe .dzone{position:absolute;border:2px dotted var(--accent);border-radius:50%;opacity:.6}
.dframe span{position:absolute;left:18px;top:-24px;font:600 12px var(--font,system-ui);color:var(--accent);white-space:nowrap}
.devstage{background:var(--sep2)}
.devstage .zoomc{display:none}
.uvp.dev{box-shadow:0 0 0 10px #1C1C1E,0 0 0 11px rgba(0,0,0,.25),0 24px 60px rgba(0,0,0,.28)}
.uvp.dev.devfull{box-shadow:none}

/* ---------- Näkymäpalikat ---------- */
.ue{position:absolute;display:flex;flex-direction:column}
.ue>.in{flex:1;min-height:0;display:flex;flex-direction:column}
.edit .ue{cursor:move}
.edit .ue .in{pointer-events:none}
.edit .ue.sel{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.edit .ue:hover:not(.sel){outline:1px dashed var(--label3);outline-offset:3px;border-radius:12px}
.ue .rh{display:none;position:absolute;right:-9px;bottom:-9px;width:14px;height:14px;border-radius:5px;background:var(--cell);border:2px solid var(--accent);cursor:nwse-resize;z-index:3}
.edit .ue.sel .rh{display:block}
.ue .nmtag{display:none;position:absolute;left:0;top:-22px;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:6px}
.edit .ue.sel .nmtag,.edit.shownames .ue .nmtag{display:block}
.ue.hid{display:none}
.edit .ue.hid{display:flex;opacity:.38;filter:grayscale(.7)}
.ue.dim{pointer-events:none}
.ue.dim>.in{opacity:.4;filter:grayscale(1)}
.edit .ue.dim{pointer-events:auto}
.ue.ro{pointer-events:none}
.edit .ue.ro{pointer-events:auto}
.ue.ro .w-btn,.ue.ro .sbtn,.ue.ro .box,.ue.ro .sw{opacity:.55}
.ue .nks{display:none;position:absolute;left:2px;top:calc(100% + 4px);font-size:12px;font-weight:550;color:var(--label2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.ue.dim>.nks,.ue.ro>.nks{display:block}
.locked-ui .ue.k-merkki,.locked-ui .ue.k-alue{display:none}
.ue.k-alue{pointer-events:none}.ue.k-alue .alab,.ue.k-alue .rh{pointer-events:auto}
.w-area{position:absolute;inset:0;border:2px dashed var(--hc);border-radius:10px;background:color-mix(in srgb,var(--hc) 5%,transparent)}
.w-area .alab{position:absolute;left:8px;top:-13px;background:var(--hc);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;cursor:move}
.ue.k-alue .nmtag{display:none!important}
.w-mark.keski{border-radius:50%;font-size:20px}
.mframe{position:absolute;border:2px dashed var(--accent);border-radius:6px;pointer-events:none;z-index:0}
.mframe span{position:absolute;left:6px;top:-11px;font-size:11px;font-weight:700;background:var(--accent);color:#fff;padding:1px 8px;border-radius:999px;white-space:nowrap}
.zoomc .zsep{width:1px;background:var(--sep);margin:3px 4px}
.zoomc .ponly{font-weight:600;font-size:12.5px;padding:0 8px}
.zoomc .ponly{display:none}.edit~.zoomc .ponly{display:inline-block}
.zoomc .zsep{display:none}.edit~.zoomc .zsep{display:block}
.nopan~.zoomc{display:none}
.card{background:var(--cell);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--sep2)}

.w-btn{flex:1;border:0;border-radius:12px;background:var(--hs);color:var(--hc);font-weight:650;font-size:15px;padding:0 14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 18%,transparent);transition:transform .08s,background .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--sep);background:var(--cell);display:grid;place-items:center;transition:all .15s}

.sw{width:46px;height:28px;border-radius:99px;background:var(--sep);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--hc)}
.sw.on i{transform:translateX(18px)}
.w-pad{flex:1;padding:11px 12px 10px;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:hidden}
.w-sl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.w-sl .row b{color:var(--hc);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--hc) var(--p,50%),var(--sep) var(--p,50%));outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.fld{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:10px;padding:8px 10px;outline:none;transition:border .15s,box-shadow .15s}
.fld:focus{border-color:var(--hc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--hc,var(--accent)) 18%,transparent);background:var(--cell)}
textarea.fld{resize:none;flex:1}
.w-num{display:flex;gap:6px}
.w-num .fld{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sbtn{border:0;border-radius:10px;width:38px;flex:none;background:var(--hs);color:var(--hc);font-weight:800;font-size:17px}
.w-date{display:flex;gap:6px}
.w-date .sbtn{width:auto;padding:0 10px;font-size:12px;font-weight:700}
.dsub{font-size:12px;color:var(--label3);margin:6px 2px 0}
.w-txt{flex:1;display:flex;align-items:center;line-height:1.3;white-space:pre-wrap;word-break:break-word;color:var(--label);overflow:hidden}
.w-txt.c{justify-content:center;text-align:center}.w-txt.r{justify-content:flex-end;text-align:right}
.w-txt.s-s{font-size:12px;color:var(--label2)}.w-txt.s-m{font-size:15px}.w-txt.s-l{font-size:21px;letter-spacing:-.01em}.w-txt.s-xl{font-size:32px;letter-spacing:-.02em;font-weight:700}
.w-txt.b{font-weight:700}
.w-ilmo{flex:1;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--hs);color:var(--label);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent);font-weight:550;overflow:hidden}
.w-ilmo .ic{width:24px;height:24px;flex:none;border-radius:50%;background:var(--hc);color:var(--cell);display:grid;place-items:center;font-weight:800;font-size:13px}
.w-card{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 12px 10px}
.w-card .ttl{font-weight:700;font-size:14px;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.w-card .ttl small{margin-left:auto;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums}
.lrows{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.lr{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid var(--sep2)}
.lr .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lr.done .lt{color:var(--label3);text-decoration:line-through}
.lr .box{width:20px;height:20px;cursor:pointer}
.lr .ld{width:86px;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 5px;font-size:12px;color:var(--label2);text-align:right}
.lr .ld:hover,.lr .ld:focus{border-color:var(--sep);background:var(--tint);outline:none}
.lr .ld.late{color:var(--h1);font-weight:700}
.lr .x{border:0;background:transparent;color:var(--label3);font-size:16px;width:22px;opacity:0;border-radius:6px}
.lr:hover .x{opacity:1}
.lr .x:hover{background:var(--sep2);color:var(--h1)}
.ladd{margin-top:8px;border:1px dashed var(--sep);background:transparent;border-radius:9px;padding:7px 9px;width:100%;outline:none}
.ladd:focus{border-style:solid;border-color:var(--hc);background:var(--tint)}
.aes{flex:1;overflow-y:auto;min-height:0;padding-left:4px}
.ae{display:flex;gap:10px;position:relative;padding:0 0 12px}
.ae::before{content:"";position:absolute;left:5px;top:12px;bottom:-2px;width:2px;background:var(--sep2)}
.ae:last-child::before{display:none}
.ae i{width:12px;height:12px;border-radius:50%;background:var(--hc);flex:none;margin-top:3px;box-shadow:0 0 0 3px var(--hs)}
.ae b{display:block;font-weight:600;font-size:13px}
.ae span{font-size:12px;color:var(--label3)}
.muted{color:var(--label3);font-size:13px;padding:6px 2px}
.w-shape{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:600;color:var(--label);white-space:pre-wrap;overflow:hidden;background:var(--hs);border:1.5px solid color-mix(in srgb,var(--hc) 45%,transparent);border-radius:16px}
.w-shape.ympyra{border-radius:50%}
.w-shape.pilleri{border-radius:999px}
.w-shape.lappu{border:0;border-radius:3px 3px 18px 3px;background:color-mix(in srgb,var(--hs) 70%,var(--hc) 30%);box-shadow:0 10px 18px -12px rgba(0,0,0,.45);font-family:"Marker Felt","Bradley Hand",var(--font)}
.w-shape.kehys{background:transparent;border:2px dashed color-mix(in srgb,var(--hc) 60%,transparent)}
.w-mark{width:36px;height:36px;border-radius:50% 50% 50% 4px;background:var(--hc);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
.chart svg{width:100%;flex:1;min-height:0;overflow:visible}
.chart text{font-family:var(--font)}
.cal{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px}
.cal .ch{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal .ch b{flex:1;font-size:14px;text-transform:capitalize}
.cal .ch button{border:0;background:var(--sep2);border-radius:8px;width:28px;height:26px;font-weight:800;color:var(--label2)}
.cal .cg{flex:1;display:grid;grid-template-columns:28px repeat(7,1fr);grid-auto-rows:1fr;gap:2px;font-size:12px;font-variant-numeric:tabular-nums;min-height:0}
.cal .cg>div{display:flex;align-items:center;justify-content:center;border-radius:8px;position:relative}
.cal .cg .hd{font-weight:700;color:var(--label3);font-size:10.5px;text-transform:uppercase}
.cal .cg .wk{color:var(--label3);font-size:10.5px;font-weight:600}
.cal .cg .o{color:var(--label3);opacity:.5}
.cal .cg .td{background:var(--hc);color:var(--cell);font-weight:800}
.cal .cg .mk::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--h1)}
.cal .cg .td.mk::after{background:var(--cell)}
#udeco line,#udeco path{stroke-linecap:round}
#udeco .dl{pointer-events:stroke;cursor:pointer}
.ln-hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}

/* ---------- Logiikka ---------- */
.ln{position:absolute;min-width:84px;max-width:240px;background:var(--cell);border-radius:11px;border:1px solid var(--sep);box-shadow:var(--shadow);font-size:12.5px;cursor:grab;user-select:none;-webkit-user-select:none;z-index:2}
.ln::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gc)}
.ln.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.ln{display:flex;flex-direction:column;justify-content:center}
.ln .lb{display:flex;align-items:center;gap:7px;padding:7px 10px 7px 12px;min-height:34px}
.ln .lic{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--gc) 16%,transparent);color:var(--gc)}
.ln .lt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .lt b{font-size:15px;margin:0 3px;color:var(--gc)}
.ln .lt i{font-style:normal;color:var(--label2);font-weight:500}
.ln .cap{position:absolute;left:10px;top:-17px;font-size:10.5px;font-weight:700;color:var(--label3);white-space:nowrap}
.lv{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--nof);color:var(--label2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv.on{background:var(--kylf);color:var(--kyl)}
.lv.off{background:var(--einf);color:var(--ein)}
/* Pajakone 4: kyllä vihreä, ei sininen (punainen kuuluu ketjuille, oranssi viitteille). Kontrasti ≥ 4,5:1 molemmissa tiloissa. */
:root{--kyl:#1B7140;--kylf:#DDF2E4;--ein:#2563B8;--einf:#E0EBFA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kyl:#7FD9A0;--kylf:#173A26;--ein:#8DBDF5;--einf:#1A2C45}}
:root[data-theme="dark"]{--kyl:#7FD9A0;--kylf:#173A26;--ein:#8DBDF5;--einf:#1A2C45}
:root[data-appearance-mode="light"] :is(#top,#pal,#insp,#menu,#sheet,#welcome,#toast,#lvp){--kyl:#1B7140;--kylf:#DDF2E4;--ein:#2563B8;--einf:#E0EBFA}
:root[data-appearance-mode="dark"] :is(#top,#pal,#insp,#menu,#sheet,#welcome,#toast,#lvp){--kyl:#7FD9A0;--kylf:#173A26;--ein:#8DBDF5;--einf:#1A2C45}
.yn{display:inline-block;font-weight:700;font-size:12px;line-height:1.5;padding:0 7px;border-radius:99px}.yn.y{background:var(--kylf);color:var(--kyl)}.yn.n{background:var(--einf);color:var(--ein)}
/* Ominaisuudet-osio */
#insp details.oms>summary{list-style:none;cursor:pointer;display:flex;align-items:center}#insp details.oms>summary::-webkit-details-marker{display:none}
#insp details.oms>summary h4{margin:0;flex:1}#insp details.oms>summary::after{content:'›';color:var(--label3);font-size:18px;transition:transform .15s}#insp details.oms[open]>summary::after{transform:rotate(90deg)}
#insp details.oms[open]>summary{margin-bottom:8px}
.omr{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--sep2);min-height:32px}.omr:first-of-type{border-top:0}
.omr.drv .omref{border-color:var(--vtc)}
.omref{border:1px solid var(--sep);background:var(--tint);color:var(--vtc);border-radius:7px;padding:2px 7px;font-size:12px;max-width:54%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.omv{flex:1;min-width:0;text-align:right;font-size:12.5px;font-weight:600;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.omt{color:var(--label3)}
.omb{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;border:0;white-space:nowrap}.omb.on{background:var(--s2);color:var(--vtc)}.omb.set{background:var(--sep2);color:var(--label2);cursor:pointer}
.oma{display:flex;gap:2px}.omx{border:0;background:transparent;min-width:26px;height:26px;border-radius:7px;color:var(--label2);cursor:pointer;font-weight:700}.omx:hover{background:var(--sep2)}.omx.nf{color:var(--vtc)}
.edit .ue.omdrv .nmtag::after{content:' ƒ';color:var(--vtc);font-weight:800}
.ln .not{font-size:10px;font-weight:800;background:var(--h1);color:#fff;border-radius:5px;padding:1px 4px}
.ln.g-ui{--gc:var(--h6)}.ln.g-arvo{--gc:var(--h0)}.ln.g-lasku{--gc:var(--h2)}.ln.g-vert{--gc:var(--h7)}.ln.g-ehto{--gc:var(--h4)}.ln.g-tee{--gc:var(--h1)}.ln.g-pvm{--gc:var(--h5)}
.ln.ui-dim{opacity:.55}
.pins{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly;pointer-events:none}
.pins.i{left:-6px}.pins.o{right:-6px}
.pt{width:12px;height:12px;border-radius:50%;background:var(--cell);border:2px solid var(--label3);pointer-events:auto;cursor:crosshair;position:relative;transition:transform .1s}
.pt.e{border-radius:3px;transform:rotate(45deg);border-color:var(--h1)}
.pt:hover,.pt.hot{transform:scale(1.35);border-color:var(--accent);background:var(--fill)}
.pt.e:hover,.pt.e.hot{transform:rotate(45deg) scale(1.35)}
.pt em{display:none;position:absolute;top:-3px;font-style:normal;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--label2);background:var(--bg);padding:1px 5px;border-radius:5px;pointer-events:none}
.pt.e em{transform:rotate(-45deg)}
.pins.i .pt em{right:15px}.pins.o .pt em{left:15px}
.ln:hover .pt em,.lw>.wh:hover~.pins .pt em,.ln.sel .pt em,.lw.sel>.pins .pt em,.linking .pt em{display:block}
.lw{position:absolute;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--wc) 45%,transparent);background:color-mix(in srgb,var(--wc) 7%,transparent);z-index:1}
.lw.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 30%,transparent)}
.lw.drop{background:color-mix(in srgb,var(--wc) 16%,transparent);border-style:dashed}
.lw>.wh{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;cursor:grab}
.lw>.pins{bottom:auto;height:34px}
.lw .wm{border:0;border-radius:8px;background:var(--wc);color:#fff;font-weight:800;font-size:11px;letter-spacing:.05em;padding:4px 8px;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .lw .wm{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lw .wm{color:#111}}
.lw .wnn{width:40px;border:1px solid var(--sep);border-radius:7px;background:var(--cell);text-align:center;padding:2px;font-weight:700;font-size:12px}
.lw .wname{font-weight:700;font-size:12.5px;color:var(--label2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw .wj{font-size:10.5px;font-weight:800;color:var(--wc)}
.lw .rs{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;border-right:2.5px solid color-mix(in srgb,var(--wc) 60%,transparent);border-bottom:2.5px solid color-mix(in srgb,var(--wc) 60%,transparent);border-radius:0 0 12px 0}
.lw.m-and{--wc:var(--h4)}.lw.m-or{--wc:var(--h6)}.lw.m-one{--wc:var(--h7)}.lw.m-min,.lw.m-max,.lw.m-eq,.lw.m-cnt{--wc:var(--h3)}.lw.m-not{--wc:var(--h1)}
.lw.m-sum,.lw.m-avg,.lw.m-maxv,.lw.m-minv{--wc:var(--h2)}
#lsvg path.lk{fill:none;stroke:var(--label3);stroke-width:2;opacity:.75}
#lsvg path.lk.asg{stroke-dasharray:5 4;opacity:.6}
#lsvg path.lk.on{stroke:var(--ok);opacity:1;stroke-width:2.4}
#lsvg path.lk.ev{stroke:var(--h1);stroke-dasharray:5 4;opacity:.8}
#lsvg path.lk.sel{stroke:var(--accent);stroke-width:3.5;opacity:1}
.marq{position:absolute;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:6px;pointer-events:none;z-index:9}
/* Rinnakkain */
#stage.split{display:flex}
#stage.split>.pane{position:relative;overflow:hidden;min-width:0}
.splitbar{flex:none;width:7px;cursor:col-resize;background:var(--sep2);border-left:1px solid var(--sep);border-right:1px solid var(--sep);position:relative;z-index:12}
.splitbar::after{content:"";position:absolute;left:2px;top:50%;width:1px;height:28px;margin-top:-14px;border-left:1px solid var(--label3);border-right:1px solid var(--label3);opacity:.6}
.splitbar:hover{background:var(--fill)}
.edit .ue.sel2,.ue.sel2{outline:2px dashed var(--h6);outline-offset:4px;border-radius:12px}
.ue.has-err .card,.ue.has-err .w-txt{box-shadow:0 0 0 2px color-mix(in srgb,var(--h1) 55%,transparent)}
/* Logiikan korostukset */
.ln.same{border-color:var(--h6);box-shadow:0 0 0 2px color-mix(in srgb,var(--h6) 30%,transparent),var(--shadow)}
.ln.rel,.lw.rel{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.ln.why-yes{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--ok) 55%,transparent),var(--shadow)}
.ln.why-no{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--h1) 45%,transparent),var(--shadow)}
.ln.has-err{border-color:var(--h1)}
.lv.err{background:var(--s1);color:var(--h1)}
.ln.off,.lw.off{opacity:.5;border-style:dashed}
.offt{flex:none;font-size:10px;font-weight:800;color:var(--label3);border:1px solid var(--sep);border-radius:5px;padding:0 4px}
#lsvg path.lk.hl{stroke-width:3;opacity:1}
#lsvg path.lk.fade{opacity:.28}
.lw .wcol{border:0;background:transparent;color:var(--label3);font-weight:800;font-size:14px;width:24px;height:24px;border-radius:7px;flex:none;margin-left:2px}
.lw .wcol:hover{background:color-mix(in srgb,var(--wc) 15%,transparent);color:var(--label)}
.lw.col{height:36px;width:auto;min-width:200px;background:color-mix(in srgb,var(--wc) 12%,var(--cell));border-style:solid;box-shadow:var(--shadow)}
.lw.col>.wh{position:relative;height:34px}
.lw.col .wname small{font-weight:500;color:var(--label3)}
#lsvg path.tmp{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:4 4}
#lsvg .hit,#lsvg2 .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
/* Ikkunan sisäisten nuolten osuma-alue on ikkunoiden päällä (mutta palikoiden alla), jotta ne voi valita.
   Ulkoiset nuolet jäävät ikkunoiden alle, jotteivät ne peitä ikkunan otsikon nappeja. */
#lsvg2{z-index:2}

/* ---------- Tarkastelija ---------- */
.ih{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ih .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--hs);color:var(--hc)}
.ih b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih small{display:block;font-size:12px;color:var(--label3);font-weight:500}
.fs{background:var(--cell);border:1px solid var(--sep2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.fs>h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--label3)}
.f{margin-bottom:9px}
.f:last-child{margin-bottom:0}
.f>label{display:block;font-size:12px;font-weight:600;color:var(--label2);margin-bottom:4px}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:8px;padding:6px 8px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);background:var(--cell)}
.f textarea{resize:vertical;min-height:58px}
.row2{display:flex;gap:6px;align-items:center}
.row2>*{flex:1;min-width:0}

   Osuma-alue b.osu 'laatikko' | 'ympyra' (puuttuva: ympyrän muotoinen Muoto = ympyrä, muuten laatikko), b.osk = koko %

/* ---------- Appi-appi 3: hahmon liike ----------

var NEEDT={aseta:1,lisaa:1,valitse:1,poista:1,vaihda:1,tyhjenna:1,tila:1,kirjaa:1,rivi:1,kaynnista:1,pysayta:1,arvonta:1};
function chainIssues(P,kid,ctx){
  var out=[],b=P.b[kid];if(!b)return out;var steps=chainSteps(P,kid),w=chainNode(P,kid);
  if(!steps.length){out.push({info:1,t:'Ketju on tyhjä: vedä tähän tapahtumia, esim. Aseta arvo tai Ajastin.'});return out;}
  var ids={};steps.forEach(function(n){ids[n.id]=1;});
  var trig=!!b.avaus||Object.keys(P.b).some(function(i){var o=P.b[i];return o.k==='tee'&&o.do==='kaynnista'&&o.o===kid&&!(ids[(nodesOfBlock(P,i)[0]||{}).id]);})||P.lg.l.some(function(l){return (w&&l.t===w.id&&l.tp==='e')||(ids[l.t]&&!isChainLink(P,l)&&(port(P.b[nodeOf(P,l.t).p],'ins',l.tp)||{}).t==='e');});
  if(!trig)out.push({info:1,t:'Mikään ei vielä käynnistä ketjua: vie nuoli kohtaan ”käynnistä”, esim. painikkeesta tai kaavasta. Kokeilla voi ▶-napilla.'});
  if(b.off)out.push({info:1,t:'Ketju on pois päältä: se ei käynnisty.'});
  if(chainIsRing(P,kid))out.push({info:1,t:'Ketju on kehä: jokaiseen palikkaan tulee viiva, joten se alkaa ylimmästä palikasta.'});
  // kehä ilman ajastinta: etsitään kehä, joka ei kulje ajastimen kautta
  var BRK={ajastin:1,odota:1,toista:1};
  var adj={};P.lg.l.forEach(function(l){if(isChainLink(P,l)&&!BRK[P.b[nodeOf(P,l.f).p].k]&&!BRK[P.b[nodeOf(P,l.t).p].k])(adj[l.f]=adj[l.f]||[]).push(l.t);});
  var col={},path=[],cyc=null;
  function dfs(u){if(cyc)return;col[u]=1;path.push(u);(adj[u]||[]).forEach(function(v){if(cyc)return;if(col[v]===1){cyc=path.slice(path.indexOf(v)).concat([v]);}else if(!col[v])dfs(v);});path.pop();col[u]=2;}
  steps.forEach(function(n){if(!col[n.id])dfs(n.id);});
  if(cyc)out.push({n:cyc[0],t:'Kehä ilman ajastinta: '+cyc.map(function(id){return P.b[nodeOf(P,id).p].nm;}).join(' → ')+'. Se pysäytettäisiin heti. Lisää kehään ajastin tai Odota, kunnes.'});
  steps.forEach(function(n){var sb=P.b[n.p],nm='”'+sb.nm+'”';
    if(sb.off)out.push({n:n.id,info:1,t:nm+' on pois käytöstä: ketju jatkuu sen ohi.'});
    if(sb.k==='tee'){var tg=P.b[sb.o];
      if(NEEDT[sb.do]&&!tg)out.push({n:n.id,t:nm+': valitse kohde.'});
      else if(sb.do==='tila'&&tg&&!isBoolKind(tg))out.push({n:n.id,t:nm+': kohde ”'+tg.nm+'” ei ole valittava palikka (painike, valintaruutu, kytkin tai muisti).'});
      else if(sb.do==='arvonta'&&tg&&tg.k!=='satu')out.push({n:n.id,t:nm+': kohde ”'+tg.nm+'” ei ole satunnaisluku.'});
      else if(sb.do==='arvonta'&&tg&&satuSpec(P,tg.id,ctx).err)out.push({n:n.id,t:nm+': satunnaisluvussa ”'+tg.nm+'” on virhe: '+satuSpec(P,tg.id,ctx).err+'.'});
      else if((sb.do==='kaynnista'||sb.do==='pysayta')&&tg&&tg.k!=='ketju')out.push({n:n.id,t:nm+': kohde ”'+tg.nm+'” ei ole ketju.'});
      else if(sb.do==='kaynnista'&&sb.o===kid)out.push({n:n.id,t:nm+': ketju ei voi käynnistää itseään. Toistoon tee kehä ajastimen tai Odota, kunnes -palikan kautta.'});
      else if(sb.do==='kaynnista'&&tg&&tg.off)out.push({n:n.id,info:1,t:nm+': ketju ”'+tg.nm+'” on pois päältä, joten se ei käynnisty.'});}
    if(sb.k==='ajastin'){var d=timerMs(P,sb.id,ctx);if(isErr(d))out.push({n:n.id,t:nm+': '+d.err+'.'});}
    if(sb.k==='toista'){var tn2=toistaN(P,sb,ctx);if(isErr(tn2))out.push({n:n.id,t:nm+': '+tn2.err+'.'});
      else{var lp=chainLinksFrom(P,n.id,'e');if(!lp.length)out.push({n:n.id,info:1,t:nm+': kierros-haara ei jatku mihinkään. Vie se toistettaviin tapahtumiin ja niiden lopusta viiva takaisin tähän.'});}}
    if(sb.k==='arpa'){var miss=[];for(var ai=1;ai<=arpaN(sb);ai++)if(!chainLinksFrom(P,n.id,'a'+ai).length)miss.push(ai);if(miss.length)out.push({n:n.id,info:1,t:nm+': vaihtoehto '+miss.join(', ')+' ei jatku mihinkään, joten ketjun haara päättyy, jos se arvotaan.'});}
    if(sb.k==='monihaara'){var hr=sb.haarat||[];if(!hr.length)out.push({n:n.id,t:nm+': lisää ainakin yksi haara.'});
      hr.forEach(function(r,i){if(r.m==='val'&&!P.b[r.o])out.push({n:n.id,t:nm+', haara '+(i+1)+': valitse palikka.'});});
      if(hr.some(function(r){return r.m!=='val';})&&!Ev(P,ctx).linked(sb.id,'a')&&(sb.a===''||sb.a==null))out.push({n:n.id,t:nm+': valitse arvo, jota haarat vertaavat.'});
      var mr2=Ev(P,ctx).mhRow(sb.id);if(mr2.err)out.push({n:n.id,t:nm+': arvossa on virhe.'});}
    if(sb.k==='odota'){var ov=haaraVal(P,sb,ctx);if(ov&&ov.none&&!odotaEv(P,n.id))out.push({n:n.id,t:nm+': valitse, mitä odotetaan: palikka, ehto nuolesta tai tapahtuma nuolesta.'});
      var ol=odotaLim(sb,P,ctx);if(isErr(ol))out.push({n:n.id,t:nm+': '+ol.err+'.'});
      else if(ol>0&&!chainLinksFrom(P,n.id,'m').length)out.push({n:n.id,info:1,t:nm+': aika loppui -haara ei jatku mihinkään, joten ketjun haara päättyy, jos aika loppuu.'});}
    if(sb.k==='haara'){var hv=haaraVal(P,sb,ctx);if(hv&&hv.none)out.push({n:n.id,t:nm+': valitse palikka, jota ehto tarkistaa.'});
      else if(!chainLinksFrom(P,n.id,'e').length&&!chainLinksFrom(P,n.id,'m').length)out.push({n:n.id,info:1,t:nm+': kumpikaan haara ei vielä jatku mihinkään.'});}
    if(FXK[sb.k])out.push({n:n.id,info:1,t:nm+' tulee myöhemmin: nyt ketju jatkuu sen ohi.'});
  });
  /* Ketjut odottavat toisiaan (A käynnistää ja odottaa B:tä, B odottaa A:ta): kumpikaan ei koskaan valmistu. */
  var wcyc=waitCycle(P,kid);if(wcyc)out.push({t:'Ketjut odottavat toisiaan: '+wcyc.map(function(id){return P.b[id].nm;}).join(' → ')+'. Kumpikaan ei valmistu. Poista jostain ”ja odota”.'});
  return out;
}

/* ---------- Ketjun ajo ----------
   Ketjussa on haaroja (tk). Jokainen haara on jossakin tapahtumassa. Kun ketju käynnistyy, jokaiseen alkupalikkaan tulee
   haara. Tapahtuma tehdään, ja haara jatkaa sen viivoja pitkin: jos viivoja on monta, haara jakautuu ja osat etenevät
   rinnakkain. Odottava tapahtuma (ajastin) pysäyttää vain oman haaransa; ketju jatkuu, kun aika on kulunut, myös silloin
   kun appi on ollut välillä kiinni (tarkistus appia avattaessa ja käytön aikana). Ketju on valmis, kun viimeinenkin
   haara on päässyt loppuun. Hätäjarru: kehä ilman odotusta pysäyttää ketjun, ja samoin valtava määrä askelia tai haaroja. */
var CH_STEPS=5000,CH_TOKENS=2000;
var CH_ADV={};
function nowMs(ctx){return (ctx&&ctx.now?ctx.now():new Date()).getTime();}
function chainErr(P,kid,msg,now){var cs=P.st[kid];if(!cs)return;cs.run=false;cs.tk=[];cs.err=msg;cs.end=now;}
function chainStart(P,kid,ctx,at,depth){
  var b=P.b[kid];if(!b||b.k!=='ketju'||isOff(P,b,ctx))return false;
  if(CH_ADV[kid])return false; // ketju on jo etenemässä: estetään kehä
  if((depth||0)>60)return false;
  var now=nowMs(ctx),cs=P.st[kid];
  if(cs&&cs.run&&b.uusi!=='alusta')return false;
  var w=chainNode(P,kid),atn=at?nodeOf(P,at):null;
  var starts=atn?[atn]:chainStarts(P,kid);
  cs=P.st[kid]={run:true,n:((cs&&cs.n)||0)+1,t0:now,tk:[],err:'',fl:{}};
  if(!w||!starts.length){
    var has=chainSteps(P,kid).length;
    chainErr(P,kid,'Ketju on tyhjä: siinä ei ole tapahtumia.',now);return false;}
  starts.forEach(function(n){cs.tk.push({n:n.id,a:now,v:[]});});
  chainAdvance(P,kid,ctx,depth);
  return true;
}
/* Projektia avattaessa: ketjut, joilla on asetus ”käynnisty, kun projekti avataan”. */
function chainOpen(P,ctx){var n=0;Object.keys(P.b).forEach(function(id){var b=P.b[id];if(b.k==='ketju'&&b.avaus&&!isOff(P,b,ctx)&&chainStart(P,id,ctx,null,0))n++;});if(n)tick(P,ctx);return n;}
function chainStop(P,kid,ctx){var cs=P.st[kid];if(!cs||!cs.run)return false;cs.run=false;cs.tk=[];cs.end=nowMs(ctx);cs.stop=true;return true;}
/* Yhden tapahtuman tekeminen. Palauttaa {p: portti, jota pitkin jatketaan} tai {wait: ms-aikaleima} tai {err}. */
function stepRun(P,sb,t,ctx,depth,now,seenT,kid){
  switch(sb.k){
    case 'tee':
      /* Käynnistä ketju ja odota: haara odottaa, kunnes toinen ketju on valmis (tai pysähtyy). */
      if(sb.do==='kaynnista'&&sb.odota&&sb.o!==kid&&P.b[sb.o]&&P.b[sb.o].k==='ketju'){
        if(!t.hd&&!t.sub){t.sub=1;chainStart(P,sb.o,ctx,null,(depth||0)+1);}
        var sc=P.st[sb.o];if(sc&&sc.run){t.hd=1;return {wait:Infinity};}
        return {p:'e',at:t.hd?now:t.a};}
      runAction(P,sb.id,ctx,(depth||0)+1);return {p:'e',fired:true};
    case 'haara':{var c=haaraVal(P,sb,ctx);if(c&&c.none)return {err:'valitse, mitä ehto tarkistaa'};if(isErr(c))return {err:'ehdossa on virhe: '+c.err};return {p:truth(c)?'e':'m'};}
    case 'ktulos':{var ev3=Ev(P,ctx),tv=ev3.has(sb.id,'v')?ev3.inp(sb.id,'v'):null;if(isErr(tv))return {err:'tulos: '+tv.err};
      var cs3=P.st[kid];if(cs3)cs3.tulos=(typeof tv==='number'&&isNaN(tv))?null:tv;return {p:'e'};}
    case 'lopeta':return {endAll:true};
    case 'arpa':{var rnd=ctx&&typeof ctx.rand==='function'?ctx.rand():Math.random();var an=arpaN(sb);var pick=Math.min(an,Math.floor(rnd*an)+1);P.st['arpa:'+sb.id]=pick;return {p:'a'+pick};}
    case 'toista':{var tn=toistaN(P,sb,ctx);if(isErr(tn))return {err:tn.err};var csx=P.st[kid];csx.cnt=csx.cnt||{};var c=(csx.cnt[t.n]||0)+1;
      if(c<=tn){csx.cnt[t.n]=c;return {p:'e',loop:true};}
      delete csx.cnt[t.n];return {p:'m',loop:true};}
    case 'monihaara':{var mr=Ev(P,ctx).mhRow(sb.id);if(mr.err)return {err:'arvossa on virhe: '+mr.err.err};return {p:mr.i<0?'m':mr.id};}
    case 'odota':{
      /* Jatkuu, kun ehto pätee tai kun kohtaan tapahtuma tulee nuoli odotuksen aikana. Valinnainen aikaraja: aika loppui -haara. */
      if(t.go){delete t.go;return {p:'e',at:now};}
      var cv=haaraVal(P,sb,ctx),none=!!(cv&&cv.none);
      if(none&&!odotaEv(P,t.n))return {err:'valitse, mitä odotetaan (palikka, ehto nuolesta tai tapahtuma)'};
      if(!none&&!isErr(cv)&&truth(cv))return {p:'e',at:t.hd?now:t.a};
      if(t.u==null&&!t.hd){var lim=odotaLim(sb,P,ctx);if(isErr(lim))return {err:lim.err};var a0=(seenT[t.n]||t.a==null)?now:Math.min(t.a,now);t.s=a0;if(lim>0)t.u=a0+lim;}
      seenT[t.n]=1;
      if(t.u!=null&&t.u<=now)return {p:'m'};
      t.hd=1;return {wait:t.u!=null?t.u:Infinity};}
    case 'ilmesty':case 'kuva':case 'anim':case 'nvaihto':{
      if(t.u==null){var sec=0;
        if(ctx&&typeof ctx.fx==='function'){try{sec=+ctx.fx({k:sb.k,id:sb.id,b:sb,P:P})||0;}catch(e){sec=0;}}
        if(sec>0&&sb.odota!==false){t.s=now;t.u=now+Math.round(Math.min(sec,3600)*1000);}}
      if(t.u!=null&&t.u>now)return {wait:t.u};
      return {p:'e'};}
    case 'ajastin':{
      if(t.u==null){var d=timerMs(P,sb.id,ctx);if(isErr(d))return {err:d.err};
        /* Aloitus: hetki, jolloin haara tuli tähän. Jos ajastin on jo tehty tällä tarkistuskerralla (kehä), aloitetaan nyt,
           jotta suljettuna ollut appi ei tee kiinni jääneitä kierroksia. Kellonaika: seuraava kerta aloituksen jälkeen. */
        var a=(seenT[t.n]||t.a==null)?now:Math.min(t.a,now);t.s=a;t.u=sb.tapa==='klo'?nextClock(a,parseKlo(sb.klo)):a+d;}
      seenT[t.n]=1;
      if(t.u>now)return {wait:t.u};
      return {p:'e'};}
  }
  return {p:'e'};
}
/* Ehto: nuoli kohtaan ehto, tai valittu palikka (on valittu = kyllä). */
function odotaEv(P,nid){return P.lg.l.some(function(l){return l.t===nid&&l.tp==='x';});}
function odotaLim(b,P,ctx){
  /* Pajakone 4: aikaraja voi olla ohjattu tai asetettu. Aika-arvo (esim. Arvo yksikössä min) tulee sekunteina. */
  if(P&&omActive(P,b,'raja')){var ev=Ev(P,ctx),r=ev.omi(b.id,'raja');if(isErr(r))return ERR('aikaraja: '+r.err);var rn=num(r);if(r==null||r===''||isNaN(rn)||rn===0)return 0;if(rn<0)return ERR('aikaraja ei ole luku');
    return Math.round(rn*(ev.omSrc(b.id,omFind(b,'raja'))==='nuoli'&&ev.timeSrc(b.id,'o_raja')?1000:(YKS[b.yks]||60000)));}
  if(!hasLimit(b))return 0;var n=parseNum(b.raja);if(isNaN(n)||n<0)return ERR('aikaraja ei ole luku');return Math.round(n*(YKS[b.yks]||60000));}
function haaraVal(P,b,ctx){var ev=Ev(P,ctx);if(ev.linked(b.id,'c'))return ev.inp(b.id,'c');if(b.o&&P.b[b.o])return ev.val(b.o);return {none:1};}
/* Kellonaika muodossa 7.00, 7:00 tai 7 → {h, m}. */
function parseKlo(s){var m=/^\s*(\d{1,2})(?:[.:](\d{2}))?\s*$/.exec(String(s==null?'':s));if(!m)return null;var h=+m[1],mi=m[2]?+m[2]:0;if(h>23||mi>59)return null;return {h:h,m:mi};}
function fmtKlo(k){return k?k.h+'.'+p2(k.m):'';}
/* Seuraava kerta, kun kello on k, aloituksen jälkeen (paikallista aikaa, kesäaika huomioiden). */
function nextClock(ms,k){var d=new Date(ms);d.setHours(k.h,k.m,0,0);if(d.getTime()<=ms)d.setDate(d.getDate()+1);d.setHours(k.h,k.m,0,0);return d.getTime();}
/* Ajastimen lyhyt kuvaus: ”10 s” tai ”klo 7.00”. */
function timerLabel(P,b,ctx){if(b.tapa==='klo'){var k=parseKlo(b.klo);return k?'klo '+fmtKlo(k):'klo ?';}var d=timerMs(P,b.id,ctx);return isErr(d)?'⚠':fmtDur(d);}
function timerMs(P,id,ctx){
  var b=P.b[id];
  if(b&&b.tapa==='klo'){var kk=parseKlo(b.klo);if(!kk)return ERR(String(b.klo||'').trim()?'kellonaika ”'+b.klo+'” ei kelpaa (esim. 7.00)':'kirjoita kellonaika, esim. 7.00');var nw=nowMs(ctx);return nextClock(nw,kk)-nw;}
  var ev=Ev(P,ctx),lk=ev.linked(id,'k'),x=lk?ev.inp(id,'k'):parseLit(b.kesto);
  if(isErr(x))return x;var n=num(x);
  if(x==null||x===''||isNaN(n))return ERR('kesto ei ole luku');
  if(n<=0)return ERR('kesto on nolla');
  var ms=n*(lk&&ev.timeSrc(id,'k')?1000:(YKS[b.yks]||1000));if(ms>3650*864e5)return ERR('kesto on yli 10 vuotta');
  return Math.round(ms);
}
function chainAdvance(P,kid,ctx,depth){
  var cs=P.st[kid],b=P.b[kid];if(!cs||!cs.run||!b)return false;
  var now=nowMs(ctx),w=chainNode(P,kid),changed=false,steps=0,seenT={};
  CH_ADV[kid]=1;
  try{
    var queue=cs.tk.slice(),keep=[];cs.tk=[];
    for(var pass=0;pass<50;pass++){
    while(queue.length){
      var t=queue.shift(),n=nodeOf(P,t.n),sb=n&&P.b[n.p];
      if(!n||!sb||!w||n.g!==w.id||!isStep(sb)){changed=true;continue;} // tapahtuma poistettu tai siirretty pois ketjusta
      var sg=CH_SIG[kid];if(sg&&sg[n.id]&&sb.k==='odota')t.go=1;
      if(t.u==null&&!t.hd&&sb.k!=='toista'&&t.v.indexOf(n.id)>=0){chainErr(P,kid,'Ketju pysäytettiin: se kiersi kehää ilman ajastinta (palikka ”'+sb.nm+'” tuli vastaan uudelleen samalla hetkellä). Lisää kehään ajastin.',now);return true;}
      if(++steps>CH_STEPS){chainErr(P,kid,'Ketju pysäytettiin: yli '+CH_STEPS+' tapahtumaa samalla hetkellä.',now);return true;}
      var r,had=t.u!=null||!!t.hd;
      if(isOff(P,sb,ctx))r={p:'e',skip:true};
      else r=stepRun(P,sb,t,ctx,depth,now,seenT,kid);
      if(r.err){chainErr(P,kid,'”'+sb.nm+'”: '+r.err,now);return true;}
      if(r.endAll){cs.fl[n.id]=now;queue=[];keep=[];changed=true;delete CH_SIG[kid];break;}
      if(r.wait!=null){if(!had)changed=true;keep.push(t);continue;}
      if(!cs.run)return true; // tapahtuma pysäytti ketjun
      changed=true;cs.fl[n.id]=now;
      if(!r.fired&&!r.skip)fire(P,sb.id,r.p,ctx,(depth||0)+1);
      if(!P.st[kid]||P.st[kid]!==cs||!cs.run)return true; // ketju käynnistettiin alusta tai pysäytettiin tapahtumassa
      var nx=chainLinksFrom(P,n.id,r.p),vis=(t.u!=null||t.hd||r.loop)?[]:t.v.concat([n.id]),at=r.at!=null?r.at:(t.u!=null?t.u:t.a);
      nx.forEach(function(l){queue.push({n:l.t,a:at,v:vis.slice()});});
      if(queue.length+keep.length>CH_TOKENS){chainErr(P,kid,'Ketju pysäytettiin: yli '+CH_TOKENS+' haaraa yhtä aikaa.',now);return true;}
    }
    /* Saman hetken tapahtuma (esim. toinen haara ehti merkkiin) vapauttaa jo odottavan haaran. */
    var sg2=CH_SIG[kid];if(!sg2)break;
    var rel=keep.filter(function(x){var xn=nodeOf(P,x.n);return sg2[x.n]&&xn&&P.b[xn.p]&&P.b[xn.p].k==='odota';});if(!rel.length)break;
    keep=keep.filter(function(x){return rel.indexOf(x)<0;});rel.forEach(function(x){x.go=1;queue.push(x);});delete CH_SIG[kid];
    }
    cs.tk=keep;
    if(!keep.length){cs.run=false;cs.end=now;changed=true;fire(P,kid,'e',ctx,(depth||0)+1);}
  }finally{delete CH_ADV[kid];delete CH_SIG[kid];}
  return changed;
}
/* Tapahtuma Odota-palikan kohtaan: odottava haara jatkaa. Ilman odottavaa haaraa tapahtuma ei tee mitään. */
var CH_SIG={};
function chainSignal(P,kid,nid,ctx,depth){
  var cs=P.st[kid];if(!cs||!cs.run)return false;
  (CH_SIG[kid]=CH_SIG[kid]||{})[nid]=1;
  if(!CH_ADV[kid])chainAdvance(P,kid,ctx,depth);
  return true;
}
/* Käytön aikana (tick): ketjut, joissa jokin haara odottaa ehtoa, tarkistetaan heti eikä vasta seuraavalla sekunnilla. */
function advanceHeld(P,ctx){var any=false;
  Object.keys(P.st||{}).forEach(function(id){var b=P.b[id],cs=P.st[id];if(!b||b.k!=='ketju'||!cs||!cs.run||CH_ADV[id])return;
    if((cs.tk||[]).some(function(t){return t.hd;})&&chainAdvance(P,id,ctx,0))any=true;});return any;}
/* Tarkistus appia avattaessa ja käytön aikana: onko jonkin ketjun odotus päättynyt? */
function chainPoll(P,ctx){
  var any=false;
  Object.keys(P.b).forEach(function(id){var b=P.b[id];if(b.k!=='ketju')return;var cs=P.st[id];if(!cs||!cs.run)return;
    if(isOff(P,b,ctx)){chainStop(P,id,ctx);any=true;return;}
    if(chainAdvance(P,id,ctx,0))any=true;});
  if(any)tick(P,ctx);
  return any;
}
/* Kaikki projektin ketjut nimen mukaan: nimi, päällä / pois, käynnissä, virhe. */
function chainList(P){return Object.keys(P.b).filter(function(id){return P.b[id].k==='ketju';}).map(function(id){var b=P.b[id],cs=P.st[id]||{};
  return {id:id,nm:b.nm,off:!!b.off,run:!!cs.run,err:cs.run?'':(cs.err||''),n:cs.n||0,steps:chainSteps(P,id).length};}).sort(function(a,b){return a.nm.localeCompare(b.nm,'fi');});}
function anyChainRunning(P){return Object.keys(P.st||{}).some(function(id){var b=P.b[id];return b&&b.k==='ketju'&&P.st[id]&&P.st[id].run;});}
/* Seurantaa varten: missä haarat ovat ja kauanko odotusta on jäljellä. */
function chainInfo(P,kid,ctx){
  var cs=P.st[kid]||{},now=nowMs(ctx);
  return {run:!!cs.run,n:cs.n||0,err:cs.err||'',stop:!!cs.stop,end:cs.end||0,t0:cs.t0||0,
    tk:(cs.tk||[]).map(function(t){return {n:t.n,u:t.u,left:t.u!=null?Math.max(0,t.u-now):null};}),fl:cs.fl||{}};
}

/* ---------- Kopiointi ja liittäminen (versio 6.10) ----------
   Kopio ottaa valitut logiikan solmut sisältöineen (ikkunan tai ketjun sisällä olevat mukaan) ja niiden väliset nuolet.
   Liitettäessä logiikan palikat tehdään uusina (uudet tunnisteet, nimet ja viitteet), ja näkymän palikoista tulee uusi
   esiintymä samaan palikkaan. Viittaukset kopioitujen palikoiden välillä osoittavat liitettäessä uusiin. */
function copyNodes(P,nids){
  var want={},out={b:{},n:[],l:[],pid:P.id};
  function addN(id){if(want[id])return;var n=nodeOf(P,id);if(!n)return;want[id]=1;P.lg.n.forEach(function(m){if(m.g===id)addN(m.id);});}
  (nids||[]).forEach(addN);
  P.lg.n.forEach(function(n){if(!want[n.id])return;var c=clone(n);if(!want[c.g])c.keepG=c.g;out.n.push(c);var b=P.b[n.p];if(b)out.b[b.id]=clone(b);});
  P.lg.l.forEach(function(l){if(want[l.f]&&want[l.t])out.l.push(clone(l));});
  return out;
}
function pasteNodes(P,clip,dx,dy){
  if(!clip||!clip.n||!clip.n.length)return [];
  var bmap={},nmap={},made=[],other=clip.pid&&clip.pid!==P.id;
  Object.keys(clip.b).forEach(function(id){var o=clip.b[id];if(!K[o.k])return;
    if(K[o.k].g==='ui'){if(P.b[id]&&P.b[id].k===o.k)bmap[id]=id;return;}
    var props=clone(o);delete props.id;delete props.vt;delete props.vtSet;var nm=props.nm;delete props.nm;
    var nb=addBlock(P,o.k,props);if(o.nmSet||o.k==='ketju'){nb.nm=uniqueName(P,nm,nb.id);if(o.nmSet)nb.nmSet=true;nb.vt=uniqueVt(P,nb.nm,nb.id);}bmap[id]=nb.id;});
  // viittaukset kopioitujen palikoiden välillä
  Object.keys(bmap).forEach(function(oid){var nid=bmap[oid];if(oid===nid)return;var b=P.b[nid];
    Object.keys(b).forEach(function(k){if(k==='id'||k==='k')return;var x=b[k];
      /* Toisesta projektista liitettäessä viittaukset muihin kuin kopioituihin palikoihin poistetaan (tunnisteet eivät ole samoja). */
      if(typeof x==='string'){var y=x.replace(/\{#([a-zA-Z0-9]+)\}/g,function(m,i){return bmap[i]?'{#'+bmap[i]+'}':other?(b.k==='kaava'?'{?}':''):m;});if(k==='o')y=bmap[x]?bmap[x]:other?'':x;b[k]=y;}
      else if(x&&typeof x==='object'&&!Array.isArray(x)&&x.r){if(bmap[x.r])x.r=bmap[x.r];else if(other)b[k]=k==='nk'?{m:'aina'}:k==='vr'?null:'';}});
    if(other&&b.k==='haku')(b.rivit||[]).forEach(function(r){['a','b','t'].forEach(function(f){if(typeof r[f]==='string')r[f]=r[f].replace(/\{#([a-zA-Z0-9]+)\}/g,function(m,i){return bmap[i]?'{#'+bmap[i]+'}':'';});});});});
  clip.n.forEach(function(c){var pid=bmap[c.p];if(!pid||!P.b[pid])return;
    var n={id:'n'+(++P.seq),p:pid,x:Math.round((c.x||0)+(dx||0)),y:Math.round((c.y||0)+(dy||0)),g:''};if(c.w)n.w=c.w;if(c.h)n.h=c.h;if(c.not)n.not=true;if(c.col)n.col=true;
    n._g=c.g;n._keep=c.keepG;nmap[c.id]=n;P.lg.n.push(n);made.push(n);});
  made.forEach(function(n){var g=nmap[n._g];if(g)n.g=g.id;else if(n._keep&&nodeOf(P,n._keep))n.g=n._keep;delete n._g;delete n._keep;});
  clip.l.forEach(function(l){var f=nmap[l.f],t=nmap[l.t];if(f&&t)addLink(P,f.id,l.fp,t.id,l.tp);});
  repair(P);
  return made.map(function(n){return n.id;}).filter(function(id){return !!nodeOf(P,id);});
}

/* ---------- Yhteydet: mistä palikka saa arvonsa ja missä sitä käytetään ---------- */
var HOW={ehto:'ketjun ehto',nuoli:'nuoli',teksti:'tekstissä',kaava:'kaavassa',tulos:'antaa arvon',nk:'näkyvyys',hk:'harmaana',vr:'vaihtoväri',arvo:'arvona',kohde:'toiminnon kohde',kaavio:'kaaviossa',kalenteri:'kalenterissa'};
function deps(P){
  var uses={},usedBy={};
  function add(a,b,how){if(!P.b[a]||!P.b[b]||a===b)return;(uses[a]=uses[a]||[]).push({id:b,how:how});(usedBy[b]=usedBy[b]||[]).push({id:a,how:how});}
  var nid={};P.lg.n.forEach(function(n){nid[n.id]=n;});
  P.lg.l.forEach(function(l){var f=nid[l.f],t=nid[l.t];if(f&&t)add(t.p,f.p,'nuoli');});
  Object.keys(P.b).forEach(function(id){
    var b=P.b[id];
    Object.keys(b).forEach(function(k){
      var x=b[k];if(k==='id'||k==='k'||k==='nm')return;
      if(typeof x==='string')refsIn(x).forEach(function(r){add(id,r,b.k==='kaava'&&k==='f'?'kaava':'teksti');});
      else if(x&&typeof x==='object'&&!Array.isArray(x)&&x.r)add(id,x.r,k==='nk'?'nk':k==='hk'?'hk':k==='vr'?'vr':'arvo');
    });
    if(b.k==='tee'&&b.o)add(id,b.o,'kohde');
    if((b.k==='haara'||b.k==='odota')&&b.o)add(id,b.o,'ehto');
    if(b.k==='monihaara')(b.haarat||[]).forEach(function(r){if(r.m==='val'&&r.o)add(id,r.o,'ehto');[r.a,r.b].forEach(function(x){refsIn(x).forEach(function(q){add(id,q,'arvo');});});});
    if(b.k==='kaava'){var pk=parseKaava(b.f);var tg=pk.asg&&P.b[pk.asg.id]&&P.b[pk.asg.id].k==='tulos'?pk.asg.id:null;
      if(tg){var rest=refsIn(kaavaToText(P,b.f)===''?'':b.f.replace('{#'+tg+'}',''));if(rest.indexOf(tg)<0){uses[id]=(uses[id]||[]).filter(function(x){return x.id!==tg;});usedBy[tg]=(usedBy[tg]||[]).filter(function(x){return x.id!==id;});}add(tg,id,'tulos');}}
    (b.sarjat||[]).forEach(function(s){if(s&&s.r)add(id,s.r,'kaavio');});
    (b.lahteet||[]).forEach(function(r){add(id,r,'kalenteri');});
    if(b.k==='haku')(b.rivit||[]).forEach(function(r){[r.a,r.b,r.t].forEach(function(x){refsIn(x).forEach(function(q){add(id,q,'arvo');});});});
  });
  function uniq(m){Object.keys(m).forEach(function(k){var seen={};m[k]=m[k].filter(function(x){var key=x.id+'|'+x.how;if(seen[key])return false;seen[key]=1;return true;});});}
  uniq(uses);uniq(usedBy);
  return {uses:uses,usedBy:usedBy};
}

/* ---------- Toiminnon kuvaus selkokielellä ---------- */
function descAct(P,id,df){
  var b=P.b[id];if(!b||b.k!=='tee')return '';var tg=P.b[b.o],tn=tg?tg.nm:'';
  function lit(x){if(x&&typeof x==='object'&&x.r)return P.b[x.r]?P.b[x.r].nm:'?';if(x===''||x==null)return '';return toNames(P,String(x));}
  var s=DOS[b.do]||'Toiminto';
  /* Pajakone 4: toiminto ominaisuuteen, esim. ”Nappi.leveys = 200”, ja Palauta. */
  var oe=tg&&b.om?omFind(tg,b.om):null;if(oe&&tn)tn=tn+'.'+oe.n;
  if(b.do==='palauta')return (b.off?'(pois käytöstä) ':'')+(tg?'Palauta '+(oe?tn:tn+': kaikki ominaisuudet')+' perusarvoon':'Palauta perusarvo');
  if(oe&&b.do==='vaihda')return (b.off?'(pois käytöstä) ':'')+'Vaihda: '+tn;
  switch(b.do){
    case 'aseta':s=tn?tn+' = '+(lit(b.v)||'arvo nuolesta'):'Aseta arvo';break;
    case 'tila':s=tn?tn+': '+(b.ti==='ei'?'ei ole valittu':'on valittu'):'Aseta tila';break;
    case 'lisaa':s=tn?tn+' + '+(lit(b.v)||'1'):'Lisää';break;
    case 'valitse':case 'poista':case 'vaihda':case 'tyhjenna':s+=tn?': '+tn:'';break;
    case 'siirry':s+=tn?' → '+tn:(b.vw?' → '+((P.views.filter(function(v){return v.id===b.vw;})[0]||{}).n||'')+' ('+b.x+', '+b.y+')':' → kohta ('+b.x+', '+b.y+')');if(b.tapa==='heti')s+=' (heti)';break;
    case 'kirjaa':case 'rivi':s+=(tn?' → '+tn:'')+(b.tx?': '+toNames(P,b.tx):'');break;
    case 'ilmoita':s+=b.tx?': '+toNames(P,b.tx):'';break;
    case 'kaynnista':s+=tn?': '+tn+(b.odota?' ja odota':''):'';break;
    case 'pysayta':case 'arvonta':s+=tn?': '+tn:'';break;
  }
  return (b.off?'(pois käytöstä) ':'')+s;
}
/* Toiminnot, joihin palikan tapahtuma- tai arvokohdasta lähtee nuoli. */
function actsFrom(P,id,p){
  var ns={};P.lg.n.forEach(function(n){if(n.p===id)ns[n.id]=1;});
  var out=[];P.lg.l.forEach(function(l){if(!ns[l.f]||l.fp!==p)return;var t=nodeOf(P,l.t);var tb=t&&P.b[t.p];if(tb&&tb.k==='tee'&&l.tp==='e')out.push({l:l,id:tb.id});});
  return out;
}

/* Hakutaulukon rivi selkokielellä: ”= Vähän”, ”0–4”, ”vähintään 10”, ”alle 5”, ”mikä tahansa”. */
function hakuDesc(P,r){
  if(!r)return '';function n(x){return toNames(P,String(x==null?'':x)).trim();}
  if(r.m==='on')return '= '+(n(r.a)||'tyhjä');
  var a=n(r.a),b=n(r.b);
  if(a&&b)return a+' – alle '+b;if(a)return 'vähintään '+a;if(b)return 'alle '+b;return 'mikä tahansa';
}
/* ---------- Miksi? Selitys siitä, miksi arvo on mikä on ---------- */
var WTXT={and:'Pätee, kun kaikki sisällä olevat pätevät',or:'Pätee, kun vähintään yksi sisällä olevista pätee',one:'Pätee, kun täsmälleen yksi sisällä olevista pätee',
  min:'Pätee, kun vähintään {n} sisällä olevista pätee',max:'Pätee, kun enintään {n} sisällä olevista pätee',eq:'Pätee, kun täsmälleen {n} sisällä olevista pätee',
  not:'Pätee, kun mikään sisällä olevista ei päde',cnt:'Laskee, montako sisällä olevista pätee',sum:'Laskee sisällä olevat luvut yhteen',avg:'Laskee sisällä olevien lukujen keskiarvon',
  maxv:'Antaa sisällä olevista luvuista suurimman',minv:'Antaa sisällä olevista luvuista pienimmän'};
function why(P,E,id,depth,seen){
  var b=P.b[id];if(!b)return null;seen=seen||{};depth=depth==null?3:depth;
  var v=E.val(id),r={id:id,nm:b.nm,k:b.k,v:v,ok:typeof v==='boolean'?v:null,err:isErr(v)?v.err:'',txt:'',kids:[]};
  if(seen[id]||depth<0)return r;seen[id]=1;
  function srcOf(p){var ls=E.inl[id+'|'+p];if(!ls||!ls.length)return null;var f=E.nid[ls[0].f];return f?{id:f.p,not:!!f.not,port:ls[0].fp}:null;}
  function inName(p){var s=srcOf(p);if(s){var sb=P.b[s.id];var pn=port(sb,'outs',s.port);return (s.not?'EI ':'')+sb.nm+(s.port!=='v'&&pn?' ('+pn.n+')':'');}var x=b[p];if(x&&typeof x==='object'&&x.r)return P.b[x.r]?P.b[x.r].nm:'?';if(x===''||x==null)return 'tyhjä';return toNames(P,String(x));}
  function kidFor(p){var s=srcOf(p);var x=b[p];var kid=null;
    if(s)kid=why(P,E,s.id,depth-1,seen);else if(x&&typeof x==='object'&&x.r&&P.b[x.r])kid=why(P,E,x.r,depth-1,seen);
    if(kid){if(s)portKid(kid,s.id,s.port);if(s&&s.not){kid.not=true;if(kid.ok!=null)kid.ok=!kid.ok;}r.kids.push(kid);}}
  function portKid(kid,bid,p){if(p==='v')return;kid.v=E.val(bid,p);kid.ok=typeof kid.v==='boolean'?kid.v:null;kid.err=isErr(kid.v)?kid.v.err:'';var pn=port(P.b[bid],'outs',p);if(pn)kid.nm+=' ('+pn.n+')';kid.kids=[];}
  switch(b.k){
    case 'ikkuna':{
      r.txt=WTXT[b.m].replace('{n}',b.n);
      var wn=null;P.lg.n.forEach(function(n){if(n.p===id&&!wn)wn=n;});
      E.members(id).forEach(function(m){var kid=why(P,E,m.p,depth-1,seen);if(!kid)return;if(m.not){kid.not=true;if(kid.ok!=null)kid.ok=!kid.ok;}kid.nid=m.id;r.kids.push(kid);});
      (E.inl[id+'|in']||[]).forEach(function(l){var f=E.nid[l.f];if(!f)return;var kid=why(P,E,f.p,depth-1,seen);if(!kid)return;portKid(kid,f.p,l.fp);if(f.not){kid.not=true;if(kid.ok!=null)kid.ok=!kid.ok;}r.kids.push(kid);});
      var bools=r.kids.filter(function(k){return k.ok!=null;});
      if(bools.length&&['and','or','one','min','max','eq','not','cnt'].indexOf(b.m)>=0)r.txt+=' · nyt '+bools.filter(function(k){return k.ok;}).length+'/'+bools.length+' pätee';
      if(!r.kids.length)r.txt+=' · ikkuna on tyhjä';
      if(b.j==='jos')r.txt+='. JOS-ikkuna: NIIN tehdään, kun tulos alkaa päteä'+(b.muuten?', MUUTEN kun se lakkaa':'')+'.';
      if(b.j==='kun')r.txt+='. KUN-ikkuna päästää tapahtuman läpi, kun tulos pätee.';
      break;}
    case 'vert':case 'lasku':r.txt=inName('a')+' '+(b.k==='vert'?CMPS[b.op]:OPS[b.op])+' '+inName('b');kidFor('a');kidFor('b');break;
    case 'jos':if(!srcOf('c')){r.txt='Ehto puuttuu: vie nuoli kohtaan ”ehto”.';break;}r.txt='JOS '+inName('c')+' alkaa päteä, NIIN tehdään sen toiminnot'+(b.muuten?'. MUUTEN-toiminnot tehdään, kun se lakkaa päteä.':'.');kidFor('c');break;
    case 'valitse':if(!srcOf('c')){r.txt='Ehto puuttuu: vie nuoli kohtaan ”ehto”.';kidFor('a');kidFor('b');break;}r.txt='Jos '+inName('c')+' pätee, tulos on '+(srcOf('a')||b.a!==''?inName('a'):'kyllä')+', muuten '+(srcOf('b')||b.b!==''?inName('b'):'ei')+'.';kidFor('c');kidFor('a');kidFor('b');break;
    case 'haku':{var hr=E.hakuRow(id);
      if(!srcOf('a')&&(b.a===''||b.a==null)){r.txt='Arvo puuttuu: vie nuoli kohtaan ”arvo”.';break;}
      if(hr.err){r.txt='Arvossa on virhe.';kidFor('a');break;}
      var nr=(b.rivit||[]).length;
      if(hr.x==null||hr.x==='')r.txt=inName('a')+' on tyhjä, joten tulos on '+(b.muuten!==''&&b.muuten!=null?'muuten-arvo.':'tyhjä.');
      else if(hr.i<0)r.txt=inName('a')+' = '+fmt(hr.x,E.df)+' ei osu mihinkään '+nr+' rivistä, joten tulos on '+(b.muuten!==''&&b.muuten!=null?'muuten-arvo.':'tyhjä.');
      else r.txt=inName('a')+' = '+fmt(hr.x,E.df)+' osuu riviin '+(hr.i+1)+' ('+hakuDesc(P,b.rivit[hr.i])+'), joten tulos on '+fmt(v,E.df)+'.';
      kidFor('a');break;}
    case 'kun':r.txt=srcOf('c')||b.c?'Päästää tapahtuman läpi, kun '+inName('c')+' pätee.':'Ei ehtoa: päästää kaiken läpi.';kidFor('c');break;
    case 'pvmosa':r.txt=PARTS[b.part]+': '+inName('a');kidFor('a');break;
    case 'tulos':{var tow=E.ownerOf(id);
      if(!tow){r.txt='Mikään kaava ei vielä anna arvoa. Kirjoita kaavaan esim. '+b.vt+' = a + b.';break;}
      r.txt='Arvo tulee kaavasta: '+kaavaToText(P,P.b[tow].f).trim()+'.';
      var lose=Object.keys(P.b).filter(function(i){return i!==tow&&E.targetOf(i)===id;});
      if(lose.length)r.txt+=' Myös '+lose.map(function(i){return '”'+P.b[i].nm+'”';}).join(', ')+' yrittää antaa arvon, mutta ensin tehty voittaa.';
      var kw=why(P,E,tow,depth-1,seen);if(kw)r.kids.push(kw);break;}
    case 'kaava':{var src=kaavaToText(P,b.f).trim(),pk=parseKaava(b.f);
      if(!src){r.txt='Kaava on tyhjä. Kirjoita esim. uni > 7.';break;}
      var ktg=E.targetOf(id);
      r.txt='Kaava: '+src+(ktg?(pk.asg.err?' · '+pk.asg.err:'')+' · antaa arvon palikalle ”'+P.b[ktg].nm+'”'+(E.ownerOf(ktg)!==id?', mutta ensin tehty kaava ”'+P.b[E.ownerOf(ktg)].nm+'” antaa jo arvon':''):(pk.err?' · '+pk.err:''))+'.';
      var used={};(kaavaTokens(b.f).t||[]).forEach(function(t){if(t.t!=='ref'||!P.b[t.id])return;if(ktg&&t.id===ktg&&!used.asg){used.asg=1;return;}var key=t.id+'.'+t.p;if(used[key])return;used[key]=1;
        if(!t.p||t.p==='arvo'){var kid=why(P,E,t.id,depth-1,seen);if(kid)r.kids.push(kid);return;}
        var pv=E.prop(t.id,t.p);r.kids.push({id:t.id,nm:P.b[t.id].nm+' .'+t.p,k:P.b[t.id].k,v:pv,ok:typeof pv==='boolean'?pv:null,err:isErr(pv)?pv.err:'',txt:'',kids:[]});});
      break;}
    case 'tee':r.txt=descAct(P,id);break;
    case 'haara':{var hv=haaraVal(P,b,{now:function(){return E.now;}}),src=E.linked(id,'c')?'ehto nuolesta':(P.b[b.o]?'onko ”'+P.b[b.o].nm+'” valittu':'');
      r.txt=!src?'Valitse palikka, jota ehto tarkistaa.':isErr(hv)?'Ehdossa on virhe.':'Tarkistaa '+src+': nyt '+(truth(hv)?'pätee, joten ketju jatkaa kyllä-haaraan.':'ei päde, joten ketju jatkaa ei-haaraan.');
      r.ok=src&&!isErr(hv)?truth(hv):null;if(E.linked(id,'c'))kidFor('c');else if(P.b[b.o]){var kq=why(P,E,b.o,depth-1,seen);if(kq)r.kids.push(kq);}break;}
    case 'ktulos':{var tv=E.has(id,'v')?E.inp(id,'v'):null;r.txt='Antaa ketjulle tuloksen: '+(E.linked(id,'v')?'arvo nuolesta':b.v&&b.v.r&&P.b[b.v.r]?P.b[b.v.r].nm:toNames(P,String(b.v||''))||'tyhjä')+(isErr(tv)?' (virhe)':' = '+fmt(tv,E.df))+'. Tuloksen näkee ketjun kohdasta tulos ja kaavassa: ketjun viite.tulos.';kidFor('v');break;}
    case 'satu':{var ssp=satuSpec(P,id,{now:function(){return E.now;}},E),sd=satuDist(ssp),sv=E.val(id);
      if(ssp.err)r.txt='Väli tai painot: '+ssp.err+', joten uutta lukua ei voi arpoa.';
      else{r.txt='Arpoo kokonaisluvun väliltä '+ssp.lo+'–'+ssp.hi+' ('+ssp.cnt+(ssp.cnt===1?' luku':' lukua')+'). ';
        r.txt+=!ssp.muoto?'Kaikki luvut ovat yhtä todennäköisiä.':ssp.zero?'Kaikki painot ovat nollassa, joten arvonta on tasainen.':'Jakauma on muotoiltu '+ssp.w.length+' painolla. Todennäköisin: '+satuTop(sd)+'.';}
      r.txt+=sv==null?' Ei vielä arvottu: luku arvotaan, kun kohtaan arvo uudelleen tulee tapahtuma tai toiminto Arvo uudelleen tehdään.':' Nyt '+fmt(sv,E.df)+(ssp.lo!=null&&(sv<ssp.lo||sv>ssp.hi)?' (arvottu ennen välin muutosta)':'')+'. Luku pysyy samana, kunnes se arvotaan uudelleen.';
      ['min','max'].forEach(function(p){if(srcOf(p)||(b[p]&&typeof b[p]==='object'&&b[p].r))kidFor(p);});

   Näkymä: alku = alkukohdan sijainti, rul '' / 'alue' / 'ei', alue = aloitusalue.

/* ---------- Laitemuoto (Pajakone 1) ----------
   Näkymän laite (puhelin, iPad pysty, iPad vaaka): muokatessa laitteen ruutu näkyy kanvaasilla kehyksenä kohdassa (0, 0).
   Käytössä näkymä on laitteen muotoinen: tietokoneella kehyksenä keskellä, kapealla ruudulla (oikea puhelin) koko alueen kokoisena.
   Käytössä rullataan vain alaspäin ja vain, jos palikoita on ruudun alareunan alapuolella. Zoomausta ei ole. */

/* Vapaa kohta logiikan kanvaasilla: siirrytään alaspäin, kunnes paikalla ei ole toista palikkaa. */
function freeY(x,y,w,h,excl){var guard=0;h=Math.max(h,40);while(guard++<40){var hit=P.lg.n.some(function(o){if(o.id===excl)return false;var ob=P.b[o.p];if(!ob||KK.isWin(ob))return false;var r=nodeRect(o);return x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y;});if(!hit)return y;y+=54;}return y;}
function offerLink(n,tnode,x,y){

  showMenu(x+8,y+8,[{h:'Vie tulos: '+tb.nm}].concat(cands.map(function(q){return {t:q.n,f:function(){
    pushUndo();KK.addLink(P,n.id,'v',tnode.id,q.p);

    KK.tick(P,ctx());save();renderLogicStage();if(n.g)growChain(n.g);if(old&&old!==n.g)growChain(old);drawLinks();renderInsp();if(showU())renderUIStage();
    toast('Tulos viety: '+tb.nm+' ('+q.n+')');}};})).concat([{t:'Ei mitään, vain siirto',f:function(){}}]));
}

function lmarg(){var m=+((Dt.cfg.lmarg==null)?16:Dt.cfg.lmarg);return isNaN(m)?16:Math.max(0,m);}

function bbox(bs){return {x1:Math.min.apply(null,bs.map(function(b){return b.x;})),y1:Math.min.apply(null,bs.map(function(b){return b.y;})),x2:Math.max.apply(null,bs.map(function(b){return b.x+b.w;})),y2:Math.max.apply(null,bs.map(function(b){return b.y+b.h;}))};}
/* Laitteen ruutu: keskitys (h, v), reunat (lft, rgt, top, bot), täysi leveys (fw) ja jako leveydelle (dw). */
function alignScreen(ax){var bs=selUIBlocks();if(!bs.length)return;var L=KK.laite(P,bs[0].v);if(!L)return;var m=lmarg(),g=lgap(),bb=bbox(bs);
  pushUndo();
  if(ax==='fw')bs.forEach(function(b){b.x=m;b.w=Math.max(30,L.w-2*m);});
  else if(ax==='dw'){var srt=bs.slice().sort(function(a,b){return a.x-b.x;}),n=srt.length,w=Math.max(30,Math.floor((L.w-2*m-(n-1)*g)/n)),x=m;srt.forEach(function(b){b.x=x;b.w=w;x+=w+g;});}
  else{var dx=0,dy=0;
    if(ax==='h')dx=Math.round(L.w/2-(bb.x1+bb.x2)/2);if(ax==='v')dy=Math.round(L.h/2-(bb.y1+bb.y2)/2);
    if(ax==='lft')dx=m-bb.x1;if(ax==='rgt')dx=L.w-m-bb.x2;if(ax==='top')dy=m-bb.y1;if(ax==='bot')dy=L.h-m-bb.y2;

}

/* Tapahtuman paikka ketjussa: mistä tullaan ja mihin jatketaan. */

  var h='<div class="rlab">Tullaan</div>'+(ins.length?'<div class="rels">'+ins.map(function(l){return chip(l.f,l.id);}).join('')+'</div>':'<div class="help" style="margin:0 0 6px">Tämä on ketjun alku.</div>');
  var eps=KK.ports(b).outs.filter(function(q){return q.t==='e';});
  eps.forEach(function(q){var os=outs.filter(function(l){return l.fp===q.p;});var lab=eps.length>1?'Haara: '+q.n:'Jatketaan';
    h+='<div class="rlab">'+esc(lab)+'</div>'+(os.length?'<div class="rels">'+os.map(function(l){return chip(l.t,l.id);}).join('')+'</div>':'<div class="help" style="margin:0 0 6px">'+(eps.length>1?'Tämä haara päättyy tähän.':'Ketju päättyy tähän'+(ins.length?'':' (ja alkaa tästä)')+'.')+'</div>');

/* Valittu ketju tai ketjun tapahtuma, johon napautettu uusi tapahtuma lisätään. */
function chainTarget(){if(!P||!S.sel||S.sel.t!=='n'||S.multi.length>1)return null;var n=KK.nodeOf(P,S.sel.id);if(!n)return null;var b=P.b[n.p];
  if(b&&b.k==='ketju'&&!n.col)return {ch:b,from:null};var ch=KK.chainOfNode(P,n);if(ch)return {ch:ch,from:n.id};return null;}
/* Vapaa kohta ketjussa samalla korkeudella: siirrytään oikealle, kunnes uusi tapahtuma ei osu toiseen. */
function freeX(x,y,w,h,g){var guard=0;while(guard++<40){var hit=P.lg.n.some(function(o){if(o.g!==g)return false;var r=nodeRect(o);return x<r.x+r.w+20&&x+w>r.x-20&&y<r.y+r.h+10&&y+h>r.y-10;});if(!hit)return x;x+=60;}return x;}
/* Ketjun tapahtuman poisto: ketju pysyy yhtenäisenä, eli edellinen kytketään seuraavaan. */
function removeStep(nid){
  var n=KK.nodeOf(P,nid);if(!n)return;
  if(!KK.chainOfNode(P,n)){KK.removeNode(P,nid);return;}
  var ins=P.lg.l.filter(function(l){return l.t===nid&&KK.isChainLink(P,l);}),outs=KK.chainLinksFrom(P,nid);
  var pairs=[];if(ins.length<=1||outs.length<=1)ins.forEach(function(a){outs.forEach(function(b){if(a.f!==b.t)pairs.push([a.f,a.fp,b.t,b.tp]);});});
  KK.removeNode(P,nid);
  pairs.forEach(function(p){if(KK.nodeOf(P,p[0])&&KK.nodeOf(P,p[2]))KK.addLink(P,p[0],p[1],p[2],p[3]);});
}
/* Lisää ketjuun tapahtuman: loppuun, alkuun tai valitun perään. */
function addChainStep(kb,where,spec,fromNid,fromPort){fromPort=fromPort||'e';
  var w=KK.chainNode(P,kb.id);if(!w)return null;
  var kind=spec.split(':')[0],arg=spec.split(':')[1]||'';
  pushUndo();
  var nb=KK.addBlock(P,kind,kind==='tee'?{do:arg||'aseta'}:{});
  var order=KK.chainOrder(P,kb.id),nodes=order.map(function(id){return KK.nodeOf(P,id);});
  var x=w.x+18,y=w.y+48;
  var ends=nodes.filter(function(n){return !KK.chainLinksFrom(P,n.id).length;}),starts=KK.chainStarts(P,kb.id);
  var from=where==='after'?KK.nodeOf(P,fromNid):where==='end'&&ends.length?ends[ends.length-1]:null;
  if(from){var r=nodeRect(from);var fo=KK.ports(P.b[from.p]).outs.filter(function(q){return q.t==='e';}).map(function(q){return q.p;});var pi=Math.max(0,fo.indexOf(fromPort));
    x=from.x+pi*260;y=from.y+Math.max(r.h,34)+44;
    var sib=KK.chainLinksFrom(P,from.id,fromPort).length;if(sib)x+=sib*260;}
  if(where==='start'&&starts.length){x=starts[0].x;y=starts[0].y;nodes.forEach(function(n){n.y+=84;});}
  if(from){x=freeX(x,y,260,50,w.id);}
  var nn=KK.addNode(P,nb.id,x,y,w.id);
  if(from)KK.addLink(P,from.id,fromPort,nn.id,'e');
  if(where==='start')starts.forEach(function(st){KK.addLink(P,nn.id,'e',st.id,'e');});
  S.sel={t:'n',id:nn.id};S.multi=[];S.pendingFit=nn.id;
  KK.tick(P,ctx());save();renderStage();renderInsp();
