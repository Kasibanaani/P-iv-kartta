    if(k2==='dhue'&&T&&T.d){T.d.hue=v2;save();renderStage();renderInsp();return;}
    if(T&&T.b){T.b[k2]=v2;afterInsp(true);}return;}
  if(t.hasAttribute('data-ksm')&&T&&T.b&&Array.isArray(T.b.sarja)){var ka=t.getAttribute('data-ksm'),ki=+t.getAttribute('data-i'),sa=T.b.sarja;if(!(ki>=0&&ki<sa.length))return;pushUndo();
    if(ka==='x')sa.splice(ki,1);else{var kj=ka==='u'?ki-1:ki+1;if(kj<0||kj>=sa.length)return;var tmp=sa[ki];sa[ki]=sa[kj];sa[kj]=tmp;}afterInsp(true);return;}
  if(t.hasAttribute('data-rlrm')&&T&&T.b){pushUndo();var kk=t.getAttribute('data-rlrm');T.b[kk].splice(+t.getAttribute('data-i'),1);afterInsp(true);return;}
  if(t.hasAttribute('data-ins')&&T&&T.b){
    var key=t.getAttribute('data-ins');var r=t.getBoundingClientRect();
    var items=[{h:'Lisää arvo palikasta'}].concat(blocks(function(o){return o.id!==T.b.id&&hasValue(o);}).sort(function(a,b){return a.nm.localeCompare(b.nm,'fi');}).map(function(o){return {t:o.nm,f:function(){
      var inp=$('#insp input[data-k="'+key+'"]');var cur=inp?inp.value:KK.toNames(P,T.b[key]);var pos=inp&&inp.selectionStart!=null?inp.selectionStart:cur.length;
      var nv=cur.slice(0,pos)+'{'+o.nm+'}'+cur.slice(pos);pushUndo();T.b[key]=KK.toIds(P,nv);afterInsp(true);}};}));
    showMenu(r.left-120,r.bottom+4,items);return;}
  var d=t.getAttribute('data-do');if(!d)return;
  if(d==='fitdev'){fitDevice();save();return;}
  doAction(d,T);
});
function doAction(d,T){
  var b=T&&T.b;
  switch(d){
    case 'dellink':pushUndo();P.lg.l=P.lg.l.filter(function(l){return l.id!==S.sel.id;});S.sel=null;break;
    case 'deldeco':pushUndo();P.deco=P.deco.filter(function(x){return x.id!==S.sel.id;});S.sel=null;break;
    case 'delblock':pushUndo();KK.nodesOfBlock(P,b.id).forEach(function(n){if(KK.chainOfNode(P,n))removeStep(n.id);});if(P.b[b.id])KK.removeBlock(P,b.id);S.sel=null;break;
    case 'delnode':pushUndo();removeStep(S.sel.id);S.sel=null;break;
    case 'dup':{pushUndo();var c=KK.clone(b);delete c.id;delete c.nm;delete c.nmSet;delete c.vt;delete c.vtSet;var nb=KK.addBlock(P,b.k,c);nb.x=b.x+20;nb.y=b.y+20;S.sel={t:'b',id:nb.id};break;}
    case 'inst':{pushUndo();var n0=KK.nodeOf(P,S.sel.id);var n=KK.addNode(P,b.id,(n0?n0.x:0)+30,(n0?n0.y:0)+60,n0?n0.g:'');S.sel={t:'n',id:n.id};S.pendingFit=n.id;break;}
    case 'tologic':{var ex=KK.nodesOfBlock(P,b.id)[0];if(!split()){S.tab='logiikka';$('#stage').innerHTML='';}ensurePanes();
      var st=stL(),cL=camL();
      if(!ex){pushUndo();ex=KK.addNode(P,b.id,(st.clientWidth/2-cL.x)/cL.z-60,(st.clientHeight/2-cL.y)/cL.z-17);}
      else{cL.x=st.clientWidth/2-ex.x*cL.z-60;cL.y=st.clientHeight/2-ex.y*cL.z;}
      S.sel={t:'n',id:ex.id};S.multi=[];break;}
    case 'toview':if(!split()){S.tab='nakyma';$('#stage').innerHTML='';}S.vw=b.v;S.sel={t:'b',id:b.id};S.multi=[];navTo({o:b.id});break;
    case 'back':if(S.back){S.sel=S.back.fromSel&&(S.back.fromSel.t==='b'?P.b[S.back.fromSel.id]:KK.nodeOf(P,S.back.fromSel.id))?S.back.fromSel:{t:'b',id:S.back.from};S.back=null;}break;
    case 'delmulti':pushUndo();S.multi.forEach(function(m){if(m.t==='b')KK.removeBlock(P,m.id);else KK.removeNode(P,m.id);});S.multi=[];S.sel=null;break;
    case 'clearst':pushUndo();KK.clearVal(P,b.id);break;
    case 'saturoll':{pushUndo();var srr=KK.satuRoll(P,b.id,ctx());if(KK.isErr(srr))toast('Ei voi arpoa: '+srr.err+'.');break;}
    case 'satued':openSatuSheet(b.id);return;
    case 'kayraed':openKayraSheet(b.id);return;
    case 'kuvafile':{var fi=$('#kuvain');if(!fi){fi=document.createElement('input');fi.type='file';fi.id='kuvain';fi.accept='image/*,.svg';fi.style.display='none';document.body.appendChild(fi);
        fi.addEventListener('change',function(){var f=fi.files[0],tid=fi.getAttribute('data-for');fi.value='';if(!f||!P.b[tid])return;if(f.size>1500000){toast('Kuva on liian iso (yli 1,5 Mt). Pienennä sitä tai käytä SVG:tä.');return;}
          var rd=new FileReader();rd.onload=function(){pushUndo();var tb=P.b[tid];if(!tb)return;var res=String(rd.result);
            if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)){try{res=decodeURIComponent(escape(atob(res.split(',')[1])));}catch(e){}}
            tb.src=res;afterInsp(true);if(f.size>300000)toast('Kuva on iso ('+Math.round(f.size/1024)+' kt). Se tallentuu projektiin ja hidastaa tallennusta.');};rd.readAsDataURL(f);});}
      fi.setAttribute('data-for',b.id);fi.click();return;}
    case 'kuvaclr':pushUndo();b.src='';break;
    case 'reittiuusi':pushUndo();b.pts=[];reittiNorm(b);S.tool='reitti';S.rtid=b.id;save();renderAll();return;
    case 'reittijatka':S.tool=S.tool==='reitti'&&S.rtid===b.id?null:'reitti';S.rtid=b.id;renderAll();return;
    case 'sarjafile':{var sfi=$('#sarjain');if(!sfi){sfi=document.createElement('input');sfi.type='file';sfi.id='sarjain';sfi.multiple=true;sfi.accept='image/*,.svg';sfi.style.display='none';document.body.appendChild(sfi);
        sfi.addEventListener('change',function(){var fs=Array.prototype.slice.call(sfi.files),tid=sfi.getAttribute('data-for');sfi.value='';var tb=P.b[tid];if(!fs.length||!tb)return;
          fs.sort(function(a,b){return a.name.localeCompare(b.name,'fi',{numeric:true});});var res=[],left=fs.length,big=0;pushUndo();
          fs.forEach(function(f,i){if(f.size>1500000){big++;if(--left===0)done();return;}var rd=new FileReader();rd.onload=function(){var r=String(rd.result);
              if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)){try{r=decodeURIComponent(escape(atob(r.split(',')[1])));}catch(e){}}res[i]=r;if(--left===0)done();};rd.readAsDataURL(f);});
          function done(){var t2=P.b[tid];if(!t2)return;if(!Array.isArray(t2.sarja))t2.sarja=[];var add=res.filter(function(x){return x&&KK.kuvaUrl(x);});
            if(!t2.src&&add.length)t2.src=add.shift();t2.sarja=t2.sarja.concat(add).slice(0,KK.SARJA_MAX);afterInsp(true);
            if(big)toast(big+' kuvaa oli liian iso (yli 1,5 Mt) eikä tullut mukaan.');}});}
      sfi.setAttribute('data-for',b.id);sfi.click();return;}
    case 'sarjateksti':{var sta=$('#ksuusi'),sv=sta?sta.value.trim():'';if(!sv)return;if(!KK.kuvaUrl(sv)){toast('Ei kelpaa kuvaksi: liitä SVG-koodi (<svg…>) tai https-osoite.');return;}
      pushUndo();if(!b.src)b.src=sv;else{if(!Array.isArray(b.sarja))b.sarja=[];if(b.sarja.length<KK.SARJA_MAX)b.sarja.push(sv);}break;}
    case 'muutosgo':KK.muutosStart(P,b.id,ctx());KK.tick(P,ctx());save();renderAll();runFrames();return;
    case 'muutosstop':KK.muutosStop(P,b.id,ctx());KK.tick(P,ctx());save();renderAll();return;
    case 'liikealkuun':pushUndo();KK.liikeAlkuun(P,b.id);KK.tick(P,ctx());save();renderAll();runFrames();return;
    case 'copy':copySel();return;
    case 'paste':pasteClip();return;
    case 'markhere':{pushUndo();var r=screenWorld();var p1=b.kk==='keski'?{x:r.x+r.w/2,y:r.y+r.h/2}:{x:r.x+20/r.z,y:r.y+20/r.z};
      b.x=Math.round(b.kk==='keski'?p1.x-b.w/2:p1.x);b.y=Math.round(b.kk==='keski'?p1.y-b.h/2:p1.y);if(typeof b.zz==='number'||b.kk==='keski')b.zz=Math.round(r.z*100)/100;toast('Sijainti päivitettiin tähän ruutuun.');break;}
    case 'markgo':{var hold=S.sel;navTo({o:b.id});S.sel=hold;break;}
    case 'front':case 'toback':{pushUndo();var zs=blocks(function(o){return isUI(o)&&o.v===b.v;}).map(function(o){return o.z||0;});b.z=d==='front'?Math.max.apply(null,zs)+1:Math.min.apply(null,zs)-1;break;}
  }
  KK.tick(P,ctx());save();renderAll();
}

document.addEventListener('keydown',function(e){
  if(!P)return;
  var inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
  if(e.code==='Space'&&!inField){S.space=true;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!inField){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'&&!inField){e.preventDefault();redo();return;}
  if((e.metaKey||e.ctrlKey)&&!inField&&showL()&&!(S.tab==='nakyma')&&(e.key.toLowerCase()==='c'||e.key.toLowerCase()==='v')){
    if(e.key.toLowerCase()==='c'){if(selNodeIds().length){e.preventDefault();copySel();}}else if(S.clip){e.preventDefault();pasteClip();}return;}
  if(inField)return;
  if(e.key==='Escape'){S.tool=null;S.sel=null;S.multi=[];S.back=null;hideMenu();closeSheet();renderAll();return;}
  if(S.tab==='nakyma'&&locked())return;
  if((e.key==='Backspace'||e.key==='Delete')&&S.multi.length>1){e.preventDefault();doAction('delmulti',{});return;}
  if((e.key==='Backspace'||e.key==='Delete')&&S.sel){e.preventDefault();
    if(S.sel.t==='b')doAction('delblock',{b:P.b[S.sel.id]});
    else if(S.sel.t==='n')doAction('delnode',{});
    else if(S.sel.t==='l')doAction('dellink',{});
    else if(S.sel.t==='d')doAction('deldeco',{});
    return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&S.sel){e.preventDefault();var b=selBlock();if(!b)return;
    if(S.sel.t==='b')doAction('dup',{b:b});else if(!KK.isWin(b)&&!KK.chainOfNode(P,KK.nodeOf(P,S.sel.id)))doAction('inst',{b:b});return;}
  if(S.sel&&S.sel.t==='b'&&/^Arrow/.test(e.key)&&editingUI()){var bb=P.b[S.sel.id];if(!bb||!isUI(bb))return;e.preventDefault();var s=e.shiftKey?10:1;
    if(!S.nudging){pushUndo();S.nudging=true;}
    var grp=S.multi.length>1?S.multi.map(function(m){return P.b[m.id];}).filter(Boolean):[bb];
    grp.forEach(function(g){if(e.key==='ArrowLeft')g.x-=s;if(e.key==='ArrowRight')g.x+=s;if(e.key==='ArrowUp')g.y-=s;if(e.key==='ArrowDown')g.y+=s;});save();renderUIStage();renderInsp();}
});
document.addEventListener('keyup',function(e){if(e.code==='Space')S.space=false;if(/^Arrow/.test(e.key))S.nudging=false;});

function importText(t){

  var list=Array.isArray(o.projects)?o.projects:(o&&o.b&&o.lg?[o]:null);if(!list||!list.length){toast('Tekstissä ei ole projekteja.');return;}
  list.forEach(function(p){p=KK.repair(KK.clone(p));if(Dt.projects.some(function(x){return x.id===p.id;}))p.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);Dt.projects.push(p);Dt.cur=p.id;});
  P=curProject();S.vw=P.views[0].id;S.sel=null;S.undo=[];KK.tick(P,ctx());save();closeSheet();$('#stage').innerHTML='';renderAll();toast('Tuotu: '+list.length+' projekti'+(list.length>1?'a':''));

/* Kytköskartan projektit samasta selaimesta (sama osoite, eri tallennusavain). Kopio: Kytköskartta ei muutu.
   Jo tuotua projektia (sama tunniste) ei tuoda uudelleen. GitHub-kirjanpito jätetään pois, joten kopio tallentuu omaan kansioonsa. */
function importFromKK(){
  var o=null;try{o=JSON.parse(localStorage.getItem('kytkoskartta.v1')||'null');}catch(e){}
  var list=o&&Array.isArray(o.projects)?o.projects:[];
  if(!list.length){toast('Tässä selaimessa ei ole Kytköskartan projekteja. Voit myös viedä ne Kytköskartasta tiedostona ja tuoda tiedostosta.');return;}
  var n=0,ohit=0;
  list.forEach(function(p0){if(!p0||!p0.b||!p0.lg)return;if(Dt.projects.some(function(x){return x.id===p0.id;})){ohit++;return;}
    var p=KK.repair(KK.clone(p0));delete p._gh;Dt.projects.push(p);Dt.cur=p.id;n++;});
  if(!n){toast('Kaikki Kytköskartan projektit on jo tuotu ('+ohit+').');return;}
  P=curProject();S.vw=P.views[0].id;S.sel=null;S.undo=[];S.redo=[];KK.tick(P,ctx());save();closeSheet();$('#stage').innerHTML='';renderAll();
  toast('Tuotu Kytköskartasta: '+n+' projekti'+(n>1?'a':'')+(ohit?' ('+ohit+' oli jo tuotu)':'')+'. Kytköskartta pysyi ennallaan.');
}

}

/* ---------- GitHub-tallennus ja varmuuskopio ----------
   Masterin mallin mukaan: projektin rakenne tallentuu käyttäjän yksityiseen repoon tiedostoon pajakone/<projektin id>.json.
   Mukana ovat myös käyttötiedot (st, mem) Emilin päätöksellä 14.10.2026; vain kameran paikat (cam, lcam) jäävät selaimeen.
   Avain on vain tämän selaimen muistissa (pajakone:gh), ei varmuuskopioissa. Jos Kytköskartan tai Masterin GitHub-asetukset ovat samassa
   selaimessa, ne otetaan käyttöön (sama repo ja avain käyvät). Jos GitHubissa on uudempi versio (esim. tekoälyn muutokset),
   se haetaan itsestään, ellei omia tallentamattomia muutoksia ole; muuten käyttäjä valitsee. */
var GHK='appiappi:gh',GHDIR='appiappi',gh={repo:'',token:'',auto:true},ghBusy=false,ghMsg='',ghTimer=null,ghLastErr='',ghRepoBad=false,H={};
(function(){var g0=null;try{g0=JSON.parse(localStorage.getItem(GHK)||'null');}catch(e){}
  if(!g0){try{var m=JSON.parse(localStorage.getItem('pajakone:gh')||'null')||JSON.parse(localStorage.getItem('kytkoskartta:gh')||'null')||JSON.parse(localStorage.getItem('master:gh')||'null');if(m&&m.repo&&m.token){g0={repo:m.repo,token:m.token,auto:true,fromMaster:true};localStorage.setItem(GHK,JSON.stringify(g0));}}catch(e){}}
  if(g0){gh.repo=g0.repo||'';gh.token=g0.token||'';gh.auto=g0.auto!==false;}})();
function ghSaveCfg(){try{localStorage.setItem(GHK,JSON.stringify({repo:gh.repo,token:gh.token,auto:gh.auto}));}catch(e){}}
function ghOn(){return !!(gh.repo&&gh.token);}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(b){return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));}
function hm(d){d=new Date(d);return d.getHours()+'.'+('0'+d.getMinutes()).slice(-2);}
/* Ei ylimääräisiä otsakkeita (Safari ja CORS). Välimuisti ohitetaan aikaleimalla. */
function ghApi(url,method,body){method=method||'GET';var u=method==='GET'?url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now():url;var h={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json'};if(body)h['Content-Type']='application/json';
  var req;try{req=fetch(u,{method:method,headers:h,body:body?JSON.stringify(body):undefined});}catch(e){ghLastErr=String(e&&e.message||e);return Promise.resolve({status:0,j:{}});}
  return req.then(function(r){ghLastErr='';return r.text().then(function(t){var j={};try{j=JSON.parse(t);}catch(e){}return {status:r.status,j:j};});},function(e){ghLastErr=String(e&&e.message||e);return {status:0,j:{}};});}
function ghRepoName(){return String(gh.repo||'').trim().replace(/\s+/g,'').replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');}
function ghRepoUrl(){return 'https://api.github.com/repos/'+ghRepoName();}
function ghPath(p){return GHDIR+'/'+p.id+'.json';}
function ghErr(st){if(st===0)return 'Ei yhteyttä GitHubiin. Tarkista nettiyhteys ja että avain on kopioitu kokonaan (alkaa github_pat_).'+(ghLastErr?' Selaimen ilmoitus: '+ghLastErr:'');return ({401:'Avain ei kelpaa tai se on vanhentunut.',403:'Avaimella ei ole oikeutta. Tarvitaan Contents: Read and write.',404:'Repoa ei löydy, tai avaimella ei ole pääsyä siihen.',409:'GitHubissa on uudempi versio.',422:'GitHubissa on uudempi versio.'})[st]||('GitHub vastasi virheellä '+st+'.');}
function ghRepoErr(st){var n=ghRepoName();if(st!==404)return ghErr(st);
  if(n.indexOf('/')<0)return 'Repoa ei löydy: Repo-kenttään kirjoitetaan omistaja ja nimi kauttaviivalla, esimerkiksi Kasibanaani/master-tiedot. Nyt kentässä on ”'+n+'”.';
  return 'Repoa ”'+n+'” ei löydy, tai avaimella ei ole pääsyä siihen. Tarkista Repo-kentän kirjoitusasu ja avaimen Repository access -kohta.';}
var ghBadRe=/Avain|oikeutta|löydy|yhteyttä|virheellä|ei ole Appi-appin/;
function ghMeta(p){if(!p._gh||typeof p._gh!=='object')p._gh={sha:'',at:'',dirty:false,remote:false};return p._gh;}
/* GitHubiin = kaikki paitsi kamerat ja kirjanpito. Täysi = kaikki paitsi kamerat ja kirjanpito (varmuuskopion tila). */
var NOSTRUCT={cam:1,lcam:1,_gh:1};
function structOf(p){var c={};for(var k in p)if(!NOSTRUCT[k])c[k]=p[k];return JSON.stringify(c);}
function fullOf(p){var c={};for(var k in p)if(k!=='cam'&&k!=='lcam'&&k!=='_gh')c[k]=p[k];return JSON.stringify(c);}
function ghInitHashes(){H={};Dt.projects.forEach(function(p){H[p.id]={s:structOf(p),f:fullOf(p)};var g=ghMeta(p);if(!g.sha)g.dirty=true;});}
/* Kutsutaan jokaisessa tallennuksessa: huomaa rakenteen ja käyttötietojen muutokset */
function trackChanges(){var any=false;
  Dt.projects.forEach(function(p){var s=structOf(p),f=fullOf(p),h=H[p.id],g=ghMeta(p);
    if(!h){H[p.id]={s:s,f:f};if(!g.sha){g.dirty=true;any=true;}Dt.meta.dirty=(Dt.meta.dirty||0)+1;return;}
    if(h.s!==s){g.dirty=true;any=true;}if(h.f!==f)Dt.meta.dirty=(Dt.meta.dirty||0)+1;h.s=s;h.f=f;});
  if(any)ghSchedule();}
function ghSchedule(){clearTimeout(ghTimer);if(ghOn()&&gh.auto)ghTimer=setTimeout(ghFlush,2500);renderGh();}
function ghFlush(){clearTimeout(ghTimer);if(!ghOn()||ghBusy)return;var p=Dt.projects.filter(function(x){var g=ghMeta(x);return g.dirty&&!g.remote;})[0];if(p)ghPush(p);}
function payload(p){var c=JSON.parse(structOf(p));return JSON.stringify({app:'appiappi',ver:KK.VER,savedAt:new Date().toISOString(),projekti:c},null,1)+'\n';}
function ghPush(p,force){if(!ghOn()||!p||ghBusy)return Promise.resolve(false);var g=ghMeta(p),sent=structOf(p);ghBusy=true;renderGh();
  function put(sha){return ghApi(ghRepoUrl()+'/contents/'+ghPath(p),'PUT',{message:'Appi-appi: '+p.name,content:b64e(payload(p)),sha:sha||undefined});}
  var first=(force||!g.sha)?ghApi(ghRepoUrl()+'/contents/'+ghPath(p)).then(function(r){if(r.status===200&&!force&&r.j.sha!==g.sha)return {status:409,j:{}};return put(r.status===200?r.j.sha:'');}):put(g.sha);
  return first.then(function(r){ghBusy=false;
    if(r.status===200||r.status===201){g.sha=r.j.content.sha;g.at=new Date().toISOString();g.dirty=structOf(p)!==sent;g.remote=false;ghMsg='';saveQuiet();renderGh();if(gh.auto)ghSchedule();return true;}
    if(r.status===409||r.status===422){g.remote=true;ghMsg='Projektista ”'+p.name+'” on GitHubissa uudempi versio, esimerkiksi tekoälyn muutokset. Hae se tai tallenna omasi sen päälle.';}
    else ghMsg=ghErr(r.status);
    saveQuiet();renderGh();return false;});}
function saveQuiet(){try{localStorage.setItem(LS,JSON.stringify(Dt));}catch(e){}}
function okProj(o){return o&&(o.app==='appiappi'||o.app==='pajakone'||o.app==='kytkoskartta')&&o.projekti&&typeof o.projekti==='object'&&o.projekti.b&&o.projekti.lg;}
/* Hakee projektin GitHubista käyttötietoineen. Kamerat ja tunniste säilyvät. Kumoa palauttaa edellisen rakenteen. */
function ghPull(p,quiet){if(!ghOn()||!p)return Promise.resolve(false);ghBusy=true;renderGh();
  return ghApi(ghRepoUrl()+'/contents/'+ghPath(p)).then(function(r){ghBusy=false;
    if(r.status!==200){ghMsg=r.status===404?'Projektia ”'+p.name+'” ei ole GitHubissa. Se on tehty vain tässä selaimessa.':ghErr(r.status);renderGh();return false;}
    var o=null;try{o=JSON.parse(b64d(r.j.content));}catch(e){}if(!okProj(o)){ghMsg='GitHubin tiedosto ei ole Appi-appin projekti.';renderGh();return false;}
    if(p===P)pushUndo();
    var keep={id:p.id,cam:p.cam,lcam:p.lcam};Object.keys(p).forEach(function(k){delete p[k];});Object.keys(o.projekti).forEach(function(k){p[k]=o.projekti[k];});
    Object.keys(keep).forEach(function(k){p[k]=keep[k];});KK.repair(p);p._gh={sha:r.j.sha,at:new Date().toISOString(),dirty:false,remote:false};
    H[p.id]={s:structOf(p),f:fullOf(p)};
    if(p===P){S.sel=null;S.multi=[];fixView();KK.tick(P,ctx());}
    /* Haettu projekti voi sisältää ketjuja, joiden ajastin on jo kulunut: ne jatkuvat heti. */
    if(pollChains())saveQuiet();chainTimer();
    ghMsg=quiet?'Haettu GitHubista uudempi versio projektista ”'+p.name+'”.':'Haettu GitHubista.';saveQuiet();$('#stage').innerHTML='';renderAll();renderGh();if(quiet)toast(ghMsg);return true;});}
/* Onko GitHubissa uudempi versio? Haetaan, jos omia tallentamattomia muutoksia ei ole. */
function ghCheck(p){if(!ghOn()||!p||ghBusy)return Promise.resolve();var g=ghMeta(p);
  return ghApi(ghRepoUrl()+'/contents/'+ghPath(p)).then(function(r){if(r.status!==200){if(r.status!==404){ghMsg=ghErr(r.status);renderGh();}return;}
    if(r.j.sha===g.sha)return;if(!g.dirty)return ghPull(p,true);g.remote=true;ghMsg='Projektista ”'+p.name+'” on GitHubissa uudempi versio, esimerkiksi tekoälyn muutokset. Hae se tai tallenna omasi sen päälle.';renderGh();});}
/* Projektit, jotka ovat GitHubissa mutta eivät tässä selaimessa (esim. tekoälyn tekemät tai toisella laitteella tehdyt).
   Itse poistetut jätetään hakematta, ellei käyttäjä pyydä (all=true). */
var ghNewP=null;
function ghNew(all){if(!ghOn())return Promise.resolve(0);if(ghNewP)return ghNewP;ghNewP=ghNew0(all).then(function(n){return ghRepoBad?n:ghFromPaja().then(function(m){return n+m;});}).then(function(n){ghNewP=null;return n;},function(){ghNewP=null;return 0;});return ghNewP;}
/* Appi-appi (entinen Pajakone): kerran tehtävä siirto GitHubin kansiosta pajakone/. Projektit, joita tässä selaimessa ei ole,
   haetaan ja merkitään tallentamattomiksi, jolloin ne tallentuvat kansioon appiappi/. Kansio pajakone/ jää ennalleen. */
function ghFromPaja(){if(Dt.meta.pajaGh)return Promise.resolve(0);
  return ghApi(ghRepoUrl()+'/contents/pajakone').then(function(r){
    if(r.status===404){Dt.meta.pajaGh=KK.iso(new Date());saveQuiet();return 0;}
    if(r.status!==200||!Array.isArray(r.j))return 0;
    var have={};Dt.projects.forEach(function(p){have[p.id]=1;});
    var todo=r.j.filter(function(f){var m=/^(.+)\.json$/.exec(f.name);return m&&!have[m[1]]&&Dt.meta.ghGone.indexOf(m[1])<0;});
    return Promise.all(todo.map(function(f){return ghApi(ghRepoUrl()+'/contents/'+f.path).then(function(x){if(x.status!==200)return -1;try{var o=JSON.parse(b64d(x.j.content));if(okProj(o)){var p=o.projekti;
        p.id=f.name.replace(/\.json$/,'');p.st=p.st||{};p.mem=p.mem||{};p.cam={};delete p.lcam;KK.repair(p);p._gh={sha:'',at:'',dirty:true,remote:false};
        if(Dt.projects.some(function(q){return q.id===p.id;}))return 0;Dt.projects.push(p);H[p.id]={s:structOf(p),f:fullOf(p)};return 1;}}catch(e){}return 0;});}))
      .then(function(l){if(l.indexOf(-1)>=0)return l.filter(function(v){return v>0;}).length;
        var n=l.reduce(function(a,b){return a+b;},0);Dt.meta.pajaGh=KK.iso(new Date());
        if(n){if(!P){Dt.cur=Dt.projects[0].id;P=curProject();S.vw=P.views[0].id;KK.tick(P,ctx());}
          pollChains();chainTimer();ghMsg=n+(n===1?' projekti siirretty':' projektia siirretty')+' Pajakoneen GitHub-kansiosta Appi-appiin.';$('#stage').innerHTML='';renderAll();toast(ghMsg);ghSchedule();}
        saveQuiet();return n;});});}
function ghNew0(all){ghRepoBad=false;return ghApi(ghRepoUrl()+'/contents/'+GHDIR).then(function(r){
  if(r.status===404)return ghApi(ghRepoUrl()).then(function(q){if(q.status!==200){ghRepoBad=true;ghMsg=ghRepoErr(q.status);renderGh();}return 0;});
  if(r.status!==200||!Array.isArray(r.j)){ghMsg=ghErr(r.status);renderGh();return 0;}
  var have={};Dt.projects.forEach(function(p){have[p.id]=1;});
  var todo=r.j.filter(function(f){var m=/^(.+)\.json$/.exec(f.name);return m&&!have[m[1]]&&(all||Dt.meta.ghGone.indexOf(m[1])<0);});
  return Promise.all(todo.map(function(f){return ghApi(ghRepoUrl()+'/contents/'+f.path).then(function(x){try{var o=JSON.parse(b64d(x.j.content));if(okProj(o)){var p=o.projekti;
      p.id=f.name.replace(/\.json$/,'');p.st=p.st||{};p.mem=p.mem||{};p.cam={};delete p.lcam;KK.repair(p);p._gh={sha:x.j.sha,at:new Date().toISOString(),dirty:false,remote:false};
      if(Dt.projects.some(function(q){return q.id===p.id;}))return 0;Dt.projects.push(p);H[p.id]={s:structOf(p),f:fullOf(p)};
      var gi=Dt.meta.ghGone.indexOf(p.id);if(gi>=0)Dt.meta.ghGone.splice(gi,1);return 1;}}catch(e){}return 0;});}))
    .then(function(l){var n=l.reduce(function(a,b){return a+b;},0);
      if(n){if(!P){Dt.cur=Dt.projects[0].id;P=curProject();S.vw=P.views[0].id;KK.tick(P,ctx());}
        pollChains();chainTimer();
        ghMsg=n+(n===1?' projekti haettu GitHubista.':' projektia haettu GitHubista.');saveQuiet();$('#stage').innerHTML='';renderAll();toast(ghMsg);}
      return n;});});}
function ghTest(){var m=$('#gh-msg');function say(t,bad){if(m){m.textContent=t;m.className='ghmsg'+(bad?' bad':'');}}
  if(/[^\x21-\x7e]/.test(gh.token)){say('Avaimessa on merkkejä, joita GitHubin avaimessa ei voi olla (esim. ääkkösiä tai lainausmerkkejä). Kopioi avain uudelleen.',1);return;}
  say('Tarkistetaan…');ghApi(ghRepoUrl()).then(function(r){
    if(r.status!==200){say(ghRepoErr(r.status),1);return;}
    if(!r.j.private){say('Yhteys toimii, mutta repo on JULKINEN: kaikki näkisivät projektisi. Vaihda repo yksityiseksi GitHubissa.',1);return;}
    if(r.j.permissions&&!r.j.permissions.push){say('Yhteys toimii, mutta avaimella ei ole kirjoitusoikeutta.',1);return;}
    say('Yhteys toimii. Repo '+r.j.full_name+' on yksityinen.');});}
/* Tila yläpalkissa */
function renderGh(){var b=$('#ghbtn');if(!b)return;if(!ghOn()){b.hidden=true;renderStat();return;}b.hidden=false;
  var dirtyN=0,remote=null,last='';Dt.projects.forEach(function(p){var g=ghMeta(p);if(g.dirty)dirtyN++;if(g.remote&&!remote)remote=p;if(g.at&&g.at>last)last=g.at;});
  var t,bad=false;if(ghBusy)t='GitHub: tallennetaan…';else if(remote){t='GitHubissa uudempi';bad=true;}else if(ghMsg&&ghBadRe.test(ghMsg)){t='GitHub: virhe';bad=true;}
  else if(dirtyN)t=gh.auto?'GitHub: tallentamatta':'GitHub: '+dirtyN+' tallentamatta';else if(last)t='GitHub: tallennettu '+hm(last);else t='GitHub: ei vielä tallennettu';
  b.textContent=t;b.className='tb ghchip'+(bad?' bad':'');b.title=ghMsg||'GitHub-tallennus. Avaa asetukset napauttamalla.';
  var gm=$('#gh-msg');if(gm&&ghMsg){gm.textContent=ghMsg;gm.className='ghmsg'+(bad?' bad':'');}renderStat();}
function renderStat(){var s=$('#kstat');if(!s||!Dt)return;var d=(Dt.meta&&Dt.meta.dirty)>0,le=Dt.meta&&Dt.meta.lastExport;
  s.className='kstat'+((!storeOk||(d&&!ghOn()))?' dirty':'');
  s.title=d?'Varmuuskopiotiedostoa ei ole viety viimeisten muutosten jälkeen.'+(ghOn()?' Kaikki on silti tallessa GitHubissa.':''):'';
  s.textContent=!storeOk?'Tallennus selaimeen ei onnistu':(d?'Varmuuskopio viemättä':(le?'Varmuuskopio viety '+KK.fmtDate(le,Dt.cfg.df):'Tallessa tässä selaimessa'));}
/* Varmuuskopio omalle laitteelle: kaikki projektit käyttötietoineen. Avain ei tule mukaan. */
function exportAll(){download('appiappi-varmuuskopio-'+KK.iso(new Date())+'.json',JSON.stringify(Dt,null,1));Dt.meta.lastExport=KK.iso(new Date());Dt.meta.dirty=0;saveQuiet();renderStat();}
/* Asetusten osio */
function ghSection(){
  return '<div class="fs" id="sec-gh"><h4>GitHub-tallennus (yksityinen repo)</h4>'+
   '<div class="help" style="margin-bottom:8px">Tallentaa kaiken tekemäsi omaan yksityiseen repoosi kansioon <b>appiappi</b>: projektien rakenteen ja käyttötiedot (kirjoitetut tekstit, valinnat, listojen rivit, aikajanan). Silloin tekoäly näkee projektit ja voi muokata niitä, ja saat ne toiseen selaimeen. Vain kanvaasin vierityskohta jää tähän selaimeen. Sama repo ja avain kuin Masterissa käyvät. Avain on vain tämän selaimen muistissa, eikä se tule varmuuskopioon.</div>'+
   '<label class="ghf"><span>Repo</span><input type="text" id="gh-repo" value="'+esc(gh.repo)+'" placeholder="Kasibanaani/master-tiedot" autocomplete="off" spellcheck="false"></label>'+
   '<label class="ghf"><span>Avain'+(gh.token?' · tallessa tässä selaimessa':'')+'</span><input type="password" id="gh-token" value="'+esc(gh.token)+'" placeholder="github_pat_…" autocomplete="off"></label>'+
   '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 8px"><input type="checkbox" id="gh-auto"'+(gh.auto?' checked':'')+'> Tallenna automaattisesti muutosten jälkeen</label>'+
   '<div class="ibs"><button class="ib" data-gh="save">Tallenna nyt</button><button class="ib" data-gh="fetch">Hae GitHubista</button><button class="ib" data-gh="new">Hae uudet projektit</button><button class="ib" data-gh="test">Testaa yhteys</button>'+(gh.token?'<button class="ib del" data-gh="delkey">Poista avain</button>':'')+'</div>'+
   '<p class="ghmsg'+(ghMsg&&ghBadRe.test(ghMsg)?' bad':'')+'" id="gh-msg">'+esc(ghMsg)+'</p>'+
   '<details class="ghhelp"><summary>Näin otat GitHub-tallennuksen käyttöön</summary>'+
   ['Jos Kytköskartan tai Masterin GitHub-tallennus on jo käytössä tässä selaimessa, Appi-appi ottaa sen asetukset itsestään, eikä mitään tarvitse tehdä.',
    '1. GitHubissa: oikean yläkulman + → New repository. Nimi esimerkiksi master-tiedot, valitse Private ja rasti Add a README file. Create repository.',
    '2. Avain: profiilikuva → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.',
    '3. Repository access: Only select repositories → valitse repo. Permissions → Repository permissions → Contents: Read and write.',
    '4. Generate token, kopioi avain (alkaa github_pat_) ja liitä se yllä olevaan kenttään. Kirjoita Repo-kenttään omistaja/nimi ja paina Testaa yhteys.',
    '5. Jotta tekoäly näkee projektit: anna Claude-sovellukselle pääsy repoon GitHubissa (Settings → Applications → Claude → Configure) ja kerro keskustelussa repon nimi.'].map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+
   '</details></div>';}
var ghSoonT=null;function ghSoon(){clearTimeout(ghSoonT);if(!ghOn())return;ghSoonT=setTimeout(function(){ghNew().then(function(){ghFlush();});},900);}
document.addEventListener('input',function(e){var id=e.target.id;
  if(id==='gh-repo'){gh.repo=String(e.target.value||'').trim();ghSaveCfg();ghMsg='';renderGh();ghSoon();}
  else if(id==='gh-token'){gh.token=String(e.target.value||'').replace(/[\s​-‍﻿]+/g,'');ghSaveCfg();ghMsg='';renderGh();ghSoon();}});
document.addEventListener('change',function(e){if(e.target.id==='gh-auto'){gh.auto=!!e.target.checked;ghSaveCfg();if(gh.auto)ghFlush();renderGh();}});
$('#sheet').addEventListener('click',function(e){var x=e.target.closest('[data-gh]');if(!x)return;var a=x.getAttribute('data-gh'),m=$('#gh-msg');
  function say(t,bad){if(m){m.textContent=t;m.className='ghmsg'+(bad?' bad':'');}}
  if(a!=='delkey'&&!ghOn()){say('Täytä ensin Repo ja Avain.',1);return;}
  if(a==='save'){if(ghBusy){say('Tallennus on jo käynnissä…');return;}if(!P){say('Avaa ensin projekti.',1);return;}say('Tallennetaan…');var g=ghMeta(P);
    ghPush(P,!!g.remote).then(function(ok){if(ok){say('Tallennettu GitHubiin klo '+hm(new Date())+': '+ghRepoName()+' / '+ghPath(P));ghFlush();}else if(!ghMsg)say('Tallennus ei onnistunut.',1);});}
  else if(a==='fetch'){say('Haetaan…');ghNew().then(function(n){if(ghRepoBad||!P)return;var g=ghMeta(P);
      return ghApi(ghRepoUrl()+'/contents/'+ghPath(P)).then(function(r){var pre=n?n+(n===1?' projekti haettu. ':' projektia haettu. '):'';
        if(r.status===404){say(pre+'Avoin projekti ”'+P.name+'” on vain tässä selaimessa, eikä sitä ole vielä GitHubissa.');return;}
        if(r.status!==200){say(ghErr(r.status),1);return;}
        if(r.j.sha===g.sha&&!g.dirty){say(pre+'Avoin projekti on jo sama kuin GitHubissa.');return;}
        if(g.dirty&&!confirm('Haetaanko GitHubin versio? Projektin ”'+P.name+'” tallentamattomat muutokset korvataan. Kumoa palauttaa ne tarvittaessa.'))return;
        return ghPull(P).then(function(ok){if(ok)openSettingsGh();});});});}
  else if(a==='new'){say('Haetaan…');ghNew(true).then(function(n){if(!n&&!ghRepoBad)say('Ei uusia projekteja GitHubissa.');else if(n)openSettingsGh();});}
  else if(a==='test')ghTest();
  else if(a==='delkey'){gh.token='';ghSaveCfg();ghMsg='';renderGh();openSettingsGh();}});
function openSettingsGh(){openSettings();var s=$('#sec-gh');if(s)s.scrollIntoView({block:'start'});}
$('#bkbtn').addEventListener('click',exportAll);
$('#ghbtn').addEventListener('click',function(){var p=Dt.projects.filter(function(x){return ghMeta(x).remote;})[0];
  if(p){if(confirm('Projektista ”'+p.name+'” on GitHubissa uudempi versio, todennäköisesti tekoälyn tekemiä muutoksia.\n\nOK = hae GitHubin versio (tämän projektin tallentamattomat muutokset korvautuvat; Kumoa palauttaa ne).\nPeru = muut vaihtoehdot.')){ghPull(p);return;}
    if(confirm('Tallennetaanko oma versiosi GitHubin version päälle? GitHubin uudempi versio korvautuu.'))ghPush(p,true);return;}
  openSettingsGh();});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(ghOn()&&gh.auto){saveNow();ghFlush();}}else if(P)ghCheck(P);});

/* ---------- Ketjut etenevät, kun appi on auki ----------
   Odottava ketju (ajastin) tarkistetaan, kun appi avataan, kun se tulee taas näkyviin ja sekunnin välein käytön aikana.
   Kun appi on kiinni, mitään ei tapahdu taustalla: ketju jatkuu siitä, kun appi seuraavan kerran avataan. */
function pollChains(){
  if(!Dt)return false;var cur=false;
  Dt.projects.forEach(function(p){if(!KK.anyChainRunning(p))return;var c=p===P?ctx():{now:function(){return new Date();},df:Dt.cfg.df};
    if(KK.chainPoll(p,c)&&p===P)cur=true;});
  return cur;
}
var chT=null;
/* Kun ketju pysähtyy virheeseen käytön aikana (esim. ajastimen kesto nuolesta on nolla), siitä kerrotaan kerran. */
function chainErrToast(){if(!P)return;S.errSeen=S.errSeen||{};Object.keys(P.st).forEach(function(id){var b=P.b[id],cs=P.st[id];if(!b||b.k!=='ketju'||!cs||!cs.err)return;var key=id+'|'+cs.end;if(S.errSeen[key])return;S.errSeen[key]=1;toast('⚠ Ketju ”'+b.nm+'”: '+cs.err);});}
function chainTimer(){
  var any=Dt&&Dt.projects.some(function(p){return KK.anyChainRunning(p);});
  if(any&&!chT)chT=setInterval(chainTick,1000);else if(!any&&chT){clearInterval(chT);chT=null;}
}
function chainTick(){runFrames();
  if(!P){chainTimer();return;}
  var ch=pollChains();if(ch)chainErrToast();
  if(ch)save();
  if(!S.drg&&ch){refreshKList();if(showL()&&$('#lvp'))renderLogicStage();if(showU()&&$('#uvp'))renderUIStage();var sb=selBlock();if(sb&&(sb.k==='ketju'||KK.isStep(sb))&&!($('#insp')&&$('#insp').contains(document.activeElement)))renderInsp();}
  else if(KK.anyChainRunning(P))liveChains();
  chainTimer();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&P){if(pollChains()){save();renderStage();}chainTimer();}});

/* ---------- Päivä vaihtuu ---------- */
var lastDay=KK.iso(new Date());
setInterval(function(){var d=KK.iso(new Date());if(d!==lastDay&&P){lastDay=d;KK.tick(P,ctx());save();renderStage();}},30000);
/* Pajakone 4: kaavat, joissa on nyt (kellonaika), päivittyvät sekunnin välein. Ruudun koon muutos päivittää ruutu-kaavat. */
var NOWRE=/(^|[^A-Za-z0-9_ÅÄÖåäö#.{])nyt(\.|\b)/,RUUTURE=/(^|[^A-Za-z0-9_ÅÄÖåäö#.{])ruutu\./;
function usesWord(re){return !!P&&Object.keys(P.b).some(function(i){var b=P.b[i];return b.k==='kaava'&&re.test(String(b.f||''));});}
setInterval(function(){if(!P||document.hidden||S.drg||S.frRaf||!usesWord(NOWRE))return;KK.tick(P,ctx());if(showU()&&$('#uvp'))renderUIStage();if(showL()&&$('#lvp'))renderLogicStage();},1000);
window.addEventListener('resize',function(){if(P&&usesWord(RUUTURE)&&!S.drg){KK.tick(P,ctx());if(showU()&&$('#uvp'))renderUIStage();}if(P&&showU()&&useMode()&&devOf()&&$('#uvp')){clampUI();applyCam($('#uvp'),$('#uworld'),camUI());applyRV();}if(P&&showU())updRulers();if(P&&showL()&&$('#lvp'))drawLinks();});
window.addEventListener('beforeunload',saveNow);

/* ---------- Käynnistys ---------- */
load();
if(P){S.vw=P.views[0].id;KK.tick(P,ctx());}
if(pollChains())saveNow();
/* Projektin avaus lukittuna: alkukohtaan (kanvaasin koko tiedetään vasta piirron jälkeen). */
function startAfterOpen(){setTimeout(runFrames,0);if(P&&locked()&&viewOf(S.vw)&&viewOf(S.vw).alku&&$('#uvp')){goStart(S.vw);renderUIStage();}openChains();}
/* Ketjut, joilla on ”Käynnisty, kun projekti avataan”, käynnistyvät, kun projekti avataan. */
function openChains(){if(!P)return;var c=ctx(),n=KK.chainOpen(P,c);if(n){save();chainErrToast();renderAll();}chainTimer();}
renderAll();startAfterOpen();
if(S.pajaMoved)toast('Pajakone on nyt Appi-appi. '+S.pajaMoved+(S.pajaMoved===1?' projekti siirtyi':' projektia siirtyi')+' tähän itsestään.');
renderGh();if(ghOn()){ghCheck(P).then(function(){return ghNew();}).then(function(){ghFlush();});}
chainTimer();
return {get data(){return Dt;},get P(){return P;},S:S,gh:gh,ghPush:function(){return ghPush(P);},ghCheck:function(){return ghCheck(P);},ghNew:function(a){return ghNew(a);},ghFlush:ghFlush,ghMeta:ghMeta,exportAll:exportAll,renderAll:renderAll,openExample:openExample,saveNow:saveNow,ev:ev,ctx:ctx,runFrames:runFrames,goStart:goStart};
})();
