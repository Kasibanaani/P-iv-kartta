<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shakki">
<link rel="apple-touch-icon" id="touchicon">
<title>Shakki</title>
<style>
:root{--bg:#F5F3EE;--cell:#FFFEFA;--label:#252B28;--label2:#5E685F;--sep:#DDE2D9;--accent:#39775A;--fill:#E7F0E7;--tint:#EDF1EA;--shadow:rgba(39,61,34,.055);--shade:rgba(20,30,25,.38);--on-solid:#fff;--red:#D70015;
  --sqL:#EEF1EC;--sqD:#9DB7A7;--hl:rgba(246,196,50,.42);--sel:rgba(246,196,50,.62);--dot:rgba(20,30,25,.22);--bs:320px;
  --pwf:#FFFFFF;--pwo:#202124;--pwd:#202124;--pbf:#2A2B2E;--pbo:#2A2B2E;--pbd:#F2F2EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.brand{font-size:21px;font-weight:800;letter-spacing:-.045em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.seg{display:inline-flex;background:var(--tint);border:1px solid var(--sep);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 14px;min-height:38px;font-weight:600;color:var(--label2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--cell);color:var(--label);box-shadow:0 1px 4px var(--shadow),0 0 0 1px var(--sep)}
.ibtn{border:1px solid var(--sep);background:var(--cell);border-radius:11px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
main{flex:1;min-height:0;display:flex;gap:24px;padding:4px 16px 16px;align-items:flex-start;justify-content:center}
main.port{flex-direction:column;align-items:center;gap:14px}
#boardwrap{flex:none;width:var(--bs);height:var(--bs);position:relative}
#board{position:absolute;inset:0;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 6px 22px var(--shadow),0 0 0 1px var(--sep)}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:var(--sqL)}.sq.d{background:var(--sqD)}
.sq.hl::before,.sq.sel::before,.sq.hint::before{content:"";position:absolute;inset:0;background:var(--hl)}
.sq.sel::before{background:var(--sel)}
.sq.hint::before{background:transparent;box-shadow:inset 0 0 0 4px var(--accent)}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,40,40,.75) 0,rgba(230,40,40,.35) 45%,rgba(230,40,40,0) 72%)}
.dotm{position:absolute;left:50%;top:50%;width:28%;height:28%;margin:-14% 0 0 -14%;border-radius:50%;background:var(--dot);pointer-events:none;z-index:3}
.dotm.cap{width:88%;height:88%;margin:-44% 0 0 -44%;background:transparent;border:calc(var(--bs)*.009) solid var(--dot)}
.co{position:absolute;font-size:calc(var(--bs)*.024);font-weight:700;line-height:1;pointer-events:none;opacity:.85}
.co.f{right:5%;bottom:4%}.co.r{left:5%;top:5%}
.sq.l .co{color:var(--sqD)}.sq.d .co{color:var(--sqL)}
#pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s cubic-bezier(.3,.7,.3,1);will-change:transform;z-index:2}
.pc svg{width:100%;height:100%;display:block}
.pc.drag{transition:none;z-index:10}.pc.drag svg{transform:scale(1.18);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.pc.ghost{opacity:.35}
.pc.noanim{transition:none}
.o{stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.w .o{fill:var(--pwo);stroke:var(--pwo)}.w .f{fill:var(--pwf)}.w .dt{fill:var(--pwd);stroke:var(--pwd)}
.b .o{fill:var(--pbo);stroke:var(--pbo)}.b .f{fill:var(--pbf)}.b .dt{fill:var(--pbd);stroke:var(--pbd)}
.dt{stroke-width:4.5;stroke-linecap:round}
#promo{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:14px}
#promo[hidden]{display:none}
#promo .box{background:var(--cell);border-radius:18px;padding:10px;display:flex;gap:8px;box-shadow:0 20px 70px var(--shade)}
#promo button{width:calc(var(--bs)*.15);height:calc(var(--bs)*.15);border:1px solid var(--sep);border-radius:12px;background:var(--tint);padding:6px;cursor:pointer}
#over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cell);border-radius:18px;padding:18px 22px;text-align:center;box-shadow:0 20px 70px var(--shade);z-index:15;min-width:60%}
#over[hidden]{display:none}
#over b{display:block;font-size:22px;letter-spacing:-.03em;margin-bottom:4px}
#over p{margin:0 0 12px;color:var(--label2)}
#side{flex:1;min-width:0;max-width:400px;display:flex;flex-direction:column;gap:12px;align-self:stretch;min-height:0}
main.port #side{width:var(--bs);max-width:none;flex:1}
.card{background:var(--cell);border:1px solid var(--sep);border-radius:18px;padding:14px 16px;box-shadow:0 6px 22px var(--shadow)}
.sec{font-size:11px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--label2);margin:0 0 6px}
.status{font-size:20px;font-weight:700;letter-spacing:-.035em}
.sub{color:var(--label2);font-size:14px}
.btn{border:1px solid var(--sep);background:var(--cell);border-radius:11px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:600px){main.port .btns{grid-template-columns:repeat(4,1fr)}}
.btns.three,main.port .btns.three{grid-template-columns:repeat(3,1fr)}
#moves{flex:1;min-height:60px;overflow:auto;-webkit-overflow-scrolling:touch;font-variant-numeric:tabular-nums}
#moves .row{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;padding:3px 0;font-size:15px}
#moves .n{color:var(--label2)}
#moves .last{background:var(--fill);border-radius:6px;padding:0 6px;margin-left:-6px;color:var(--accent);font-weight:700}
.empty{color:var(--label2);font-size:14px}
.plist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;min-height:0}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--sep);background:var(--cell);border-radius:12px;padding:10px 12px;min-height:48px;cursor:pointer;margin-top:6px}
.pitem .nro{width:26px;height:26px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--label2);flex:none}
.pitem.cur{border:2px solid var(--accent);background:var(--fill)}
.pitem.ok .nro{background:var(--accent);color:var(--on-solid)}
.pitem .nm{flex:1}
.fb{margin-top:8px;font-weight:600;min-height:1.4em}
.fb.good{color:var(--accent)}.fb.bad{color:var(--red)}
#sheetbg{position:fixed;inset:0;background:var(--shade);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#sheetbg[hidden]{display:none}
#sheet{background:var(--cell);border-radius:24px;padding:22px;width:100%;max-width:520px;max-height:100%;overflow:auto;box-shadow:0 20px 70px var(--shade)}
#sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.035em}
#sheet .grp{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--sep);background:var(--cell);border-radius:11px;min-height:44px;padding:6px 14px;cursor:pointer;font-weight:600;text-align:left}
.chip[aria-pressed=true]{background:var(--fill);color:var(--accent);border:2px solid var(--accent)}
.lvl{display:grid;gap:8px}
.lvl .chip{display:flex;align-items:center;gap:12px;width:100%}
.lvl .chip small{display:block;font-weight:400;color:var(--label2);font-size:13px}
.pips{display:flex;gap:3px;flex:none}.pips i{width:7px;height:7px;border-radius:50%;background:var(--sep)}.pips i.on{background:var(--accent)}
textarea{width:100%;min-height:140px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--label);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;-webkit-user-select:text;user-select:text}
.help p{margin:0 0 8px;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>
</head>

<div id="app">
<header>
  <div class="brand"><svg viewBox="0 0 100 100" class="w"><use href="#s-n" class="o"/><use href="#s-n" class="f"/><use href="#d-n" class="dt"/></svg>Shakki</div>

  <div id="boardwrap">

<script id="engine">
/* Shakkimoottori SH: säännöt (0x88-lauta), siirrot, SAN, botti (alfa-beta) ja mattiratkaisija. Ei DOMia: ajetaan myös Web Workerissa. */
var SH=(function(){
'use strict';
var P=1,N=2,B=3,R=4,Q=5,K=6;
var VAL=[0,100,320,330,500,900,0];
var NDIR=[33,31,18,14,-33,-31,-18,-14],BDIR=[17,15,-17,-15],RDIR=[16,-16,1,-1],KDIR=[17,15,-17,-15,16,-16,1,-1];
var START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
var LET=' pnbrqk';
var MATE=100000,INF=1000000;

/* Zobrist: kiinteä siemen, sama pääsäikeessä ja workerissa */
var seed=0x2545F491;
function rnd32(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return (t^t>>>14)>>>0}
var ZA=new Uint32Array(16*128),ZB=new Uint32Array(16*128),ZCA=new Uint32Array(16),ZCB=new Uint32Array(16),ZEA=new Uint32Array(8),ZEB=new Uint32Array(8),ZTA=rnd32(),ZTB=rnd32();
(function(){for(var i=0;i<16*128;i++){ZA[i]=rnd32();ZB[i]=rnd32()}for(i=0;i<16;i++){ZCA[i]=rnd32();ZCB[i]=rnd32()}for(i=0;i<8;i++){ZEA[i]=rnd32();ZEB[i]=rnd32()}})();
var CASM=new Int8Array(128);for(var i=0;i<128;i++)CASM[i]=15;CASM[0]=13;CASM[4]=12;CASM[7]=14;CASM[0x70]=7;CASM[0x74]=3;CASM[0x77]=11;

function hx(p,pc,sq){var i=pc*128+sq;p.h1^=ZA[i];p.h2^=ZB[i]}
function rehash(p){p.h1=0;p.h2=0;for(var s=0;s<128;s++){if(s&0x88){s+=7;continue}if(p.b[s])hx(p,p.b[s],s)}
  p.h1^=ZCA[p.cas];p.h2^=ZCB[p.cas];if(p.ep>=0){p.h1^=ZEA[p.ep&7];p.h2^=ZEB[p.ep&7]}if(p.turn){p.h1^=ZTA;p.h2^=ZTB}}

function sqName(s){return 'abcdefgh'[s&7]+((s>>4)+1)}
function sqOf(n){return (n.charCodeAt(1)-49)*16+(n.charCodeAt(0)-97)}
/* ruutu 0–63 (a8 = 0 … h1 = 63, FEN-järjestys) <-> 0x88 */
function to64(s){return (7-(s>>4))*8+(s&7)}
function from64(i){return (7-(i>>3))*16+(i&7)}

function fromFen(fen){
  var f=String(fen||START).trim().split(/\s+/),p={b:new Int8Array(128),turn:0,cas:0,ep:-1,half:0,full:1,k:[-1,-1],h1:0,h2:0,st:[],ha:[],hb:[]};
  var rows=(f[0]||'').split('/');if(rows.length!==8)return null;
  for(var r=0;r<8;r++){var file=0,row=rows[r];for(var j=0;j<row.length;j++){var c=row[j];
    if(c>='1'&&c<='8'){file+=+c;continue}
    var t=LET.indexOf(c.toLowerCase());if(t<1||file>7)return null;
    var pc=t|(c===c.toLowerCase()?8:0),s=(7-r)*16+file;p.b[s]=pc;if(t===K)p.k[pc>>3]=s;file++}
    if(file!==8)return null}
  if(p.k[0]<0||p.k[1]<0)return null;
  p.turn=f[1]==='b'?1:0;var c2=f[2]||'-';
  if(c2.indexOf('K')>=0&&p.b[4]===K&&p.b[7]===R)p.cas|=1;if(c2.indexOf('Q')>=0&&p.b[4]===K&&p.b[0]===R)p.cas|=2;
  if(c2.indexOf('k')>=0&&p.b[0x74]===(K|8)&&p.b[0x77]===(R|8))p.cas|=4;if(c2.indexOf('q')>=0&&p.b[0x74]===(K|8)&&p.b[0x70]===(R|8))p.cas|=8;
  if(f[3]&&f[3]!=='-'&&/^[a-h][36]$/.test(f[3]))p.ep=sqOf(f[3]);
  p.half=+f[4]||0;p.full=Math.max(1,+f[5]||1);
  rehash(p);p.ha.push(p.h1);p.hb.push(p.h2);
  if(attacked(p.b,p.k[p.turn^1],p.turn))return null; /* vuorossa olematon kuningas shakissa = virheellinen */
  return p}

function toFen(p){
  var out='';for(var r=7;r>=0;r--){var e=0;for(var f=0;f<8;f++){var pc=p.b[r*16+f];
    if(!pc){e++;continue}if(e){out+=e;e=0}var ch=LET[pc&7];out+=pc&8?ch:ch.toUpperCase()}
    if(e)out+=e;if(r)out+='/'}
  var c=(p.cas&1?'K':'')+(p.cas&2?'Q':'')+(p.cas&4?'k':'')+(p.cas&8?'q':'');
  return out+' '+(p.turn?'b':'w')+' '+(c||'-')+' '+(p.ep>=0?sqName(p.ep):'-')+' '+p.half+' '+p.full}

function clone(p){return fromFenHist(p)}
function fromFenHist(p){var q={b:new Int8Array(p.b),turn:p.turn,cas:p.cas,ep:p.ep,half:p.half,full:p.full,k:p.k.slice(),h1:p.h1,h2:p.h2,st:[],ha:p.ha.slice(),hb:p.hb.slice()};return q}

function attacked(b,sq,by){
  var bb=by*8,s,i,d,pc;
  if(by===0){s=sq-15;if(!(s&0x88)&&b[s]===P)return true;s=sq-17;if(!(s&0x88)&&b[s]===P)return true}
  else{s=sq+15;if(!(s&0x88)&&b[s]===(P|8))return true;s=sq+17;if(!(s&0x88)&&b[s]===(P|8))return true}
  for(i=0;i<8;i++){s=sq+NDIR[i];if(!(s&0x88)&&b[s]===(N|bb))return true;s=sq+KDIR[i];if(!(s&0x88)&&b[s]===(K|bb))return true}
  for(i=0;i<4;i++){d=BDIR[i];s=sq+d;while(!(s&0x88)){pc=b[s];if(pc){if(pc===(B|bb)||pc===(Q|bb))return true;break}s+=d}
    d=RDIR[i];s=sq+d;while(!(s&0x88)){pc=b[s];if(pc){if(pc===(R|bb)||pc===(Q|bb))return true;break}s+=d}}
  return false}

function mv(f,t,pc,c,pr,fl){return {f:f,t:t,pc:pc,c:c,pr:pr,fl:fl}}
function promo(ms,f,t,pc,c,only){var col=pc&8;ms.push(mv(f,t,pc,c,Q|col,0));if(!only){ms.push(mv(f,t,pc,c,N|col,0));ms.push(mv(f,t,pc,c,R|col,0));ms.push(mv(f,t,pc,c,B|col,0))}}

/* näennäiset siirrot; caps = vain lyönnit ja korotukset daamiksi */
function gen(p,caps){
  var ms=[],b=p.b,us=p.turn,them=us^1,sq,pc,t,to,c,i,d,j;
  for(sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    pc=b[sq];if(!pc||(pc>>3)!==us)continue;t=pc&7;
    if(t===P){
      d=us?-16:16;var last=us?0:7,start=us?6:1;to=sq+d;
      if(!(to&0x88)&&!b[to]){
        if((to>>4)===last)promo(ms,sq,to,pc,0,caps);
        else if(!caps){ms.push(mv(sq,to,pc,0,0,0));if((sq>>4)===start&&!b[to+d])ms.push(mv(sq,to+d,pc,0,0,4))}}
      for(j=-1;j<=1;j+=2){to=sq+d+j;if(to&0x88)continue;c=b[to];
        if(c&&(c>>3)===them){if((to>>4)===last)promo(ms,sq,to,pc,c,caps);else ms.push(mv(sq,to,pc,c,0,0))}

function make(p,m){

    var rk=b[rf];b[rf]=0;b[rt]=rk;hx(p,rk,rf);hx(p,rk,rt)}

function same(a,b){return a&&b&&a.f===b.f&&a.t===b.t&&(a.pr||0)===(b.pr||0)}

function reps(p){var n=0,a=p.h1,bb=p.h2;for(var i=p.ha.length-1;i>=0;i--)if(p.ha[i]===a&&p.hb[i]===bb)n++;return n}
function material(p){var c=[[],[]];for(var s=0;s<128;s++){if(s&0x88){s+=7;continue}var pc=p.b[s];if(pc&&(pc&7)!==K)c[pc>>3].push({t:pc&7,s:s})}return c}
function insufficient(p){var m=material(p),a=m[0],b=m[1];
  function minorOnly(x){return x.every(function(o){return o.t===N||o.t===B})}
  if(!minorOnly(a)||!minorOnly(b))return false;
  if(a.length+b.length<=1)return true;
  var all=a.concat(b);if(all.every(function(o){return o.t===B})){var col=((all[0].s>>4)+(all[0].s&7))&1;return all.every(function(o){return (((o.s>>4)+(o.s&7))&1)===col})}
  return false}
/* '' | 'matti' | 'patti' | 'toisto' | '50' | 'materiaali' */
function status(p){var ms=legal(p);if(!ms.length)return inCheck(p)?'matti':'patti';
  if(insufficient(p))return 'materiaali';if(p.half>=100)return '50';if(reps(p)>=3)return 'toisto';return ''}

function san(p,m){

  else{
    s='';if(t===P){if(m.c)s='abcdefgh'[m.f&7]}
    else{s=LET[t].toUpperCase();var ms=legal(p),fileU=false,rankU=false,amb=false;
      for(var i=0;i<ms.length;i++){var o=ms[i];if(o.t===m.t&&o.pc===m.pc&&o.f!==m.f){amb=true;if((o.f&7)===(m.f&7))fileU=true;if((o.f>>4)===(m.f>>4))rankU=true}}
      if(amb){if(!fileU)s+='abcdefgh'[m.f&7];else if(!rankU)s+=((m.f>>4)+1);else s+=sqName(m.f)}}
    if(m.c)s+='x';s+=sqName(m.t);if(m.pr)s+='='+LET[m.pr&7].toUpperCase()}
  make(p,m);var ch=inCheck(p);if(ch)s+=legal(p).length?'+':'#';unmake(p);

function fromSan(p,s){s=String(s).replace(/[+#!?]/g,'').replace(/0/g,'O');var ms=legal(p);
  for(var i=0;i<ms.length;i++)if(san(p,ms[i]).replace(/[+#]/g,'')===s)return ms[i];return null}

/* ---------- arvio ---------- */
var PST_W={
1:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
2:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
3:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
4:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
5:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
6:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20],
7:[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50]};
/* PSTW[t][0x88] valkealle ja PSTB mustalle (peilattu) */
var PSTW=[],PSTB=[];(function(){for(var t=1;t<=7;t++){PSTW[t]=new Int16Array(128);PSTB[t]=new Int16Array(128);
  for(var s=0;s<128;s++){if(s&0x88)continue;var r=s>>4,f=s&7;PSTW[t][s]=PST_W[t][(7-r)*8+f];PSTB[t][s]=PST_W[t][r*8+f]}}})();
var PH=[0,0,1,1,2,4,0];
function cdist(s){var r=s>>4,f=s&7;return Math.max(3-r,r-4)+Math.max(3-f,f-4)}
function evaluate(p){
  var b=p.b,mg=[0,0],kmid=[0,0],kend=[0,0],phase=0,mat=[0,0],nonp=[0,0],bish=[0,0],pawns=[0,0];
  for(var s=0;s<128;s++){if(s&0x88){s+=7;continue}var pc=b[s];if(!pc)continue;var c=pc>>3,t=pc&7,T=c?PSTB:PSTW;
    if(t===K){kmid[c]=T[6][s];kend[c]=T[7][s];continue}
    mg[c]+=VAL[t]+T[t][s];mat[c]+=VAL[t];phase+=PH[t];if(t!==P)nonp[c]+=VAL[t];else pawns[c]++;if(t===B)bish[c]++}
  if(phase>24)phase=24;

  for(c=0;c<2;c++){sc[c]=mg[c]+((kmid[c]*phase+kend[c]*(24-phase))/24|0);if(bish[c]>=2)sc[c]+=30}
  /* lopetusapu: yksinäinen kuningas reunaan ja kuninkaat lähelle */
  for(c=0;c<2;c++){var o=c^1;if(nonp[o]===0&&pawns[o]===0&&mat[c]>=500){var ek=p.k[o],ok=p.k[c];

/* ---------- haku ---------- */
function now(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now()}
function mkey(m){return m.f|(m.t<<7)|((m.pr&7)<<14)}
function Ctx(o){this.nodes=0;this.stop=false;this.t0=now();this.ms=o.ms||1e9;this.tt=new Map();this.kill=[];this.hist=new Int32Array(16*128);this.qs=o.qs!==false;this.maxNodes=o.maxNodes||0}
function order(S,ms,ttm,ply){
  var k1=S.kill[ply*2],k2=S.kill[ply*2+1];
  for(var i=0;i<ms.length;i++){var m=ms[i],k=mkey(m),v;
    if(k===ttm)v=1e7;else if(m.c)v=1e6+VAL[m.c&7]*10-VAL[m.pc&7]/10;else if(m.pr)v=9e5+VAL[m.pr&7];
    else if(k===k1)v=8e5;else if(k===k2)v=7e5;else v=S.hist[m.pc*128+m.t];

function qs(p,S,alpha,beta,ply){
  S.nodes++;

  if(stand>=beta)return stand;if(stand>alpha)alpha=stand;
  var ms=gen(p,true),us=p.turn;order(S,ms,-1,63);
  for(var i=0;i<ms.length;i++){var m=ms[i];
    if(m.c&&stand+VAL[m.c&7]+200<alpha&&!m.pr)continue;
    make(p,m);if(attacked(p.b,p.k[us],us^1)){unmake(p);continue}

    if(s>=beta)return s;if(s>alpha)alpha=s}

function negamax(p,S,depth,alpha,beta,ply){

    if(alpha>=beta){if(!m.c&&!m.pr){var kk=mkey(m);if(S.kill[ply*2]!==kk){S.kill[ply*2+1]=S.kill[ply*2];S.kill[ply*2]=kk}S.hist[m.pc*128+m.t]+=depth*depth}break}}

  return best}

/* juurihaku: kaikkien siirtojen tarkat arvot (heikommille tasoille ja avausvaihteluun) */
function rootScores(p,depth,o){

  return out}

/* iteratiivinen syveneminen */
function search(p,o){

    best=cb;bs=cs;done=d;
    S.tt.set(p.h1,{h2:p.h2,d:d,s:bs,f:0,m:mkey(best)});
    if(Math.abs(bs)>MATE-500)break;

/* tasot: d = syvyys, k = kohina senttisotilaina, v = virhesiirron todennäköisyys, ms = aikaraja */
var LEVELS=[null,
  {nimi:'Aloittelija',k:320,v:.22,d:1},
  {nimi:'Harrastaja',k:140,v:.07,d:2},
  {nimi:'Kerhopelaaja',k:45,v:0,d:3},
  {nimi:'Vahva',d:5,ms:1200},
  {nimi:'Mestari',d:30,ms:3000}];
function botMove(p,lvl,rand){
  rand=rand||Math.random;var L=LEVELS[lvl]||LEVELS[3],ms=legal(p);if(!ms.length)return null;

  var ply=p.ha.length;

    var d=L.k?L.d:3,k=L.k||12,list=rootScores(p,d),bm=null,bv=-INF;
    for(i=0;i<list.length;i++){var v=list[i].s+(Math.abs(list[i].s)>MATE-500?0:(rand()*2-1)*k);if(v>bv){bv=v;bm=list[i]}}
    return {m:bm.m,s:bm.s,d:d}}

/* ---------- mattiratkaisija (tehtävät) ---------- */
function mates(p,n){ /* vuorossa oleva tekee matin enintään n siirrolla */
  var ms=legal(p);ms.sort(function(a,b){return (b.c?1:0)-(a.c?1:0)});

var G={p:null,san:[],over:'',think:false,req:0,hint:null,overShown:false};
function rebuildGame(){
  var g=D.peli;G.p=SH.fromFen(g.fen0);G.san=[];
  g.uci.forEach(function(u){var m=SH.fromUci(G.p,u);G.san.push(SH.san(G.p,m));SH.make(G.p,m)});
  G.over=SH.status(G.p);G.hint=null}
function botTurn(){var g=D.peli;return g.vastus==='botti'&&!G.over&&(G.p.turn===1)!==(g.oma==='b')}

/* botti workerissa, ettei lauta jähmety miettiessä; varalla pääsäikeessä */
var worker=null,wfail=false,wcb={};
function getWorker(){
  if(worker||wfail)return worker;
  try{var src=$('engine').textContent+'\nonmessage=function(e){var d=e.data,p=SH.fromFen(d.fen0);for(var i=0;i<d.uci.length;i++)SH.make(p,SH.fromUci(p,d.uci[i]));'+
      'var r=d.vihje?SH.search(p,{depth:30,ms:1500}):SH.botMove(p,d.taso);postMessage({id:d.id,uci:r&&r.m?SH.uci(r.m):null,s:r?r.s:0,d:r?r.d:0})};';
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=function(e){var f=wcb[e.data.id];delete wcb[e.data.id];if(f)f(e.data)};
    worker.onerror=function(){wfail=true;worker=null}}catch(e){wfail=true;worker=null}
  return worker}
var reqN=0;
function think(msg,cb){
  var id=++reqN,w=getWorker();
  if(w){wcb[id]=cb;msg.id=id;w.postMessage(msg)}
  else setTimeout(function(){var p=SH.fromFen(msg.fen0);msg.uci.forEach(function(u){SH.make(p,SH.fromUci(p,u))});
    var r=msg.vihje?SH.search(p,{depth:30,ms:1200}):SH.botMove(p,msg.taso);cb({uci:r&&r.m?SH.uci(r.m):null})},30);
  return id}
function askBot(){
  if(!botTurn())return;
  var g=D.peli,my=++G.req,t0=Date.now();G.think=true;renderSide();
  think({fen0:g.fen0,uci:g.uci.slice(),taso:g.taso},function(r){
    var wait=Math.max(0,450-(Date.now()-t0));
    setTimeout(function(){G.think=false;
      if(my!==G.req)return;var m=r.uci&&SH.fromUci(G.p,r.uci);if(m)gameMove(m);else renderSide()},wait)})}
function gameMove(m){
  var g=D.peli;G.san.push(SH.san(G.p,m));SH.make(G.p,m);g.uci.push(SH.uci(m));
  G.over=SH.status(G.p);G.hint=null;G.overShown=false;sel=-1;save();
  if(D.tab==='pelaa')render(m);
  if(botTurn())askBot()}
function undo(){
  var g=D.peli;if(!g.uci.length)return;
  G.req++;G.think=false;
  if(g.vastus==='botti'){var mine=g.oma==='b'?1:0;
    do{g.uci.pop()}while(g.uci.length&&(SH.fromFen(g.fen0).turn+g.uci.length)%2!==mine);
    if((SH.fromFen(g.fen0).turn+g.uci.length)%2!==mine)g.uci=[]}
  else g.uci.pop();
  rebuildGame();sel=-1;save();render();if(botTurn())askBot()}
