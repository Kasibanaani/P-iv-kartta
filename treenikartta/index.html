function repair(d){
  var b=blank(); if(!d||typeof d!=='object')return b;
  b.liikkeet=Array.isArray(d.liikkeet)?d.liikkeet.filter(function(l){return l&&l.id&&l.nimi}):[];
  b.treenit=Array.isArray(d.treenit)?d.treenit.filter(function(t){return t&&t.id&&t.alku}).map(function(t){t.sarjat=Array.isArray(t.sarjat)?t.sarjat:[];return t}):[];
  b.auki=d.auki||null;
  var a=d.as&&typeof d.as==='object'?d.as:{}; for(var k in b.as)if(a[k]!=null)b.as[k]=a[k];
  if(d.teema&&!d.as)b.as.tila={auto:'auto',light:'light',dark:'dark'}[d.teema]||'auto'; /* versio 1 */
  if(typeof b.as.tavoitteet!=='object'||!b.as.tavoitteet)b.as.tavoitteet={};
  Object.keys(b.as.tavoitteet).forEach(function(g){var v=b.as.tavoitteet[g]; if(typeof v==='number')b.as.tavoitteet[g]={n:v,pv:b.as.jakso}; else if(!v||typeof v!=='object'||v.n==null)delete b.as.tavoitteet[g]}); /* versio 2 */
  b.liikkeet.forEach(function(l){if(!Array.isArray(l.goals))l.goals=[]});
  if((d.ver||1)<4&&b.as.tauko===3)b.as.tauko=2; /* Emil 31.10.: oletus 2 h */
  /* versio 5: lihasryhmät omana luettelona; isot ja pienet kirjaimet samanarvoisia */
  var rl=[]; function lisaa(n){n=String(n||'').trim(); if(n&&!rl.some(function(x){return x.toLowerCase()===n.toLowerCase()}))rl.push(n)}
  (Array.isArray(d.ryhmat)?d.ryhmat:[]).forEach(lisaa);
  b.liikkeet.forEach(function(l){String(l.paa||'').split(',').concat(String(l.sivu||'').split(',')).forEach(lisaa)});
  Object.keys(b.as.tavoitteet).forEach(lisaa);
  b.ryhmat=rl;
  function kan(n){n=n.trim().toLowerCase();return rl.filter(function(x){return x.toLowerCase()===n})[0]}
  b.liikkeet.forEach(function(l){
    var pa=String(l.paa||'').split(',').map(function(x){return x.trim()}).filter(Boolean).map(kan);
    l.paa=pa.filter(function(x,i){return pa.indexOf(x)===i}).join(', ');
    var sv=String(l.sivu||'').split(',').map(function(x){return x.trim()}).filter(Boolean).map(kan);
    l.sivu=sv.filter(function(x,i){return sv.indexOf(x)===i&&pa.indexOf(x)<0}).join(', ');
  });
  var tv={}; Object.keys(b.as.tavoitteet).forEach(function(k){var c=kan(k);if(c&&!tv[c])tv[c]=b.as.tavoitteet[k]}); b.as.tavoitteet=tv;
  return b;
}

/* painoehdotus: ideaali ensin, muuten min–max (tuplaprogressio) */
function ehdotus(l){
  var p=edellinen(l.id); if(!p)return null;
  var a=askel(l), lo=num(l.tmin), hi=num(l.tmax), id=num(l.tideal);
  var top=Math.max.apply(null,p.sarjat.map(function(s){return s.kg}));
  var ts=p.sarjat.filter(function(s){return s.kg===top});
  if(!isNaN(id)){
    var best=p.sarjat.reduce(function(b,s){return e1(s)>e1(b)?s:b});
    var k=Math.round(e1(best)/(1+id/30)/a)*a;
    k=Math.min(top+2*a,Math.max(top-a,k)); if(k<0)k=0;
    var mit='viimeksi '+kg(best.kg)+' × '+best.toistot+', ideaali '+id;
    if(k>top)return {kg:k,syy:'+'+kg(k-top)+' kg: '+mit};
    if(k<top)return {kg:k,syy:'−'+kg(top-k)+' kg: '+mit};
    return {kg:k,syy:'Sama paino: '+mit};
  }
  if(!isNaN(hi)&&ts.every(function(s){return s.toistot>=hi}))return {kg:top+a,syy:'+'+kg(a)+' kg: viimeksi kaikki '+kg(top)+' kg:n sarjat '+hi+'+ toistoa'};
  if(!isNaN(lo)&&ts[0].toistot<lo)return {kg:top,syy:'Pidä paino: viimeksi '+ts[0].toistot+' toistoa, alle tavoitteen '+lo};
  if(!isNaN(hi))return {kg:top,syy:'Sama paino, tavoitteena lisää toistoja ('+hi+' asti)'};
  return {kg:top,syy:'Sama kuin viimeksi'};
}

var BF=[['tmin','toistot min'],['tideal','ideaali'],['tmax','toistot max'],['skerta','sarjaa / kerta'],['sjakso','sarjaa / jakso'],['sjaksoPv','jakso (pv)'],['askel','painoaskel']];
function keraa(g){
  var items=[], vals={};
  BF.forEach(function(f){var v=String(fvv('b-'+f[0])).trim(); if(!v)return; var n=num(v); if(isNaN(n)||n<0)throw new Error('Tarkista kenttä '+f[1]+'.'); if(f[0]==='sjaksoPv'){n=Math.round(n);if(n<1||n>60)throw new Error('Jakso 1–60 päivää.')} vals[f[0]]=n});
  var ls=g==='*'?S.liikkeet.filter(function(l){return !l.arkisto}):ryhmanLiikkeet(g);
  ls.forEach(function(l){Object.keys(vals).forEach(function(f){
    var lab=BF.filter(function(x){return x[0]===f})[0][1], o=num(l[f]);
    if(isNaN(o))items.push({key:'l|'+l.id+'|'+f,t:'l',id:l.id,f:f,uusi:vals[f],konf:false,lab:l.nimi+': '+lab+' '+kg(vals[f])});
    else if(o!==vals[f])items.push({key:'l|'+l.id+'|'+f,t:'l',id:l.id,f:f,uusi:vals[f],konf:true,lab:l.nimi+': '+lab+' '+kg(o)+' → '+kg(vals[f])});
  })});
  var ryhmaPv=null, gs=[];
  if(g==='*'){
    var kn=String(fvv('k-n')).trim(), kp=String(fvv('k-pv')).trim();
    if(kn&&(isNaN(num(kn))||num(kn)<0))throw new Error('Tarkista ryhmien sarjamäärä.');
    if(kp&&!(Math.round(num(kp))>=1&&Math.round(num(kp))<=60))throw new Error('Jakso 1–60 päivää.');
    if(kn||kp){ryhmaPv=kp?Math.round(num(kp)):null; gs=kaikkiRyhmat();
      gs.forEach(function(r){var o=S.as.tavoitteet[r], n=kn?num(kn):o?o.n:null; if(n==null)return; var u={n:n,pv:ryhmaPv||(o?o.pv:S.as.jakso)};
        if(!o)items.push({key:'g|'+r,t:'g',id:r,uusi:u,konf:false,lab:r+': '+tavTeksti(u)});
        else if(o.n!==u.n||o.pv!==u.pv)items.push({key:'g|'+r,t:'g',id:r,uusi:u,konf:true,lab:r+': '+tavTeksti(o)+' → '+tavTeksti(u)});
      });}
  } else {
    var n=String(fvv('gf-n')).trim(), pvv=Math.round(num(fvv('gf-pv')))||S.as.jakso, o=S.as.tavoitteet[g];
    if(pvv<1||pvv>60)throw new Error('Jakso 1–60 päivää.');
    if(!n){if(o)items.push({key:'g|'+g,t:'g',id:g,uusi:null,konf:false,lab:'Ryhmän '+g+' tavoite poistetaan'})}
    else{var nn=num(n); if(isNaN(nn)||nn<0)throw new Error('Tarkista ryhmän sarjamäärä.'); var u={n:nn,pv:pvv};
      if(!o||o.n!==u.n||o.pv!==u.pv)items.push({key:'g|'+g,t:'g',id:g,uusi:u,konf:false,lab:g+': '+tavTeksti(u)}); ryhmaPv=pvv}
  }
  /* liikkeiden omat jaksotavoitteet eri jaksolla: muunnetaan samaan jaksoon */
  if(ryhmaPv&&vals.sjakso==null&&vals.sjaksoPv==null){
    var kohde=g==='*'?S.liikkeet.filter(function(l){return !l.arkisto}):ryhmanLiikkeet(g);
    kohde.forEach(function(l){var sj=num(l.sjakso), op=liikeJaksoPv(l); if(isNaN(sj)||op===ryhmaPv)return;
      var u={sjakso:Math.round(sj*ryhmaPv/op),sjaksoPv:ryhmaPv};
      items.push({key:'m|'+l.id,t:'m',id:l.id,uusi:u,konf:true,lab:l.nimi+': oma tavoite '+kg(sj)+' / '+pvNimi(op)+' → '+u.sjakso+' / '+pvNimi(ryhmaPv)});
    });
  }
  return items;
}

  var vanhat={}; if(prev)prev.items.forEach(function(x){vanhat[x.key]=x.on});

  prev=null;fv={};gEdit=null;save();toast(n?'Tallennettu: '+n+' muutosta'+(jat?', '+jat+' ennallaan':''):'Ei muutoksia');
}

  var h='<h1>Seuranta · '+{liike:'Liike',ryhmat:'Lihasryhmät',yhteydet:'Yhteydet'}[seurTila]+'</h1>';
  var has=S.treenit.some(function(t){return t.sarjat.length});
  if(!has)return h+'<div class="card empty"><b>Ei vielä dataa</b><span class="muted">Kun kirjaat sarjoja, tänne tulee liikkeittäin kehitys, lihasryhmien sarjat jaksoittain ja niiden yhteydet kehitykseen.</span></div>';
  return h+(seurTila==='liike'?sLiike():seurTila==='ryhmat'?sRyhmat():sYhteydet());
}
function liikeKerrat(id){
  var rows=[];
  S.treenit.forEach(function(t){var ss=t.sarjat.filter(function(s){return s.liike===id});if(ss.length)rows.push({t:t.alku,tr:t,ss:ss,best:Math.max.apply(null,ss.map(e1))})});
  return rows;
}
function sLiike(){
  var ids=S.liikkeet.filter(function(l){return S.treenit.some(function(t){return t.sarjat.some(function(s){return s.liike===l.id})})}).map(function(l){return l.id});
  if(ids.indexOf(seur)<0)seur=ids[0];
  var l=liike(seur), h='<div class="chips">'+ids.map(function(id){return '<button class="'+(id===seur?'on':'')+'" data-act="seur" data-id="'+id+'">'+esc(liike(id).nimi)+'</button>'}).join('')+'</div>';
  var rows=liikeKerrat(seur), last=rows[rows.length-1], ago=rows.filter(function(r){return r.t<=last.t-28*DAY}).pop();
  h+='<div class="card form"><div class="muted">Arvioitu maksimi (1 toisto, Epley), paras sarja</div><div class="big num">'+d1(last.best)+' kg</div>'+
    (ago?'<div class="muted num">'+(last.best>=ago.best?'+':'')+d1(last.best-ago.best)+' kg 4 viikossa</div>':'<div class="muted">Muutos näkyy, kun dataa on yli 4 viikolta.</div>')+chart(rows,l)+'</div>';
  h+='<h2>Tavoitteet</h2>';
  if(l.goals&&l.goals.length)h+='<div class="list">'+l.goals.map(function(g){return '<div class="card form">'+goalHtml(l,g,false)+'</div>'}).join('')+'</div>';
  else h+='<div class="muted">Lisää tavoite liikkeen asetuksista (Liikkeet → Muokkaa), esim. 6 × 120 kg 1.1.2027 mennessä.</div>';
  var all=[];rows.forEach(function(r){all=all.concat(r.ss)});
  var id=num(l.tideal), lo=num(l.tmin), hi=num(l.tmax);
  h+='<h2>Sarjapituus</h2><div class="card grp"><div class="kv"><span>Keskiarvo<b>'+d1(avg(all.map(function(s){return s.toistot})))+'</b></span>'+
    (isNaN(id)?'<span>Ideaali<b>–</b></span><span>Ideaalissa ±1<b>–</b></span>':'<span>Ideaali<b>'+id+'</b></span><span>Ideaalissa ±1<b>'+Math.round(100*all.filter(function(s){return Math.abs(s.toistot-id)<=1}).length/all.length)+' %</b></span>')+'</div>'+
    ((!isNaN(lo)||!isNaN(hi))?'<div class="muted">Rajojen ulkopuolella: '+all.filter(function(s){return (!isNaN(lo)&&s.toistot<lo)||(!isNaN(hi)&&s.toistot>hi)}).length+' / '+all.length+' sarjaa</div>':'')+
    (isNaN(id)?'<div class="muted">Aseta liikkeelle ideaali toistomäärä, niin näet osuman ja painoehdotus tähtää siihen.</div>':'')+'</div>';
  var P=liikeJaksoPv(l), sj=num(l.sjakso), w=[0,0,0,0,0,0], kerr=[0,0,0,0,0,0];
  rows.forEach(function(r){var j=jaksoN(r.t,P); if(j<6){w[j]+=r.ss.length;kerr[j]++}});
  h+='<h2>Sarjat / '+pvNimi(P)+(isNaN(sj)?'':' · tavoite '+sj)+'</h2><div class="card tw"><table><thead><tr><th>Jakso</th><th class="r">Kertaa</th><th class="r">Sarjaa / kerta</th><th class="r">Yhteensä</th></tr></thead><tbody>';
  for(var j=0;j<6;j++)h+='<tr><td>'+jaksoLabel(j,P)+'</td><td class="r">'+kerr[j]+'</td><td class="r">'+(kerr[j]?d1(w[j]/kerr[j]):'–')+'</td><td class="r">'+w[j]+(isNaN(sj)?'':(w[j]>=sj?' ✓':''))+'</td></tr>';
  h+='</tbody></table></div>';
  h+='<h2>Kerrat</h2><div class="card tw"><table><thead><tr><th>Päivä</th><th>Sarjat</th><th class="r">Arvio</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){h+='<tr><td>'+pv(r.t)+'<br><span class="muted">'+(jarjestys(r.tr).indexOf(seur)+1)+'. liike</span></td><td>'+r.ss.map(function(s){return kg(s.kg)+'×'+s.toistot}).join(', ')+'</td><td class="r">'+d1(r.best)+'</td></tr>'});
  return h+'</tbody></table></div>';
}
function jaksoLabel(j,P){
  P=P||S.as.jakso; var loppu=paiva(Date.now())-j*P, alku=loppu-P+1;
  return j===0?'Nyt':pv(alku*DAY+43200e3)+'–'+pv(loppu*DAY+43200e3);
}
/* tavoitteet ja ennuste: lineaarinen trendi viimeisen 8 viikon parhaista arvioista */
function goalAika(g){var p=String(g.pvm).split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime()}
function trendi(rows){
  if(!rows.length)return null; var last=rows[rows.length-1], r=rows.filter(function(x){return x.t>=last.t-56*DAY});
  if(r.length<3||(r[r.length-1].t-r[0].t)/DAY<10)return null;
  var x0=r[0].t, xs=r.map(function(x){return (x.t-x0)/DAY}), ys=r.map(function(x){return x.best}), mx=avg(xs), my=avg(ys), sxy=0, sxx=0;
  for(var i=0;i<xs.length;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx)}
  var b=sxy/sxx; return {b:b,a:my-b*mx,x0:x0,n:r.length};
}
function arvoAt(tr,t){return tr.a+tr.b*(t-tr.x0)/DAY}
function ennuste(l,g){
  var rows=liikeKerrat(l.id), o={tgt:g.kg*(1+g.rep/30), gt:goalAika(g)+DAY-1, done:null};
  rows.forEach(function(r){r.ss.forEach(function(s){if(!o.done&&s.kg>=g.kg&&s.toistot>=g.rep)o.done=r.t})});
  if(o.done){o.tila='saavutettu';return o}
  if(o.gt<Date.now()){o.tila='umpeutui';return o}
  if(!rows.length){o.tila='eidataa';return o}
  var tr=trendi(rows); o.tr=tr; o.nyt=tr?arvoAt(tr,Date.now()):rows[rows.length-1].best;
  o.tarve=(o.tgt-o.nyt)/Math.max(1,(o.gt-Date.now())/DAY)*7;
  if(!tr){o.tila='vahan';return o}
  o.tahti=tr.b*7; o.ennAt=arvoAt(tr,o.gt); o.kgAt=o.ennAt/(1+g.rep/30);
  if(tr.b>0)o.pvm=Date.now()+(o.tgt-o.nyt)/tr.b*DAY;
  o.tila=o.ennAt>=o.tgt?'aikataulussa':'jaljessa'; return o;
}
function goalHtml(l,g,lyhyt){
  var e=ennuste(l,g), pill={saavutettu:['done','Saavutettu '+(e.done?pv(e.done):'')],aikataulussa:['','Aikataulussa'],jaljessa:['warn','Jäljessä'],umpeutui:['warn','Aika umpeutui'],vahan:['','Ennuste tulossa'],eidataa:['','Ei dataa']}[e.tila];
  var h='<div class="goal"><span class="num">Tavoite <b>'+kg(g.kg)+' kg × '+g.rep+'</b> viim. '+pvY(e.gt)+'</span><span class="pill '+pill[0]+'">'+pill[1]+'</span></div>';
  if(lyhyt||e.tila==='saavutettu')return h;
  h+='<div class="muted num">Vastaa maksimiarviota '+d1(e.tgt)+' kg.'+(e.nyt!=null?' Nyt arviolta '+d1(e.nyt)+' kg.':'')+'</div>';
  if(e.tila==='vahan')h+='<div class="muted">Ennuste tarvitsee vähintään 3 kertaa vähintään 10 päivän ajalta.</div>';
  if(e.tr){
    h+='<div class="muted num">Tahti '+(e.tahti>=0?'+':'')+d1(e.tahti)+' kg/vk, tarvitaan '+(e.tarve>=0?'+':'')+d1(e.tarve)+' kg/vk.</div>';
    var k=Math.floor(e.kgAt/askel(l))*askel(l);
    h+='<div class="num">Ennuste '+pvY(e.gt)+': <b>'+kg(k)+' kg × '+g.rep+'</b></div>';
    if(e.tila==='jaljessa')h+='<div class="muted">'+(e.pvm&&e.pvm-Date.now()<3*365*DAY?'Nykytahdilla tavoite täyttyy arviolta '+pvY(e.pvm)+'.':'Nykytahdilla tavoite ei täyty.')+'</div>';
  }
  return h;
}
function chart(rows,l){
  if(rows.length<2)return '<div class="muted">Käyrä piirtyy toisesta kerrasta alkaen.</div>';
  var g=null,e=null; (l&&l.goals||[]).forEach(function(x){var en=ennuste(l,x); if(!g&&en.tila!=='saavutettu'&&en.tila!=='umpeutui'){g=x;e=en}});
  var W=340,H=160,L=34,R=12,T=12,B=22,v=rows.map(function(r){return r.best});
  if(e)v.push(e.tgt); if(e&&e.ennAt)v.push(e.ennAt);
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);
  if(mx-mn<1){mx+=1;mn-=1} var pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  var t0=rows[0].t,t1=Math.max(rows[rows.length-1].t,e?e.gt:0);
  function x(t){return L+(W-L-R)*(t1===t0?.5:(t-t0)/(t1-t0))} function y(z){return T+(H-T-B)*(1-(z-mn)/(mx-mn))}
  var d=rows.map(function(r,i){return (i?'L':'M')+x(r.t).toFixed(1)+' '+y(r.best).toFixed(1)}).join(' '), lt=rows[rows.length-1].t;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Arvioidun maksimin kehitys">';
  [mn+pad,mx-pad].forEach(function(z){s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(z)+'" y2="'+y(z)+'"/><text x="'+(L-4)+'" y="'+(y(z)+4)+'" text-anchor="end">'+Math.round(z)+'</text>'});
  s+='<path class="ar" d="'+d+' L'+x(lt)+' '+(H-B)+' L'+x(t0)+' '+(H-B)+' Z" opacity=".6"/><path class="ln" d="'+d+'"/>';
  if(e&&e.tr){var tn=Math.max(Date.now(),lt);s+='<path class="fc" d="M'+x(tn)+' '+y(arvoAt(e.tr,tn))+' L'+x(e.gt)+' '+y(e.ennAt)+'"/>'}
  var lr=rows[rows.length-1]; s+='<circle class="pt" cx="'+x(lr.t)+'" cy="'+y(lr.best)+'" r="4"/>';
  if(e)s+='<circle class="gl" cx="'+x(e.gt)+'" cy="'+y(e.tgt)+'" r="5"/><text x="'+(x(e.gt)-8)+'" y="'+(y(e.tgt)-9)+'" text-anchor="end">tavoite '+kg(g.kg)+'×'+g.rep+'</text>';
  return s+'<text x="'+L+'" y="'+(H-6)+'">'+pv(t0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+pv(t1)+'</text></svg>';
}

/* lihasryhmät: sarjat jaksossa, sarjaa/kerta, kertoja, lepopäivät */
function ryhmaData(g){
  var kerrat=[]; /* {t, sarjat} per treeni jossa ryhmää treenattiin */
  S.treenit.forEach(function(t){var n=0;t.sarjat.forEach(function(s){var l=liike(s.liike);if(l){var w=ryhmat(l)[g];if(w)n+=w}});if(n>0)kerrat.push({t:t.alku,n:n})});
  return kerrat;
}
function sRyhmat(){
  var gs=kaikkiRyhmat();
  if(!gs.length)return '<div class="card empty"><b>Ei lihasryhmiä</b><span class="muted">Lisää liikkeille pää- ja sivukohteet ja ryhmille tavoitteet Liikkeet-välilehdellä.</span></div>';
  var h='<div class="muted">Pääkohde 1 sarja, sivukohde '+kg(S.as.sivu)+'. Jakso = viimeiset N päivää, ryhmän oman tavoitteen mukaan.</div><div class="list">';
  gs.forEach(function(g){
    var k=ryhmaData(g), tv=S.as.tavoitteet[g], P=tv?tv.pv:S.as.jakso, nyt=k.filter(function(x){return jaksoN(x.t,P)===0});
    var sum=nyt.reduce(function(a,x){return a+x.n},0);
    var valit=[];for(var i=1;i<k.length;i++)valit.push(paiva(k[i].t)-paiva(k[i-1].t));
    var viimeksi=k.length?paiva(Date.now())-paiva(k[k.length-1].t):null;
    var hist=[];for(var j=1;j<=6;j++){var q=k.filter(function(x){return jaksoN(x.t,P)===j});hist.push(q.reduce(function(a,x){return a+x.n},0))}
    var histKerta=k.filter(function(x){var j=jaksoN(x.t,P);return j>=1&&j<=6});
    h+='<div class="card grp"><div class="top"><h3>'+esc(g)+'</h3><span class="num">'+kg(sum)+(tv?' / '+kg(tv.n):'')+' sarjaa · '+pvNimi(P)+'</span></div>'+
      (tv?'<div class="bar"><i style="width:'+Math.min(100,100*sum/tv.n)+'%"></i></div>':'')+
      '<div class="kv"><span>Kertoja nyt<b>'+nyt.length+'</b></span><span>Sarjaa / kerta<b>'+(nyt.length?d1(sum/nyt.length):'–')+'</b></span><span>Viimeksi<b>'+(viimeksi==null?'–':viimeksi===0?'tänään':viimeksi+' pv')+'</b></span></div>'+
      '<div class="kv"><span>Väli ka.<b>'+(valit.length?d1(avg(valit))+' pv':'–')+'</b></span><span>Ed. 6 jaksoa ka.<b>'+d1(avg(hist))+'</b></span><span>Ennen / kerta<b>'+(histKerta.length?d1(avg(histKerta.map(function(x){return x.n}))):'–')+'</b></span></div>'+
      (tv?'<div class="muted">'+(sum>=tv.n?'Jakson tavoite täynnä.':'Puuttuu '+kg(tv.n-sum)+' sarjaa. Tällä tahdilla ('+(nyt.length?d1(sum/nyt.length):'?')+' / kerta) tarvitaan vielä '+(nyt.length&&sum>0?Math.ceil((tv.n-sum)/(sum/nyt.length)):'?')+' kertaa.')+'</div>':'')+
      '</div>';
  });
  return h+'</div>';
}

/* yhteydet: Pearsonin korrelaatio kerta- ja jaksotasolla */
function pearson(x,y){
  var n=x.length; if(n<3)return null; var mx=avg(x),my=avg(y),sxy=0,sx=0,sy=0;
  for(var i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)*(x[i]-mx);sy+=(y[i]-my)*(y[i]-my)}
  if(!sx||!sy)return {r:null,n:n}; return {r:sxy/Math.sqrt(sx*sy),n:n};
}
function kertaPisteet(id){
  var l=liike(id), pr=paaRyhmat(l), rows=liikeKerrat(id), out=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i], t=r.tr, j=jarjestys(t), first=r.ss[0].t;
    var ennen=0; t.sarjat.forEach(function(s){if(s.t<first){var ll=liike(s.liike);if(ll)pr.forEach(function(g){ennen+=ryhmat(ll)[g]||0})}});
    var lepo=null; for(var k=S.treenit.indexOf(t)-1;k>=0;k--){var tt=S.treenit[k]; if(tt.sarjat.some(function(s){var ll=liike(s.liike);return ll&&pr.some(function(g){return ryhmat(ll)[g]})})){lepo=paiva(t.alku)-paiva(tt.alku);break}}
    out.push({y:100*(r.best/rows[i-1].best-1),sij:j.indexOf(id)+1,ennen:ennen,lepo:lepo,sarjat:r.ss.length,
      poik:isNaN(num(l.tideal))?null:avg(r.ss.map(function(s){return Math.abs(s.toistot-num(l.tideal))}))});
  }
  return out;
}
function jaksoPisteet(id){
  var l=liike(id), pr=paaRyhmat(l), rows=liikeKerrat(id), by={}, out=[];
  rows.forEach(function(r){var j=jakso(r.t);(by[j]=by[j]||[]).push(r)});
  Object.keys(by).forEach(function(js){
    var j=+js, nx=by[j-1]; if(!nx)return; var c=by[j];
    var best=Math.max.apply(null,c.map(function(r){return r.best})), nb=Math.max.apply(null,nx.map(function(r){return r.best}));
    var sar=c.reduce(function(a,r){return a+r.ss.length},0), rs=0;
    S.treenit.forEach(function(t){if(jakso(t.alku)!==j)return;t.sarjat.forEach(function(s){var ll=liike(s.liike);if(ll)pr.forEach(function(g){rs+=ryhmat(ll)[g]||0})})});
    var all=[];c.forEach(function(r){all=all.concat(r.ss)});
    out.push({y:100*(nb/best-1),sarjat:sar,ryhma:rs,kerrat:c.length,skerta:sar/c.length,
      sij:avg(c.map(function(r){return jarjestys(r.tr).indexOf(id)+1})),
      poik:isNaN(num(l.tideal))?null:avg(all.map(function(s){return Math.abs(s.toistot-num(l.tideal))}))});
  });
  return out;
}
var KERTA_X=[['lepo','Lepopäivät edellisestä saman lihasryhmän treenistä'],['sij','Liikkeen sijainti treenissä (1 = ensimmäinen)'],['ennen','Saman lihasryhmän sarjat ennen liikettä samassa treenissä'],['sarjat','Liikkeen sarjamäärä kerralla'],['poik','Toistojen etäisyys ideaalista']];
var JAKSO_X=[['sarjat','Liikkeen sarjat jaksossa'],['ryhma','Lihasryhmän sarjat jaksossa'],['kerrat','Treenikerrat jaksossa (frekvenssi)'],['skerta','Sarjaa / kerta'],['sij','Keskimääräinen sijainti treenissä'],['poik','Toistojen etäisyys ideaalista']];
function vahvuus(r){var a=Math.abs(r);return a<.1?'ei yhteyttä':a<.3?'heikko':a<.5?'kohtalainen':'vahva'}
function corrList(pts,xs,ylab){
  var h='';
  var res=xs.map(function(x){var p=pts.filter(function(o){return o[x[0]]!=null&&isFinite(o[x[0]])});return {lab:x[1],c:pearson(p.map(function(o){return o[x[0]]}),p.map(function(o){return o.y})),n:p.length}});
  res.sort(function(a,b){return Math.abs((b.c&&b.c.r)||0)-Math.abs((a.c&&a.c.r)||0)});
  res.forEach(function(o){
    var r=o.c&&o.c.r;
    h+='<div class="corr"><div class="top"><span>'+o.lab+'</span><b class="num">'+(r==null?'–':(r>0?'+':'')+r.toFixed(2).replace('.',','))+'</b></div>';
    if(r==null)h+='<div class="muted">'+(o.n<5?'Liian vähän dataa (n = '+o.n+', tarvitaan 5).':'Ei vaihtelua, joten yhteyttä ei voi laskea.')+'</div>';
    else if(o.n<5)h+='<div class="muted">Liian vähän dataa (n = '+o.n+', tarvitaan 5).</div>';
    else h+='<div class="rbar"><i style="'+(r>=0?'left:50%;width:'+(50*r)+'%':'right:50%;width:'+(-50*r)+'%')+'"></i></div><div class="muted">'+vahvuus(r)+(Math.abs(r)>=.1?(r>0?', enemmän → '+ylab+' parempi':', enemmän → '+ylab+' heikompi'):'')+' · n = '+o.n+'</div>';
    h+='</div>';
  });
  return h;
}
function sYhteydet(){
  var ids=S.liikkeet.filter(function(l){return liikeKerrat(l.id).length>1}).map(function(l){return l.id});
  if(yht!=='kaikki'&&ids.indexOf(yht)<0)yht='kaikki';
  var h='<div class="chips"><button class="'+(yht==='kaikki'?'on':'')+'" data-act="yht" data-id="kaikki">Kaikki liikkeet</button>'+ids.map(function(id){return '<button class="'+(id===yht?'on':'')+'" data-act="yht" data-id="'+id+'">'+esc(liike(id).nimi)+'</button>'}).join('')+'</div>';
  var sel=yht==='kaikki'?ids:[yht], kp=[], jp=[];
  sel.forEach(function(id){kp=kp.concat(kertaPisteet(id));jp=jp.concat(jaksoPisteet(id))});
  h+='<h2>Kertatasolla</h2><div class="card form"><span class="muted">Mittari: paras arvioitu maksimi verrattuna saman liikkeen edelliseen kertaan (%). Kertoo päivän suorituksesta.</span>'+corrList(kp,KERTA_X,'tulos')+'</div>';
  h+='<h2>Jaksotasolla</h2><div class="card form"><span class="muted">Mittari: arvioidun maksimin muutos seuraavaan jaksoon (%). Kertoo kehityksestä. Jakso = '+S.as.jakso+' päivää.</span>'+corrList(jp,JAKSO_X,'kehitys')+'</div>';
  h+='<div class="muted">Korrelaatio kertoo yhteydestä, ei syystä. Yhden ihmisen datassa moni asia muuttuu yhtä aikaa, ja kehitys hidastuu ajan myötä itsestään. Lukuihin kannattaa luottaa vasta, kun n on kymmeniä.</div>';
  return h;
}

/* ---------- asetukset ---------- */
function vAsetukset(){
  var h='<h1>Asetukset</h1><div class="muted">Liikkeiden, lihasryhmien ja kaikkien liikkeiden asetukset ovat Liikkeet-välilehdellä.</div>';

function lueTeksti(txt){
  var out=[], vir=[], cur=null;
  String(txt).split(/\r?\n/).forEach(function(raw,i){
    var line=raw.trim(); if(!line||line[0]==='#')return;
    var m=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(?:klo\s+)?(\d{1,2})[:.](\d{2}))?$/.exec(line)||null, d=null;
    if(m)d=[+m[1],+m[2],+m[3],m[4],m[5]];
    else{m=/^(?:[a-zåäö]{2}\s+)?(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(?:klo\s+)?(\d{1,2})[:.](\d{2}))?$/i.exec(line); if(m)d=[+m[3],+m[2],+m[1],m[4],m[5]]}
    if(d){var dt=new Date(d[0],d[1]-1,d[2],d[3]!=null?+d[3]:12,d[4]!=null?+d[4]:0); if(isNaN(dt)||dt.getMonth()!==d[1]-1){vir.push('Rivi '+(i+1)+': virheellinen päivämäärä');return} cur={alku:dt.getTime(),aikaOk:d[3]!=null,rivit:[]};out.push(cur);return}
    var e=/^(.+?)\s*:\s*(.+)$/.exec(line);
    if(!e){vir.push('Rivi '+(i+1)+': '+line);return}
    if(!cur){vir.push('Rivi '+(i+1)+': aloita päivämäärällä');return}
    var s=e[2].toLowerCase().replace(/(\d),(\d{1,2})(?=\s*(?:kg)?\s*[x×*])/g,'$1.$2').replace(/kg/g,'').replace(/\bkp\b/g,'0').replace(/\s*[x×*]\s*/g,'x').replace(/\s*@\s*/g,'@'), sarjat=[];
    s.split(/[,;]+|\s+/).filter(Boolean).forEach(function(tok){
      var q=/^(\d+(?:[.,]\d+)?)x(\d+)(?:x(\d+))?(?:@(\d{1,2})[:.](\d{2}))?$/.exec(tok);
      if(!q){vir.push('Rivi '+(i+1)+': ei ymmärretty "'+tok+'"');return}
      for(var k=0;k<(q[3]?+q[3]:1);k++)sarjat.push({kg:num(q[1]),rep:+q[2],aika:q[4]!=null&&k===0?q[4]+':'+q[5]:null});
    });
    if(sarjat.length)cur.rivit.push({nimi:e[1].trim(),sarjat:sarjat});
  });
  return {treenit:out.filter(function(t){return t.rivit.length}),virheet:vir};
}

    var dup=S.treenit.some(function(t){if(paiva(t.alku)!==paiva(w.alku))return false;
      var o=jarjestys(t).map(function(id){var l=liike(id);return (l?l.nimi.toLowerCase():'?')+':'+t.sarjat.filter(function(s){return s.liike===id}).map(function(s){return s.kg+'x'+s.toistot}).join(',')}).join(';');

}
