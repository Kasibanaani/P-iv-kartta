<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pakettipeli">
<title>Pakettipeli</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#f1ece2;--land:#f1ece2;--park:#d9e6c8;--road:#ffffff;--roadEdge:#e2dbcd;
  --house:#d3ccbf;--depot:#2d3142;--depotTx:#ffffff;
  --car:#2d3142;--carTx:#ffffff;--pill:#ffffff;--pillTx:#2d3142;
  --surface:#fffdf8;--line:#e3dccf;--tx:#2b2a28;--tx2:#5f5a52;--accent:#2f6fdf;--accentTx:#ffffff;
  --good:#1e7d3c;--bad:#c0392b;--shadow:rgba(40,40,40,.08);--shade:rgba(30,30,30,.32);
}
:root[data-theme="dark"]{
  --bg:#1c1f24;--land:#1c1f24;--park:#23302a;--road:#3b4048;--roadEdge:#2a2e34;
  --house:#2f343b;--depot:#e9e6df;--depotTx:#1c1f24;
  --car:#f2efe8;--carTx:#1c1f24;--pill:#2a2e34;--pillTx:#f2efe8;
  --surface:#262a30;--line:#3a3f47;--tx:#eeebe5;--tx2:#b3ada4;--accent:#6aa2ff;--accentTx:#10151c;
  --good:#5fd38a;--bad:#ff7b6e;--shadow:rgba(0,0,0,.25);--shade:rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1f24;--land:#1c1f24;--park:#23302a;--road:#3b4048;--roadEdge:#2a2e34;
    --house:#2f343b;--depot:#e9e6df;--depotTx:#1c1f24;
    --car:#f2efe8;--carTx:#1c1f24;--pill:#2a2e34;--pillTx:#f2efe8;
    --surface:#262a30;--line:#3a3f47;--tx:#eeebe5;--tx2:#b3ada4;--accent:#6aa2ff;--accentTx:#10151c;
    --good:#5fd38a;--bad:#ff7b6e;--shadow:rgba(0,0,0,.25);--shade:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{padding:max(env(safe-area-inset-top),44px) 12px 6px;background:var(--surface);border-bottom:1px solid var(--line);
  box-shadow:0 3px 18px var(--shadow);position:relative;z-index:2}
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px}
.st{display:flex;flex-direction:column;min-width:0}
.st b{font-size:17px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.st span{font-size:10.5px;color:var(--tx2);font-weight:650;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.st.cash b{font-size:20px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.mrow{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--tx2);font-weight:650;white-space:nowrap}
.bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:4px;transition:width .4s}
#mapwrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--surface);color:var(--tx);
  border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:0 6px 22px var(--shadow);
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#speedtag{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:700;color:var(--tx2);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:3px 7px;display:none}
#bot{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px max(env(safe-area-inset-bottom),10px);position:relative;z-index:2}
#cInfo{font-size:13.5px;color:var(--tx2);margin:0 2px 8px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cInfo b{color:var(--tx)}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:11px;min-height:44px;
  padding:0 10px;font-size:15px;font-weight:650;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(.94)}
button:disabled{opacity:.42}
button.pri{background:var(--accent);color:var(--accentTx);border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1.25fr 1.25fr 1fr 48px;gap:6px}
.btns button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;padding:4px 4px;min-height:58px}
.btns small{font-size:11px;font-weight:600;color:inherit;opacity:.8;margin-top:2px}
#ovl{position:fixed;inset:0;background:var(--shade);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#ovl.on{display:flex}
#dlg{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;width:100%;max-width:400px;
  max-height:86vh;overflow-y:auto;box-shadow:0 20px 70px var(--shadow)}
#dlg h2{margin:0 0 10px;font-size:20px;letter-spacing:-.035em}
#dlg p,#dlg li{font-size:15px;line-height:1.42;color:var(--tx)}
#dlg ul{padding-left:20px;margin:8px 0}
#dlg .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#dlg .sec{font-size:11px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--tx2);margin:16px 0 6px}
#dlg textarea{width:100%;min-height:90px;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button.on{background:var(--accent);color:var(--accentTx);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;margin:6px 0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:360px){.st b{font-size:15px}.st.cash b{font-size:17px}.st span{font-size:9px;letter-spacing:0}
  .btns button{font-size:13px}.btns small{font-size:10px}#cInfo{font-size:12.5px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="stats">
      <div class="st cash"><b id="sCash">0</b><span>Kassa</span></div>
      <div class="st"><b id="sIn">0</b><span>Tuotto/min</span></div>
      <div class="st"><b id="sOut">0</b><span>Kulut/min</span></div>
      <div class="st"><b id="sNet">0</b><span>Tulos/min</span></div>
    </div>
    <div class="mrow"><span>Maine</span><b id="sMaine">0</b><div class="bar"><i id="mBar"></i></div><span id="sOffers"></span></div>
  </header>
  <div id="mapwrap"><canvas id="cv"></canvas><div id="toast"></div><div id="speedtag"></div></div>
  <footer id="bot">
    <div id="cInfo"></div>
    <div class="btns">
      <button id="bRoute" class="pri">Nollaa reitti<small>nykyinen kohde jää</small></button>
      <button id="bUp">Isompi auto<small id="bUpS"></small></button>
      <button id="bEnd">Lopeta peli<small>pikakelaa loput</small></button>
      <button id="bMenu" aria-label="Valikko">≡</button>
    </div>
  </footer>
</div>
<div id="ovl"><div id="dlg"></div></div>

<script id="engine">
// Pakettipelin moottori (versio 2: yksi auto). Kartta, reitit, tarjoukset, kuljetus, autotasot ja talous. Ei DOMia (testataan nodella).
var PP=(function(){
'use strict';
var VER=2;
var C={W:14,H:22,SPEED:2,DWELL:0.35,START_CASH:300,PAY_BASE:3,PAY_PER:0.45,
  OFFER_LIFE_MIN:60,OFFER_LIFE_MAX:90,RATE_BASE:10,RATE_PER:0.05,RATE_MAX:15,OFFERS_BASE:6,OFFERS_PER:10,OFFERS_MAX:14,MAX_PLACES:10,
  CO_BASE:5,CO_PER:8,COMPANIES:12,MAINE_MAX:100,MIN_TRIP:4,MAX_LETTERS:26,SIZE_BASE:2,SIZE_PER:12,SIZE_MAX:8,SIZE_W:0};
// Autotasot: isompi auto lainalla. raja = vaadittu kassa, kasi = käsiraha, kulu = juoksevat kulut/min (palkka, huolto, laina).
var TIERS=[
  {nimi:'Pakettiauto',cap:4,kulu:24},
  {nimi:'Iso pakettiauto',cap:6,kulu:32,raja:600,kasi:250},
  {nimi:'Jakeluauto',cap:8,kulu:42,raja:1200,kasi:450},
  {nimi:'Kuorma-auto',cap:10,kulu:52,raja:2200,kasi:750},
  {nimi:'Iso kuorma-auto',cap:12,kulu:64,raja:3500,kasi:1100}];
var LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
var COLORS=['#e4572e','#f2a516','#1f9bb0','#7a5cbf','#3f9e4d','#e0457b','#2f6fdf','#9c6b3d','#0f8a7e','#a3b11a','#b5179e','#5c6bc0'];

function rnd(o){o.rs=o.rs+0x6D2B79F5|0;var t=Math.imul(o.rs^o.rs>>>15,1|o.rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function shuffle(a,o){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd(o)*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickW(items,w,o){var s=0,i;for(i=0;i<items.length;i++)s+=w(items[i]);var r=rnd(o)*s;for(i=0;i<items.length;i++){r-=w(items[i]);if(r<0)return items[i];}return items[items.length-1];}

// ---------- Kartta ----------
function genMap(seed){
  var o={rs:seed|0},W=C.W,H=C.H,N=W*H,x,y,i;
  var road=new Uint8Array(N);
  function lines(len){var a=[],p=Math.floor(rnd(o)*2);while(p<=len-1){a.push(p);p+=3+(rnd(o)<.3?1:0);}return a;}
  var cols=lines(W),rows=lines(H),x0=cols[0],x1=cols[cols.length-1],y0=rows[0],y1=rows[rows.length-1];
  cols.forEach(function(cx){for(y=y0;y<=y1;y++)road[y*W+cx]=1;});
  rows.forEach(function(cy){for(x=x0;x<=x1;x++)road[cy*W+x]=1;});
  function nbr(c){var cx=c%W,cy=(c-cx)/W,r=[];if(cx>0)r.push(c-1);if(cx<W-1)r.push(c+1);if(cy>0)r.push(c-W);if(cy<H-1)r.push(c+W);return r;}
  function connected(){var s=-1,n=0;for(i=0;i<N;i++)if(road[i]){n++;if(s<0)s=i;}if(s<0)return false;
    var seen=new Uint8Array(N),q=[s],k=0;seen[s]=1;while(k<q.length){var c=q[k++];nbr(c).forEach(function(m){if(!seen[m]&&road[m]){seen[m]=1;q.push(m);}});}return q.length===n;}
  var segs=[];
  rows.forEach(function(cy){for(var k=0;k<cols.length-1;k++){var s=[];for(x=cols[k]+1;x<cols[k+1];x++)s.push(cy*W+x);segs.push(s);}});
  cols.forEach(function(cx){for(var k=0;k<rows.length-1;k++){var s=[];for(y=rows[k]+1;y<rows[k+1];y++)s.push(y*W+cx);segs.push(s);}});
  shuffle(segs,o);
  var drop=Math.round(segs.length*(0.12+rnd(o)*0.08));
  for(var k=0;k<segs.length&&drop>0;k++){var s=segs[k];s.forEach(function(c){road[c]=0;});if(connected())drop--;else s.forEach(function(c){road[c]=1;});}
  for(i=0;i<N;i++)if(road[i]&&!nbr(i).some(function(m){return road[m];}))road[i]=0;
  cols.forEach(function(cx){if(road[y0*W+cx]&&rnd(o)<.4)for(y=0;y<y0;y++)road[y*W+cx]=1;if(road[y1*W+cx]&&rnd(o)<.4)for(y=y1+1;y<H;y++)road[y*W+cx]=1;});
  rows.forEach(function(cy){if(road[cy*W+x0]&&rnd(o)<.3)for(x=0;x<x0;x++)road[cy*W+x]=1;if(road[cy*W+x1]&&rnd(o)<.3)for(x=x1+1;x<W;x++)road[cy*W+x]=1;});
  // rakennukset kiinni tiessä
  var bld=new Int16Array(N).fill(-1),blds=[],park=new Uint8Array(N);
  var SH=[[1,1],[2,1],[1,2],[2,2]],SW=[4,3,3,2];
  function free(c){return !road[c]&&bld[c]<0;}
  function touches(cells){return cells.some(function(c){return nbr(c).some(function(m){return road[m];});});}
  var order=[];for(i=0;i<N;i++)if(!road[i])order.push(i);shuffle(order,o);
  order.forEach(function(c){
    if(!free(c)||!nbr(c).some(function(m){return road[m];}))return;
    var cx=c%W,cy=(c-cx)/W,tries=SH.map(function(s,j){return [j,Math.pow(rnd(o),1/SW[j])];}).sort(function(a,b){return b[1]-a[1];}).map(function(a){return a[0];});
    for(var t=0;t<tries.length;t++){var sw=SH[tries[t]][0],sh=SH[tries[t]][1];
      for(var dx=0;dx<sw;dx++)for(var dy=0;dy<sh;dy++){var bx=cx-dx,by=cy-dy;if(bx<0||by<0||bx+sw>W||by+sh>H)continue;
        var cells=[],ok=true;for(var u=0;u<sw&&ok;u++)for(var v=0;v<sh;v++){var cc=(by+v)*W+bx+u;if(!free(cc)){ok=false;break;}cells.push(cc);}
        if(!ok||!touches(cells))continue;
        var id=blds.length,mx=bx+sw/2,my=by+sh/2,best=-1,bd=1e9;
        cells.forEach(function(cc){bld[cc]=id;nbr(cc).forEach(function(m){if(road[m]){var mx2=m%W+.5,my2=(m-m%W)/W+.5,d=(mx2-mx)*(mx2-mx)+(my2-my)*(my2-my);if(d<bd){bd=d;best=m;}}});});
        blds.push({id:id,x:bx,y:by,w:sw,h:sh,area:sw*sh,door:best,kind:'talo',col:-1});return;}
    }
  });
  for(i=0;i<N;i++)if(free(i)&&rnd(o)<.65)park[i]=1;
  var big=blds.filter(function(b){return b.area>=2;}),mid=rnd(o)<.5;
  big.sort(function(a,b){var da=Math.hypot(a.x+a.w/2-W/2,a.y+a.h/2-H/2),db=Math.hypot(b.x+b.w/2-W/2,b.y+b.h/2-H/2);return mid?da-db:db-da;});
  var dep=big[Math.floor(rnd(o)*Math.min(3,big.length))];dep.kind='varikko';
  // sopimusyritykset: järjestysnumero = avautumisjärjestys maineen kasvaessa
  var cand=blds.filter(function(b){return b.kind==='talo';}),n=Math.min(C.COMPANIES,cand.length);
  for(i=0;i<n;i++){var b=pickW(cand,function(q){return q.area+1;},o);b.kind='yritys';b.col=i;cand.splice(cand.indexOf(b),1);}
  var M={seed:seed,W:W,H:H,road:road,bld:bld,park:park,blds:blds,depot:dep.id,nb:[],dc:{}};
  for(i=0;i<N;i++)M.nb.push(road[i]?nbr(i).filter(function(m){return road[m];}):[]);
  return M;
}
function distFrom(M,t){var d=M.dc[t];if(d)return d;var N=M.W*M.H;d=new Int16Array(N).fill(-1);d[t]=0;var q=[t],k=0;
  while(k<q.length){var c=q[k++];M.nb[c].forEach(function(m){if(d[m]<0){d[m]=d[c]+1;q.push(m);}});}M.dc[t]=d;return d;}
function dist(M,a,b){var d=distFrom(M,b)[a];return d<0?999:d;}
function nextCell(M,c,t,dir){var d=distFrom(M,t),best=-1;
  M.nb[c].forEach(function(m){if(d[m]>=0&&d[m]===d[c]-1){if(best<0||m-c===dir)best=m;}});return best;}
function door(G,bid){return G.M.blds[bid].door;}

// ---------- Peli ----------
function newGame(seed){
  if(seed==null)seed=Math.floor(Math.random()*1e9);
  var G={seed:seed,rs:(seed^0x5bd1e995)|0,t:0,cash:C.START_CASH,maine:0,tier:0,orders:[],nextId:1,lp:0,acc:0,thr:1,
    car:{c:0,n:-1,f:0,dir:0,route:[],load:[],wait:0},ending:false,final:null,over:false,rev:[],tot:{del:0,earned:0,cost:0,acc:0}};
  attach(G);G.car.c=door(G,G.M.depot);G.thr=expo(G);
  for(var i=0;i<2;i++)spawn(G);
  return G;
}
function attach(G){Object.defineProperty(G,'M',{value:genMap(G.seed),enumerable:false,writable:true,configurable:true});
  Object.defineProperty(G,'ev',{value:[],enumerable:false,writable:true,configurable:true});}
function expo(G){return -Math.log(1-rnd(G)*0.999);}
function tier(G){return TIERS[G.tier];}
function cap(G){return TIERS[G.tier].cap;}
function ord(G,id){for(var i=0;i<G.orders.length;i++)if(G.orders[i].id===id)return G.orders[i];return null;}
function offerRate(G){return Math.min(C.RATE_MAX,C.RATE_BASE+C.RATE_PER*G.maine);}
function maxOffers(G){return Math.min(C.OFFERS_MAX,C.OFFERS_BASE+Math.floor(G.maine/C.OFFERS_PER));}
function companies(G){return Math.min(C.COMPANIES,C.CO_BASE+Math.floor(G.maine/C.CO_PER));}
function byState(G,s){return G.orders.filter(function(o){return o.state===s;});}
function accepted(G){return byState(G,'hyvaksytty');}
function pk(G,ids){var s=0;ids.forEach(function(id){var o=ord(G,id);s+=o?o.n:0;});return s;}
function maxSize(G){return Math.min(C.SIZE_MAX,C.SIZE_BASE+Math.floor(G.maine/C.SIZE_PER));}

function spawn(G){
  if(G.ending||G.over)return null;
  if(byState(G,'tarjous').length>=maxOffers(G)||G.orders.length>=C.MAX_LETTERS)return null;
  var M=G.M,nco=companies(G),co=M.blds.filter(function(b){return b.kind==='yritys'&&b.col<nco;});if(!co.length)return null;
  var busy={};G.orders.forEach(function(q){if(q.state==='tarjous')busy[q.from]=1;});
  var free=co.filter(function(b){return !busy[b.id];});if(!free.length)return null;
  var from=pickW(free,function(b){return b.area;},G);
  var dests=M.blds.filter(function(b){return b.kind!=='varikko'&&b.id!==from.id&&dist(M,from.door,b.door)>=C.MIN_TRIP;});
  if(!dests.length)return null;
  var to=pickW(dests,function(b){return Math.sqrt(b.area);},G);
  var used={};G.orders.forEach(function(q){used[q.L]=1;});var L=null;
  for(var k=0;k<26;k++){var c=LETTERS[(G.lp+k)%26];if(!used[c]){L=c;G.lp=(G.lp+k+1)%26;break;}}
  if(!L)return null;
  var d=dist(M,from.door,to.door),ms=maxSize(G),sizes=[];for(var z=1;z<=ms;z++)sizes.push(z);
  var n=pickW(sizes,function(z){return Math.pow(z,-C.SIZE_W);},G);
  var o={id:G.nextId++,L:L,n:n,from:from.id,to:to.id,col:from.col,t0:G.t,exp:G.t+C.OFFER_LIFE_MIN+rnd(G)*(C.OFFER_LIFE_MAX-C.OFFER_LIFE_MIN),
    state:'tarjous',pay:Math.round((C.PAY_BASE+C.PAY_PER*d)*n)};
  G.orders.push(o);G.ev.push({k:'new',o:o.id});return o;
}

// Kuljetus: auto tekee kaiken, minkä voi, jokaisessa ruudussa johon se tulee: jättää tänne menevät paketit ja ottaa hyväksytyt noudot (jos mahtuu).
function act(G,cell){
  var c=G.car,did=false;
  for(var i=c.load.length-1;i>=0;i--){var o=ord(G,c.load[i]);if(o&&door(G,o.to)===cell){c.load.splice(i,1);deliver(G,o);did=true;}}
  G.orders.forEach(function(o){if(o.state==='hyvaksytty'&&door(G,o.from)===cell&&pk(G,c.load)+o.n<=cap(G)){o.state='kyydissa';c.load.push(o.id);did=true;G.ev.push({k:'pick',o:o.id,b:o.from});}});
  if(did)c.wait=C.DWELL;return did;
}
function deliver(G,o){o.state='valmis';G.cash+=o.pay;G.rev.push([G.t,o.pay]);G.tot.earned+=o.pay;G.tot.del++;
  G.maine=Math.min(C.MAINE_MAX,G.maine+1);G.ev.push({k:'pay',b:o.to,amt:o.pay,o:o.id});}

// Reitin simulointi: mitä auto ehtii hoitaa nykyisellä reitillä (samat säännöt kuin oikeassa ajossa).
function simulate(G,route){

    acc.forEach(function(o){if(!picked[o.id]&&door(G,o.from)===cell&&pk(G,load)+o.n<=k){picked[o.id]=1;load.push(o.id);}});}
  a(cur);

  return {load:load,missing:acc.filter(function(o){return !picked[o.id];}),end:cur};
}
// Täydennys: puuttuvat viennit ja noudot reitin perään (lähin ensin). Käytössä vain pelin lopetuksessa (hyväksytyt ajetaan loppuun) ja botissa.
function ensure(G){
  var c=G.car,M=G.M;

    if(s.load.length){var best=null,bd=1e9;s.load.forEach(function(id){var o=ord(G,id),d=dist(M,s.end,door(G,o.to));if(d<bd){bd=d;best=door(G,o.to);}});c.route.push(best);continue;}

  }

// Reitti: napautettu paikka menee perään (enintään MAX_PLACES). Palauttaa true tai syyn ('full', 'same', 'bad').

function resetRoute(G){if(G.ending||G.over)return false;G.car.route=G.car.route.slice(0,1);return true;}

function income(G){var s=0;G.rev.forEach(function(r){if(r[0]>G.t-60)s+=r[1];});return s;}

// ---------- Tallennus ----------
function save(G){return {app:'pakettipeli',ver:VER,savedAt:new Date().toISOString(),peli:JSON.parse(JSON.stringify(G))};}

function repair(d){

// ---------- Botti (tasapainotus ja testit) ----------
function routeLen(G){var c=G.car,p=c.n>=0?c.n:c.c,s=0;c.route.forEach(function(q){s+=dist(G.M,p,q);p=q;});return {len:s,end:p};}

  if(best&&accept(G,best.id))ensure(G);
}

  save:save,repair:repair,bot:bot,routeLen:routeLen};
})();
if(typeof module!=='undefined')module.exports=PP;
</script>

  countDot(o.n,x,y,h,bs,big?col.bad:col.car,col.carTx);
  cx.globalAlpha=1;
  hits.push({k:'tn',o:o.id,b:o.from,x:x,y:y,r:Math.max(22,h+9)});
}
// Hyväksytyt ilman kirjaimia: nouto = tumma ruutu ↑, kohde = tumma rengas ↓, kyydissä olevan kohde = tumma täytetty ympyrä ↓. Pallo = pakettien määrä.
function jobBadge(it,b,x,y,bs,col){
  var h=bs/2,fg;
  if(it.k==='an'){cx.fillStyle=col.car;rr(x-h,y-h,bs,bs,bs*.22);cx.fill();cx.strokeStyle=col.surface;cx.lineWidth=2;cx.stroke();fg=col.carTx;}
  else if(it.k==='kv'){cx.fillStyle=col.car;cx.beginPath();cx.arc(x,y,h,0,7);cx.fill();cx.strokeStyle=col.surface;cx.lineWidth=2;cx.stroke();fg=col.carTx;}
  else{cx.fillStyle=col.surface;cx.beginPath();cx.arc(x,y,h,0,7);cx.fill();cx.strokeStyle=col.car;cx.lineWidth=Math.max(2.5,bs*.14);cx.stroke();fg=col.car;}
  cx.fillStyle=fg;cx.font=F(800,bs*.62);cx.textAlign='center';cx.textBaseline='middle';cx.fillText(it.k==='an'?'↑':'↓',x,y+1);
  countDot(it.n,x,y,h,bs,col.accent,col.accentTx);
  hits.push({k:it.k,b:b,x:x,y:y,r:Math.max(22,h+9)});
}

// ---------- napautus: tarjous hyväksytään, paikka menee reitin perään ----------
function nearest(x,y,f){var b=null,bd=1e9;hits.forEach(function(h){if(!f(h))return;var d=Math.hypot(h.x-x,h.y-y);if(d<=h.r&&d<bd){bd=d;b=h;}});return b;}
function roadAt(x,y){var gx=(x-L.ox)/L.cell,gy=(y-L.oy)/L.cell,best=-1,bd=.8;
  for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var cxg=Math.floor(gx)+dx,cyg=Math.floor(gy)+dy;if(cxg<0||cyg<0||cxg>=C.W||cyg>=C.H)continue;
    var i=cyg*C.W+cxg;if(!G.M.road[i])continue;var d=Math.hypot(cxg+.5-gx,cyg+.5-gy);if(d<bd){bd=d;best=i;}}return best;}
function bldAt(x,y){var gx=Math.floor((x-L.ox)/L.cell),gy=Math.floor((y-L.oy)/L.cell);if(gx<0||gy<0||gx>=C.W||gy>=C.H)return -1;return G.M.bld[gy*C.W+gx];}
function place(cell,label){var r=PP.addPlace(G,cell);
  if(r===true){stats(true);return true;}
  if(r==='full')toast('Reitillä on jo '+C.MAX_PLACES+' paikkaa. Nollaa reitti tai odota.');
  else if(r==='same')toast('Sama paikka on jo viimeisenä.');
  return false;}
function tap(x,y){
  if(!G||G.over||G.final||menuOpen)return;
  if(G.ending){toast('Peli päättyy: reittiä ei voi enää muuttaa.');return;}
  var h=nearest(x,y,function(){return true;});
  if(h&&h.k==='tn'){var o=PP.ord(G,h.o);
    if(o.n>PP.cap(G)){toast('Keikka '+o.L+' on '+o.n+' pakettia: ei mahdu autoon ('+PP.cap(G)+' paikkaa).');return;}
    PP.accept(G,o.id);if(place(PP.door(G,o.from)))toast('Keikka '+o.L+' hyväksytty, nouto reitille');else toast('Keikka '+o.L+' hyväksytty');return;}
  if(h){place(G.M.blds[h.b].door);return;}
  var r=roadAt(x,y);if(r>=0){place(r);return;}
  var b=bldAt(x,y);if(b>=0)place(G.M.blds[b].door);
}
var down=null;
cv.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',function(e){if(!down)return;var r=cv.getBoundingClientRect();
  if(Math.hypot(e.clientX-down[0],e.clientY-down[1])<14)tap(e.clientX-r.left,e.clientY-r.top);down=null;});

// ---------- napit ----------
$('bRoute').onclick=function(){if(!G.car.route.length){toast('Reitti on jo tyhjä.');return;}
  PP.resetRoute(G);toast(G.car.route.length?'Reitti nollattu: auto ajaa nykyiseen kohteeseen ja jää odottamaan.':'Reitti nollattu.');stats(true);};
$('bUp').onclick=function(){var n=T[G.tier+1];if(!n)return;
  if(G.cash<n.raja){toast('Laina vaatii kassaan '+n.raja+'.');return;}
  dialog('<h2>'+n.nimi+'?</h2><p>'+n.cap+' paikkaa (nyt '+PP.cap(G)+'). Auto ostetaan lainalla: käsiraha <b>'+n.kasi+'</b> heti, ja juoksevat kulut nousevat <b>'+PP.costs(G)+' → '+n.kulu+'/min</b>.</p>'+
    '<p>Iso auto kannattaa vain, jos se kulkee täynnä.</p><div class="col"><button class="pri" data-x="up">Osta lainalla</button><button data-x="close">Ei vielä</button></div>');};
$('bEnd').onclick=function(){dialog('<h2>Lopeta peli?</h2><p>Uusia tarjouksia ei enää tule. Hyväksytyt keikat ajetaan pikakelauksella loppuun (reitti täydennetään itsestään), eikä reittiä voi enää muuttaa. Kulut juoksevat loppuun asti, ja kassa on lopputulos.</p>'+
  '<div class="col"><button class="pri" data-x="end">Lopeta peli</button><button data-x="close">Jatka ajamista</button></div>');};
$('bMenu').onclick=function(){menu();};

function put(id,v,html){if(UI[id]===v)return;UI[id]=v;if(html)$(id).innerHTML=v;else $(id).textContent=v;}
function dis(id,v){if(UI['d'+id]===v)return;UI['d'+id]=v;$(id).disabled=v;}
function stats(force){var now=clock();
  var k=PP.cap(G),ld=PP.pk(G,G.car.load),wait=PP.pk(G,PP.accepted(G).map(function(o){return o.id;})),nr=G.car.route.length;
  put('cInfo',G.ending?'Peli päättyy: hyväksytyt ajetaan loppuun.':'<b>'+esc(PP.tier(G).nimi)+'</b> · kyydissä '+ld+'/'+k+' · nouto '+wait+' · reitti '+nr+'/'+C.MAX_PLACES,true);
  var n=T[G.tier+1];
  put('bUpS',n?(G.cash>=n.raja?n.cap+' paikkaa · käsiraha '+n.kasi:'vaatii kassan '+n.raja):'suurin auto');
  dis('bUp',!n||G.cash<n.raja||G.ending);dis('bEnd',G.ending);dis('bRoute',G.ending);
  if(!force&&now-lastStat<1)return;lastStat=now;
  var inc=PP.income(G),out=PP.costs(G),net=inc-out;
  put('sCash',fmt(G.cash));$('sCash').className=G.cash<60?'neg':'';
  put('sIn',fmt(inc));put('sOut',fmt(out));
  put('sNet',(net>0?'+':'')+fmt(net));$('sNet').className=net>=0?'pos':'neg';
  put('sMaine',String(Math.round(G.maine)));$('mBar').style.width=G.maine+'%';
  put('sOffers','tarjouksia ~'+fmt1(PP.offerRate(G))+'/min');
  if(G.cash>rec.kassa)rec.kassa=Math.round(G.cash);
}

// ---------- dialogit ----------
function dialog(html){menuOpen=true;$('dlg').innerHTML=html;$('ovl').classList.add('on');}
function closeDlg(){menuOpen=false;$('ovl').classList.remove('on');}
var HELP='<h2>Näin pelaat</h2><ul>'+
  '<li>Olet yksityisyrittäjä, jolla on yksi auto. Värilliset talot tarjoavat keikkoja: <b>katkoviivaruutu kirjaimella</b> on tarjous, ja haalea rengas samalla kirjaimella näyttää, minne paketti menee.</li>'+
  '<li><b>Napauta tarjousta</b>, niin keikka on hyväksytty ja nouto lisätään reitin perään. Hyväksytyt menettävät kirjaimen: <b>↑</b> on nouto, <b>↓</b> kohde ja täytetty <b>↓</b> kohde, jonne kyydissä oleva paketti menee.</li>'+
  '<li><b>Reitin teet itse:</b> jokainen napautus kartalla (merkki, talo tai tie) lisää paikan reitin perään, enintään '+C.MAX_PLACES+'. Reitti menee vain sinne, minne sen laitat.</li>'+
  '<li><b>Nollaa reitti</b>: auto ajaa vielä nykyiseen kohteeseensa ja jää sinne odottamaan uutta reittiä.</li>'+
  '<li>Auto noutaa ja jättää paketit itse, kun se ohittaa paikan. Rahat tulevat vasta perillä, ja ajan kulumisella ei ole muuta merkitystä kuin juoksevat kulut.</li>'+
  '<li>Toimitukset kasvattavat mainetta, ja maine tuo lisää ja isompia keikkoja. Isompi auto ostetaan lainalla: käsiraha ja isommat kulut. Konkurssi tulee heti, kun kassa menee miinukselle.</li>'+
  '<li><b>Lopeta peli</b> ajaa hyväksytyt loppuun, ja kassa on tulos.</li></ul>';
function menu(){
  var t=function(v,l){return '<button data-t="'+v+'"'+(set.teema===v?' class="on"':'')+'>'+l+'</button>';};
  dialog('<h2>Pakettipeli</h2><div class="col"><button class="pri" data-x="close">Jatka</button><button data-x="help">Näin pelaat</button><button data-x="new">Uusi peli (uusi kaupunki)</button></div>'+
    '<div class="sec">Ennätykset</div><div class="kv"><span>Paras lopputulos</span><b>'+fmt(rec.loppu)+'</b><span>Suurin kassa</span><b>'+fmt(rec.kassa)+'</b><span>Kaupunki</span><b>#'+G.seed+'</b></div>'+
    '<div class="sec">Teema</div><div class="seg">'+t('laite','Laite')+t('vaalea','Vaalea')+t('tumma','Tumma')+'</div>'+
    '<div class="sec">Varmuuskopio</div><div class="col"><button data-x="exp">Tallenna tiedostoksi</button><button data-x="txt">Näytä tekstinä</button><button data-x="imp">Palauta tiedostosta</button><button data-x="imptxt">Palauta tekstistä</button></div>'+
    '<input type="file" id="impf" accept=".json,application/json,text/plain" hidden>');
}
function finalDlg(){var f=G.final;var best=f.cash>rec.loppu;if(best)rec.loppu=Math.round(f.cash);store();
  dialog('<h2>Peli päättyi</h2><div class="kv"><span>Lopputulos (kassa)</span><b>'+fmt(f.cash)+'</b><span>Toimituksia</span><b>'+f.del+'</b><span>Auto</span><b>'+esc(T[f.tier].nimi)+'</b><span>Maine</span><b>'+Math.round(f.maine)+'</b><span>Kesto</span><b>'+Math.round(f.mins)+' min</b><span>Paras lopputulos</span><b>'+fmt(rec.loppu)+'</b></div>'+
    (best?'<p>Uusi ennätys! 🏆</p>':'')+'<div class="col"><button class="pri" data-x="new2">Uusi peli</button></div>');}
function gameover(){
  dialog('<h2>Konkurssi</h2><p>Kassa meni miinukselle, ja laina kaatui. Toimituksia ehti '+G.tot.del+', ja peliä kesti '+Math.round(G.t/60)+' min.</p><div class="kv"><span>Suurin kassa</span><b>'+fmt(rec.kassa)+'</b><span>Paras lopputulos</span><b>'+fmt(rec.loppu)+'</b></div>'+
    '<div class="col"><button class="pri" data-x="new2">Uusi peli</button></div>');}
function startNew(){G=PP.newGame();fx=[];hl=null;UI={};closeDlg();layout();stats(true);store();}
$('dlg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){set.teema=b.dataset.t;theme();store();menu();return;}
  var x=b.dataset.x;
  if(x==='close'){closeDlg();if(!set.ohje3){set.ohje3=true;store();}}
  else if(x==='help')dialog(HELP+'<div class="col"><button class="pri" data-x="close">Selvä</button></div>');
  else if(x==='new')dialog('<h2>Uusi peli?</h2><p>Nykyinen peli häviää, ja saat uuden kaupungin. Ennätykset säilyvät.</p><div class="col"><button class="pri" data-x="new2">Aloita uusi</button><button data-x="close">Peru</button></div>');
  else if(x==='new2')startNew();
  else if(x==='up'){closeDlg();if(PP.upgrade(G))toast(PP.tier(G).nimi+': '+PP.cap(G)+' paikkaa.');stats(true);}
  else if(x==='end'){closeDlg();PP.endGame(G);stats(true);}
  else if(x==='exp'){var d=PP.save(G);d.ennatykset=rec;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
    a.download='pakettipeli-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}
  else if(x==='txt'){var d2=PP.save(G);d2.ennatykset=rec;dialog('<h2>Varmuuskopio tekstinä</h2><p>Kopioi teksti talteen.</p><textarea readonly>'+esc(JSON.stringify(d2))+'</textarea><div class="col"><button data-x="copy">Kopioi</button><button class="pri" data-x="close">Valmis</button></div>');}
  else if(x==='copy'){var ta=$('dlg').querySelector('textarea');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Kopioitu.');},function(){document.execCommand('copy');});}catch(err){document.execCommand('copy');}}
  else if(x==='imp'){var f=$('impf');f.onchange=function(){var r=new FileReader();r.onload=function(){importText(r.result);};if(f.files[0])r.readAsText(f.files[0]);};f.click();}
  else if(x==='imptxt')dialog('<h2>Palauta tekstistä</h2><textarea id="impt" placeholder="Liitä varmuuskopio tähän"></textarea><div class="col"><button class="pri" data-x="impgo">Palauta</button><button data-x="close">Peru</button></div>');
  else if(x==='impgo')importText($('impt').value);
});
function importText(t){try{var d=JSON.parse(t),g=PP.repair(d);if(!g)throw 0;if(d.ennatykset)rec=Object.assign(rec,d.ennatykset);G=g;UI={};closeDlg();stats(true);store();toast('Peli palautettu.');}
  catch(e){toast('Tämä ei ole Pakettipelin (versio 2) varmuuskopio.');}}

// ---------- silmukka ----------
var last=clock(),shownEnd=false;
function speed(){if(menuOpen||G.over||G.final)return 0;return G.ending?8:1;}
function loop(){
  var now=clock(),dt=Math.min(0.1,now-last);last=now;
  if(G&&!document.hidden){
    var sp=speed();PP.step(G,dt*sp);
    G.ev.forEach(function(e){if(e.k==='pay')fx.push({b:e.b,amt:e.amt,t:now});});G.ev.length=0;
    var st=$('speedtag');st.style.display=sp===8?'block':'none';st.textContent='Pikakelaus 8×';
    draw(now);stats(false);
    if((G.final||G.over)&&!shownEnd){shownEnd=true;stats(true);if(G.over){store();gameover();}else finalDlg();}
    if(!G.final&&!G.over)shownEnd=false;
    if(now-lastSave>5){lastSave=now;if(!G.over&&!G.final)store();}
  }
  if(toastT&&now>toastT){$('toast').classList.remove('on');toastT=0;}
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',function(){if(document.hidden)store();last=clock();});
window.addEventListener('pagehide',store);
window.addEventListener('resize',layout);

if(!restore())G=PP.newGame();
theme();layout();stats(true);
if(!set.ohje3)dialog(HELP+'<div class="col"><button class="pri" data-x="close">Aloita</button></div>');
requestAnimationFrame(loop);

// testikoukut
window.__pp={PP:PP,get G(){return G;},set G(g){G=g;},layout:layout,tap:tap,cxy:cxy,bCenter:bCenter,
  setClock:function(f){clock=f;},stats:stats,store:store,get hits(){return hits;},closeDlg:closeDlg};
})();
</script>
