<style>
/* Päiväkartta 2.0 (15.11.2026): Emilin appilinjan mukainen runko. Värit tulevat teemasta (applyCfg). */
:root{
  --ground:#F5F3EE; --surface:#FFFEFA; --ink:#252B28; --muted:#5E685F; --line:#DDE2D9;
  --accent:#39775A; --on-accent:#FFFFFF; --fill:#E7F0E7; --alert:#D70015; --alert-bg:#FCE8EA;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --lh:1.4;
  --barh:57px; --hdh:38px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B18; --surface:#202922; --ink:#EEF1E9; --muted:#ACB8AE; --line:#3B473E;
    --accent:#A2C9B6; --on-accent:#151B18; --fill:#2B4032; --alert:#FF453A; --alert-bg:#371B22;
  }
}
:root[data-theme="dark"]{
  --ground:#151B18; --surface:#202922; --ink:#EEF1E9; --muted:#ACB8AE; --line:#3B473E;
  --accent:#A2C9B6; --on-accent:#151B18; --fill:#2B4032; --alert:#FF453A; --alert-bg:#371B22;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:var(--lh);-webkit-text-size-adjust:100%;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(var(--barh) + 18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="text"],input[type="date"],textarea,select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink)}
textarea{min-height:130px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:560px;margin:0 auto}

/* inforivi */
.hd{position:sticky;top:0;z-index:6;background:var(--ground);display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto;min-height:30px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 0 6px}
.hd h1{margin:0;font-size:16px;font-weight:700;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .meta{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hd .sp{flex:1}
.hd #hdmeta{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:350px){.hd{gap:6px}}
.hl{border:0;background:none;padding:0;min-height:30px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;position:relative;font-variant-numeric:tabular-nums}
.hl::after{content:"";position:absolute;inset:-7px -4px}
.hl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.ib{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;color:var(--muted);font:italic 600 13px/1 Georgia,serif;position:relative}
.ib::after{content:"";position:absolute;inset:-11px}

/* alapalkki */
.abar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.abar .in{max-width:560px;margin:0 auto;display:flex;gap:6px;align-items:center}
.bbtn,.roll{flex:none;height:44px;min-width:44px;padding:0 11px;white-space:nowrap;border-radius:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:5px;position:relative;border:1px solid var(--line);background:var(--surface)}
.roll{border:0;background:var(--fill);font-weight:700;max-width:46vw;overflow:hidden}
.roll span{overflow:hidden;text-overflow:ellipsis}
.abar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bact{flex:1;min-width:0;display:flex;gap:0;justify-content:center;align-items:center}
.bact select{min-height:44px;min-width:0;flex:1;font-weight:650;padding:0 8px;background:var(--surface)}
.navg{display:flex;align-items:stretch}
.navg .bbtn{border-radius:0;margin-left:-1px}
.navg .bbtn:first-child{border-radius:10px 0 0 10px;margin-left:0;width:42px;min-width:42px;padding:0;font-size:20px}
.navg .bbtn:last-child{border-radius:0 10px 10px 0;width:42px;min-width:42px;padding:0;font-size:20px}
.navg .bbtn[aria-disabled="true"]{color:var(--muted)}
.bbtn.ic{padding:0;width:44px}
.bbtn[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.xdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.kb .abar{display:none}
@media (max-width:350px){.roll svg{display:none}.abar .in{gap:4px}.navg .bbtn{padding:0 8px}}

/* pieni ikkuna */
.pkbg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.26);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(var(--barh) + 12px + env(safe-area-inset-bottom,0px))}
.kb .pkbg{top:var(--vvt,0);bottom:auto;height:var(--vvh,100%);padding-bottom:12px}
.pkd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.pkd p{margin:0;font-size:14.5px;line-height:1.45}
.pkd>b{font-size:16px}
.pkd label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.pkd.menu{padding:6px;gap:0}
.mrow{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;width:100%;min-height:46px;border:0;border-radius:9px;background:none;text-align:left;padding:4px 10px}
.mrow b{font-weight:650;font-size:15.5px}
.mrow .meta{font-size:13px;color:var(--muted)}
.mrow[aria-current="true"]{background:var(--ink);color:var(--surface)}
.list .mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:54px;padding:6px 12px;margin-bottom:8px}
.cf{display:flex;align-items:center;gap:8px;min-height:44px}
.cf span{flex:1;min-width:0;font-size:14.5px}
.sbtn{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14.5px}
.sbtn.del{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:650}
.sbtn.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
.lnk{border:0;background:none;min-height:34px;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14.5px;align-self:flex-start;text-align:left;position:relative}
.lnk.q{color:var(--muted)}
.lnk::after{content:"";position:absolute;inset:-5px -2px}
.rel{font-size:13.5px;line-height:1.4;color:var(--muted)}
.rel b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 12px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* kuukausikalenteri */
.kkh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kkh b{font-size:15.5px}
.kkh button{width:44px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:19px;padding:0}
.kkg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kkg .wdh{font-size:11px;font-weight:600;color:var(--muted);text-align:center;height:18px}
.kkc{position:relative;height:42px;border:0;border-radius:9px;background:none;padding:0 0 8px;font-size:15px;font-variant-numeric:tabular-nums}
.kkc.out{color:var(--muted);opacity:.55}
.kkc.today{box-shadow:inset 0 0 0 1.5px var(--line)}
.kkc .dot{position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.kkc[aria-pressed="true"]{background:var(--ink);color:var(--surface);opacity:1}
.kkc[aria-pressed="true"] .dot{background:var(--surface)}

/* päivä: viikkonauha ja asiat */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 12px}
.daybtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;height:52px;padding:5px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.daybtn .wd{font-size:11.5px;color:var(--muted);line-height:1.2}
.daybtn .dn{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.daybtn .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.daybtn.today{border-color:var(--ink)}
.daybtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.daybtn[aria-pressed="true"] .wd{color:inherit;opacity:.8}
.daybtn[aria-pressed="true"] .dot{background:var(--surface)}
.rows{display:grid;gap:6px}
.tiivis{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:15.5px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .28s ease}
.opt>span{position:relative}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.pct{flex:none;min-width:58px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pct i{font-style:normal;font-weight:700;margin-right:3px}
.pct i.up{color:var(--accent)}
.pct i.dn{color:var(--alert)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt[aria-pressed="true"]::before{width:0}
.opt[aria-pressed="true"] .pct{color:inherit;opacity:.8}
.opt[data-off]{opacity:.6;border-style:dashed;background:transparent}
.opt[data-off]::before{width:0}
.opt[data-off] .t{text-decoration:line-through}
.opt.hold{box-shadow:0 0 0 2px var(--accent)}
.tiivis .opt{width:auto;min-height:40px;padding:7px 14px;border-radius:999px;font-size:15px}
.tiivis .pct{display:none}
.addslot{min-height:44px;display:flex;align-items:center;margin-top:6px}
.addslot input{min-height:44px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
@media (prefers-reduced-motion: reduce){.opt::before,.bar::before{transition:none}}

/* yhteydet */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:2px 0 12px}
.seg button{flex:1;min-height:38px;border:0;border-left:1px solid var(--line);background:none;font-size:14.5px;padding:0 6px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.subh{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.bar{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14.5px}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .28s ease}
.bar>span{position:relative}
.bar .t{flex:1;min-width:0;overflow-wrap:anywhere}
.bar small{display:block;font-size:12.5px;color:var(--muted)}
.pair{padding:10px 0;border-bottom:1px solid var(--line)}
.pair b{font-weight:650}
.pair span{display:block;font-size:13.5px;color:var(--muted)}
.combo{padding:12px 0 14px;border-bottom:1px solid var(--line)}
.combo>b{display:block;font-weight:650}
.combo .to{display:block;font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.combo .rows,.tree,.branch{display:grid;gap:5px}
.branch{margin-left:12px;padding-left:10px;border-left:2px solid var(--line)}
.info{font-size:14px;color:var(--muted);margin:4px 0 12px}

/* valikko: asiat (raahaus), ulkoasu, tiedot */
.alist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arow{display:flex;align-items:center;min-height:46px;border-top:1px solid var(--line);background:var(--surface);position:relative}
.arow:first-child{border-top:0}
.arow.drag{z-index:3;box-shadow:0 6px 22px rgba(0,0,0,.22)}
.vgrip{touch-action:none;flex:none;width:40px;align-self:stretch;min-height:46px;border:0;background:none;padding:0;cursor:grab;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vgrip::before{content:"";width:14px;height:2px;border-radius:1px;background:var(--muted);box-shadow:0 5px 0 var(--muted),0 -5px 0 var(--muted)}
.aname{flex:1;min-width:0;min-height:46px;border:0;background:none;text-align:left;padding:8px 12px 8px 0;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.aname .t{flex:1;min-width:0}
.aname .meta{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.alist.hid .aname{padding-left:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.card>b{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<header class="hd" id="hd"></header>
<main class="wrap" id="app"></main>
<nav class="abar" id="bar" aria-label="Ohjaimet"></nav>
<div id="pop"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ===================== MALLI =====================
   Ei valmista sisältöä: kaikki opitaan omista kirjauksista.
   Jokaiselle vaihtoehdolle lasketaan todennäköisyys tälle päivälle:
   perustaso (kuinka usein valittu niinä päivinä, kun se oli listalla)
   + viikonpäivän ja tämän päivän jo valittujen vaihtoehtojen yhteisesiintymät muina päivinä.
   Tarkasteltava päivä jätetään itse laskennasta pois. */

function addOpt(name){

  data.seq++;data.opts.push({id:'o'+data.seq,n:name.slice(0,200),h:false,c:c0});touch();

/* ---- yhteydet ---- */
function fshort(st,k){return k<st.n?data.opts[k].n:WDN[k-st.n];}
function fcond(st,k,neg){return k<st.n?(neg?'Kun ei: ':'Kun: ')+data.opts[k].n:(neg?'Kun ei ole ':'Kun on ')+WDN[k-st.n];}
function ratio(k,n){return n?pct(k/n):'–';}
function barRow(name,f,right,sub){return '<div class="bar" style="--f:'+Math.max(0,Math.min(1,f||0)).toFixed(3)+'"><span class="t">'+h(name)+(sub?'<small>'+h(sub)+'</small>':'')+'</span><span class="pct">'+h(right)+'</span></div>';}
function linksHtml(){var st=stats(null),vis=visible(),n=st.n,s='';
  function note(t){s+='<p class="info">'+h(t)+'</p>';}
  function head(t){s+='<h3 class="subh">'+h(t)+'</h3>';}
  if(st.days<5){note('Yhteydet alkavat näkyä, kun päiviä on kirjattu viisi. Nyt kirjattuna: '+st.days+'.');return s;}
  s+='<div class="seg" role="group" aria-label="Näkymä">'+[['single','Yksittäiset'],['combo','Yhdistelmät'],['tree','Polku']].map(function(v){return '<button type="button" data-act="lview" data-k="'+v[0]+'" aria-pressed="'+(linkView===v[0])+'">'+v[1]+'</button>';}).join('')+'</div>';
  var cands=vis.map(function(o){return st.ix[o.id];});for(var w=0;w<7;w++)cands.push(n+w);
  var isWd=linkSel.indexOf('wd')===0,xi=!linkSel?-1:(isWd?n+(+linkSel.slice(2)):st.ix[linkSel]);
  if(xi===undefined)xi=-1;

  if(linkView==='single'){
    if(xi<0){var pairs=[];
      for(var i=0;i<cands.length;i++)for(var j=i+1;j<cands.length;j++){var a=cands[i],b=cands[j];if(a>=n&&b>=n)continue;var A=assoc(st,a,b);
        if(A.Nb>=5&&A.ni>=3&&A.nj>=3&&A.Nb-A.ni>=2&&A.Nb-A.nj>=2)pairs.push({a:a,b:b,A:A});}
      var pos=pairs.filter(function(x){return x.A.phi>=0.25;}).sort(function(x,y){return y.A.phi-x.A.phi;}).slice(0,12);
      var neg=pairs.filter(function(x){return x.A.phi<=-0.25;}).sort(function(x,y){return x.A.phi-y.A.phi;}).slice(0,8);
      if(!pos.length&&!neg.length){note('Selviä yhteyksiä ei vielä erotu. Ne vaativat, että sama asia on valittu vähintään kolmena päivänä.');return s;}
      var block=function(title,list){if(!list.length)return;head(title);
        list.forEach(function(x){var A=x.A;s+='<div class="pair"><b>'+h(fshort(st,x.a)+' ja '+fshort(st,x.b))+'</b><span>Yhdessä '+A.c+' päivänä '+A.Nb+':sta.</span>';
          var one=function(c1,c2,k,nn,k0,n0){return fcond(st,c1,false)+' → '+fshort(st,c2)+' '+ratio(k,nn)+' ('+k+'/'+nn+'), muulloin '+ratio(k0,n0)+' ('+k0+'/'+n0+').';};
          if(x.b<n)s+='<span>'+h(one(x.a,x.b,A.c,A.ni,A.nj-A.c,A.Nb-A.ni))+'</span>';
          if(x.a<n)s+='<span>'+h(one(x.b,x.a,A.c,A.nj,A.ni-A.c,A.Nb-A.nj))+'</span>';
          s+='</div>';});};
      block('Usein samana päivänä',pos);block('Harvoin samana päivänä',neg);return s;}
    if(isWd)note('Kirjattuja päiviä, jolloin oli '+WDN[xi-n]+': '+st.S[xi]+'.');
    else note('Valittu '+st.S[xi]+' päivänä '+st.N[xi]+':sta'+(st.N[xi]?' ('+pct(st.S[xi]/st.N[xi])+')':'')+'.');
    if(st.S[xi]<3){note(isWd?'Tätä viikonpäivää on kirjattu alle kolme kertaa, joten yhteyksiä ei voi vielä arvioida.':'Tämä on valittu alle kolmena päivänä, joten yhteyksiä ei voi vielä arvioida.');return s;}
    var R=relFor(st,xi,vis.map(function(o){return o.id;}),linkSel);
    var weekdays=function(){if(isWd)return;head('Viikonpäivittäin');s+='<div class="rows">';
      for(var k=0;k<7;k++){var W=assoc(st,n+k,xi);s+=barRow(WDN[k],W.ni?W.c/W.ni:0,ratio(W.c,W.ni),W.ni?W.c+'/'+W.ni+' päivänä':'ei kirjattuja päiviä');}
      s+='</div>';};
    if(!R.up.length&&!R.dn.length){note('Selviä yhteyksiä muihin asioihin ei vielä erotu.');weekdays();return s;}
    var group=function(title,list){if(!list.length)return;head(title);s+='<div class="rows">';
      list.forEach(function(r){var A=r.A;s+=barRow(opt(r.id).n,A.pji,pct(A.pji)+' / '+pct(A.pjn),A.c+'/'+A.ni+' päivänä, muulloin '+(A.nj-A.c)+'/'+(A.Nb-A.ni));});s+='</div>';};
    group(isWd?'Useammin tänä viikonpäivänä':'Useammin samana päivänä',R.up);group(isWd?'Harvemmin tänä viikonpäivänä':'Harvemmin samana päivänä',R.dn);
    s+='<p class="note">Ensimmäinen luku: kun '+(isWd?'on '+h(WDN[xi-n]):'”'+h(fshort(st,xi))+'” on valittu')+'. Toinen: muina päivinä.</p>';
    weekdays();return s;}

  if(isWd){note('Viikonpäivä voi olla yhdistelmän tai polun osa, mutta ei kohde. Valitse kohteeksi jokin asioistasi.');return s;}

  if(linkView==='combo'){
    var card=function(c,showT){var nn=c.n,kk=c.k;
      return '<div class="combo"><b>'+h(fshort(st,c.a)+' + '+fshort(st,c.b))+'</b><span class="to">'+h((showT?'→ '+fshort(st,c.T)+'. ':'')+'Yhdessä '+(c.dir>0?'nostaa':'laskee')+' enemmän kuin kumpikaan yksin.'+(c.prelim?' Alustava: päiviä on vielä vähän.':''))+'</span><div class="rows">'+
        barRow('Molemmat',nn[3]?kk[3]/nn[3]:0,ratio(kk[3],nn[3]),kk[3]+'/'+nn[3]+' päivänä')+
        barRow('Vain: '+fshort(st,c.a),nn[2]?kk[2]/nn[2]:0,ratio(kk[2],nn[2]),kk[2]+'/'+nn[2]+' päivänä')+
        barRow('Vain: '+fshort(st,c.b),nn[1]?kk[1]/nn[1]:0,ratio(kk[1],nn[1]),kk[1]+'/'+nn[1]+' päivänä')+
        barRow('Ei kumpaakaan',nn[0]?kk[0]/nn[0]:0,ratio(kk[0],nn[0]),kk[0]+'/'+nn[0]+' päivänä')+'</div></div>';};
    if(xi<0){
      if(vis.length*cands.length*cands.length/2*st.days>3e7){note('Aineisto on jo niin laaja, että kaikkien kohteiden yhdistelmät olisivat hitaita laskea kerralla. Valitse kohde alapalkista.');return s;}
      var all=[];vis.forEach(function(o){combosFor(st,st.ix[o.id],cands).list.slice(0,4).forEach(function(c){all.push(c);});});
      all.sort(function(x,y){return y.score-x.score;});all=all.slice(0,12);
      if(!all.length){note('Yhdistelmiä ei vielä erotu. Molempien tekijöiden pitää osua samalle päivälle vähintään viisi kertaa.');return s;}
      all.forEach(function(c){s+=card(c,true);});return s;}
    var res=combosFor(st,xi,cands);
    note('Kohde ”'+fshort(st,xi)+'”: tavallisesti '+ratio(res.K,res.R)+' ('+res.K+'/'+res.R+' päivänä).');
    if(res.R<10){note('Yhdistelmiin tarvitaan vähintään kymmenen päivää, joina kohde on ollut mukana.');return s;}
    if(!res.list.length){note('Tälle kohteelle ei vielä erotu yhdistelmiä, jotka selittäisivät enemmän kuin tekijät yksinään.');return s;}
    var ups=res.list.filter(function(c){return c.dir>0;}).slice(0,10),dns=res.list.filter(function(c){return c.dir<0;}).slice(0,10);
    if(ups.length){head('Nostavat kohdetta');ups.forEach(function(c){s+=card(c,false);});}
    if(dns.length){head('Laskevat kohdetta');dns.forEach(function(c){s+=card(c,false);});}
    return s;}

  if(xi<0){note('Valitse kohde alapalkista.');return s;}
  var tree=treeFor(st,xi,cands);
  note('Kohde ”'+fshort(st,xi)+'”.');
  if(tree.f<0){note(tree.n<10?'Polkuun tarvitaan vähintään kymmenen päivää, joina kohde on ollut mukana.':'Mikään tekijä ei vielä jaa kohteen päiviä selvästi kahtia.');return s;}
  var draw=function(node,label){var o=barRow(label,node.n?node.k/node.n:0,ratio(node.k,node.n),node.k+'/'+node.n+' päivänä');
    if(node.f<0)return o;return o+'<div class="branch">'+draw(node.yes,fcond(st,node.f,false))+draw(node.no,fcond(st,node.f,true))+'</div>';};
  s+='<div class="tree">'+draw(tree,'Kaikki päivät')+'</div>';
  return s;
}

function moveVis(i,j){var vis=visible(),o=vis[i],t=vis[j];if(!o||!t||i===j)return;
  data.opts.splice(data.opts.indexOf(o),1);var at=data.opts.indexOf(t);data.opts.splice(j>i?at+1:at,0,o);touch();}
/* Raahaus kahvasta (malli: Mätsik Forest bindVt). Rivi nousee, muut väistävät, reunan lähellä sivu vierii. */
function bindDrag(){Array.prototype.forEach.call(document.querySelectorAll('#alist .vgrip'),function(g){var st=null;
  function upd(){var raw=st.cy+window.scrollY-st.y0,lo=st.tops[0]-st.tops[st.i],n=st.rows.length-1,hi=st.tops[n]+st.hs[n]-st.tops[st.i]-st.hs[st.i],dy=Math.max(lo,Math.min(hi,raw));
    st.row.style.transform='translateY('+dy+'px)';var mid=st.tops[st.i]+st.hs[st.i]/2+raw,j=st.i;
    st.rows.forEach(function(r,k){if(k===st.i)return;var m=st.tops[k]+st.hs[k]/2;if(k<st.i&&mid<m)j=Math.min(j,k);if(k>st.i&&mid>m)j=Math.max(j,k);});st.j=j;
    st.rows.forEach(function(r,k){if(k!==st.i)r.style.transform=k>=j&&k<st.i?'translateY('+st.hs[st.i]+'px)':k<=j&&k>st.i?'translateY(-'+st.hs[st.i]+'px)':'';});}
  g.addEventListener('pointerdown',function(ev){if(ev.button>0||st)return;ev.preventDefault();var row=g.closest('.arow'),rows=Array.prototype.slice.call(row.parentNode.querySelectorAll('.arow[data-row]')),sy=window.scrollY;
    st={pid:ev.pointerId,row:row,rows:rows,i:rows.indexOf(row),j:rows.indexOf(row),cy:ev.clientY,y0:ev.clientY+sy,tops:rows.map(function(r){return r.getBoundingClientRect().top+sy;}),hs:rows.map(function(r){return r.offsetHeight;})};
    row.classList.add('drag');try{g.setPointerCapture(ev.pointerId);}catch(e){}
    st.tm=setInterval(function(){if(!st)return;var v=st.cy<90?-14:st.cy>window.innerHeight-140?14:0;if(v){window.scrollBy(0,v);upd();}},30);});
  g.addEventListener('pointermove',function(ev){if(!st||ev.pointerId!==st.pid)return;ev.preventDefault();st.cy=ev.clientY;upd();});
  g.addEventListener('touchmove',function(ev){if(st)ev.preventDefault();},{passive:false});g.addEventListener('contextmenu',function(ev){ev.preventDefault();});
  function end(cancel){if(!st)return;var s0=st;st=null;clearInterval(s0.tm);s0.rows.forEach(function(r){r.style.transform='';});s0.row.classList.remove('drag');
    if(cancel||s0.j===s0.i)return;var y=window.scrollY;moveVis(s0.i,s0.j);refreshAList();window.scrollTo(0,y);}
  g.addEventListener('pointerup',function(ev){if(st&&ev.pointerId===st.pid)end(false);});g.addEventListener('pointercancel',function(){end(true);});
  /* näppäimistöllä: nuoli ylös tai alas siirtää */
  g.addEventListener('keydown',function(ev){if(ev.key!=='ArrowUp'&&ev.key!=='ArrowDown')return;ev.preventDefault();var id=g.closest('.arow').dataset.row,vis=visible(),i=-1;
    vis.forEach(function(o,k){if(o.id===id)i=k;});var j=i+(ev.key==='ArrowUp'?-1:1);if(i<0||j<0||j>=vis.length)return;moveVis(i,j);refreshAList();
    var ng=document.querySelector('#alist .arow[data-row="'+CSS.escape(id)+'"] .vgrip');if(ng)ng.focus();});});}

  var fallback=function(){tab='menu';vsub='tiedot';tview='vie';pop=null;render();toast('Tiedoston tallennus ei onnistunut. Kopioi teksti talteen.');};
  var linkSave=function(){try{var url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},5000);done();}catch(e){fallback();}};
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(dl){if(!dl){fallback();return;}
      return dl.save({filename:name,data:txt}).then(done,function(err){if(err&&err.code==='declined')toast('Vienti peruttiin.');else fallback();});},fallback);return;}
  try{var f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:name}).then(done,function(err){if(err&&err.name==='AbortError')return;linkSave();});return;}
  }catch(e){}
  linkSave();}

  lpXY=[ev.clientX,ev.clientY];var id=b.dataset.id;lpT=setTimeout(function(){lpT=null;suppress=true;b.classList.remove('hold');pop={t:'asia',id:id};renderPop();},520);
  setTimeout(function(){if(lpT)b.classList.add('hold');},220);});
document.addEventListener('pointermove',function(ev){if(lpT&&lpXY&&(Math.abs(ev.clientX-lpXY[0])>10||Math.abs(ev.clientY-lpXY[1])>10))lpClear();});
['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,function(){if(lpT)lpClear();});});
document.addEventListener('contextmenu',function(ev){if(ev.target.closest&&ev.target.closest('#opts .opt'))ev.preventDefault();});

var anc=null;
window.addEventListener('click',function(e){
  if(suppress){suppress=false;e.preventDefault();e.stopPropagation();return;}
  var t=e.target;
  if(pop&&!t.closest('.pkd')){e.preventDefault();e.stopPropagation();closePop();return;}
  var b=t.closest('button');anc=null;
  if(b&&$('app').contains(b)&&b.dataset.act!=='day')anc={b:b,sel:b.dataset.act?'[data-act="'+b.dataset.act+'"]'+(b.dataset.k?'[data-k="'+b.dataset.k+'"]':'')+(b.dataset.v?'[data-v="'+b.dataset.v+'"]':'')+(b.dataset.id?'[data-id="'+CSS.escape(b.dataset.id)+'"]':''):null,y:b.getBoundingClientRect().top,v:viewKey()};
},true);
window.addEventListener('click',function(){var A=anc;anc=null;if(!A||!A.sel||A.v!==viewKey()||document.body.contains(A.b))return;
  var el=document.querySelector('#app '+A.sel);if(!el)return;var dy=el.getBoundingClientRect().top-A.y;if(Math.abs(dy)>1)window.scrollBy(0,dy);});

document.addEventListener('click',function(e){
  var o=e.target.closest('#opts .opt');if(o){toggle(o.dataset.id);updateDay();return;}
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
  if(a==='osiot'){pop={t:'osiot'};renderPop();}
  else if(a==='osio')go(k);
  else if(a==='valikko'){if(tab==='menu'&&!vsub)go(lastTab);else go('menu');}
  else if(a==='vsub'){vsub=k;tview='';render();window.scrollTo(0,0);}
  else if(a==='vback'){vsub='';tview='';render();window.scrollTo(0,0);}
  else if(a==='info'){pop={t:'info',k:k};renderPop();}
  else if(a==='popkiinni')closePop();
  else if(a==='prev'||a==='next'){cur=addDays(cur,a==='prev'?-1:1);render();}
  else if(a==='today'){if(cur!==todayStr){cur=todayStr;render();}}
  else if(a==='day'){if(b.dataset.d!==cur){cur=b.dataset.d;render();}}
  else if(a==='kk'){pop={t:'kk',m:cur.slice(0,7)};renderPop();}
  else if(a==='kkm'){var d=parse(pop.m+'-01');d.setMonth(d.getMonth()+(+b.dataset.n));pop.m=iso(d).slice(0,7);renderPop();}
  else if(a==='kkday'){cur=b.dataset.d;pop=null;render();}
  else if(a==='add')openAdd();
  else if(a==='off'){var ctab=tab;toggleOff(id);pop=null;tab=ctab;render();}
  else if(a==='edit'){if(pop&&pop.t==='edit')saveEdit();pop={t:'edit',id:id};renderPop();}
  else if(a==='tolinks'){linkSel=id;linkView='single';go('links');}
  else if(a==='nostart'){var se=$('ed-start');if(se)se.value='';saveEdit();renderPop();}
  else if(a==='hide'){saveEdit();var oh=opt(id);if(oh){oh.h=!oh.h;if(!oh.h){data.opts.splice(data.opts.indexOf(oh),1);data.opts.push(oh);}touch();}pop=null;render();}
  else if(a==='del'){saveEdit();pop.del=true;renderPop();}
  else if(a==='del2'){data.opts=data.opts.filter(function(x){return x.id!==id;});
    Object.keys(data.days).forEach(function(d){var r=data.days[d];r.s=r.s.filter(function(x){return x!==id;});r.v=(r.v||[]).filter(function(x){return x!==id;});r.x=(r.x||[]).filter(function(x){return x!==id;});if(!r.s.length&&!r.x.length)delete data.days[d];});
    touch();pop=null;render();}
  else if(a==='lview'){linkView=k;render();}
  else if(a==='cfg'){data.cfg[k]=b.dataset.v;save();applyCfg();render();}
  else if(a==='vie')exportFile();
  else if(a==='tuo'){var f=$('impfile');if(f){f.value='';f.click();}}
  else if(a==='tview'){tview=tview===k?'':k;render();}
  else if(a==='kopioi'){var ta=$('exptext'),txt=ta?ta.value:'';
    var sel=function(){if(ta){ta.focus();ta.select();}toast('Teksti valittu: kopioi se.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){markExported();toast('Kopioitu');render();},sel);else sel();}catch(err){sel();}}
  else if(a==='tuoteksti'){var it=$('imptext');offerImport(it?it.value:'');}
  else if(a==='imp2'){var ob=pop&&pop.obj;if(!ob)return;data.opts=ob.opts;data.days=ob.days;data.seq=ob.seq;migrateStarts(data);
    if(ob.cfg)Object.keys(data.cfg).forEach(function(kk){if(typeof ob.cfg[kk]==='string')data.cfg[kk]=ob.cfg[kk];});
    data.meta={lastExport:data.meta.lastExport,dirty:0};rev++;save();applyCfg();pop=null;tview='';render();toast('Tiedot tuotu.');}
  else if(a==='clear'){pop={t:'clear'};renderPop();}
  else if(a==='clear2'){data.opts=[];data.days={};data.seq=0;data.meta={lastExport:null,dirty:0};rev++;save();pop=null;render();toast('Kaikki tiedot poistettu.');}
});
document.addEventListener('change',function(e){if(e.target&&(e.target.id==='ed-name'||e.target.id==='ed-start'))saveEdit();});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='ed-name'){e.preventDefault();e.target.blur();}
  if(e.key==='Escape'&&pop)closePop();});

/* Näppäimistö (iPhone): pieni ikkuna nousee näppäimistön yläpuolelle, alapalkki piiloon. */
(function(){var vv=window.visualViewport;if(!vv)return;function upd(){var kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);
  root.style.setProperty('--vvh',vv.height+'px');root.style.setProperty('--vvt',vv.offsetTop+'px');root.classList.toggle('kb',kb>120&&vv.scale<1.05);}
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);upd();})();

document.addEventListener('visibilitychange',function(){if(document.hidden)return;var t=iso(new Date());if(t!==todayStr){if(cur===todayStr)cur=t;todayStr=t;render();}});
