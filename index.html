<style>
:root{
  --ground:#EDF1EE; --surface:#FBFCFB; --ink:#14201C; --muted:#56665F; --line:#D3DCD6;
  --accent:#1D4D42; --on-accent:#F3F8F5; --fill:#CFE1D6; --alert:#A3243C; --alert-bg:#F6E4E7;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --dw:500; --lh:1.45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --surface:#161F1B; --ink:#E3EAE6; --muted:#97A7A0; --line:#2B3933;
    --accent:#8ED1B8; --on-accent:#0D1814; --fill:#243A30; --alert:#F08BA0; --alert-bg:#371B22;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#161F1B; --ink:#E3EAE6; --muted:#97A7A0; --line:#2B3933;
  --accent:#8ED1B8; --on-accent:#0D1814; --fill:#243A30; --alert:#F08BA0; --alert-bg:#371B22;
}
*,*::before,*::after{box-sizing:inherit}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:var(--lh);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--ground)}

/* ---- yläosa: viikko ja päivät ---- */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 12px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;min-height:22px}
.brand{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.weekrow{display:flex;align-items:center;gap:8px;margin-top:2px}
.wk{flex:1}
.navbtn{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--ground);font-size:22px;line-height:1;cursor:pointer}
.wk{min-width:0;padding-left:6px}
.wk-name{display:block;font-family:var(--font-display);font-weight:var(--dw);font-size:28px;line-height:1.1}
.wk-range{display:block;font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.daybtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 11px;border:1px solid var(--line);border-radius:10px;background:var(--ground);cursor:pointer}
.daybtn .wd{font-size:12px;color:var(--muted)}
.daybtn .dn{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.daybtn .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.daybtn.today .dn{text-decoration:underline;text-underline-offset:3px}
.daybtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daybtn[aria-pressed="true"] .wd{color:var(--on-accent);opacity:.85}
.daybtn[aria-pressed="true"] .dot{background:var(--on-accent)}

/* ---- sisältö ---- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 40px}
h2{font-family:var(--font-display);font-weight:var(--dw);font-size:25px;line-height:1.2;margin:30px 0 2px}
.panel>h2:first-child{margin-top:2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:38em}
.subh{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.legend{font-size:13px;color:var(--muted);margin:0 0 14px;padding-left:22px;position:relative}
.legend::before{content:"";position:absolute;left:0;top:4px;width:16px;height:10px;border-radius:3px;border:1px solid var(--line);
  background:linear-gradient(90deg,var(--fill) 60%,var(--surface) 0)}
.rows{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt,.chip,.bar{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);text-align:left}
.opt,.chip{cursor:pointer}
.opt,.bar{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:9px 12px;border-radius:10px;font-size:15.5px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:7px 14px;border-radius:999px;font-size:15px}
.opt::before,.chip::before,.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .28s ease}
.opt>span,.chip>span,.chip>i,.bar>span{position:relative}
.opt .t,.bar .t{overflow-wrap:anywhere}
.pct{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.opt[aria-pressed="true"]::before,.chip[aria-pressed="true"]::before{width:0}
.opt[aria-pressed="true"] .pct{color:var(--on-accent);opacity:.8}
.opt[aria-pressed="true"]:focus-visible,.chip[aria-pressed="true"]:focus-visible{outline-color:var(--ink)}
.tiivis{display:flex;flex-wrap:wrap;gap:8px}
.tiivis .opt{width:auto;min-height:40px;padding:7px 14px;border-radius:999px;font-size:15px}
.tiivis .pct{display:none}

.btn{display:inline-block;padding:11px 16px;border:1px solid var(--accent);border-radius:10px;background:none;color:var(--accent);font-weight:600;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
input[type="text"],input[type="number"],textarea,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.orow{display:grid;grid-template-columns:1fr 44px 44px;gap:6px}
.oname{display:flex;gap:10px;align-items:baseline;text-align:left;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15.5px;cursor:pointer;overflow-wrap:anywhere}
.oname .no{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em}
.mv{border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px;cursor:pointer}
.mv:disabled{opacity:.3;cursor:default}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.msg{font-size:14px;margin:10px 0 0}
.msg.warn{color:var(--alert)}
.confirm{background:var(--alert-bg);border-left:3px solid var(--alert);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0 0;font-size:14.5px}
.confirm p{margin:0 0 8px}
details.more{margin-top:14px}
details.more summary{font-size:14px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.pair{padding:10px 0;border-bottom:1px solid var(--line)}
.pair b{font-weight:600}
.pair span{display:block;font-size:13.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);margin:22px 0 0;max-width:40em}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid;flex:none}

nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{background:none;border:0;border-top:2px solid transparent;padding:14px 2px 13px;font-size:14px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}

dialog{border:0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));margin:auto auto 0;width:100%;max-width:560px;max-height:88%;
  border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);font-family:var(--font-body)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px}
dialog input{background:var(--ground)}
@media (prefers-reduced-motion: reduce){.opt::before,.chip::before,.bar::before{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar-top"><span class="brand">Päiväkartta</span><button id="status" class="link" hidden></button></div>
    <div id="cal">
      <div class="weekrow">
        <button class="navbtn" type="button" data-nav="-1" aria-label="Edellinen viikko">‹</button>
        <div class="wk"><span class="wk-name" id="wk"></span><span class="wk-range" id="range"></span></div>
        <button class="link" type="button" id="today" hidden>Tänään</button>
        <button class="navbtn" type="button" data-nav="1" aria-label="Seuraava viikko">›</button>
      </div>
      <div class="days" id="days"></div>
    </div>
  </header>
  <main id="main">
    <div class="panel" id="p-day" role="tabpanel"></div>
    <div class="panel" id="p-links" role="tabpanel" hidden></div>
    <div class="panel" id="p-set" role="tabpanel" hidden></div>
  </main>
  <nav role="tablist" aria-label="Näkymät" id="nav">
    <button class="tab" type="button" role="tab" data-tab="day">Päivä</button>
    <button class="tab" type="button" role="tab" data-tab="links">Yhteydet</button>
    <button class="tab" type="button" role="tab" data-tab="set">Asetukset</button>
  </nav>
</div>
<dialog id="sheet" aria-labelledby="sheet-h">
  <h2 id="sheet-h">Muokkaa vaihtoehtoa</h2>
  <label class="fl" for="ed-name">Nimi</label><input type="text" id="ed-name" autocomplete="off">
  <div id="ed-posbox"><label class="fl" for="ed-pos">Paikka listassa</label><input type="number" id="ed-pos" min="1" inputmode="numeric"></div>
  <p class="sub" id="ed-info" style="margin:12px 0 0"></p>
  <div class="btnrow">
    <button type="button" class="btn solid" id="ed-ok">Valmis</button>
    <button type="button" class="btn" id="ed-hide"></button>
    <button type="button" class="btn danger" id="ed-del">Poista kokonaan</button>
  </div>
</dialog>

<script>
/* ===================== MALLI =====================
   Ei valmista sisältöä: kaikki opitaan omista kirjauksista.
   Jokaiselle vaihtoehdolle lasketaan todennäköisyys tälle päivälle:
   perustaso (kuinka usein valittu niinä päivinä, kun se oli listalla)
   + tämän päivän jo valittujen vaihtoehtojen yhteisesiintymät aiempina päivinä.
   Tarkasteltava päivä jätetään itse laskennasta pois. */
var MIN_DAYS=3;
function computeStats(D,ex){
  var ix={},n=D.opts.length,i;for(i=0;i<n;i++)ix[D.opts[i].id]=i;
  var st={ix:ix,n:n,days:0,N:new Uint16Array(n),S:new Uint16Array(n),both:new Uint16Array(n*n),selb:new Uint16Array(n*n),co:new Uint16Array(n*n)};
  Object.keys(D.days).forEach(function(d){if(d===ex)return;var r=D.days[d];if(!r||!r.s||!r.s.length)return;
    var s=[],v=[],seen={},a,b;
    r.s.forEach(function(id){var k=ix[id];if(k!==undefined&&!seen[k]){seen[k]=1;s.push(k);v.push(k);}});
    if(!s.length)return;
    (r.v||[]).forEach(function(id){var k=ix[id];if(k!==undefined&&!seen[k]){seen[k]=1;v.push(k);}});
    st.days++;
    for(a=0;a<v.length;a++){st.N[v[a]]++;for(b=0;b<v.length;b++)st.both[v[a]*n+v[b]]++;}
    for(a=0;a<s.length;a++){st.S[s[a]]++;for(b=0;b<v.length;b++)st.selb[s[a]*n+v[b]]++;for(b=0;b<s.length;b++)st.co[s[a]*n+s[b]]++;}
  });
  return st;
}
/* P(j valitaan tänään | tänään jo valitut sel) tai null, jos tietoa on liian vähän */
function predict(st,sel,j){
  if(st.days<MIN_DAYS||st.N[j]<MIN_DAYS)return null;
  var n=st.n,base=(st.S[j]+0.5)/(st.N[j]+1),lo=Math.log(base/(1-base)),sum=0,k=0;
  sel.forEach(function(i){if(i===j)return;var Nb=st.both[i*n+j];if(Nb<MIN_DAYS)return;
    var nj=st.selb[j*n+i],ni=st.selb[i*n+j],c=st.co[i*n+j];
    var lr=Math.log(((c+1)/(nj+2))/((ni-c+1)/(Nb-nj+2)));
    sum+=Math.max(-1.8,Math.min(1.8,lr));k++;});
  if(k)lo+=sum*Math.pow(k,-0.35);
  return 1/(1+Math.exp(-lo));
}
/* Kahden vaihtoehdon yhteys niiltä päiviltä, jolloin molemmat olivat listalla */
function assoc(st,i,j){
  var n=st.n,Nb=st.both[i*n+j],ni=st.selb[i*n+j],nj=st.selb[j*n+i],c=st.co[i*n+j];
  var den=Math.sqrt(ni*nj*(Nb-ni)*(Nb-nj));
  return {Nb:Nb,ni:ni,nj:nj,c:c,pji:ni?c/ni:null,pjn:(Nb-ni)?(nj-c)/(Nb-ni):null,phi:den?(c*Nb-ni*nj)/den:0};
}
function normalize(o){ // tuodun tiedoston tarkistus
  if(!o||typeof o!=='object'||o.app!=='paivakartta'||!Array.isArray(o.options)||!o.days||typeof o.days!=='object')return null;
  var out={seq:0,opts:[],days:{},cfg:null},ids={};
  o.options.forEach(function(x){if(!x||typeof x.id!=='string'||typeof x.name!=='string'||ids[x.id])return;ids[x.id]=1;
    out.opts.push({id:x.id,n:x.name.slice(0,200),h:!!x.hidden});var m=/^o(\d+)$/.exec(x.id);if(m)out.seq=Math.max(out.seq,+m[1]);});
  Object.keys(o.days).forEach(function(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;var r=o.days[d];if(!r||!Array.isArray(r.s))return;
    var s=r.s.filter(function(id){return ids[id];});if(!s.length)return;
    out.days[d]={s:s,v:(Array.isArray(r.v)?r.v:[]).filter(function(id){return ids[id];})};});
  if(o.cfg&&typeof o.cfg==='object')out.cfg=o.cfg;
  return out;
}

/* ===================== KÄYTTÖLIITTYMÄ ===================== */
if(typeof document!=='undefined')(function(){
'use strict';
var KEY='paivakartta:v1';
var WD=['sunnuntai','maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai'],WDS=['su','ma','ti','ke','to','pe','la'];
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function monday(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function isoWeek(s){var d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);}

function renderDay(){var p=panels.day,vis=visible(),dt=parse(cur);p.textContent='';dayBtn={};

  vis.forEach(function(o){var b=el('button','opt');b.type='button';b.dataset.id=o.id;b.appendChild(el('span','t',o.n));b.appendChild(el('span','pct'));dayBtn[o.id]=b;list.appendChild(b);});

function toggle(id){var rec=data.days[cur],s=rec?rec.s.slice():[],k=s.indexOf(id);
  if(k>=0)s.splice(k,1);else s.push(id);
  if(s.length){var v=visible().map(function(o){return o.id;});s.forEach(function(x){if(v.indexOf(x)<0)v.push(x);});data.days[cur]={s:s,v:v};}
  else delete data.days[cur];
  data.meta.dirty=(data.meta.dirty||0)+1;save();renderStatus();renderCal();updateDay();
}
function updateDay(){var st=stats(cur),rec=data.days[cur],s=rec?rec.s:[],selIdx=[];
  s.forEach(function(id){if(st.ix[id]!==undefined)selIdx.push(st.ix[id]);});
  Object.keys(dayBtn).forEach(function(id){var b=dayBtn[id],on=s.indexOf(id)>=0,p=predict(st,selIdx,st.ix[id]);
    b.setAttribute('aria-pressed',on?'true':'false');b.style.setProperty('--f',on||p===null?0:p.toFixed(3));
    b.querySelector('.pct').textContent=p===null?'':pct(p);});
  var c=$('day-count'),l=$('day-legend');
  if(c)c.textContent=s.length?s.length+' valittu':'Ei vielä valintoja tälle päivälle.';
  if(l)l.textContent=st.days<MIN_DAYS?'Ennuste alkaa näkyä, kun muita päiviä on kirjattu '+MIN_DAYS+'. Nyt kirjattuna: '+st.days+'.':
    'Täyttö näyttää, kuinka todennäköinen vaihtoehto on tälle päivälle muiden päiviesi ja tämän päivän valintojen perusteella.';
}

  sel.addEventListener('change',function(){linkSel=sel.value;renderLinks();});p.appendChild(sel);
  var n=st.n,i,j;

    for(i=0;i<vis.length;i++)for(j=i+1;j<vis.length;j++){var a=st.ix[vis[i].id],b=st.ix[vis[j].id],A=assoc(st,a,b);
      if(A.Nb>=5&&A.ni>=3&&A.nj>=3&&A.Nb-A.ni>=2&&A.Nb-A.nj>=2)pairs.push({a:vis[i],b:vis[j],A:A});}
    var pos=pairs.filter(function(x){return x.A.phi>=0.25;}).sort(function(x,y){return y.A.phi-x.A.phi;}).slice(0,10);
    var neg=pairs.filter(function(x){return x.A.phi<=-0.25;}).sort(function(x,y){return x.A.phi-y.A.phi;}).slice(0,6);
    if(!pos.length&&!neg.length){p.appendChild(el('p','sub','Selviä yhteyksiä ei vielä erotu. Ne vaativat, että sama vaihtoehto on valittu vähintään kolmena päivänä.'));return;}
    function block(title,list){if(!list.length)return;p.appendChild(el('h3','subh',title));
      list.forEach(function(x){var d=el('div','pair');var t=el('b','',x.a.n+' ja '+x.b.n);d.appendChild(t);

    block('Usein samana päivänä',pos);block('Harvoin samana päivänä',neg);return;}

  var up=rows.filter(function(r){return r.d>=0.15;}).sort(function(a,b){return b.d-a.d;}),
      dn=rows.filter(function(r){return r.d<=-0.15;}).sort(function(a,b){return a.d-b.d;});

  p.appendChild(el('p','legend','Ensimmäinen luku: kuinka usein valittu samana päivänä kuin ”'+X.n+'”. Toinen: kuinka usein muina päivinä.'));

function setMsg(id,txt,warn){var m=$(id);if(!m)return;m.textContent=txt||'';m.className='msg'+(warn?' warn':'');}
function renderOptList(){var ol=$('optlist'),vis=visible();ol.textContent='';
  vis.forEach(function(o,k){var r=el('div','orow');var nb=el('button','oname');nb.type='button';nb.dataset.edit=o.id;nb.setAttribute('aria-label','Muokkaa: '+o.n);
    nb.appendChild(el('span','no',(k+1)+'.'));nb.appendChild(el('span','',o.n));r.appendChild(nb);
    var u=el('button','mv','↑');u.type='button';u.dataset.up=o.id;u.setAttribute('aria-label','Siirrä ylemmäs: '+o.n);u.disabled=k===0;
    var d=el('button','mv','↓');d.type='button';d.dataset.down=o.id;d.setAttribute('aria-label','Siirrä alemmas: '+o.n);d.disabled=k===vis.length-1;
    r.appendChild(u);r.appendChild(d);ol.appendChild(r);});
  if(!vis.length)ol.appendChild(el('p','sub','Ei vielä vaihtoehtoja. Kirjoita ensimmäinen yllä olevaan kenttään.'));
  var hb=$('hiddenbox'),hid=data.opts.filter(function(o){return o.h;}),was=hb.open;hb.textContent='';hb.hidden=!hid.length;
  if(hid.length){hb.appendChild(el('summary','','Piilotetut ('+hid.length+')'));var g=el('div','rows');g.style.marginTop='10px';
    hid.forEach(function(o){var nb=el('button','oname');nb.type='button';nb.dataset.edit=o.id;nb.appendChild(el('span','',o.n));g.appendChild(nb);});hb.appendChild(g);hb.open=was;}
}
function addOpt(){var inp=$('newopt'),name=inp.value.trim().replace(/\s+/g,' ');if(!name)return;
  if(data.opts.some(function(o){return o.n.toLowerCase()===name.toLowerCase();})){setMsg('addmsg','”'+name+'” on jo listassa.',true);return;}
  data.seq++;data.opts.push({id:'o'+data.seq,n:name.slice(0,200),h:false});inp.value='';touch();renderOptList();
  setMsg('addmsg','Lisätty listan loppuun paikalle '+visible().length+': '+name);inp.focus();}
function move(id,dir){var vis=visible(),k=-1;vis.forEach(function(o,i){if(o.id===id)k=i;});var t=k+dir;if(k<0||t<0||t>=vis.length)return;
  var a=data.opts.indexOf(vis[k]),b=data.opts.indexOf(vis[t]);data.opts[a]=vis[t];data.opts[b]=vis[k];touch();renderOptList();
  var btn=$('optlist').querySelector('[data-'+(dir<0?'up':'down')+'="'+id+'"]');if(btn&&!btn.disabled)btn.focus();}
function moveTo(id,pos){var o=opt(id);if(!o||o.h)return;data.opts.splice(data.opts.indexOf(o),1);var vis=visible();
  pos=Math.max(1,Math.min(vis.length+1,pos));if(pos>vis.length)data.opts.push(o);else data.opts.splice(data.opts.indexOf(vis[pos-1]),0,o);}
function openEdit(id){var o=opt(id);if(!o)return;editId=id;delArmed=false;var vis=visible();
  $('ed-name').value=o.n;$('ed-posbox').hidden=o.h;$('ed-pos').value=o.h?'':vis.indexOf(o)+1;$('ed-pos').max=vis.length;
  var st=stats(null),k=st.ix[id];$('ed-info').textContent='Valittu '+st.S[k]+' päivänä. Piilotettu vaihtoehto poistuu listalta, mutta säilyy aiemmissa päivissä. Poistaminen hävittää sen myös aiemmista päivistä.';
  $('ed-hide').textContent=o.h?'Palauta listalle':'Piilota listalta';$('ed-del').textContent='Poista kokonaan';
  if(sheet.showModal)sheet.showModal();else sheet.setAttribute('open','');}
function closeEdit(){editId=null;if(sheet.close)sheet.close();else sheet.removeAttribute('open');}
$('ed-ok').addEventListener('click',function(){var o=opt(editId);if(o){var name=$('ed-name').value.trim().replace(/\s+/g,' '),changed=false;
    if(name&&name!==o.n){o.n=name.slice(0,200);changed=true;}
    var pos=parseInt($('ed-pos').value,10),vis=visible();if(!o.h&&pos>=1&&pos!==vis.indexOf(o)+1){moveTo(o.id,pos);changed=true;}
    if(changed)touch();}
  closeEdit();renderOptList();});
$('ed-hide').addEventListener('click',function(){var o=opt(editId);if(o){o.h=!o.h;if(!o.h){data.opts.splice(data.opts.indexOf(o),1);data.opts.push(o);}touch();}closeEdit();renderOptList();});
$('ed-del').addEventListener('click',function(){if(!delArmed){delArmed=true;$('ed-del').textContent='Vahvista poisto';return;}
  var id=editId;data.opts=data.opts.filter(function(o){return o.id!==id;});
  Object.keys(data.days).forEach(function(d){var r=data.days[d];r.s=r.s.filter(function(x){return x!==id;});r.v=(r.v||[]).filter(function(x){return x!==id;});if(!r.s.length)delete data.days[d];});
  touch();closeEdit();renderOptList();renderCal();});
sheet.addEventListener('click',function(ev){if(ev.target===sheet)closeEdit();});

/* ---- vienti ja tuonti ---- */
function exportObj(){return {app:'paivakartta',version:1,exportedAt:new Date().toISOString(),
  options:data.opts.map(function(o){return {id:o.id,name:o.n,hidden:!!o.h};}),days:data.days,cfg:data.cfg};}
function renderDataInfo(){var nd=Object.keys(data.days).length,i=$('datainfo');if(!i)return;
  var le=data.meta.lastExport?fi(data.meta.lastExport.slice(0,10),true):'ei vielä kertaakaan';
  i.textContent='Kirjattuja päiviä '+nd+', vaihtoehtoja '+data.opts.length+'. Viimeksi viety: '+le+'.'+(data.meta.dirty>0?' Sen jälkeen on tehty muutoksia.':'');}
function markExported(){data.meta.lastExport=iso(new Date())+'T'+new Date().toTimeString().slice(0,5);data.meta.dirty=0;save();renderStatus();renderDataInfo();}
function showText(txt,target){var out=$(target||'dataout');out.textContent='';var ta=el('textarea');ta.readOnly=true;ta.value=txt;ta.style.marginTop='10px';ta.setAttribute('aria-label','Vietävä sisältö');out.appendChild(ta);
  var b=el('button','btn','Kopioi teksti');b.type='button';b.style.marginTop='8px';out.appendChild(b);
  b.addEventListener('click',function(){function sel(){ta.focus();ta.select();b.textContent='Valittu, kopioi';}
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){b.textContent='Kopioitu';markExported();},sel);else sel();}catch(e){sel();}});}
function exportFile(){var txt=JSON.stringify(exportObj(),null,1),name='paivakartta-'+iso(new Date())+'.json';$('dataout').textContent='';
  if(!data.opts.length){setMsg('datamsg','Ei vielä mitään vietävää.');return;}
  function fallback(){setMsg('datamsg','Tiedoston tallennus ei ole käytettävissä tässä näkymässä. Kopioi alla oleva teksti ja tallenna se tiedostoksi tai muistiinpanoon.');showText(txt);}
  function linkSave(){try{var url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},5000);setMsg('datamsg','Tiedosto '+name+' annettu tallennettavaksi. Jos mitään ei tapahtunut, käytä alla olevaa tekstinä vientiä.');markExported();}catch(e){fallback();}}
  var inViewer=window.claude&&typeof window.claude.use==='function';
  if(!inViewer){ // itsenäinen käyttö omasta osoitteesta: laitteen oma jako- tai latausikkuna
    try{var f=new File([txt],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).then(function(){setMsg('datamsg','Tiedosto '+name+' annettu tallennettavaksi. Valitse sille paikka, esimerkiksi iCloud Drive.');markExported();},
          function(err){if(err&&err.name==='AbortError')setMsg('datamsg','Vienti peruttiin.');else linkSave();});return;}
    }catch(e){}
    linkSave();return;}
  setMsg('datamsg','Valmistellaan tiedostoa…');
  window.claude.use('downloads').then(function(dl){if(!dl){fallback();return;}
    return dl.save({filename:name,data:txt}).then(function(){setMsg('datamsg','Tiedosto '+name+' annettu tallennettavaksi. Valitse sille paikka, esimerkiksi iCloud Drive.');markExported();},
      function(err){var c=err&&err.code;if(c==='declined')setMsg('datamsg','Vienti peruttiin.');else if(c==='rate_limited')setMsg('datamsg','Edellinen tallennuskysely on vielä auki. Yritä hetken päästä uudelleen.',true);else fallback();});
  },fallback);}
function offerImport(txt){var obj=null,out=$('dataout');out.textContent='';pendingImport=null;
  try{obj=normalize(JSON.parse(txt));}catch(e){obj=null;}
  if(!obj){setMsg('datamsg','Sisältö ei ole Päiväkartan tiedosto.',true);return;}
  pendingImport=obj;setMsg('datamsg','');
  var c=el('div','confirm');c.appendChild(el('p','','Tiedostossa on '+Object.keys(obj.days).length+' päivää ja '+obj.opts.length+' vaihtoehtoa. Tämän laitteen nykyiset tiedot ('+Object.keys(data.days).length+' päivää, '+data.opts.length+' vaihtoehtoa) korvataan.'));
  var r=el('div','btnrow');r.style.marginTop='0';var y=el('button','btn solid','Korvaa tiedot');y.type='button';var nn=el('button','btn','Peru');nn.type='button';r.appendChild(y);r.appendChild(nn);c.appendChild(r);out.appendChild(c);
  nn.addEventListener('click',function(){pendingImport=null;out.textContent='';});
  y.addEventListener('click',function(){var o=pendingImport;if(!o)return;data.opts=o.opts;data.days=o.days;data.seq=o.seq;
    if(o.cfg)Object.keys(data.cfg).forEach(function(k){if(typeof o.cfg[k]==='string')data.cfg[k]=o.cfg[k];});
    data.meta={lastExport:data.meta.lastExport,dirty:0};rev++;save();applyCfg();pendingImport=null;out.textContent='';
    renderStatus();renderCal();renderSettings();setMsg('datamsg','Tiedot tuotu.');});
}

renderStatus();renderCal();showTab('day');
})();
if(typeof module!=='undefined')module.exports={computeStats:computeStats,predict:predict,assoc:assoc,normalize:normalize};
</script>
