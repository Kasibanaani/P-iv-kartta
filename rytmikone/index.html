<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rytmikone</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rytmikone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Rytmikone, vaihe 1: ääni -> MIDI-rumpunuotit. Yksi sarake puhelimelle, Appipaja 2.0 -ilme.
   Välilehdet: Nauhoita (#v-rec), Otot (#v-takes), Asetukset (#v-set). Oton editori on koko ruudun peittävä #editor. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#F5F3EE;--cell:#FFFEFA;--label:#252B28;--label2:#5E685F;--sep:#DDE2D9;--accent:#39775A;--solid:#39775A;--on-solid:#FFFFFF;
  --fill:#E7F0E7;--fill2:#EDF1EA;--danger:#D70015;--on-danger:#FFFFFF;--app-shadow:rgba(39,61,34,.055);--shade:rgba(20,30,25,.38);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.brand{font-size:21px;font-weight:800;letter-spacing:-.045em}
.proj{max-width:60%;min-height:40px;padding:0 12px;border:1px solid var(--sep);border-radius:11px;background:var(--cell);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--fill2);border:1px solid var(--sep);border-radius:12px}
.seg button{min-height:38px;padding:4px 6px;border:0;border-radius:9px;background:transparent;font-size:15px;line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--cell);color:var(--accent);font-weight:650;box-shadow:0 1px 4px var(--app-shadow),inset 0 0 0 1px var(--sep)}
.seg.small button{min-height:36px;font-size:14px}
.card{background:var(--cell);border:1px solid var(--sep);border-radius:18px;padding:14px 16px;margin-top:12px;box-shadow:0 6px 22px var(--app-shadow)}
h2{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--label2)}
p{margin:8px 0 0}
.help{font-size:12.5px;color:var(--label2)}
.warn{color:var(--danger)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row,.row+.field,.field+.row,.field+.field{margin-top:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--sep);border-radius:11px;background:var(--fill2);font-size:16px;text-align:center}
.btn.solid{background:var(--solid);border-color:var(--solid);color:var(--on-solid);font-weight:600}
.btn.danger{color:var(--danger);background:var(--cell)}
.btn.wide{width:100%}
.btn.sq{width:44px;padding:0;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border:1px solid var(--sep);border-radius:11px;background:var(--cell);font-size:15px}
.chip[aria-pressed="true"]{background:var(--fill);border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.field{display:flex;align-items:center;gap:8px}
.field>span:first-child{min-width:72px;color:var(--label2);font-size:15px}
input[type=number],input[type=text],select,textarea{min-height:44px;padding:0 10px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);font-size:16px;min-width:0}
input[type=number],input.num{width:84px;flex:none}
select{flex:1;max-width:100%}
textarea{width:100%;min-height:120px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input[type=text]{flex:1}
.sl{display:block;margin-top:12px}
.sl .lab{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sl output{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{display:block;width:100%;height:34px;margin:2px 0 0;accent-color:var(--accent)}
details{margin-top:12px}
summary{min-height:36px;display:flex;align-items:center;color:var(--accent);cursor:pointer}
/* nauhoitus */
.recbox{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.rec{width:128px;height:128px;border-radius:50%;border:0;background:var(--danger);color:var(--on-danger);font-size:19px;font-weight:700;box-shadow:0 8px 26px var(--app-shadow),0 0 0 6px var(--cell),0 0 0 7px var(--sep)}
.rec.on{border-radius:30px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 26px var(--app-shadow),0 0 0 10px var(--cell),0 0 0 11px var(--danger)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.meter{position:relative;width:100%;height:16px;margin-top:18px;border-radius:8px;background:var(--fill2);border:1px solid var(--sep);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .08s linear}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--label)}
.meter.lr{height:12px;margin-top:8px}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:12px;text-align:center}
.center{text-align:center}
body.busy .lock{pointer-events:none;opacity:.4}
/* otot */
.take{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--sep)}
.take:first-of-type{border-top:0}
.take .open{flex:1;min-width:0;min-height:48px;padding:4px 0;border:0;background:none;text-align:left}
.take .open b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .open span{display:block;font-size:12.5px;color:var(--label2)}
.tog{width:44px;height:44px;flex:none;border:1px solid var(--sep);border-radius:11px;background:var(--cell);font-size:18px;color:var(--label2)}
.tog[aria-pressed="true"]{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{padding:8px 4px;border-radius:12px;background:var(--fill2)}
.stat b{display:block;font-size:clamp(16px,5.2vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--label2)}
/* editori */
.editor{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.edtop{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 0;background:var(--bg)}
canvas#wave{display:block;width:100%;height:170px;border-radius:12px;background:var(--fill2);touch-action:pan-y}
/* alhaalta nouseva paneeli */
.shade{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--cell);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 70px var(--app-shadow)}
.plist button{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;padding:0 12px;margin-top:6px;border:1px solid var(--sep);border-radius:11px;background:var(--bg);text-align:left}
.plist button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;max-width:528px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--label);color:var(--bg);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
/* ulkoasu */
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.theme-chip{display:flex;align-items:center;gap:6px;min-width:0;min-height:40px;padding:5px 7px;border:1px solid var(--sep);border-radius:11px;background:var(--cell);font-size:13px}
.theme-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-swatch{width:14px;height:14px;border:1px solid var(--sep);border-radius:5px;flex:none}
.theme-chip[aria-pressed="true"]{background:var(--fill2);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.theme-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.theme-modes .chip{justify-content:center;padding:0 4px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid2 .btn{padding:0 8px;font-size:15px}
#eNoteNum{width:64px}
.list-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--sep)}
.list-row:first-of-type{border-top:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Rytmikone</div>
    <button id="projBtn" class="proj lock" data-act="projects" aria-label="Vaihda projektia"></button>
  </header>
  <nav class="seg lock" id="tabs">
    <button data-tab="rec">Nauhoita</button><button data-tab="takes">Otot</button><button data-tab="set">Asetukset</button>
  </nav>
  <main>
    <section id="v-rec"></section>
    <section id="v-takes" hidden></section>
    <section id="v-set" hidden></section>
  </main>
</div>
<div id="editor" class="editor" hidden></div>
<div id="shade" class="shade" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="songFile" accept="audio/*" hidden>
<input type="file" id="importFile" accept="application/json,.json,text/plain" hidden>
<script id="engine">
// Rytmikoneen moottori: ei DOMia. Tunnistus (voimakkuuden ylitys -> isku), velocity, MIDI-tiedosto, tallennusmuoto.
// Verhokäyrä (env) = jokaisen 128 näytteen lohkon huippu desibeleinä. Ääntä itseään ei tallenneta.
var RK=(function(){
'use strict';
var VER=1,KEY='rytmikone:v1',PPQ=480,BLOCK=128,FLOOR=-96;
var DEF={portti:-36,hiljaisin:-36,kovin:-6,kayra:'tasainen',esto:60,hyst:6,ikkuna:20};
var KAYRAT={hiljaiset:0.6,tasainen:1,kovat:1.7};
var KAYRA_NIMET=[['hiljaiset','Korosta hiljaisia'],['tasainen','Tasainen'],['kovat','Korosta kovia']];
var PITUUDET={'1/32':PPQ/8,'1/16':PPQ/4,'1/8':PPQ/2};
var GM=[[35,'Bassorumpu 2'],[36,'Bassorumpu'],[37,'Sivulyönti'],[38,'Virveli'],[39,'Taputus'],[40,'Virveli 2'],[41,'Matala lattiatomi'],[42,'Suljettu hi-hat'],[43,'Lattiatomi'],[44,'Polkimen hi-hat'],[45,'Matala tomi'],[46,'Avoin hi-hat'],[47,'Matala keskitomi'],[48,'Korkea keskitomi'],[49,'Crash'],[50,'Korkea tomi'],[51,'Ride'],[52,'China'],[53,'Ride-kello'],[54,'Tamburiini'],[55,'Splash'],[56,'Lehmänkello'],[57,'Crash 2'],[59,'Ride 2']];

function clamp(x,a,b){return x<a?a:x>b?b:x;}
function num(x,d){x=typeof x==='string'&&x.trim()===''?NaN:+x;return isFinite(x)?x:d;}
function db(a){return a>0?Math.max(FLOOR,20*Math.log10(a)):FLOOR;}
function noteName(n){return ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][n%12]+(Math.floor(n/12)-2);}
function gmName(n){for(var i=0;i<GM.length;i++)if(GM[i][0]===n)return GM[i][1];return '';}
function noteLabel(n){var g=gmName(n);return n+' · '+noteName(n)+(g?' · '+g:'');}

// ---------- verhokäyrän pakkaus: 0,5 dB tarkkuus, tavu per lohko, base64 ----------
function b64(u){
  if(typeof btoa==='function'){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
  return Buffer.from(u).toString('base64');
}
function unb64(s){
  if(typeof atob==='function'){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  return new Uint8Array(Buffer.from(s,'base64'));
}
function encEnv(arr){var u=new Uint8Array(arr.length);for(var i=0;i<arr.length;i++)u[i]=clamp(Math.round((arr[i]-FLOOR)*2),0,255);return b64(u);}
function decEnv(s){var u;try{u=unb64(s||'');}catch(e){u=new Uint8Array(0);}var a=new Float32Array(u.length);for(var i=0;i<u.length;i++)a[i]=u[i]/2+FLOOR;return a;}

// ---------- tunnistus ----------
function settings(s){
  s=s||{};var o={};
  o.portti=clamp(num(s.portti,DEF.portti),-90,0);
  o.hiljaisin=clamp(num(s.hiljaisin,o.portti),-90,-1);
  o.kovin=clamp(num(s.kovin,DEF.kovin),-89,0);
  if(o.kovin<o.hiljaisin+1)o.kovin=o.hiljaisin+1;
  o.kayra=KAYRAT.hasOwnProperty(s.kayra)?s.kayra:DEF.kayra;
  o.esto=clamp(Math.round(num(s.esto,DEF.esto)),0,1000);
  o.hyst=clamp(num(s.hyst,DEF.hyst),0,40);
  o.ikkuna=clamp(Math.round(num(s.ikkuna,DEF.ikkuna)),1,200);
  return o;
}
// Isku alkaa, kun taso nousee portin yli ja ääni on ehtinyt laskea (portti - hystereesi) edellisen iskun jälkeen.
// Eston aikana noussut ääni kuluttaa virityksen, jottei sama ääni laukaise uudestaan eston päätyttyä.
// Velocityn huippu = suurin taso mittausikkunassa iskun alusta.
function detect(env,hz,s){
  s=settings(s);var hits=[],armed=true,last=-1e12,hold=s.esto/1000*hz,win=Math.max(1,Math.round(s.ikkuna/1000*hz)),re=s.portti-s.hyst;
  for(var i=0;i<env.length;i++){var v=env[i];
    if(armed){
      if(v>=s.portti){armed=false;
        if(i-last>=hold){var p=v,e=Math.min(env.length,i+win);for(var j=i+1;j<e;j++)if(env[j]>p)p=env[j];hits.push({i:i,peak:p});last=i;}
      }
    }else if(v<re)armed=true;
  }
  return hits;
}
function velocity(peak,s){s=settings(s);var x=clamp((peak-s.hiljaisin)/(s.kovin-s.hiljaisin),0,1);return clamp(Math.round(1+126*Math.pow(x,KAYRAT[s.kayra])),1,127);}
// Iskun aika sekunteina nollakohdasta (biisin alku tai esilaskennan loppu), viive vähennettynä.
function takeHits(T,env){
  env=env||decEnv(T.env);var s=settings(T.s);
  return detect(env,T.hz,s).map(function(h){return {i:h.i,peak:h.peak,v:velocity(h.peak,s),t:T.alku+h.i/T.hz-T.viive/1000};});
}
// Hiljaisin ja kovin isku otoksesta: velocity-alue kattaa otosta löytyneet iskut.
function fitRange(hits){
  if(hits.length<2)return null;var lo=Infinity,hi=-Infinity;
  hits.forEach(function(h){if(h.peak<lo)lo=h.peak;if(h.peak>hi)hi=h.peak;});
  if(hi-lo<2)return null;return {hiljaisin:Math.floor(lo*2)/2,kovin:Math.ceil(hi*2)/2};
}
// Taustakohinan taso (95. persentiili) ja sen yläpuolelle asetettava portti.
function noiseGate(env){
  if(!env.length)return null;var a=Array.prototype.slice.call(env).sort(function(x,y){return x-y;});
  var k=a[Math.min(a.length-1,Math.floor(a.length*0.95))];
  return {kohina:Math.round(k*2)/2,portti:clamp(Math.round(k+8),-80,-6)};
}
function median(a){var b=a.slice().sort(function(x,y){return x-y;}),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}
// Viivekalibrointi: jokaiselle naksulle ensimmäinen isku, joka osuu välille -150…+600 ms. Vähintään 4 osumaa.
function calibrate(hitTimes,clickTimes){
  var d=[],used={};
  clickTimes.forEach(function(c){
    for(var k=0;k<hitTimes.length;k++){var x=hitTimes[k]-c;if(!used[k]&&x>-0.15&&x<0.6){used[k]=1;d.push(x);break;}}
  });
  if(d.length<4)return {ok:false,n:d.length};
  var m=median(d);return {ok:true,ms:Math.round(m*1000),n:d.length,hajonta:Math.round(median(d.map(function(x){return Math.abs(x-m);}))*1000)};
}

// ---------- MIDI ----------
function vlq(n){var b=[n&0x7f];n=Math.floor(n/128);while(n>0){b.unshift((n&0x7f)|0x80);n=Math.floor(n/128);}return b;}
function utf8(s){var t=new TextEncoder().encode(String(s));return Array.prototype.slice.call(t,0,120);}
function chunk(id,data){var n=data.length;return [id.charCodeAt(0),id.charCodeAt(1),id.charCodeAt(2),id.charCodeAt(3),(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].concat(data);}
function trackBytes(evs){
  evs.sort(function(a,b){return a.tick-b.tick||a.o-b.o;});var out=[],t=0;
  evs.forEach(function(e){var d=vlq(e.tick-t);for(var i=0;i<d.length;i++)out.push(d[i]);for(i=0;i<e.d.length;i++)out.push(e.d[i]);t=e.tick;});
  out.push(0,0xFF,0x2F,0);return chunk('MTrk',out);
}
function meta(type,bytes){return [0xFF,type].concat(vlq(bytes.length),bytes);}
// Nuotit -> note on/off -tapahtumat. Sama sävel samalla tikillä: kovempi jää. Nuotti päättyy viimeistään saman sävelen seuraavaan iskuun.
function noteEvents(notes,len){
  var by={},evs=[];
  notes.forEach(function(n){(by[n.n]=by[n.n]||[]).push(n);});
  Object.keys(by).forEach(function(k){
    var a=by[k].sort(function(x,y){return x.tick-y.tick||y.v-x.v;}),u=[];
    a.forEach(function(n){if(u.length&&u[u.length-1].tick===n.tick)return;u.push(n);});
    u.forEach(function(n,i){var end=n.tick+len;if(i+1<u.length&&u[i+1].tick<end)end=u[i+1].tick;
      evs.push({tick:n.tick,o:1,d:[0x99,n.n,n.v]});evs.push({tick:end,o:0,d:[0x89,n.n,64]});});
  });
  return evs;
}
// Projektin vietävät nuotit raidoittain. envOf(T) antaa puretun verhokäyrän (käyttöliittymän välimuisti).
function exportNotes(P,envOf){
  var f=P.tempo/60*PPQ,tracks=[],pois=0,n=0;
  P.otot.forEach(function(T){if(!T.mukana)return;var notes=[];
    takeHits(T,envOf?envOf(T):null).forEach(function(h){if(h.t<0){pois++;return;}notes.push({tick:Math.round(h.t*f),n:T.nuotti,v:h.v});});
    n+=notes.length;tracks.push({nimi:T.nimi,notes:notes});});
  return {tracks:tracks,pois:pois,n:n};
}
function midi(P,envOf){
  var x=exportNotes(P,envOf),len=PITUUDET[P.pituus]||PITUUDET['1/16'],us=Math.round(60000000/P.tempo);
  var head=[{tick:0,o:-3,d:meta(0x03,utf8(P.nimi))},{tick:0,o:-2,d:meta(0x51,[(us>>16)&255,(us>>8)&255,us&255])},{tick:0,o:-1,d:meta(0x58,[4,2,24,8])}];
  var out;
  if(P.raidat==='omat'){
    out=chunk('MThd',[0,1,0,x.tracks.length+1,PPQ>>8,PPQ&255]).concat(trackBytes(head));
    x.tracks.forEach(function(t){out=out.concat(trackBytes([{tick:0,o:-3,d:meta(0x03,utf8(t.nimi))}].concat(noteEvents(t.notes,len))));});
  }else{
    var all=[];x.tracks.forEach(function(t){all=all.concat(t.notes);});
    out=chunk('MThd',[0,0,0,1,PPQ>>8,PPQ&255]).concat(trackBytes(head.concat(noteEvents(all,len))));
  }
  return new Uint8Array(out);
}

// ---------- tallennusmuoto ----------
// {app:'rytmikone', ver, savedAt, cur, projektit:[{id,nimi,tempo,pituus,raidat,biisi,esilasku,metronomi,otot:[otto]}],
//  esi:[{id,nimi,s}], viive:null|ms, oletus:säädöt, uusiNuotti}
// otto: {id,nimi,nuotti,mukana,hz,alku,viive,s,env,luotu,ref:'biisi'|'lasku'|'',kanavat}
var seq=0;
function uid(){seq=(seq+1)%1296;return Date.now().toString(36)+seq.toString(36)+Math.random().toString(36).slice(2,6);}

function stopRec(){
  if(!R||R.k!=='rec')return;var job=R;

// Hiljaisuuden kalibrointi: 2 s huoneen ääntä -> portti kohinan yläpuolelle.

// ---------- viivekalibrointi ----------
function startCal(){
  if(R)return;var a;try{a=ctx();}catch(e){toast(e.message);return;}
  var job=R={k:'cal'};CAL=null;setBusy(true);renderSet();
  capture(null).then(function(h){
    if(R!==job){h.stop();return;}job.h=h;var beat=60/90,t0=a.currentTime+0.5,clicks=[];
    for(var k=0;k<12;k++){click(a,t0+k*beat,k===0||k===4);if(k>=4)clicks.push(t0+k*beat);}
    var end=t0+12*beat+0.5;
    job.timer=setInterval(function(){if(R!==job)return;var i=$('calInfo'),t=a.currentTime;
      if(i)i.textContent=t<t0+4*beat?'Esilaskenta…':t<t0+12*beat?'Taputa: '+Math.min(8,Math.floor((t-t0)/beat)-3)+'/8':'Lasketaan…';
      if(t>end){clearInterval(job.timer);h.flush().then(function(){if(R!==job)return;h.stop();R=null;setBusy(false);
        var env=blocksToEnv(h),hz=h.sr/RK.BLOCK,times=RK.detect(env,hz,D.oletus).map(function(x){return h.f0/h.sr+x.i/hz;}),r=RK.calibrate(times,clicks);
        if(r.ok)CAL={ok:true,ms:r.ms,text:'Mitattu viive '+fmtMs(r.ms)+' ('+r.n+'/8 taputusta, hajonta ±'+r.hajonta+' ms)'+(r.hajonta>40?'. Hajonta on suuri: kokeile uudelleen.':'.')};
        else CAL={ok:false,text:'Taputuksia löytyi vain '+r.n+'/8. Tarkista portti (Kalibroi hiljaisuus Nauhoita-välilehdellä) ja taputa selvästi.'};
        renderSet();});}},100);
  },function(e){if(R===job){R=null;setBusy(false);}renderSet();toast(micErr(e));});
}

function edUpdate(){
  var T=takeById(EDIT.id);if(!T)return;var hits=RK.takeHits(T,envOf(T)),pois=0,lo=127,hi=0;
  hits.forEach(function(x){if(x.t<0)pois++;if(x.v<lo)lo=x.v;if(x.v>hi)hi=x.v;});
  var st=$('eStats');if(st)st.innerHTML='<div><b>'+hits.length+'</b><span>iskua</span></div><div><b>'+(hits.length?lo+'–'+hi:'–')+'</b><span>velocity</span></div><div><b>'+pois+'</b><span>ennen alkua</span></div>';
  EDIT.hits=hits;drawWave();
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawWave(){
  var c=$('wave');if(!c||!EDIT)return;var T=takeById(EDIT.id);if(!T)return;
  var env=envOf(T),hz=T.hz,dur=env.length/hz,w=c.clientWidth,hh=c.clientHeight,dpr=window.devicePixelRatio||1;
  if(!w)return;c.width=Math.round(w*dpr);c.height=Math.round(hh*dpr);var g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hh);
  var v0=EDIT.v0,v1=EDIT.v1,span=v1-v0,X=function(t){return (t-v0)/span*w;},Y=function(d){return hh-4-(Math.max(-72,Math.min(0,d))+72)/72*(hh-14);};
  var lab=cssVar('--label2'),acc=cssVar('--accent'),lab1=cssVar('--label');
  g.fillStyle=lab;g.globalAlpha=0.45;
  for(var px=0;px<w;px++){var i0=Math.floor((v0+px/w*span)*hz),i1=Math.max(i0+1,Math.floor((v0+(px+1)/w*span)*hz)),m=-96;
    for(var i=Math.max(0,i0);i<Math.min(env.length,i1);i++)if(env[i]>m)m=env[i];if(m>-72)g.fillRect(px,Y(m),1,hh-4-Y(m));}
  g.globalAlpha=1;var s=T.s;
  var zt=T.viive/1000-T.alku;if(zt>v0&&zt<v1&&(T.ref||T.alku!==0)){g.fillStyle=lab;g.globalAlpha=0.1;g.fillRect(0,0,X(zt),hh);g.globalAlpha=1;g.fillStyle=lab1;g.fillRect(X(zt),0,1.5,hh);g.font='11px '+cssVar('--font');g.fillText('Alku',X(zt)+4,12);}
  g.strokeStyle=lab1;g.setLineDash([5,4]);g.lineWidth=1;g.beginPath();g.moveTo(0,Y(s.portti)+0.5);g.lineTo(w,Y(s.portti)+0.5);g.stroke();g.setLineDash([]);
  (EDIT.hits||[]).forEach(function(x){var t=x.i/hz;if(t<v0||t>v1)return;var xx=X(t),yy=hh-4-(x.v/127)*(hh-18);
    g.fillStyle=x.t<0?lab:acc;g.fillRect(xx-0.75,yy,1.5,hh-4-yy);g.beginPath();g.arc(xx,yy,3,0,Math.PI*2);g.fill();});
  var wt=$('wTime');if(wt)wt.textContent=fmtT(v0)+' – '+fmtT(v1)+' / '+fmtT(dur);
}
function edSetView(v0,span){var T=takeById(EDIT.id),dur=Math.max(0.5,envOf(T).length/T.hz);span=Math.max(0.5,Math.min(dur,span));v0=Math.max(0,Math.min(dur-span,v0));EDIT.v0=v0;EDIT.v1=v0+span;drawWave();}
var drag=null;
document.addEventListener('pointerdown',function(e){if(e.target.id!=='wave'||!EDIT)return;drag={x:e.clientX,v0:EDIT.v0,w:e.target.clientWidth};try{e.target.setPointerCapture(e.pointerId);}catch(_){}});
document.addEventListener('pointermove',function(e){if(!drag||!EDIT)return;var span=EDIT.v1-EDIT.v0;edSetView(drag.v0-(e.clientX-drag.x)/drag.w*span,span);});
document.addEventListener('pointerup',function(){drag=null;});document.addEventListener('pointercancel',function(){drag=null;});
window.addEventListener('resize',function(){if(EDIT)drawWave();});

// ---------- projektit ----------
function sheet(html){$('sheet').innerHTML=html;$('shade').hidden=false;}
function closeSheet(){$('shade').hidden=true;$('sheet').innerHTML='';}
function projectsSheet(){
  var h='<h2>Projektit</h2><div class="plist">';
  D.projektit.forEach(function(p){h+='<button data-act="projPick" data-id="'+esc(p.id)+'" aria-current="'+(p.id===D.cur)+'"><span>'+esc(p.nimi)+'</span><span class="help">'+p.otot.length+' ottoa</span></button>';});
  h+='</div><div class="row" style="margin-top:14px"><button class="btn solid grow" data-act="projNew">＋ Uusi projekti</button><button class="btn" data-act="sheetClose">Sulje</button></div>';sheet(h);
}

// ---------- varmuuskopio ----------
function importData(text){
  var d;try{d=JSON.parse(text);}catch(e){toast('Teksti ei ole kelvollinen varmuuskopio.');return;}
  if(!d||d.app!=='rytmikone'){toast('Tämä ei ole Rytmikoneen varmuuskopio.');return;}
  if(!confirm('Korvataanko nykyiset tiedot varmuuskopiolla? Nykyiset projektit katoavat, ellei niitä ole viety.'))return;
  D=RK.repair(d);ENVC={};SONG=null;TEXTBOX='';saveNow();render();toast('Varmuuskopio tuotu: '+D.projektit.length+' projektia.');
}

// ---------- tapahtumat ----------
document.addEventListener('click',function(e){
  var tb=e.target.closest('#tabs button');if(tb){if(R)return;TAB=tb.dataset.tab;render();return;}
  var th=e.target.closest('[data-ap-theme]'),md=e.target.closest('[data-ap-mode]');
  if(th||md){if(th)appearance.theme=th.dataset.apTheme;if(md)appearance.mode=md.dataset.apMode;applyAppearance();renderSet();return;}
  if(e.target.id==='shade'){closeSheet();return;}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var act=b.dataset.act,p=P(),T=EDIT?takeById(EDIT.id):null;
  switch(act){
  case 'rec':if(R&&R.k==='rec')stopRec();else startRec();break;
  case 'quiet':quietCal();break;
  case 'songPick':$('songFile').value='';$('songFile').click();break;
  case 'songOff':SONG=null;renderRec();break;
  case 'tempo':p.tempo=RK.clamp(Math.round(p.tempo)+(+b.dataset.d),20,400);save();renderRec();break;
  case 'pflag':p[b.dataset.k]=!p[b.dataset.k];save();renderRec();break;
  case 'pset':p[b.dataset.k]=b.dataset.v;save();renderTakes();break;
  case 'edit':openEditor(b.dataset.id);break;
  case 'inc':var t=takeById(b.dataset.id);if(t){t.mukana=!t.mukana;save();renderTakes();}break;
  case 'export':case 'exportDl':
    var st=RK.exportNotes(p,envOf);if(!st.n){toast('Ei vietäviä nuotteja: mukana olevista otoista ei löytynyt iskuja alun jälkeen.');break;}
    lastExport=RK.midi(p,envOf);shareOrDownload(new Blob([lastExport],{type:'audio/midi'}),fileName(p.nimi)+'.mid','audio/midi',act==='exportDl');break;
  case 'projects':projectsSheet();break;
  case 'sheetClose':closeSheet();break;
  case 'projPick':D.cur=b.dataset.id;save();closeSheet();render();break;
  case 'projNew':var np=RK.newProject('Projekti '+(D.projektit.length+1));D.projektit.push(np);D.cur=np.id;save();closeSheet();TAB='rec';render();break;
  case 'projDel':
    if(!confirm('Poistetaanko projekti ”'+p.nimi+'” ja sen '+p.otot.length+' ottoa?'))break;
    D.projektit=D.projektit.filter(function(x){return x!==p;});if(!D.projektit.length)D.projektit.push(RK.newProject('Projekti 1'));D.cur=D.projektit[0].id;save(true);render();break;
  case 'cal':startCal();break;
  case 'calStop':cancelJob();break;
  case 'calSave':if(CAL&&CAL.ok){D.viive=CAL.ms;CAL=null;save();renderSet();toast('Viive tallennettu. Se koskee uusia ottoja; vanhoissa siirron voi muuttaa oton näkymässä.');}break;
  case 'calDrop':CAL=null;renderSet();break;
  case 'mic':startMic();break;
  case 'micStop':cancelJob();break;
  case 'presetDel':D.esi=D.esi.filter(function(x){return x.id!==b.dataset.id;});save();renderSet();break;
  case 'backup':var txt=JSON.stringify(D);lastBackup=txt;var dd=new Date(),ds=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    shareOrDownload(new Blob([txt],{type:'application/json'}),'rytmikone-varmuuskopio-'+ds+'.json','application/json',false);break;
  case 'importPick':$('importFile').value='';$('importFile').click();break;
  case 'textOut':TEXTBOX=TEXTBOX==='out'?'':'out';renderSet();break;
  case 'textIn':TEXTBOX=TEXTBOX==='in'?'':'in';renderSet();break;
  case 'copy':var ta=$('txt');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(function(){toast('Kopioitu.');},function(){ta.select();toast('Valitse ja kopioi teksti itse.');});else{ta.select();toast('Valitse ja kopioi teksti itse.');}break;
  case 'textImport':importData($('txt').value);break;
  // editori
  case 'edClose':closeEditor();break;
  case 'zoom':if(T)edSetView((EDIT.v0+EDIT.v1)/2-(EDIT.v1-EDIT.v0)*(+b.dataset.z)/2,(EDIT.v1-EDIT.v0)*(+b.dataset.z));break;
  case 'zoomAll':if(T)edSetView(0,1e9);break;
  case 'edInc':if(T){T.mukana=!T.mukana;b.setAttribute('aria-pressed',T.mukana);save();}break;
  case 'curve':if(T){T.s.kayra=b.dataset.v;D.oletus=copyS(T.s);save();Array.prototype.forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',x===b);});edUpdate();}break;
  case 'fit':if(T){var f=RK.fitRange(RK.takeHits(T,envOf(T)));if(!f){toast('Sovitukseen tarvitaan vähintään kaksi eri voimakkuista iskua.');break;}T.s.hiljaisin=f.hiljaisin;T.s.kovin=f.kovin;edSettingsChanged(T);}break;
  case 'presetSave':if(T){var nm=$('ePresetName').value.trim();if(!nm){toast('Anna esiasetukselle nimi.');break;}var ex=D.esi.filter(function(x){return x.nimi===nm;})[0];
    if(ex)ex.s=copyS(T.s);else D.esi.push({id:RK.uid(),nimi:nm,s:copyS(T.s)});save();renderEditor();toast('Esiasetus ”'+nm+'” tallennettu.');}break;
  case 'edDel':if(T&&confirm('Poistetaanko ”'+T.nimi+'”?')){p.otot=p.otot.filter(function(x){return x!==T;});delete ENVC[T.id];save(true);closeEditor();}break;
  }
});
function edSettingsChanged(T){
  T.s=RK.settings(T.s);D.oletus=copyS(T.s);save();
  SL.concat(SL2).forEach(function(d){var o=$('o-'+d[0]),r=document.querySelector('[data-s="'+d[0]+'"]');if(o)o.textContent=d[5]==='db'?fmtDb(T.s[d[0]]):fmtMs(T.s[d[0]]);if(r&&+r.value!==T.s[d[0]])r.value=T.s[d[0]];});
  edUpdate();
}
document.addEventListener('input',function(e){
  var t=e.target,p=P(),T=EDIT?takeById(EDIT.id):null;
  if(t.dataset.s&&T){T.s[t.dataset.s]=+t.value;edSettingsChanged(T);return;}
  if(t.dataset.t==='viive'&&T){T.viive=+t.value;$('o-viive').textContent=fmtMs(T.viive);save();edUpdate();return;}
  if(t.id==='eName'&&T){T.nimi=t.value.slice(0,60)||'Otto';save();return;}
  if(t.id==='pName'){p.nimi=t.value.slice(0,60)||'Projekti';$('projBtn').textContent=p.nimi+' ▾';save();return;}
});
document.addEventListener('change',function(e){
  var t=e.target,p=P(),T=EDIT?takeById(EDIT.id):null;
  if(t.id==='tempo'){var v=parseFloat(String(t.value).replace(',','.'));if(isFinite(v))p.tempo=RK.clamp(Math.round(v*10)/10,20,400);save();renderRec();}
  else if(t.id==='newNote'){D.uusiNuotti=+t.value;save();}
  else if(t.id==='newPreset'){var pr=D.esi.filter(function(x){return x.id===t.value;})[0];if(pr){D.oletus=copyS(pr.s);save();toast('Seuraava otto käyttää esiasetusta ”'+pr.nimi+'”.');}renderRec();}
  else if(t.id==='eNote'&&T){T.nuotti=+t.value;$('eNoteNum').value=T.nuotti;save();}
  else if(t.id==='eNoteNum'&&T){var n=Math.round(+t.value);if(isFinite(n)){T.nuotti=RK.clamp(n,0,127);$('eNote').innerHTML=noteOptions(T.nuotti);}t.value=T.nuotti;save();}
  else if(t.id==='ePreset'&&T){var q=D.esi.filter(function(x){return x.id===t.value;})[0];if(q){T.s=copyS(q.s);D.oletus=copyS(q.s);save();renderEditor();toast('Esiasetus ”'+q.nimi+'” käytössä.');}}
  else if(t.id==='viiveIn'){var vv=String(t.value).trim();D.viive=vv===''?null:RK.clamp(Math.round(+vv)||0,-1000,2000);save();renderSet();}
  else if(t.id==='songFile'&&t.files[0]){loadSong(t.files[0]);}
  else if(t.id==='importFile'&&t.files[0]){var fr=new FileReader();fr.onload=function(){importData(String(fr.result));};fr.readAsText(t.files[0]);}
});
function loadSong(f){
  var a;try{a=ctx();}catch(e){toast(e.message);return;}var pid=P().id;toast('Ladataan '+f.name+'…');
  var fr=new FileReader();fr.onerror=function(){toast('Tiedostoa ei voitu lukea.');};
  fr.onload=function(){
    var ok=function(buf){SONG={pid:pid,buf:buf,name:f.name};var pp=D.projektit.filter(function(x){return x.id===pid;})[0];if(pp){pp.biisi=f.name;save();}$('toast').hidden=true;renderRec();},
        bad=function(){toast('Biisiä ei voitu avata. Kokeile mp3-, m4a- tai wav-tiedostoa.');};
    try{var pr=a.decodeAudioData(fr.result,ok,bad);if(pr&&pr.catch)pr.catch(function(){});}catch(e){bad();}
  };fr.readAsArrayBuffer(f);
}
document.addEventListener('visibilitychange',function(){if(document.hidden&&R){if(R.k==='rec')stopRec();else cancelJob();}});

// testikoukku (selaintestit)
window.__rk={D:function(){return D;},P:P,envOf:envOf,job:function(){return R?R.k:null;},edit:function(){return EDIT;},lastExport:function(){return lastExport;},lastBackup:function(){return lastBackup;},
  addTake:function(env,o){o=o||{};var T=RK.newTake({nimi:o.nimi||'Otto '+(P().otot.length+1),nuotti:o.nuotti===undefined?D.uusiNuotti:o.nuotti,hz:o.hz||375,alku:o.alku||0,viive:o.viive||0,s:o.s||D.oletus,env:RK.encEnv(env),ref:o.ref||''});P().otot.push(T);saveNow();render();return T.id;},
  song:function(){return SONG?{name:SONG.name,dur:SONG.buf.duration}:null;}};

applyAppearance();render();
})();
</script>
