<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Animappi">
<title>Animappi</title>
<style>
:root{
  --bg:#F5F3EE;--cell:#FFFEFA;--tint:#F9F7F2;--label:#252B28;--label2:#5E685F;--label3:#5E685F;--sep:#DDE2D9;--sep2:#E9ECE5;
  --accent:#39775A;--accent2:#2F6449;--fill:#E7F0E7;--fill2:#CBDDD0;--on:#FFFFFF;--dot:#D6DBD2;--bar:#FFFEFA;
  --shadow:0 6px 22px rgba(39,61,34,.055);--shadow2:0 12px 40px rgba(39,61,34,.055);--shadow-color:rgba(39,61,34,.055);--dialog-shadow:rgba(39,61,34,.17);
  --rec:#C2453A;--rec2:#A8372D;--warn:#B4561E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --h0:#68716C;--s0:#EEF0EC;--h1:#C2453A;--s1:#FBE4E0;--h4:#39775A;--s4:#E2EFE5;--h6:#386EA2;--s6:#E1EBF6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151B18;--cell:#202922;--tint:#1A251E;--label:#EEF1E9;--label2:#ACB8AE;--label3:#ACB8AE;--sep:#3B473E;--sep2:#2B4032;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#151B18;--dot:#2E3831;--bar:#202922;
  --shadow:0 6px 22px rgba(0,0,0,.13);--shadow2:0 12px 40px rgba(0,0,0,.13);--shadow-color:rgba(0,0,0,.13);--dialog-shadow:rgba(0,0,0,.38);--warn:#F2A06A;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h4:#8FD3AE;--s4:#1F3528;--h6:#8FBCEB;--s6:#1B2C3F;
}}
:root[data-theme="dark"]{
  --bg:#151B18;--cell:#202922;--tint:#1A251E;--label:#EEF1E9;--label2:#ACB8AE;--label3:#ACB8AE;--sep:#3B473E;--sep2:#2B4032;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#151B18;--dot:#2E3831;--bar:#202922;
  --shadow:0 6px 22px rgba(0,0,0,.13);--shadow2:0 12px 40px rgba(0,0,0,.13);--shadow-color:rgba(0,0,0,.13);--dialog-shadow:rgba(0,0,0,.38);--warn:#F2A06A;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h4:#8FD3AE;--s4:#1F3528;--h6:#8FBCEB;--s6:#1B2C3F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}

/* ---------- Yläpalkki ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:var(--cell);border-bottom:1px solid var(--sep);box-shadow:0 3px 18px var(--shadow-color);z-index:30}
.tb{border:0;background:transparent;border-radius:11px;padding:7px 11px;min-height:36px;font-weight:600;color:var(--label);white-space:nowrap}
.tb:hover:not(:disabled){background:var(--sep2)}
#top>.tb{box-shadow:inset 0 0 0 1px var(--sep);color:var(--accent)}
.tb.pri{background:var(--accent);color:var(--on)}
.tb.pri:hover{background:var(--accent2)}
#projbtn{font-size:15px;font-weight:700;max-width:240px;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.025em;color:var(--label)!important}
#projbtn::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--fill);margin-right:10px;vertical-align:1px}
.seg{display:inline-flex;background:var(--sep2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 16px;min-height:32px;font-weight:600;color:var(--label2)}
.seg button.on{background:var(--cell);color:var(--accent);box-shadow:0 2px 6px var(--shadow-color)}
.sp{flex:1}
.kstat{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;color:var(--label2)}
#redobtn{min-width:36px;padding:7px 9px}
#inspbtn{display:none}

/* ---------- Runko ---------- */
#body{position:fixed;left:0;right:0;top:52px;bottom:0;display:flex}
#pal{width:236px;flex:none;border-right:1px solid var(--sep);background:linear-gradient(160deg,var(--tint),var(--bg) 72%);overflow-y:auto;padding:12px 12px 40px}
#insp{width:300px;flex:none;border-left:1px solid var(--sep);background:linear-gradient(160deg,var(--tint),var(--bg) 72%);overflow-y:auto;padding:14px 14px 60px}
#mid{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.pt-h{font-size:11px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--label3);margin:16px 2px 8px}
.pt-h:first-child{margin-top:2px}
.ibs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ib{border:1px solid var(--sep);background:var(--cell);border-radius:11px;padding:8px 11px;min-height:36px;font-weight:600;font-size:13px}
.ib:hover:not(:disabled){border-color:var(--accent)}
.ib.del{color:var(--h1)}.ib.del:hover{border-color:var(--h1)}
.ib.wide{width:100%}
.olist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--sep);background:var(--cell);border-radius:11px;padding:5px 6px 5px 5px;min-height:46px;cursor:pointer;-webkit-user-select:none;user-select:none}
.orow:hover{border-color:var(--accent)}
.orow.on{border-color:var(--accent);background:var(--fill)}
.orow.piilo{opacity:.55}
.orow .th{width:34px;height:34px;flex:none;border-radius:8px;background:var(--tint);display:grid;place-items:center;overflow:hidden;border:1px solid var(--sep2)}
.orow .th img{max-width:100%;max-height:100%}
.orow .on2{flex:1;min-width:0}
.orow b{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow small{display:block;font-size:11.5px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .eye{border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--label2);font-size:15px;flex:none}
.orow .eye:hover{background:var(--sep2)}
.recdot{color:var(--rec);font-weight:800}
.empty{font-size:13px;color:var(--label2);line-height:1.5;margin:10px 2px}

/* ---------- Aikajana ---------- */
#tl{flex:none;border-top:1px solid var(--sep);background:var(--cell);padding:8px 12px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.tlbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
#recbtn{border:0;background:var(--rec);color:#fff;border-radius:22px;padding:8px 18px 8px 14px;min-height:44px;font-weight:700;font-size:15px;white-space:nowrap}
#recbtn:hover{background:var(--rec2)}
#recbtn.on{background:#fff;color:var(--rec);box-shadow:inset 0 0 0 2px var(--rec)}
#recbtn.cd{background:var(--rec2)}
.tlb{border:1px solid var(--sep);background:var(--cell);border-radius:11px;min-width:44px;min-height:44px;font-size:16px;font-weight:700;color:var(--label)}
.tlb:hover:not(:disabled){border-color:var(--accent)}
.tlb.on{background:var(--fill);border-color:var(--accent);color:var(--accent)}
#fcount{font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;white-space:nowrap;margin-left:4px}
#tstat{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tstat.rec{color:var(--rec);font-weight:700}
#haamubtn{font-size:13px;padding:0 10px}
#tlcv{width:100%;height:40px;display:block;margin-top:8px;touch-action:none;cursor:pointer}

/* ---------- Lavan päällä ---------- */
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--cell);border:1px solid var(--sep);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--label2);box-shadow:var(--shadow);pointer-events:none;max-width:min(560px,90%);text-align:center;line-height:1.45;z-index:5}
#hint:empty{display:none}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:6}
#countdown.show{display:flex}
#countdown b{font-size:120px;font-weight:800;color:var(--rec);text-shadow:0 4px 30px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.zoomc{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--cell);border:1px solid var(--sep);border-radius:11px;padding:3px;box-shadow:var(--shadow);z-index:6}
.zoomc button{border:0;background:transparent;border-radius:8px;min-width:36px;height:34px;font-weight:700;color:var(--label2)}
.zoomc button:hover{background:var(--sep2)}
.zoomc span{display:inline-flex;align-items:center;font-size:12px;color:var(--label2);min-width:44px;justify-content:center;font-variant-numeric:tabular-nums}
#drop{position:absolute;inset:10px;border:3px dashed var(--accent);border-radius:20px;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--fill) 70%,transparent);font-weight:700;color:var(--accent);z-index:8;pointer-events:none}
body.dropping #drop{display:flex}

/* ---------- Tarkastelija ---------- */
.ih{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ih .th{width:40px;height:40px;border-radius:10px;background:var(--cell);border:1px solid var(--sep);display:grid;place-items:center;overflow:hidden;flex:none}
.ih .th img{max-width:100%;max-height:100%}
.ih b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih small{display:block;font-size:12px;color:var(--label2);font-weight:500;white-space:normal}
.fs{background:var(--cell);border:1px solid var(--sep2);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.fs>h4{margin:0 0 8px;font-size:11px;letter-spacing:.075em;text-transform:uppercase;color:var(--label3)}
.f{margin-bottom:9px}.f:last-child{margin-bottom:0}
.f>label{display:block;font-size:12px;font-weight:600;color:var(--label2);margin-bottom:4px}
.f input:not([type=checkbox]):not([type=range]),.f select,.f textarea,.tin{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:10px;padding:7px 9px;min-height:36px;outline:none;color:var(--label)}
.f input:focus,.f select:focus,.f textarea:focus,.tin:focus{border-color:var(--accent);background:var(--cell)}
.f input[type=range]{width:100%;accent-color:var(--accent)}
.row2{display:flex;gap:6px;align-items:center}.row2>*{flex:1;min-width:0}.row2>.nf{flex:none}
.row4{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.row4 label{font-size:11.5px;font-weight:600;color:var(--label2)}
.row4 input{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:10px;padding:7px 9px;min-height:36px;outline:none;color:var(--label);font-variant-numeric:tabular-nums}
.row4 input:focus{border-color:var(--accent);background:var(--cell)}
.help{font-size:12px;color:var(--label2);line-height:1.45;margin-top:5px}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:550;margin:4px 0;cursor:pointer;min-height:32px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.segs{display:flex;flex-wrap:wrap;gap:4px}
.segs button{border:1px solid var(--sep);background:var(--cell);border-radius:9px;padding:6px 10px;min-height:34px;font-weight:600;font-size:12.5px}
.segs button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.guide{font-size:13px;line-height:1.55;color:var(--label2);margin:0;padding-left:18px}
.guide li{margin-bottom:5px}
.tasv{float:right;font-variant-numeric:tabular-nums;color:var(--label);font-weight:700}

/* ---------- Valikot, arkit, ilmoitukset ---------- */
#sheetbg{position:fixed;inset:0;background:var(--dialog-shadow);z-index:70;display:none;align-items:center;justify-content:center}
#sheetbg.show{display:flex}
#sheet{width:min(560px,92vw);max-height:86vh;overflow-y:auto;background:var(--bg);border:1px solid var(--sep);border-radius:24px;box-shadow:0 20px 70px var(--dialog-shadow);padding:22px 24px 24px}
#sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.035em;display:flex;align-items:center;gap:8px}
#sheet h2 button{margin-left:auto}
#sheet textarea{width:100%;min-height:120px;border:1px solid var(--sep);background:var(--tint);border-radius:10px;padding:8px 10px;font:12.5px ui-monospace,Menlo,monospace;color:var(--label)}
.plrow{display:flex;align-items:center;gap:8px;background:var(--cell);border:1px solid var(--sep2);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:6px;cursor:pointer;min-height:48px}
.plrow.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.plrow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow small{color:var(--label2)}
.vrow{display:flex;align-items:center;gap:10px;background:var(--cell);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-top:8px}
.vrow span{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);background:var(--label);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow2);opacity:0;pointer-events:none;transition:all .25s;z-index:95;max-width:min(520px,90vw);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#welcome{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.6px);background-size:22px 22px}
#welcome.show{display:flex}
#welcome .wc{width:min(440px,90vw);background:var(--cell);border:1px solid var(--sep);border-radius:24px;box-shadow:var(--shadow2);padding:28px;text-align:center}
#welcome h1{margin:0 0 6px;font-size:26px;letter-spacing:-.045em}
#welcome p{color:var(--label2);margin:0 0 18px;line-height:1.5}
#welcome input{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:11px;padding:11px 12px;margin-bottom:10px;outline:none;font-size:16px}
#welcome input:focus{border-color:var(--accent)}
#welcome .tb{width:100%;padding:11px;font-size:15px;margin-bottom:6px;min-height:44px}
.logo{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:var(--fill);display:grid;place-items:center}
.ap-intro{font-size:13px;color:var(--label2);line-height:1.5;margin:0 0 14px}
.ap-label{font-size:12px;color:var(--label2);font-weight:700;margin:0 0 8px}
.ap-modes{display:flex;margin-bottom:18px}.ap-modes button{flex:1;padding:8px 6px}
.ap-modes button[aria-pressed=true]{background:var(--cell);color:var(--accent);box-shadow:0 2px 6px var(--shadow-color)}
.ap-themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ap-theme{position:relative;text-align:left;padding:14px;border:1px solid var(--sep);border-radius:16px;background:var(--bg);color:var(--label);cursor:pointer;min-width:0}
.ap-theme:hover{border-color:var(--accent)}.ap-theme[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--fill)}
.ap-theme strong{display:block;font-size:14px;margin-top:10px}.ap-theme small{display:block;font-size:12px;color:var(--label2);margin-top:3px;line-height:1.4}
.ap-theme[aria-pressed=true]::after{content:'✓';position:absolute;right:12px;top:10px;color:var(--accent);font-weight:700}
.ap-swatches{display:flex;gap:5px}.ap-swatches i{width:24px;height:24px;border-radius:8px;border:1px solid rgba(128,128,128,.18)}
.ap-note{font-size:12px;color:var(--label2);margin:14px 0 0;line-height:1.5}

/* ---------- Kapea näyttö (iPad pystyssä, puhelin) ---------- */
@media (max-width:1100px){#pal{width:204px}#insp{width:284px}.hlbl{display:none}}
@media (max-width:920px){
  #inspbtn{display:inline-flex}
  #insp{position:fixed;right:0;top:52px;bottom:0;width:min(320px,92vw);z-index:45;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 40px var(--dialog-shadow)}
  body.inspopen #insp{transform:none}
  #pal{width:184px}
  .lbl{display:none}
  #top{gap:6px}
}
@media (max-width:640px){
  #pal{position:fixed;left:0;top:52px;bottom:0;width:min(86vw,300px);z-index:45;transform:translateX(-105%);transition:transform .2s}
  body.palopen #pal{transform:none}
  #palbtn{display:inline-flex!important}
  .kstat{display:none}
}
#palbtn{display:none}
@media(prefers-reduced-motion:reduce){#toast,#insp,#pal{transition:none}}
</style>
</head>
<body>
<div id="top">
  <button class="tb" id="palbtn" title="Osat">☰</button>
  <button class="tb" id="projbtn" title="Animaatiot">Animappi</button>
  <div class="seg" id="tila" role="group" aria-label="Tila"><button data-t="rakenna" title="Aseta osat, kääntöpisteet ja kiinnitykset">Rakenna</button><button data-t="animoi" title="Liikuta osia kuin nukkea ja nauhoita">Animoi</button></div>
  <div class="sp"></div>
  <span class="kstat" id="kstat"></span>
  <button class="tb" id="viebtn" title="Vie animaatio tiedostoksi">⇪<span class="lbl"> Vie</span></button>
  <button class="tb" id="undobtn" title="Kumoa (⌘Z)">↶<span class="lbl"> Kumoa</span></button>
  <button class="tb" id="redobtn" title="Tee uudelleen (⇧⌘Z)">↷</button>
  <button class="tb" id="inspbtn" title="Osan tai animaation tiedot">ⓘ</button>
  <button class="tb" id="setbtn" title="Asetukset">⚙︎<span class="lbl"> Asetukset</span></button>
</div>
<div id="body">
  <aside id="pal"></aside>
  <section id="mid">
    <div id="stage"><canvas id="cv"></canvas><div id="hint"></div><div id="countdown"><b></b></div>
      <div class="zoomc"><button data-z="-" title="Loitonna">−</button><span id="zlbl">100 %</span><button data-z="+" title="Lähennä">+</button><button data-z="fit" title="Sovita lava näkyviin">⤢</button></div>
      <div id="drop">Pudota kuvat tähän</div>
    </div>
    <div id="tl">
      <div class="tlbar">
        <button id="recbtn" title="Nauhoita (R)">● Nauhoita</button>
        <button class="tlb" id="playbtn" title="Toista (välilyönti)">▶</button>
        <button class="tlb" id="startbtn" title="Alkuun">⏮</button>
        <button class="tlb" id="prevbtn" title="Edellinen ruutu (←)">‹</button>
        <button class="tlb" id="nextbtn" title="Seuraava ruutu (→)">›</button>
        <span id="fcount"></span>
        <span id="tstat"></span>
        <span class="sp"></span>
        <button class="tlb" id="haamubtn" title="Haamukuva: edellinen ruutu himmeänä">Haamu<span class="hlbl">kuva</span></button>
      </div>
      <canvas id="tlcv"></canvas>
    </div>
  </section>
  <aside id="insp"></aside>
</div>
<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="welcome"><div class="wc">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="8" r="5" fill="var(--accent)"/><path d="M17 13v11M17 16l-8 5M17 16l8-6M17 24l-5 8M17 24l6 7" fill="none" stroke="var(--label2)" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  <h1>Animappi</h1>
  <p>Tuo kuvat, kiinnitä osat toisiinsa ja liikuta niitä kuin nukkea. Liike tallentuu 24 kuvaa sekunnissa.</p>
  <input id="wname" placeholder="Animaation nimi" maxlength="80">
  <button class="tb pri" id="wcreate">Luo animaatio</button>
  <button class="tb" id="wimport">Tuo animaatiotiedosto</button>
</div></div>
<input type="file" id="filein" accept=".json,application/json,text/plain" style="display:none">
<input type="file" id="kuvain" accept="image/svg+xml,image/png,image/jpeg,image/webp,image/gif,.svg,.png,.jpg,.jpeg,.webp,.gif" multiple style="display:none">
<script id="appearance">

<script id="engine">
/* Animappi – moottori (AM). Ei DOMia: tietomalli, korjaus, asennot, hierarkia, nauhoitus, tasoitus ja vientimuodot.
   Muoto on kuvattu tiedostossa animaatio/MUOTO.md. */
var AM=(function(){
'use strict';
var VER=1,FPS=24,MAXS=60,KUVA_MAX=2048,ARKKI_MAX=4096,ARKKI_ALA=16777216,KOKO_MIN=0.01,KOKO_MAX=100;
var LAJIT=['svg','png','jpeg','webp','gif'],TAUSTAT=['valkoinen','shakki','tumma'],LIIKKUU=['vapaa','nivel'];

/* ---------- Apurit ---------- */
function uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function luku(v,d){var n=typeof v==='string'?parseFloat(v.replace(',','.').replace(/\s/g,'')):(typeof v==='number'?v:NaN);return isFinite(n)?n:d;}
function rajaa(x,a,b){return Math.max(a,Math.min(b,x));}
function pyor(x,d){var m=Math.pow(10,d==null?2:d);return Math.round(x*m)/m;}
function kulmaEro(a,b){var d=((a-b)%360+540)%360-180;return d===-180?180:d;}
function T(x,y,k,s){return [pyor(x,2),pyor(y,2),pyor(k,2),pyor(s,4)];}
function okT(t){return Array.isArray(t)&&t.length===4&&t.every(function(v){return typeof v==='number'&&isFinite(v);})&&t[3]>0;}

/* ---------- Projekti ja osat ---------- */
function uusiProjekti(nimi){return {id:uid('a'),nimi:String(nimi||'').trim()||'Uusi animaatio',lava:{w:512,h:512,tausta:'valkoinen'},ruutuja:0,silmukka:true,kuvat:{},osat:[],liike:{}};}
function lisaaKuva(P,meta,id){id=id||uid('k');P.kuvat[id]={laji:LAJIT.indexOf(meta.laji)>=0?meta.laji:'png',w:Math.max(1,Math.round(luku(meta.w,100))),h:Math.max(1,Math.round(luku(meta.h,100))),nimi:String(meta.nimi||'')};return id;}
function osa(P,id){if(!P||!id)return null;for(var i=0;i<P.osat.length;i++)if(P.osat[i].id===id)return P.osat[i];return null;}
function uusiOsa(P,kuvaId,nimi){var k=P.kuvat[kuvaId]||{w:100,h:100},lw=P.lava.w,lh=P.lava.h,s=Math.min(1,0.6*Math.min(lw/k.w,lh/k.h));
  var o={id:uid('o'),nimi:String(nimi||'').trim()||('Osa '+(P.osat.length+1)),kuva:kuvaId,vanhempi:null,kp:[pyor(k.w/2),pyor(k.h/2)],
    perus:{x:pyor(lw/2),y:pyor(lh/2),kulma:0,koko:pyor(s,4)},liikkuu:'vapaa',tas:30,piilo:false};
  P.osat.push(o);return o;}
function lapset(P,id){return P.osat.filter(function(o){return o.vanhempi===id;});}
/* Kaikki osat, joiden esivanhempi id on (ei id itse). */
function jalkelaiset(P,id){var r={},muutos=true;while(muutos){muutos=false;P.osat.forEach(function(o){if(!r[o.id]&&o.vanhempi&&(o.vanhempi===id||r[o.vanhempi])){r[o.id]=1;muutos=true;}});}return r;}
function perusT(o){return [o.perus.x,o.perus.y,o.perus.kulma,o.perus.koko];}
function pituus(P){return Math.max(1,P.ruutuja|0);}
function onLiike(P,id){var a=P.liike[id];return !!(a&&a.some(function(t){return !!t;}));}
function nauhoitettuja(P,id){var a=P.liike[id]||[],n=0,N=pituus(P);for(var i=0;i<Math.min(N,a.length);i++)if(a[i])n++;return n;}

/* ---------- Asennot: nauhoitus, täyttö ja tasoitus ----------
   P.liike[osa] = taulukko ruuduittain: null (ei nauhoitettu) tai [x, y, kulma, koko] vanhemman koordinaatistossa.
   Nauhoittamaton ruutu saa lähimmän aiemman nauhoitetun arvon, sen puuttuessa ensimmäisen myöhemmän, muuten perusasennon. */
function taytetty(P,o){var N=pituus(P),a=P.liike[o.id]||[],out=new Array(N),eka=null,i;
  for(i=0;i<Math.min(N,a.length);i++)if(a[i]){eka=a[i];break;}
  var ed=null,pe=perusT(o);for(i=0;i<N;i++){if(a[i])ed=a[i];out[i]=ed||eka||pe;}return out;}
/* Tasoitus 0–100: Gaussin suodin ruutujen yli (sigma enintään 4 ruutua). Raaka nauhoitus säilyy. */
function tasoita(arr,tas){tas=luku(tas,0);if(!(tas>0)||arr.length<3)return arr;var s=tas/100*4,r=Math.ceil(s*3),w=[],i,j,k,N=arr.length,out=new Array(N);
  for(j=-r;j<=r;j++)w.push(Math.exp(-j*j/(2*s*s)));
  for(i=0;i<N;i++){var acc=[0,0,0,0],ws=0;for(j=-r;j<=r;j++){var ii=i+j;if(ii<0||ii>=N)continue;var ww=w[j+r];ws+=ww;for(k=0;k<4;k++)acc[k]+=arr[ii][k]*ww;}
    out[i]=[acc[0]/ws,acc[1]/ws,acc[2]/ws,acc[3]/ws];}
  return out;}
/* Kaikkien osien asennot jokaisessa ruudussa (täytetty ja tasoitettu). Käyttöliittymä pitää tätä välimuistissa. */
function asennot(P,raaka){var r={};P.osat.forEach(function(o){var a=taytetty(P,o);r[o.id]=!raaka&&onLiike(P,o.id)?tasoita(a,o.tas):a;});return r;}

/* ---------- Hierarkia ja maailman koordinaatit ----------
   Matriisi [a, b, c, d, e, f]: x' = a·x + c·y + e, y' = b·x + d·y + f (kuten canvasin transform).
   Osan matriisi = vanhemman matriisi · T(x, y) · R(kulma) · S(koko) · T(−kääntöpiste). Juuriosan vanhempi on lava.
   Lapsen x, y on siis kääntöpisteen paikka vanhemman kuvan pikseleinä. Kulma asteina myötäpäivään, y alaspäin. */
var I=[1,0,0,1,0,0];
function matriisi(x,y,kulma,koko,kp){var r=kulma*Math.PI/180,c=Math.cos(r)*koko,s=Math.sin(r)*koko;return [c,s,-s,c,x-(c*kp[0]-s*kp[1]),y-(s*kp[0]+c*kp[1])];}
function kerro(A,B){return [A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];}
function kaanteinen(A){var d=A[0]*A[3]-A[1]*A[2];if(!d)return I.slice();return [A[3]/d,-A[1]/d,-A[2]/d,A[0]/d,(A[2]*A[5]-A[3]*A[4])/d,(A[1]*A[4]-A[0]*A[5])/d];}
function piste(A,x,y){return [A[0]*x+A[2]*y+A[4],A[1]*x+A[3]*y+A[5]];}
/* Maailma ruudussa f: {osa: {m, ka (kulma maailmassa), ks (koko maailmassa)}}. yli = {osa: [x,y,kulma,koko]} korvaa asennon (sormen alla). */
function maailma(P,f,A,yli){A=A||asennot(P);var N=pituus(P);f=rajaa(Math.floor(luku(f,0)),0,N-1);var W={},byId={};P.osat.forEach(function(o){byId[o.id]=o;});
  function m(o,d){if(W[o.id])return W[o.id];var arr=A[o.id]||taytetty(P,o),t=(yli&&yli[o.id])||arr[Math.min(f,arr.length-1)]||perusT(o),L=matriisi(t[0],t[1],t[2],t[3],o.kp),p=o.vanhempi&&byId[o.vanhempi],r;
    if(p&&d<64){var q=m(p,d+1);r={m:kerro(q.m,L),ka:q.ka+t[2],ks:q.ks*t[3]};}else r={m:L,ka:t[2],ks:t[3]};W[o.id]=r;return r;}
  P.osat.forEach(function(o){m(o,0);});return W;}
function vanhemmanM(o,W){var p=o.vanhempi&&W[o.vanhempi];return p||{m:I,ka:0,ks:1};}
/* Osan asento maailmassa: kääntöpisteen paikka, kulma ja koko. */
function maailmaksi(P,o,W){var w=W[o.id],p=piste(w.m,o.kp[0],o.kp[1]);return {x:p[0],y:p[1],kulma:w.ka,koko:w.ks};}
/* Maailman asento → osan oma [x, y, kulma, koko] vanhemman koordinaatistossa. */
function paikalliseksi(P,o,W,wp){var q=vanhemmanM(o,W),p=piste(kaanteinen(q.m),wp.x,wp.y);return [p[0],p[1],wp.kulma-q.ka,rajaa(wp.koko/q.ks,KOKO_MIN,KOKO_MAX)];}
/* Kuvan laatikko maailmassa Appi-appin tapaan: vasen yläkulma, leveys, korkeus ja kierto keskipisteen ympäri. */
function laatikko(P,o,W){var k=P.kuvat[o.kuva]||{w:0,h:0},w=W[o.id],c=piste(w.m,k.w/2,k.h/2),ww=k.w*w.ks,hh=k.h*w.ks;return {x:c[0]-ww/2,y:c[1]-hh/2,w:ww,h:hh,kulma:w.ka};}
/* Osuuko lavan piste (x, y) osan kuvaan? Palauttaa kuvan pikselikoordinaatit tai null. */
function osuma(P,o,W,x,y){var k=P.kuvat[o.kuva];if(!k||!W[o.id])return null;var u=piste(kaanteinen(W[o.id].m),x,y);return u[0]>=0&&u[1]>=0&&u[0]<=k.w&&u[1]<=k.h?u:null;}
function kulmat(P,o,W){var k=P.kuvat[o.kuva]||{w:0,h:0},m=W[o.id].m;return [piste(m,0,0),piste(m,k.w,0),piste(m,k.w,k.h),piste(m,0,k.h)];}
/* Kaikkien näkyvien osien yhteinen alue kaikissa ruuduissa (sprite sheetin rajaus). */
function rajat(P,A){A=A||asennot(P);var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,N=pituus(P);
  for(var f=0;f<N;f++){var W=maailma(P,f,A);P.osat.forEach(function(o){if(o.piilo||!P.kuvat[o.kuva])return;kulmat(P,o,W).forEach(function(p){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});});}
  if(!isFinite(x0))return {x:0,y:0,w:P.lava.w,h:P.lava.h};x0=Math.floor(x0)-2;y0=Math.floor(y0)-2;x1=Math.ceil(x1)+2;y1=Math.ceil(y1)+2;return {x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)};}

/* ---------- Nauhoitus ----------
   Näytteet [{t, x, y, kulma, koko}] (t = sekunteja nauhoituksen alusta, kasvava) muunnetaan ruuduiksi: jokainen ruutu f,
   jonka aika f / 24 osuu ensimmäisen ja viimeisen näytteen väliin, saa lineaarisesti välitetyn arvon. Lyhyt kosketus
   (alle yhden ruudun) kirjoittaa lähimmän ruudun. */
function ruuduiksi(nay,fps){fps=fps||FPS;if(!nay||!nay.length)return {alku:0,ruudut:[]};var t0=nay[0].t,t1=nay[nay.length-1].t,f0=Math.ceil(t0*fps-1e-6),f1=Math.floor(t1*fps+1e-6),out=[],j=0,f;
  if(f1<f0){var s=nay[nay.length-1];return {alku:Math.max(0,Math.round(t0*fps)),ruudut:[T(s.x,s.y,s.kulma,s.koko)]};}
  for(f=f0;f<=f1;f++){var t=f/fps;while(j<nay.length-2&&nay[j+1].t<t)j++;var a=nay[j],b=nay[Math.min(j+1,nay.length-1)],u=b.t>a.t?rajaa((t-a.t)/(b.t-a.t),0,1):0;
    out.push(T(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u,a.kulma+(b.kulma-a.kulma)*u,a.koko+(b.koko-a.koko)*u));}
  if(f0<0){out=out.slice(-f0);f0=0;}return {alku:f0,ruudut:out};}
/* Kirjoittaa nauhoitetut ruudut osalle. Muut ruudut ja muut osat säilyvät (moniraita). */
function yhdista(P,id,seg,N){N=N||pituus(P);var a=(P.liike[id]||[]).slice(0,N);while(a.length<N)a.push(null);
  seg.ruudut.forEach(function(t,i){var f=seg.alku+i;if(f>=0&&f<N)a[f]=T(t[0],t[1],t[2],t[3]);});P.liike[id]=a;}
function asetaPituus(P,N){N=rajaa(Math.round(luku(N,0)),0,MAXS*FPS);P.ruutuja=N;Object.keys(P.liike).forEach(function(id){var a=P.liike[id];if(a.length>N)P.liike[id]=a.slice(0,N);});}
function tyhjennaLiike(P,id){delete P.liike[id];}

/* ---------- Muokkaus (Rakenna-tila) ---------- */
/* Siirtää koko liikettä: perusasento ja jokainen nauhoitettu ruutu. d = {x, y, kulma (lisäys), koko (kerroin)}. */

  var vb=String(s.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(parseFloat),w=px(s.getAttribute('width')),h=px(s.getAttribute('height'));
  if(!(w>0)||!(h>0)){if(vb.length===4&&vb[2]>0&&vb[3]>0){if(w>0)h=w*vb[3]/vb[2];else if(h>0)w=h*vb[2]/vb[3];else{w=vb[2];h=vb[3];}}else{w=w>0?w:200;h=h>0?h:200;}}
  w=Math.max(1,Math.round(w));h=Math.max(1,Math.round(h));if(vb.length!==4&&!s.getAttribute('viewBox'))s.setAttribute('viewBox','0 0 '+w+' '+h);
  s.setAttribute('width',w);s.setAttribute('height',h);if(!s.getAttribute('xmlns'))s.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return {laji:'svg',data:new XMLSerializer().serializeToString(s),w:w,h:h};}catch(e){return null;}}

/* ---------- Eleet lavalla ----------
   Osa: yksi sormi, kynä tai hiiri siirtää (Animoi-tilassa nivelestä liikkuva osa kääntyy kääntöpisteensä ympäri).
   Kaksi sormea: kierto ja koko kääntöpisteen ympäri, paikka seuraa sormien keskikohtaa. Toinen sormi tyhjään kohtaan
   tai samaan osaan liittyy eleeseen (esim. kynä osassa ja sormi vieressä). Toinen sormi eri osaan liikuttaa sitä erikseen.
   Kahvat (valittu osa): ympyrä = kierto, neliö = koko, risti = kääntöpiste (vain Rakenna). Tyhjä kohta: lavan siirto ja zoomaus. */
var PT={};

  var o=osumaKohdassa(l[0],l[1],pt.tyyppi);
  if(o){var g=S.eleet[o.id];if(g){if(g.tapa==='osa'&&g.pts.length<2){lisaaPiste(g,pt);return;}delete PT[e.pointerId];return;}
    valitse(o.id);aloitaEle(o.id,(e.altKey&&pt.tyyppi==='mouse')?'kierto':'osa',pt);return;}
  var yksi=null;Object.keys(S.eleet).forEach(function(k){var g2=S.eleet[k];if(g2.tapa==='osa'&&g2.pts.length===1)yksi=g2;});
  if(yksi&&pt.tyyppi!=='mouse'){lisaaPiste(yksi,pt);return;}
  if(!S.nakEle)S.nakEle={pts:[]};S.nakEle.pts.push(pt);pt.nak=true;perustaNak();}

  if(pt.nak){pt.X=q[0];pt.Y=q[1];}else{pt.x=l[0];pt.y=l[1];pt.X=q[0];pt.Y=q[1];}
  if(Math.hypot(q[0]-pt.X0,q[1]-pt.Y0)>3)pt.liik=true;
  if(pt.g){paivitaEle(pt.g);piirra();if(!S.nauh)paivitaTila();}else if(pt.nak)liikutaNak();}
function up(e){var pt=PT[e.pointerId];if(!pt)return;delete PT[e.pointerId];try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(pt.g){var g=pt.g;g.pts=g.pts.filter(function(p){return p!==pt;});if(pt.liik)g.liik=true;if(g.pts.length)perusta(g);else lopetaEle(g);}
  else if(pt.nak&&S.nakEle){S.nakEle.pts=S.nakEle.pts.filter(function(p){return p!==pt;});if(!S.nakEle.pts.length){var tap=!S.nakEle.liik&&!pt.liik;S.nakEle=null;if(tap&&S.sel){S.sel=null;renderAll();}}else perustaNak();}}
function hover(e){if(e.pointerType!=='mouse'||!P)return;var q=ptXY(e),l=lavalle(q[0],q[1]),kh=kahvaKohdassa(q[0],q[1],'mouse');
