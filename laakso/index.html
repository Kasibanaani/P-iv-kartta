function applyTheme(){const t=themes.find(t=>t.id===prefs.theme)||themes[0],dark=prefs.mode==='dark'||prefs.mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches;for(const [k,v]of Object.entries(t[dark?'dark':'light']))document.documentElement.style.setProperty('--'+k,v);document.documentElement.style.setProperty('--solid',dark?t.dark.bg:'#fff');document.documentElement.style.setProperty('--bad',dark?'#ff9999':'#b33030');document.documentElement.style.setProperty('--good',dark?t.dark.accent:'#286046');document.documentElement.style.colorScheme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=t[dark?'dark':'light'].bg}
function firm(){return state.firms.find(f=>f.id===selected)||state.firms[0]}function status(f){return f.closed?'Toiminta päättynyt':f.level?'Tuotannossa · taso '+f.level:'Kokoaa rahoitusta'}function ownedValue(f){return f.owned*E.price(f)}
function summary(){const v=E.value(state),delta=v-E.INITIAL;return `<div class="intro"><div><div class="eyebrow">${state.month>=E.END?'Kolmen vuoden tulos':esc(E.date(state.month))} · ${state.month>=E.END?'Valmis':E.seasons[E.season(state.month)]}</div><h2>${state.month===0?'Näe mahdollisuus ennen muita.':state.month>=E.END?'Mitä laakso opetti?':'Laakso kasvaa. Mihin sinä uskot?'}</h2><p>Seuraa uudisasukkaita, tutki hankkeita ja rahoita omaa näkemystäsi. Yksi kierros on yksi kuukausi.</p></div><span class="badge">PELATTAVA ENSIVERSIO · 1.0</span></div><div class="stats"><div class="stat"><span class="eyebrow">Käytettävissä</span><strong>${gold(state.cash)}</strong><small>Vapaata rahaa sijoituksiin</small></div><div class="stat"><span class="eyebrow">Varallisuus</span><strong>${gold(v)}</strong><small class="${profitClass(delta)}">${sign(delta)} k alusta · omistukset kirjanpitoarvolla</small></div><div class="stat"><span class="eyebrow">Saadut osingot</span><strong>${gold(state.dividends)}</strong><small>Sisältyvät käteiseen ja varallisuuteen</small></div><div class="stat"><span class="eyebrow">Asukkaita laaksossa</span><strong>${state.pop}</strong><small>${state.firms.filter(f=>f.level&&!f.closed).length} yritystä tuotannossa · ${state.firms.filter(f=>!f.level&&!f.closed).length} valmistelussa</small></div></div>${state.month>=E.END?`<div class="end"><span class="eyebrow">Lopputulos · 36 kuukautta</span><strong>${sign(delta)} k · ${pct(delta/E.INITIAL)}</strong><p>Osinkoja ${gold(state.dividends)}, selvityksiin ${gold(state.researchCost)}. Omistusten arvo on arvio; koko summaa ei voi nostaa heti käteisenä.</p><button data-act="new">Aloita uusi laakso</button></div>`:''}`}
function mapSvg(){let trees='',rocks='',fields='';for(let i=0;i<105;i++){const x=(i*137+17)%1000,y=(i*97+29)%580;if((x<285&&y<280)||(x>590&&y<180)||(x>790&&y>420)){const h=13+i%15;trees+=`<path d="M${x} ${y-h}l${-h*.55} ${h}h${h*1.1}z" fill="${i%2?'#617c55':'#738d61'}" opacity=".8"/><path d="M${x} ${y-3}v8" stroke="#6d7654" stroke-width="2"/>`}}for(let i=0;i<20;i++){const x=775+(i*43)%200,y=60+(i*37)%145;rocks+=`<path d="M${x} ${y}l18-25 23 32-27 8z" fill="${i%2?'#a8afa0':'#b7bdae'}"/>`}for(let i=0;i<9;i++)fields+=`<path d="M${210+i*9} 280l58-25M${270+i*9} 245l38-18" stroke="#c9b979" stroke-width="4"/>`;return `<svg viewBox="0 0 1000 580" preserveAspectRatio="none" aria-hidden="true"><rect width="1000" height="580" fill="#dce4cb"/><path d="M0 60Q220 15 350 180T700 290T1000 190V0H0z" fill="#cdd9b9"/><path d="M0 430Q190 335 300 430T650 440T1000 380V580H0z" fill="#d3ddbc"/><path d="M670-20Q500 70 550 160T485 330T540 600" stroke="#bed1c4" stroke-width="58" fill="none"/><path d="M670-20Q500 70 550 160T485 330T540 600" stroke="#8dafb0" stroke-width="30" fill="none"/><path d="M670-20Q500 70 550 160T485 330T540 600" stroke="#a8c6c4" stroke-width="16" fill="none"/><path d="M80 600Q200 420 400 420T590 290L850 180M400 420L330 230 210 110M590 290L690 390" fill="none" stroke="#c3b798" stroke-width="12" stroke-linecap="round"/><path d="M80 600Q200 420 400 420T590 290L850 180M400 420L330 230 210 110M590 290L690 390" fill="none" stroke="#ece2c6" stroke-width="7" stroke-linecap="round"/><path d="M488 352l38 7M486 360l37 7" stroke="#977d57" stroke-width="7"/>${fields}${trees}${rocks}<g fill="#b49a73" stroke="#987f60" stroke-width="2"><path d="M430 400v-25h28v25z"/><path d="M455 418v-22h25v22z"/><path d="M405 416v-24h23v24z"/></g><g fill="#856c51"><path d="m425 376 19-16 19 16z"/><path d="m451 396 17-14 17 14z"/><path d="m401 392 15-13 15 13z"/></g><text x="430" y="451" text-anchor="middle" fill="#4f654d" font-family="system-ui" font-size="13" letter-spacing="2">KYLÄ</text><text x="852" y="540" text-anchor="middle" fill="#607052" font-family="system-ui" font-size="11">Kauppareitti ↗</text></svg>`}
function valley(){return `<div class="layout"><div>${prefs.intro?`<div class="helpstrip"><span>↗</span><div><b>Sinä rahoitat. Uudisasukkaat päättävät.</b>Napauta hanketta kartalla, tutki sen edellytyksiä ja sijoita. Etene sitten kuukausi ja seuraa, mitä tapahtui.</div><button data-act="dismiss" aria-label="Piilota aloitusohje">✕</button></div>`:''}<section class="card"><div class="cardhead"><div><div class="eyebrow">Yhteinen maailma · itsenäiset toimijat</div><h3>Uudisasukkaiden laakso</h3></div><span class="badge">${E.seasons[E.season(Math.min(state.month,35))]}</span></div><div class="map">${mapSvg()}${state.firms.map(f=>{const d=E.def(f);return `<button class="mapnode ${selected===f.id?'active':''} ${f.level?'':'planning'} ${f.closed?'closed':''}" style="left:${d.x}%;top:${d.y}%" data-firm="${d.id}" aria-label="${esc(d.name)}, ${status(f)}" aria-pressed="${selected===f.id}"><span class="icon">${d.icon}</span><span>${d.short}<span class="level">${f.closed?'Päättynyt':f.level?'Taso '+f.level:'Valmistelussa'}</span></span></button>`}).join('')}<span class="mapcaption">RAHOITA · HAVAINNOI · YMMÄRRÄ</span></div><div class="maplegend"><span>Katkoreuna = hakee alkurahoitusta</span><span>Napauta yritystä nähdäksesi lisää</span></div></section><div class="worldstrip"><div><small>Lähimetsää</small><strong>${fmt(state.forest*100)} % jäljellä</strong></div><div><small>Riistakanta</small><strong>${fmt(state.wildlife*100)} % lähtötasosta</strong></div><div><small>Viimeisin sää</small><strong>${esc(state.weather.name)}</strong></div></div><section class="card recent"><div class="cardhead"><div><div class="eyebrow">Maailma jättää jälkiä</div><h3>Laakson tapahtumat</h3></div><button data-act="events" class="quiet">Kaikki →</button></div><div class="pad" style="padding-top:0">${events(4)}</div></section></div><aside class="card detail" id="detail">${detail()}</aside></div>`}
function costEstimate(f){const probe={...f,level:Math.max(1,f.level)},d=E.def(f),n=E.needs(state,probe),input=E.inputCost(state,probe,n),workers=state.firms.reduce((a,c)=>a+(c.closed?0:E.def(c).workers*c.level),0),wage=d.wage*probe.level*Math.max(1,workers/(state.pop*.38)),transport=d.distance*.9*probe.level*(E.season(state.month)===3?1.7:1),upkeep=(f.asset||d.start)*.004;return `<details class="note"><summary>Arvio kuukauden menoista: <b>${gold(input.cost+wage+transport+upkeep)}</b></summary><div class="line"><span>Palkat</span><b>${gold(wage)}</b></div><div class="line"><span>Raaka-aineet</span><b>${gold(input.cost)}</b></div><div class="line"><span>Kuljetus ja huolto</span><b>${gold(transport+upkeep)}</b></div><p class="subtle" style="margin:8px 0 0">${Object.entries(n).filter(([g,q])=>q>0).map(([g,q])=>E.goods[g].name+' '+fmt(q,1)+' yks.').join(' · ')}. Tuontilisä sisältyy arvioon. Hinnat ja työvoiman saatavuus voivat muuttua. Kaluston poisto vähentää tulosta tämän lisäksi.</p></details>`}
function detail(){const f=firm(),d=E.def(f),end=state.month>=E.END,own=E.stake(f),p=E.price(f),q=E.saleQuote(f),need=Math.max(0,d.start+d.reserve-f.cash),latest=f.ledger.at(-1);return `<div class="detailtitle"><div class="detailicon">${d.icon}</div><div><div class="eyebrow">${esc(d.person)} · ${d.style}</div><h2>${esc(d.name)}</h2><small>${status(f)}</small></div></div><p class="subtle">${esc(d.desc)}</p><div class="chips"><span class="chip">Kuljetusmatka ${d.distance}/4</span><span class="chip">${d.flood?'Tulvatasanko':d.type==='farm'?'Tulvilta suojassa':'Yhteinen markkina'}</span><span class="chip">Työvoima ${d.workers*Math.max(1,f.level)}</span></div><div class="metrics"><div class="metric"><small>Yrityksen kassa</small><strong>${gold(f.cash)}</strong></div><div class="metric"><small>Viime kuun tulos</small><strong class="${profitClass(f.profit)}">${sign(f.profit)} k</strong></div><div class="metric"><small>Osuuden kirjanpitoarvo</small><strong>${fmt(p,2)} k</strong></div><div class="metric"><small>Sinun omistuksesi</small><strong>${pct(own)}</strong></div></div>${!f.closed?costEstimate(f):''}${!f.level&&!f.closed?`<div class="note"><b>Alkurahoitus</b><div class="bar"><i style="width:${Math.min(100,f.cash/(d.start+d.reserve)*100)}%"></i></div>${gold(f.cash)} / ${gold(d.start+d.reserve)} · ${gold(need)} puuttuu.<br><small>Kalusto ${gold(d.start)} + käyttöpuskuri ${gold(d.reserve)}. Botti aloittaa seuraavalla kierroksella, kun rahoitus riittää.</small></div>`:''}<div class="note risk"><b>Arvioi tämä riski</b><br>${esc(d.risk)}</div><div class="line"><span>Paikan ja osaamisen tuottavuus</span><b>${f.studied?fmt(f.quality*d.fit*100)+' %':fmt(.8*d.fit*100)+'–'+fmt(1.2*d.fit*100)+' %'}</b></div><small>${f.studied?'Selvityksellä varmistettu. Sää, tuotantotaso ja resurssit vaikuttavat tämän lisäksi.':'Alustava vaihteluväli, ei todennäköisyysennuste. Selvitys paljastaa tarkan perustason.'}</small>${!f.studied?`<button class="research" data-act="study" ${state.cash<35||end||f.closed?'disabled':''}>Tilaa selvitys · 35 k</button>`:''}<div class="sectiongap"><div class="eyebrow">Botin toimintatapa</div><p class="subtle" style="margin:5px 0">${esc(d.plan)}</p><div class="note">${esc(f.note)}</div></div>${latest?`<div class="line"><span>Myynti / kulut viimeksi</span><b>${gold(latest.revenue)} / ${gold(latest.costs)}</b></div><button data-act="ledger" class="quiet wide">Avaa kirjanpito →</button>`:''}<div class="investbox"><h3>${f.closed?'Yritys on lopettanut':'Rahoita tätä yritystä'}</h3><p class="subtle" style="margin:7px 0">Uudet osuudet tuovat rahat yrityksen kassaan. Voit saada osinkoja; omistuksen arvo voi myös laskea.</p><div class="amountrow"><input id="amount" type="number" min="10" max="${Math.floor(state.cash)}" step="10" value="${amount}" inputmode="numeric" aria-label="Sijoitettava summa kultana"><div class="presets"><button data-amount="100">100</button><button data-amount="250">250</button></div></div><div class="subtle" id="ownershippreview">${previewOwnership(f,amount)}</div><button class="primary wide" style="margin-top:12px" data-act="invest" ${end||f.closed||state.cash<10?'disabled':''}>Sijoita yritykseen</button>${f.owned>0?`<div class="note"><b>Sinun osuutesi ${gold(ownedValue(f))}</b><br>Sijoitettu yhteensä ${gold(f.invested)} · maksettu sinulle ${gold(f.paid)}.<br><small>Osuuksien arvo perustuu yrityksen kassaan ja kalustoon.</small></div><button class="wide" data-act="sell" ${q.shares<.0001||end||f.closed?'disabled':''}>Myy takaisin · enintään ${gold(q.shares*q.price)}</button><small>Yritys käyttää takaisinostoon enintään 25 % puskurin ylittävästä kassasta. Hinta on 12 % alle kirjanpitoarvon.</small>`:''}</div>`}
function previewOwnership(f,a){if(!Number.isFinite(a)||a<10||a>state.cash)return 'Valitse summa, johon käteisesi riittää.';const ns=a/Math.max(.05,E.price(f));return `Omistuksesi sijoituksen jälkeen noin <b>${pct((f.owned+ns)/(f.shares+ns))}</b>.`}
function companies(){return `<div class="layout"><div><div class="toolbar"><span class="subtle">Kahdeksan itsenäistä toimijaa. Järjestys pysyy samana.</span></div><div class="list companies">${state.firms.map(f=>{const d=E.def(f);return `<button class="company ${f.id===selected?'active':''}" data-firm="${f.id}"><div class="companytop"><div><h3>${d.icon} ${esc(d.name)}</h3><small>${status(f)}</small></div>${f.owned>0?'<span class="badge">OMISTAT</span>':''}</div><div class="companybottom"><span>Kassa <b>${gold(f.cash)}</b></span><span class="${profitClass(f.profit)}">Tulos ${sign(f.profit)} k</span></div><div class="bar"><i style="width:${f.level?100:Math.min(100,f.cash/(d.start+d.reserve)*100)}%"></i></div><small>${f.level?esc(d.style)+' · '+(f.studied?'Selvitetty tuottavuus':'Tuottavuus epävarma'):gold(Math.max(0,d.start+d.reserve-f.cash))+' alkurahoitusta puuttuu'}</small></button>`}).join('')}</div></div><aside class="card detail" id="detail">${detail()}</aside></div>`}
function chart(){const hs=state.history,min=Math.min(1400,...hs.map(h=>h.value)),max=Math.max(1600,...hs.map(h=>h.value)),range=Math.max(1,max-min),y=v=>125-(v-min)/range*105,x=i=>24+i/Math.max(1,hs.length-1)*550,pts=hs.map((h,i)=>x(i)+','+y(h.value)).join(' ');return `<svg class="chart" viewBox="0 0 600 155" role="img" aria-label="Kokonaisvarallisuus ${gold(E.value(state))}, muutos ${sign(E.value(state)-E.INITIAL)} kultaa. ${state.month} kuukautta."><line x1="24" x2="575" y1="${y(1500)}" y2="${y(1500)}" stroke="var(--sep)" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/><circle cx="${x(hs.length-1)}" cy="${y(hs.at(-1).value)}" r="4" fill="var(--accent)"/><text x="24" y="151" fill="var(--label2)" font-size="11">Alku · 1 500 k</text><text x="575" y="151" text-anchor="end" fill="var(--label2)" font-size="11">Nyt · ${gold(E.value(state))}</text></svg>`}
function portfolio(){const holdings=state.firms.filter(f=>f.invested>0),active=holdings.filter(f=>f.owned>0&&!f.closed),total=active.reduce((a,f)=>a+ownedValue(f),0),largest=active.length?Math.max(...active.map(ownedValue))/Math.max(1,E.value(state)):0;return `<div class="cols"><section class="card pad"><div class="eyebrow">Käteinen + omistukset</div><h2>Oma sijoitussalkkusi</h2>${chart()}<div class="line"><span>Käteinen</span><b>${gold(state.cash)}</b></div><div class="line"><span>Omistusten kirjanpitoarvo</span><b>${gold(total)}</b></div><div class="line"><span>Selvityksiin käytetty</span><b>${gold(state.researchCost)}</b></div><div class="note risk">${largest>.4?'Yli 40 % varallisuudestasi on yhdessä yrityksessä. ':''}Sama sää voi osua moneen sijoitukseen. Kaksi maatilaa ei hajauta kuivuusriskiä. Puuverstas ja sepänpaja kilpailevat samoista asiakkaista.</div><p class="subtle">Osingot sisältyvät käteiseen. Omistusten arvostus on yrityksen kassa + kaluston poistettu arvo jaettuna osuuksille. Tulevia voittoja ei ennusteta arvostukseen. Sato ja lauman kasvu näkyvät arvossa vasta myynnin kautta.</p></section><section class="card pad"><div class="eyebrow">${active.length} nykyistä omistusta</div><h2>Yrityksesi</h2>${holdings.length?holdings.map(f=>`<div class="portfolioitem"><div class="companytop"><div><h3>${E.def(f).icon} ${esc(E.def(f).name)}</h3><small>${f.closed?'Toiminta päättynyt':pct(E.stake(f))+' yrityksestä'}</small></div><b>${gold(ownedValue(f))}</b></div><div class="line"><span>Sijoitettu / maksettu takaisin</span><span>${gold(f.invested)} / ${gold(f.paid)}</span></div><button data-open-firm="${f.id}">Tutki yritystä →</button></div>`).join(''):'<div class="empty">Et ole vielä sijoittanut.<br>Tutki hankkeita kartalla ja valitse ensimmäinen sijoituksesi.<br><button data-act="showvalley">Avaa laakso →</button></div>'}</section></div>`}
function events(limit=160){return state.events.slice(0,limit).map(e=>`<div class="event"><div class="eventtime">${E.date(Math.min(e.month,35)).split(' · ')[0].slice(0,3)}<br>v. ${Math.floor(Math.min(e.month,35)/12)+1}</div><div><b>${esc(e.title)}</b><p class="muted">${esc(e.text)}</p></div></div>`).join('')}
function market(){return `<div class="marketgrid">${Object.entries(E.goods).map(([g,d])=>`<section class="card marketcard"><span class="eyebrow">${d.icon} ${d.name}</span><strong>${fmt(state.prices[g],2)} k</strong><small class="${profitClass(state.prices[g]-state.prevPrices[g])}">${sign(state.prices[g]-state.prevPrices[g],2)} k edelliseen</small><div class="bar"><i style="width:${Math.min(100,state.stock[g]/d.target*50)}%"></i></div><small>Varasto ${fmt(state.stock[g])} yks. · tavoite ${d.target}</small><div class="subtle" style="margin-top:8px">Tuotanto ${fmt(state.lastSupply[g],1)}<br>Kylän kulutus ${fmt(state.lastDemand[g],1)}</div></section>`).join('')}</div><div class="cols"><div><section class="card pad"><div class="eyebrow">Tiedossa ennen päätöstä</div><h2>Vuodenaika ja riippuvuudet</h2><div class="note risk"><b>${E.seasons[E.season(Math.min(state.month,35))]}</b><br>${E.forecast(Math.min(state.month,35))}. Muut säätilat jakavat jäljelle jäävän todennäköisyyden. Karjatilan eläintautiriski on joka kuukausi 4,5 %.</div><div class="line"><span>Viljely</span><span>Siemenet + työkalut → ruoka elokuussa</span></div><div class="line"><span>Karjatila</span><span>Ruoka/rehu → eläintuotteet</span></div><div class="line"><span>Puuverstas</span><span>Puu → työvälineet</span></div><div class="line"><span>Kaivos ja seppä</span><span>Malmi + puu → työkalut</span></div><p class="subtle" style="margin-top:14px">Tuotanto lisää markkinavarastoja, kylä ja yritykset kuluttavat niitä. Niukkuus nostaa seuraavan kuukauden hintaa; ylitarjonta laskee sitä. Suuri ylitarjonta myydään ulkopuolelle alennuksella. Raaka-aineiden loppuessa tuonti maksaa 40 % enemmän, talvella 80 %. Talvi kasvattaa lämmityksen ja rehun tarvetta.</p></section><section class="card pad sectiongap"><h3>Ensiversion rajaus</h3><p class="subtle" style="margin-top:10px">Yksi kuukausi on yksi päätös. Kahdeksan toimijaa kehittää valmiiksi valittuja maa-alueita; maa-alueiden vapaa valinta ja teiden rakentaminen tulevat myöhemmin. Kuljetuksia kuvataan etäisyyskustannuksella. Kauppakaravaanit ja kotitaloudet muodostavat ulkoisen markkinan, joten tämä ei ole täysin suljettu rahatalous. Puuvälineet ja metallityökalut ovat samaa markkinatuotetta.</p></section></div><section class="card pad"><div class="eyebrow">Päätösten seuraukset</div><h2>Tapahtumapäiväkirja</h2>${events()}</section></div>`}
function render(){applyTheme();$('summary').innerHTML=summary();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));$('main').innerHTML=({valley,companies,portfolio,market}[tab]||valley)();$('turninfo').innerHTML=`<strong>${state.month>=E.END?'Kolme vuotta täynnä':esc(E.date(state.month))}</strong><small>${state.month>=E.END?'Aloita uusi laakso tai tutki lopputulosta.':E.forecast(state.month)+' · '+state.month+'/36 kk pelattu'}</small>`;$('next').disabled=state.month>=E.END;$('next').textContent=state.month>=E.END?'Peli päättynyt':'Seuraava kuukausi →'}
function showDialog(title,html){$('dialogtitle').textContent=title;$('dialogbody').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
function help(){showDialog('Näin pelaat Laaksoa',`<p>Olet uuden laakson sijoittaja. Sinulla on <b>1 500 kultaa</b> ja aikaa kolme vuotta. Tavoite on kasvattaa käteisen ja omistusten yhteisarvoa.</p><h3>1. Tutki ennen sijoittamista</h3><p>Napauta yritystä kartalla. Sijainti, kuljetusmatka, tuotantoketju ja botin toimintatapa näkyvät ilmaiseksi. 35 kullan selvitys paljastaa paikan ja osaamisen tarkan tuottavuuden. Se antaa tietoa; se ei paranna tuotantoa.</p><h3>2. Rahoita yritystä</h3><p>Sijoitus menee yrityksen kassaan uusia osuuksia vastaan. Käynnistyminen vaatii kaluston hinnan ja käyttöpääomapuskurin. Yritys voi saada rahaa myös muilta sijoittajilta, joilla on yhteensä 2 400 kultaa.</p><h3>3. Etene kuukausi</h3><p>Botit ostavat raaka-aineita, maksavat työn ja kuljetukset, tuottavat ja myyvät. Viljelijät keräävät satoa maalis–elokuussa ja myyvät sen elokuussa. Myöhäinen aloitus pienentää ensimmäistä satoa. Sää vaikuttaa tuotantoon.</p><h3>4. Seuraa rahaa ja riskejä</h3><p>Yritys jakaa voitollisen kuukauden tuloksesta enintään 40 % osinkoina, jos käyttöpuskuri säilyy. Sinä saat omistusosuutesi mukaisen osan. Loppu jää yritykseen. Botit voivat laajentaa, kun kaksi kuukautta on ollut voitollisia, kassaa riittää ja tuotteen hinta on riittävä. Viljelijät arvioivat laajennuksen sadonkorjuussa viimeisten 12 kuukauden tuloksesta ja varaavat seuraavan kauden kuluihin suuremman puskurin.</p><p>Kolme peräkkäistä kuukautta ilman rahaa tuotantokuluihin johtaa toiminnan lopettamiseen. Kalusto myydään 45 %:lla kirjanpitoarvosta ja jäljelle jäänyt raha jaetaan omistajille.</p><h3>Omistuksen arvo ja myynti</h3><p>Arvo on yrityksen kassa ja poistettu kalusto jaettuna osuuksille. Rakentaminen vaihtaa rahaa kalustoon; kulut, tuotot ja poistot muuttavat arvoa. Omistuksen voi myydä yritykselle vain sen vapaan kassan rajoissa, 12 % alle kirjanpitoarvon.</p><p><b>Saadut osingot sisältyvät käteiseen.</b> Niitä ei lasketa varallisuuteen kahdesti. Lopputulos sisältää myymättömät omistukset kirjanpitoarvolla.</p><h3>Tärkeä havainto</h3><p>Kaksi maatilaa voi kärsiä samasta kuivuudesta. Sepän menestys voi auttaa kaivosta mutta lisätä puusepän kilpailua. Hyvä päätös voi silti päättyä huonosti.</p><button class="primary wide" data-act="close">Aloita tutkiminen</button>`)}
function settings(){showDialog('Asetukset ja tallennus',`<p class="subtle">Peli tallentuu tähän selaimeen. Varmuuskopio säilyttää koko laakson ja tulevien arvontojen tilan.</p><label>Teema<select id="theme" aria-label="Teema">${themes.map(t=>`<option value="${t.id}" ${prefs.theme===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><label>Ulkoasu<select id="mode" aria-label="Ulkoasu"><option value="auto" ${prefs.mode==='auto'?'selected':''}>Laitteen mukaan</option><option value="light" ${prefs.mode==='light'?'selected':''}>Vaalea</option><option value="dark" ${prefs.mode==='dark'?'selected':''}>Tumma</option></select></label><h3>Pelin varmuuskopio</h3><button data-act="export">Vie tiedostona</button> <button data-act="exporttext">Näytä tekstinä</button><label>Palauta JSON-tiedosto<input type="file" id="importfile" accept=".json,application/json" style="display:block;max-width:100%;margin-top:8px"></label><label>Tai liitä varmuuskopio tekstinä<textarea id="importtext" placeholder="Liitä Laakson JSON-tallennus tähän"></textarea></label><button data-act="importtext">Palauta tekstistä</button><p class="subtle">Palautus korvaa nykyisen pelin vahvistuksen jälkeen. Vie ensin varmuuskopio.</p><h3>Uusi peli</h3><p class="subtle">Uusi laakso arpoo yritysten tuottavuuden ja sääketjun uudelleen.</p><button class="danger" data-act="new">Aloita alusta</button><p class="subtle">Laakso 1.0 · peli ${state.initialSeed} · ${storageFailed?'Automaattitallennus ei käytössä — käytä vientiä.':'Automaattitallennus käytössä.'}</p>`)}
function ledger(){const f=firm();showDialog(E.def(f).name+' · kirjanpito',`<p class="subtle">Kulut sisältävät raaka-aineet, palkat, kuljetuksen ja huollon. Tulos vähentää myös kaluston 0,3 % kuukausipoiston. Osingot ovat koko yrityksen jakama summa.</p><div class="scrolltable"><table class="historytable"><thead><tr><th>Kuukausi</th><th>Myynti</th><th>Kulut</th><th>Tulos</th><th>Osingot</th></tr></thead><tbody>${f.ledger.slice().reverse().map(l=>`<tr><td>${E.date(l.month).replace(' · vuosi ',' / ')}</td><td>${fmt(l.revenue)}</td><td>${fmt(l.costs)}</td><td class="${profitClass(l.profit)}">${sign(l.profit)}</td><td>${fmt(l.dividend)}</td></tr>`).join('')}</tbody></table></div><p class="subtle">${esc(f.note)}</p>`)}
function confirmation(title,text,action){showDialog(title,`<p>${esc(text)}</p><div class="actions"><button data-act="close">Peruuta</button><button class="primary" id="confirm">Vahvista</button></div>`);$('confirm').onclick=()=>{action();$('dialog').close()}}
function acceptImport(text){try{if(text.length>2000000)throw Error('Tiedosto on liian suuri.');const imported=E.validate(JSON.parse(text));confirmation('Palautetaanko peli?','Nykyinen peli korvataan varmuuskopion laaksolla. Vie tarvittaessa nykyisestä pelistä kopio ennen palautusta.',()=>{state=imported;storageFailed=false;save();render();toast('Peli palautettu.')})}catch(e){toast('Palautus ei onnistunut: '+e.message)}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='laakso-'+state.month+'kk.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Varmuuskopio viety.')}
function doAction(a){if(stale&&['study','invest','sell','new','importtext'].includes(a)){toast('Lataa sivu uudelleen: peli on muuttunut toisessa välilehdessä.');return}if(a==='study'||a==='invest'||a==='sell'){const r=a==='study'?E.study(state,selected):a==='invest'?E.invest(state,selected,amount):E.sell(state,selected);if(r.ok){save();render()}toast(r.message)}
if(a==='dismiss'){prefs.intro=false;savePrefs();render()}if(a==='events'){tab='market';render();window.scrollTo(0,0)}if(a==='ledger')ledger();if(a==='close')$('dialog').close();if(a==='showvalley'){tab='valley';render();window.scrollTo(0,0)}if(a==='export')exportData();if(a==='exporttext'){showDialog('Varmuuskopio tekstinä','<p>Kopioi koko teksti talteen. Voit palauttaa sen Asetuksista.</p><textarea id="exporttext" readonly style="height:300px"></textarea><button data-act="copy">Kopioi teksti</button>');$('exporttext').value=JSON.stringify(state)}if(a==='copy'){const t=$('exporttext');t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Varmuuskopio kopioitu.')).catch(()=>toast('Valitse ja kopioi teksti käsin.'));else toast('Valitse ja kopioi teksti käsin.')}if(a==='importtext')acceptImport($('importtext').value);if(a==='new')confirmation('Aloitetaanko uusi laakso?','Nykyinen peli poistuu tästä selaimesta. Voit viedä varmuuskopion Asetuksista ennen aloittamista.',()=>{state=E.fresh();storageFailed=false;amount=100;selected='aino';tab='valley';save();render();window.scrollTo(0,0)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.firm){selected=b.dataset.firm;render();if(matchMedia('(max-width:760px)').matches)$('detail')?.scrollIntoView({behavior:'auto',block:'start'})}if(b.dataset.openFirm){selected=b.dataset.openFirm;tab='companies';render();$('detail')?.scrollIntoView({behavior:'auto',block:'start'})}if(b.dataset.amount){amount=Number(b.dataset.amount);const input=$('amount');if(input)input.value=amount;$('ownershippreview').innerHTML=previewOwnership(firm(),amount)}if(b.dataset.act)doAction(b.dataset.act)});
document.addEventListener('input',e=>{if(e.target.id==='amount'){amount=Number(e.target.value);$('ownershippreview').innerHTML=previewOwnership(firm(),amount)}});document.addEventListener('change',e=>{if(e.target.id==='theme'||e.target.id==='mode'){prefs[e.target.id]=e.target.value;savePrefs();applyTheme()}if(e.target.id==='importfile'&&e.target.files[0]){if(e.target.files[0].size>2000000){toast('Tiedosto on liian suuri.');return}e.target.files[0].text().then(acceptImport).catch(()=>toast('Tiedostoa ei voitu lukea.'))}});
$('next').onclick=()=>{if(stale){toast('Lataa sivu uudelleen ennen jatkamista.');return}if(E.step(state)){save();render();toast(state.weather.name+' · '+state.firms.filter(f=>f.profit>0&&!f.closed).length+' yritystä teki voittoa.')}};$('help').onclick=help;$('settings').onclick=settings;$('closedialog').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){stale=true;$('next').disabled=true;toast('Peli muuttui toisessa välilehdessä. Lataa tämä sivu uudelleen ennen jatkamista.');document.querySelectorAll('[data-act="invest"],[data-act="study"],[data-act="sell"]').forEach(b=>b.disabled=true);storageFailed=true}});
render();
</script></body></html>
