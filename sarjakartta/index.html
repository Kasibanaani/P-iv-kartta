<style>
[hidden]{display:none!important}
:root{--bg:#F5F3EE;--cell:#FFFEFA;--label:#252B28;--label2:#5E685F;--sep:#DDE2D9;--accent:#39775A;--onaccent:#FFFFFF;--fill:#E7F0E7;--tint:#EDF1EA;--danger:#A3412F;--cl:44%;--barh:57px;--hdh:38px;

.vnm{position:relative;flex:1;min-width:0;border:0;background:none;min-height:0;padding:0 4px 0 0;text-align:left;font-size:13px;font-weight:600;line-height:1.2;border-radius:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}

.vthw .vtr{border-top:0}.vthw .vtn{min-height:30px}
.vcorner{border:0;background:var(--tint);min-height:26px;height:26px;border-radius:7px;padding:0 8px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;white-space:nowrap;position:relative}
.vcorner::after{content:"";position:absolute;inset:-9px -2px}
.vcorner svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vtc{min-height:42px;padding:0;border:0;background:none;display:grid;place-items:center;border-radius:0}

.vtc[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent)}
.vgrip{flex:none;width:24px;height:36px;min-height:0;padding:0;border:0;background:none;touch-action:none;position:relative;border-radius:0}
.vgrip::before{content:"";position:absolute;left:5px;right:5px;top:13px;height:10px;border-top:2px solid var(--label2);border-bottom:2px solid var(--label2);background:linear-gradient(var(--label2),var(--label2)) center/100% 2px no-repeat;opacity:.7}
.vgrip::after{content:"";position:absolute;inset:-4px -6px}
.vtr.sum .vtn{font-weight:700;font-size:13px;padding-left:12px}
.vtr.sum{background:var(--tint)}.vtr.sum .vtn{background:var(--tint)}
.jh{border:0;background:none;border-radius:0;min-height:40px;height:40px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.jh b{font-size:12px}.jh small{font-size:10px;color:var(--label2);font-weight:500}
.jh.cur b{box-shadow:0 2px 0 var(--accent)}
.jc{position:relative;min-height:42px;border:0;background:none;border-radius:0;padding:0;font-size:14px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.jc::before{content:"";position:absolute;inset:4px 1px;border-radius:8px;background:var(--accent);opacity:var(--o,0)}

/* graafit */
.chart{width:100%;height:auto;display:block}

.tg{padding:10px 12px;border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:3px}

.pill{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--fill);color:var(--accent);font-weight:700;white-space:nowrap}
/* ikkunoiden taulukot */
.pt{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:2px 12px;font-size:13.5px;align-items:center}

.pt .hh{font-size:11px;color:var(--label2);font-weight:600}.pt .tt{font-weight:800;border-top:1px solid var(--sep);padding-top:4px}
.pt .n{gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.themes .sw{display:flex;gap:3px}.themes .sw span{flex:1;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
.themes button.on{border-color:var(--label);box-shadow:0 0 0 2px var(--label) inset}
.form{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.filebtn{display:inline-flex;align-items:center;border:1px solid var(--sep);border-radius:11px;min-height:44px;background:var(--cell);cursor:pointer}

.err{color:var(--danger);font-size:13.5px}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--label);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;max-width:88vw;pointer-events:none}
@media (max-width:360px){.gb .dot{display:none}.gb{box-shadow:inset 4px 0 0 hsl(var(--h) 46% var(--cl))}.gb .stt{min-width:16px}.gb{padding:0 8px 0 12px}.gb.h{padding:0 7px 0 11px}}
@media (max-width:340px){.bbtn.ic{width:40px;min-width:40px}.bbtn,.roll{padding:0 8px;font-size:14px}.bsg button{min-width:38px;padding:0 6px}.gt .gh,.gt .gr{grid-template-columns:minmax(0,1fr) 44px 54px 54px}}
</style>
</head>

}

(function(){var st=null;
