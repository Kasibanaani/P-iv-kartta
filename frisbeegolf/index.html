<body><main class="shell game-shell"><header class="top"><div><div class="eyebrow">Tiimi · kiekot · metsä</div><h1>Metsärata</h1></div><span class="badge">v2.2</span></header>

const APP_ID='metsarata',APP_TITLE='Metsärata',APP_HELP='Valitse kierrokselle yksi tiimin pelaaja ja enintään kolme omistamaasi kiekkoa. Kierrosvoitot ja palkkiot kuuluvat tiimille. Suuntaa napauttamalla karttaa, valitse rysty tai fore ja säädä kallistus, korkeus ja voima. Pidä heittonappia pohjassa ja vapauta vihreällä alueella. Putissa pito kasvattaa voimaa: vapauta korin etäisyyttä vastaavan merkin kohdalla. Voimakas heitto nopeuttaa vetoa ja kaventaa ajoitusikkunaa. Rysty, fore, hysse, antsa, putti, kokemus ja itseluottamus vaikuttavat tuntumaan. Epävarmuus muuttaa vedon tahtia jo ennen irrotusta, ei arvo heiton lopputulosta. Kiekon lentonumerot ja suhteellinen tuuli määräävät kaaren. Tuulinuoli osoittaa mihin tuuli puhaltaa. Positiivinen kallistus on hysse, negatiivinen antsa; vasenkätisyys ja fore peilaavat kaaren. Lentomalli on pelillinen. Kaikki eteneminen säilyy tässä selaimessa. Vie varmuuskopio vaihtaessasi selainta.';

function beginHold(ev){if(holding||animation||!state.current||state.current.holed)return;ev.preventDefault();if(ev.pointerId!==undefined)ev.currentTarget.setPointerCapture(ev.pointerId);const t=shotTiming(player(),progress(),state.settings,{power,mode,tilt,putt:isPutt()},Math.random());holding={start:performance.now(),putt:isPutt(),...t};$('#throw').textContent=holding.putt?'Voima kasvaa… vapauta':'Käsi liikkuu… vapauta';$$('#game input,#game button:not(#throw)').forEach(e=>e.disabled=true);tickHold();draw()}

function throwDisc(opts){const c=state.current;if(!c||c.holed||animation)return;const origin={...c.lie},H=hole(),p=player(),d=DISCS.find(x=>x.id===discId);c.undo={lie:{...c.lie},strokes:c.strokes,holed:c.holed,trail:[...c.trail],feedback:c.feedback,confidence:progress().confidence,log:[...c.log]};const result=resolveFlight(flightModel(origin,aim,d,p,c.wind,opts,{power,mode,tilt,elevation}),H,origin,opts.puttPower!==undefined);

function mapPoint(e){const r=canvas.getBoundingClientRect();if(isPutt()&&state.settings.puttView==='eyes'){const c=state.current,theta=aim+(e.clientX-r.left-r.width/2)/r.width*60;return {x:c.lie.x+Math.cos(theta*Math.PI/180)*20,y:c.lie.y+Math.sin(theta*Math.PI/180)*20}}const m=mapLayout(),right=(e.clientX-r.left-m.cx)/m.scale,forward=-(e.clientY-r.top-m.cy)/m.scale;return {x:m.o.x-m.uy*right+m.ux*forward,y:m.o.y+m.ux*right+m.uy*forward}}
function draw(progressValue){if(!ctx||!canvas||!state.current||!canvas.isConnected||canvas.clientWidth<1||canvas.clientHeight<1)return;
