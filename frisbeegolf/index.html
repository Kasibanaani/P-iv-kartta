function updateShotInfo(){if(!$('#target'))return;const pt=isPutt(),dist=distance(state.current.lie,hole().basket),t=shotTiming(player(),progress(),state.settings,{power,mode,tilt,putt:pt});let target=pt?dist/25:.7,width=t.window;$('#target').style.left=clamp((target-width/2)*100,0,100)+'%';$('#target').style.width=Math.min(width*100,100-target*100+width*50)+'%';$('#shotInfo').textContent=`${mode==='fore'?'Fore':'Rysty'} · osaaminen ${fmt(t.skill,0)}/100 · itsevarmuus ${fmt(progress().confidence,0)}% · ajoitusikkuna noin ${fmt(t.window*t.duration,0)} ms.`;const d=DISCS.find(x=>x.id===discId);$('#discInfo').textContent=`${d.name}: nopeus ${d.speed}, liito ${d.glide}, käännös ${d.turn}, feidi ${d.fade}.`}

function tickHold(){if(!holding)return;const elapsed=performance.now()-holding.start,frac=holding.putt?Math.min(1,elapsed/holding.duration):Math.min(1,elapsed/holding.duration);$('#needle').style.left=frac*99+'%';$('#fill').style.width=frac*100+'%';frame=requestAnimationFrame(tickHold)}

function endHold(ev){if(!holding)return;ev.preventDefault();const h=holding,elapsed=performance.now()-h.start;holding=null;cancelAnimationFrame(frame);if(h.putt){const raw=Math.min(1,elapsed/h.duration),target=distance(state.current.lie,hole().basket)/25;throwDisc({puttPower:Math.abs(raw-target)<=h.window/2?target:raw,error:0});}else{const timing=elapsed/h.duration,delta=timing-.70,excess=Math.sign(delta)*Math.max(0,Math.abs(delta)-h.window/2),error=clamp(excess*135,-115,115);throwDisc({error,ms:Math.round(elapsed-h.duration*.70)})}}
