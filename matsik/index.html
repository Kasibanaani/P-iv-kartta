<body>

<script id="engine">
/* Mätsik Forest – moottori (ei DOMia). Tallennus, säännöt ja herjat, aikasanat, arviointikierros. */
var MF=(function(){
var VER=1, KEY='matsik:v1', APP='matsik', FILE='Mätsik Forest.json';

/* ---------- päivämäärät (paikallinen YYYY-MM-DD) ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);}

  if(s.cel==='aurora')s.au.forEach((c,i)=>{o+=`<path d="M-10,${44+i*9} C70,${8+i*12} 150,${66-i*6} 230,${30+i*8} S350,${12+i*10} 400,${34+i*7}" stroke="${c}" stroke-width="${16-i*4}" fill="none" opacity="${.5-i*.12}" filter="url(#b${id})"/>`});
  if(s.cel==='sun')o+=`<circle cx="86" cy="96" r="40" fill="${s.sun}" opacity=".25"/><circle cx="86" cy="96" r="22" fill="${s.sun}"/>`;

  if(s.extra==='berries'){[[205,133],[212,131],[290,134],[296,132],[160,135]].forEach(([x,y])=>{o+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${s.a.k}"/>`})}
  // eläin
  const pos={owl:[318,74,1.25],fox:[238,132,1.35],deer:[230,130,1.2],hedgehog:[250,134,1.3],hare:[240,132,1.35],bear:[250,134,1.25]}[s.animal];
  if(s.animal==='owl')o+=`<path d="M372,76 Q340,74 296,79" stroke="${s.near}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  o+=`<g transform="translate(${pos[0]} ${pos[1]}) scale(${pos[2]})">${AN[s.animal](s.a)}</g>`;
  if(s.cel==='snow'){for(let i=0;i<70;i++)o+=`<circle cx="${(R()*W).toFixed(1)}" cy="${(R()*H).toFixed(1)}" r="${(.7+R()*1.2).toFixed(2)}" fill="#ffffff" opacity=".9"/>`}
  const h=mode==='pieni'?56:132;
  return `<svg class="band${mode==='pois'?' hide':''}" style="--band-h:${h}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Kuvitus: ${t.mood}">${o}</svg>`;
}

function preview(a,s){var o=a[s.k];if(s.sp==='dg')return a.diagnoosit.v.join(', ');if(s.sp==='tav')return a.tavoitteet.length?a.tavoitteet.length+(a.tavoitteet.length===1?' tavoite':' tavoitetta'):'';
  if(s.sp==='haast'){var n=a.haasteet.length,m=a.haasteet.filter(function(x){return x.ohjattu;}).length;return n?n+(n===1?' haaste':' haastetta')+(m?' · '+m+' ohjattu':''):'';}
  if(s.sp==='mtr')return data.asetukset.mittarit.filter(function(m){return ((a.mittarit[m.id]||{}).arvot||[]).length;}).map(function(m){return m.n;}).join(', ');
  if(s.sp==='mit')return MF.MITAT.filter(function(m){return a.seuranta[m[0]].arvot.length;}).map(function(m){return m[1];}).join(', ');
  if(s.k==='toimet'){var nS=MF.SLOTS.reduce(function(t,k){return t+((o.sykli||{})[k]||[]).length;},0);return nS?(o.alku?'Sykli alkaen '+MF.fiShort(o.alku)+' · ':'')+nS+' valintaa':'';}
  for(var i=0;i<s.f.length;i++){var v=o[s.f[i][0]];if(s.f[i][2]==='seg'&&v){var q=s.f[i][3].filter(function(x){return x[0]===v;})[0];if(q)return s.f[i][1]+': '+q[1];}
    if(typeof v==='string'&&v.trim()&&s.f[i][2]!=='date')return v.trim().split('\n')[0];}return '';}
function field(prefix,o,f){var key=f[0],lab=f[1],typ=f[2],v=o[key],id=prefix+'-'+key;
  if(typ==='ta')return '<label class="f">'+(lab?'<span>'+h(lab)+'</span>':'')+'<textarea id="'+id+'" data-b="'+prefix+'.'+key+'" rows="2">'+h(v)+'</textarea></label>';
  if(typ==='in')return '<label class="f"><span>'+h(lab)+'</span><input type="text" id="'+id+'" data-b="'+prefix+'.'+key+'" value="'+h(v)+'"></label>';
  if(typ==='date')return '<label class="f"><span>'+h(lab)+'</span><input type="date" id="'+id+'" data-b="'+prefix+'.'+key+'" value="'+h(v)+'"></label>';
  if(typ==='seg'||typ==='multi')return '<div class="f"><span>'+h(lab)+'</span><div class="seg">'+f[3].map(function(x){
    var on=typ==='multi'?(v||[]).indexOf(x[0])>=0:String(v==null?'':v)===x[0];return '<button data-'+typ+'="'+prefix+'.'+key+'" data-v="'+h(x[0])+'" aria-pressed="'+on+'">'+h(x[1])+'</button>';}).join('')+'</div></div>';
  return '';}
function hjHtml(x){return '<div class="hj '+x.sev+'"><i class="d"></i><span>'+h(x.teksti)+'</span></div>';}
function hjAction(x,a){if(x.tark)return '<button class="btn sm pri" data-act="tark" data-o="'+x.osio+'">Tarkistettu, pitää paikkansa</button>';
  if(x.laji==='arvio')return '<button class="btn sm pri" data-act="arvioi" data-t="'+x.tav+'">Arvioi</button>';
  if(x.laji==='toimenpide')return '<button class="btn sm" data-act="tehty" data-t="'+x.tav+'" data-i="'+x.ar+'">Tehty</button>';
  return '<button class="btn sm" data-act="goto" data-o="'+x.osio+'"'+(x.tav?' data-t="'+x.tav+'"':'')+'>Avaa</button>';}

function vAsiakkaat(){var L=MF.ordered(data,TODAY),need=L.filter(function(x){return x.h.length;}).length;
  var s=band(false)+'<div class="hd"><h1>Eläimet</h1><span class="sub">'+MF.fi(TODAY)+'</span></div><div class="main">';
  if(!L.length)return s+'<p class="empty">Ei vielä eläimiä. Lisää ensimmäinen alhaalta plusnapista.</p></div>';

    (top?hjHtml(top):'<div class="hj ok"><i class="d"></i><span>Kunnossa'+(x.next?' · seuraava käynti '+MF.fi(x.next.date)+(x.next.klo?' klo '+x.next.klo:''):'')+'</span></div>')+

function herjaCard(a){var H=MF.herjat(a,data,TODAY);if(!H.length)return '<div class="card" id="hjc"><div class="hj ok"><i class="d"></i><span>Kunnossa</span></div></div>';

function vAsiakas(){var a=cl(view.id);if(!a){view={v:'asiakkaat'};return vAsiakkaat();}var H=MF.herjat(a,data,TODAY),E=MF.allEntries(data,TODAY);

    s+='</div></details>';});
  var notes=data.muistio.filter(function(n){return !n.arch&&MF.mentions(n.text,[a]).length;}).sort(byEdited).slice(0,12);
  s+='<details class="card sec" data-sec="huomiot"'+(openSec.huomiot?' open':'')+'><summary><b>Huomiot muistiosta</b><span class="pv">'+notes.length+'</span></summary><div class="in">'+

  return s+'</div>';}
function secDg(a){var L=data.asetukset.diagnoosit,v=a.diagnoosit.v,extra=v.filter(function(x){return L.indexOf(x)<0;});

    '<p class="meta">Diagnoosiluettelo on tyhjä. Lisää omat diagnoosisi: Valikko → Diagnoosiluettelo.</p>'+(extra.length?'<div class="seg">'+extra.map(function(x){return '<button data-dg="'+h(x)+'" aria-pressed="true">'+h(x)+'</button>';}).join('')+'</div>':''))+
    '<div class="btns"><input type="text" id="dg-new" placeholder="Muu diagnoosi" style="flex:1"><button class="btn sm" data-act="dgadd">Lisää</button></div>';}
function syyName(a,id){if(id==='mahd')return 'Hoidon mahdollistaminen';var x=a.syyt.filter(function(s){return s.id===id;})[0];return x?(x.haitta||'Nimetön syy').split('\n')[0].slice(0,40):'';}
function secTav(a){var s='<p class="grp">Hoidon syyt</p>';
  a.syyt.forEach(function(y){s+='<div class="syy"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">'+field('syy:'+y.id,y,['haitta','Haitta elämässä','ta'])+field('syy:'+y.id,y,['tausta','Psykiatrinen taustasyy','ta'])+
    '</div>'+delBtn('syy:'+y.id)+'</div>';});
  s+='<button class="btn sm" data-act="syyadd">+ Hoidon syy</button>';
  /* tavoitteet tasoittain ja tahoittain (Emil 3.11.2026): jokaisella tasolla oma laatikko lapselle, vanhemmille ja työntekijälle */
  [1,2,3].forEach(function(lv){s+='<p class="grp">'+lv+' '+TASO[lv]+'</p>';

      s+='<div class="f"><span>Hoitosuhdetyöskentelyn periaatteet ja mittarit</span>'+(PP.length+ex.length?'<div class="seg sm">'+PP.concat(ex).map(function(x){
        return '<button data-pp="'+h(x)+'" aria-pressed="'+(a.periaatteet.indexOf(x)>=0)+'">'+h(x)+'</button>';}).join('')+'</div>':'<p class="meta">Luettelo on tyhjä. Lisää: Valikko → Periaatteet ja mittarit.</p>')+'</div>';}
    MF.OSAP.forEach(function(p){var G=a.tavoitteet.filter(function(t){return t.taso===lv&&t.taho===p[0];});

      G.forEach(function(t){s+=goal(a,t);});s+='</div>';});});

function goal(a,t){var tl=TILA.filter(function(x){return x[0]===t.tila;})[0],nm=String(t.teksti||'').trim()?MF.goalName(t):'Uusi tavoite',op=openGoal[t.id],P='tav:'+t.id,sv=t.seur||{};

    '<button class="btn sm link" data-act="gtog" data-t="'+t.id+'">'+(op?'Sulje':'Avaa')+'</button></div><span class="meta">Syy: '+h(syyName(a,t.syy)||'ei valittu')+

function shareFile(txt,name,done){function linkSave(){try{var url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);done('Tiedosto '+name+' annettu tallennettavaksi.');}catch(e){done('',true);}}
  try{var f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(function(){done('Tiedosto '+name+' annettu tallennettavaksi.');},
    function(err){if(err&&err.name==='AbortError')done('Vienti peruttiin.',false,true);else linkSave();});return;}}catch(e){}linkSave();}
function vie(){if(view.v==='muistio')draftSave();if(sheet&&sheet.k==='note')sheetNoteSave();var txt=JSON.stringify(MF.wrap(data),null,1);shareFile(txt,MF.FILE,function(msg,fail,abort){var t=$('tuo');
  if(fail){sheet={k:'vieteksti',txt:txt};renderSheet();return;}
  if(!abort){data.meta.lastExport=nowIso();try{localStorage.setItem(MF.KEY,JSON.stringify(MF.wrap(data)));}catch(e){}}toast(msg);render();});}
var pending=null;
function offerImport(txt,box){var o=null;try{o=JSON.parse(txt);}catch(e){}var d=MF.unwrap(o),el=$(box);if(!el)return;
  if(!d){el.innerHTML='<p class="msg">Tämä ei ole Mätsik Forestin vientitiedosto.</p>';return;}pending=d;
  el.innerHTML='<p class="msg">Tiedostossa on '+d.asiakkaat.length+' asiakasta ja '+d.muistio.length+' muistiinpanoa'+(o.savedAt?', viety '+MF.fiShort(MF.iso(new Date(o.savedAt))):'')+'. Tuonti korvaa kaikki tämän laitteen tiedot.</p>'+
    (data.meta.mod&&o.savedAt&&o.savedAt<data.meta.mod?'<p class="msg" style="color:var(--crit)">Varoitus: tätä laitetta on muutettu tiedoston viennin jälkeen. Tuonti hävittää myöhemmät muutokset.</p>':'')+
    '<div class="btns"><button class="btn" data-act="tuoperu">Peru</button><span style="flex:1"></span><button class="btn pri" data-act="tuook">Tuo ja korvaa</button></div>';}

/* ---------- tapahtumat ---------- */
function pathObj(a,pre){if(pre.indexOf('tavs:')===0){var g=a.tavoitteet.filter(function(x){return x.id===pre.slice(5);})[0];if(!g)return null;g.seur=g.seur||{};return g.seur;}
  if(pre.indexOf('hst:')===0)return a.haasteet.filter(function(x){return x.id===pre.slice(4);})[0];return undefined;}
function setPath(path,val){/* sec.key | syy:id.key | tav:id.key | tavs:id.key | hst:id.key | mit:id.key */var a=cl(view.id);if(!a)return;var i=path.lastIndexOf('.'),pre=path.slice(0,i),key=path.slice(i+1),o=pathObj(a,pre);
  if(o!==undefined){if(!o)return;o[key]=val;if(pre.indexOf('tavs:')===0)o.pvm=TODAY;save();return;}
  if(pre.indexOf('syy:')===0)o=a.syyt.filter(function(x){return x.id===pre.slice(4);})[0];
  else if(pre.indexOf('tav:')===0){o=a.tavoitteet.filter(function(x){return x.id===pre.slice(4);})[0];if(key==='taso')val=+val;}
  else if(pre.indexOf('mit:')===0)o=a.seuranta[pre.slice(4)];else{o=a[pre];if(o)o.u=TODAY;}
  if(!o)return;o[key]=val;if(pre.indexOf('tav:')===0)o.u=o.u||TODAY;save();}
function getPath(path){var a=cl(view.id),i=path.lastIndexOf('.'),pre=path.slice(0,i),key=path.slice(i+1),o=pathObj(a,pre);if(o!==undefined)return o?o[key]:'';
  if(pre.indexOf('tav:')===0)o=a.tavoitteet.filter(function(x){return x.id===pre.slice(4);})[0];else if(pre.indexOf('mit:')===0)o=a.seuranta[pre.slice(4)];else o=a[pre];return o?o[key]:'';}
document.addEventListener('input',function(e){var t=e.target;if(t.tagName==='TEXTAREA')grow(t);
  if(t.id==='newnote'){clearTimeout(draftT);draftT=setTimeout(draftSave,1200);}
  if(t.id==='nt'){clearTimeout(draftT);draftT=setTimeout(sheetNoteSave,1200);}
  if(t.dataset.b){setPath(t.dataset.b,t.type==='date'?t.value:t.value);}
  if(t.dataset.val!=null){var n=Math.max(0,Math.min(36,parseInt(t.value,10)||0));data.asetukset.valit[t.dataset.val]=n;save();}
  if(t.dataset.le){var lx=leCur();if(lx){lx[t.dataset.le]=t.value;save();}}
  if(t.id==='pplist'){data.asetukset.periaatteet=t.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);save();}
  if(t.id==='dglist'){data.asetukset.diagnoosit=t.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);save();}});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.b)refreshHerjat();
  if(t.id==='tuofile'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){offerImport(String(r.result),'tuo');};r.readAsText(t.files[0]);t.value='';}});
document.addEventListener('focusout',function(e){if(e.target.id==='newnote')setTimeout(function(){var a=document.activeElement;if(!a||a.id!=='newnote')draftEnd();},0);if(e.target.id==='nt')sheetNoteSave();});
(function(){var sx=null;document.addEventListener('touchstart',function(ev){sx=ev.target.closest&&ev.target.closest('#roll')?ev.touches[0].clientX:null;},{passive:true});
  document.addEventListener('touchend',function(ev){if(sx===null)return;var dx=ev.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>28){rollSw=true;var i=NAV.map(function(x){return x[0];}).indexOf(navKey());go(NAV[(i+(dx<0?1:-1)+NAV.length)%NAV.length][0]);}},{passive:true});})();
var rollSw=false;
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.sec){var was=!!openSec[d.dataset.sec];openSec[d.dataset.sec]=d.open;if(d.open&&!was)render();}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&popOpen){popOpen=false;renderBar();return;}if(e.key==='Escape'&&sheet){closeSheet();}
  if(e.key==='Enter'&&e.target.id==='nn'){e.preventDefault();var b=document.querySelector('[data-act=uusiok],[data-act=nimiok]');if(b)b.click();}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='note'){e.preventDefault();e.target.click();}});
document.addEventListener('click',function(e){var b=e.target.closest('button,[data-act]');if(!b)return;var D=b.dataset,act=D.act,a=cl(view.id);
  if(D.nav){go(D.nav);return;}
  if(D.seg){var cur=getPath(D.seg),keep=/^tav:.*\.(taso|tila|taho)$/.test(D.seg);setPath(D.seg,String(cur)===D.v&&!keep?'':D.v);render();return;}
  if(D.multi){var L=(getPath(D.multi)||[]).slice(),i=L.indexOf(D.v);if(i>=0)L.splice(i,1);else L.push(D.v);setPath(D.multi,L);render();return;}
  if(D.syk){var SK=a.toimet.sykli,L2=SK[D.syk]=(SK[D.syk]||[]),q2=L2.indexOf(D.v);if(q2>=0)L2.splice(q2,1);else L2.push(D.v);a.toimet.u=TODAY;save();render();return;}
  if(D.pp!=null){var pv=a.periaatteet,pj=pv.indexOf(D.pp);if(pj>=0)pv.splice(pj,1);else pv.push(D.pp);save();render();return;}
  if(D.dg!=null){var v=a.diagnoosit.v,j=v.indexOf(D.dg);if(j>=0)v.splice(j,1);else v.push(D.dg);a.diagnoosit.u=TODAY;save();render();return;}
  if(D.set){data.asetukset[D.set]=D.v;save();render();return;}
  switch(act){
   case 'open':view={v:'asiakas',id:D.id};openSec={};openGoal={};render();window.scrollTo(0,0);break;
   case 'home':view={v:'asiakkaat'};render();window.scrollTo(0,0);break;
   case 'uusi':sheet={k:'uusi'};renderSheet();break;
   case 'slotedit':editSlot=D.k;render();break;
   case 'slotok':editSlot='';render();break;
   case 'leopen':leEd={l:D.l,id:D.id};confirmDel='';render();break;
   case 'leadd':var nx2={id:MF.uid(),n:''};if(D.l==='mittarit')nx2.mita='';else nx2.sanat='';if(D.l==='sisallot'){nx2.laji='kaynti';nx2.mit='';}leList(D.l).push(nx2);leEd={l:D.l,id:nx2.id};save();render();var ln=$('le-n');if(ln)ln.focus();break;
   case 'leset':var lx2=leCur();if(lx2){lx2[D.f]=D.v;if(D.f==='laji'&&D.v==='kaynti')lx2.mit='';save();render();}break;
   case 'lemove':var LL=leList(leEd.l),li=LL.indexOf(leCur()),lj=li+(+D.d);if(li>=0&&lj>=0&&lj<LL.length){var tmp=LL[li];LL[li]=LL[lj];LL[lj]=tmp;save();render();}break;
   case 'leok':var lx3=leCur();if(lx3&&!lx3.n.trim()&&!String(lx3.sanat||lx3.mita||'').trim()&&!leUse(leEd.l,lx3.id)){data.asetukset[leEd.l]=leList(leEd.l).filter(function(x){return x!==lx3;});save();}
     else if(lx3&&!lx3.n.trim()){lx3.n='(nimetön)';save();}leEd=null;render();break;
   case 'roll':if(rollSw){rollSw=false;break;}popOpen=!popOpen;renderBar();break;
   case 'popclose':popOpen=false;renderBar();break;
   case 'newfocus':window.scrollTo(0,0);var nf=$('newnote');if(nf)nf.focus();break;
   case 'calprev':calSet(MF.addDays(calDay||TODAY,-7));break;
   case 'calnext':calSet(MF.addDays(calDay||TODAY,7));break;
   case 'caltoday':calTop=null;calSet(TODAY);break;
   case 'cday':if(!wideCal()||D.day!==calDay){calSet(D.day);}break;
   case 'month':var cd=MF.parse(calDay||TODAY);monCur=new Date(cd.getFullYear(),cd.getMonth(),1);sheet={k:'month'};renderSheet();break;
   case 'mprev':monCur=new Date(monCur.getFullYear(),monCur.getMonth()-1,1);renderSheet();break;
   case 'mnext':monCur=new Date(monCur.getFullYear(),monCur.getMonth()+1,1);renderSheet();break;
   case 'mday':sheet=null;calTop=null;calSet(D.day);break;
   case 'uusiok':var nm=$('nn').value.trim();if(!nm)return;var c=MF.newClient(nm,TODAY);data.asiakkaat.push(c);save();sheet=null;view={v:'asiakas',id:c.id};openSec={};render();window.scrollTo(0,0);break;
   case 'nimi':confirmDel='';sheet={k:'nimi'};renderSheet();break;
   case 'nimiok':var n2=$('nn').value.trim();if(n2){a.nimi=n2;save();}sheet=null;render();break;
   case 'arkistoi':a.arch=TODAY;save();sheet=null;view={v:'asiakkaat'};render();toast(a.nimi+' arkistoitu. Palautus: Valikko.');break;
   case 'palauta':var p=cl(D.id);if(p){delete p.arch;save();render();}break;
   case 'close':closeSheet();break;
   case 'sheetbg':if(e.target===b)closeSheet();break;
   case 'tark':a[D.o].u=TODAY;save();render();toast('Merkitty tarkistetuksi');break;
   case 'goto':openSec[D.o]=true;if(D.t)openGoal[D.t]=true;render();var s1=$(D.t?'g-'+D.t:'sec-'+D.o);if(s1)s1.scrollIntoView({block:'start'});break;
   case 'dgadd':var dn=$('dg-new').value.trim();if(dn&&a.diagnoosit.v.indexOf(dn)<0){a.diagnoosit.v.push(dn);a.diagnoosit.u=TODAY;save();render();}break;
   case 'syyadd':a.syyt.push({id:MF.uid(),haitta:'',tausta:''});save();render();break;
   case 'tavadd':var t=({id:MF.uid(),taso:+D.lv||3,taho:D.th||'lapsi',teksti:'',syy:'',keinot:'',tila:'alussa',tilaT:'',luotu:TODAY,arviot:[],seur:{}});a.tavoitteet.push(t);openGoal[t.id]=true;save();render();
     var tf=$('tav:'+t.id+'-teksti');if(tf){tf.focus();tf.scrollIntoView({block:'center'});}break;
   case 'hstadd':var hx={id:MF.uid(),teksti:'',ohjaus:'',ohjattu:''};a.haasteet.push(hx);save();render();var hf=$('hst:'+hx.id+'-teksti');if(hf)hf.focus();break;
   case 'hstoh':var hy=a.haasteet.filter(function(x){return x.id===D.id;})[0];if(hy){hy.ohjattu=D.v?TODAY:'';save();render();}break;
   case 'ohjkirj':var ol=$('ohj-lisa'),orow={pvm:TODAY,tulos:D.v};if(ol&&ol.value.trim())orow.lisa=ol.value.trim();a.ohjaus.push(orow);save();render();toast('Ohjauksen arvio kirjattu');break;
   case 'mtrkirj':var mi=$('mtr-'+D.m),mo=a.mittarit[D.m]=a.mittarit[D.m]||{arvot:[]};mo.arvot.push({pvm:TODAY,arvo:mi?mi.value.trim():''});save();render();toast('Kirjattu');break;
   case 'gtog':openGoal[D.t]=!openGoal[D.t];render();break;
   case 'delask':confirmDel=D.k;sheet?renderSheet():render();break;
   case 'delno':confirmDel='';sheet?renderSheet():render();break;
   case 'delyes':var k=D.k,id=k.slice(k.indexOf(':')+1);confirmDel='';
     if(k.indexOf('syy:')===0){a.syyt=a.syyt.filter(function(x){return x.id!==id;});a.tavoitteet.forEach(function(g){if(g.syy===id)g.syy='';});}
     if(k.indexOf('hst:')===0)a.haasteet=a.haasteet.filter(function(x){return x.id!==id;});
     if(k.indexOf('tav:')===0)a.tavoitteet=a.tavoitteet.filter(function(x){return x.id!==id;});
     if(k.indexOf('note:')===0){data.muistio=data.muistio.filter(function(x){return x.id!==id;});sheet=null;clearTimeout(draftT);}
     if(k.indexOf('le:')===0){var lp=k.split(':'),ll=lp[1],lid=lp.slice(2).join(':');data.asetukset[ll]=leList(ll).filter(function(x){return x.id!==lid;});
       data.asiakkaat.forEach(function(c){if(ll==='mittarit')delete c.mittarit[lid];else if(ll==='sisallot')MF.SLOTS.forEach(function(q){c.toimet.sykli[q]=(c.toimet.sykli[q]||[]).filter(function(x){return x!==lid;});});else c.toimet.muodot=(c.toimet.muodot||[]).filter(function(x){return x!==lid;});});leEd=null;}
     if(k.indexOf('as:')===0){data.asiakkaat=data.asiakkaat.filter(function(x){return x.id!==id;});sheet=null;view={v:'asiakkaat'};}
     save();render();toast('Poistettu');break;
   case 'arvioi':sheet={k:'arvio',t:D.t,step:'a',polku:[],per:{},res:''};renderSheet();break;
   case 'aper':sheet.per[D.p]=D.v;renderSheet();break;
   case 'aperok':var allK=MF.OSAP.every(function(q){return sheet.per[q[0]]==='k';});
     aGo(MF.OSAP.map(function(q){return q[1]+' '+({k:'kyllä',e:'ei','?':'ei tiedä'})[sheet.per[q[0]]];}).join(', '),allK?MF.FLOW.a.kaikki:MF.FLOW.a.joku);break;
   case 'aopt':var o=MF.FLOW[sheet.step].o[+D.i];aGo(o[0],o[1]);break;
   case 'abak':var hs=sheet.hist.pop();sheet.polku.pop();sheet.step=hs.step;sheet.res=hs.res;sheet.per=hs.per;renderSheet();break;
   case 'aok':var g=a.tavoitteet.filter(function(x){return x.id===sheet.t;})[0];MF.saveArvio(g,sheet.polku,sheet.res,$('alisa').value.trim(),TODAY);openGoal[g.id]=true;sheet=null;save();render();toast('Arvio kirjattu');break;
   case 'tehty':var g2=a.tavoitteet.filter(function(x){return x.id===D.t;})[0];if(g2&&g2.arviot[+D.i]){g2.arviot[+D.i].tehty=TODAY;save();render();toast('Merkitty tehdyksi');}break;
   case 'mitta':var ms=a.seuranta[D.m],mv=$('mv-'+D.m).value.trim();ms.arvot.push({pvm:TODAY,arvo:mv});save();render();toast('Kirjattu');break;
   case 'kaynti':openNew(cl(D.id).nimi+' käynti ');break;
   case 'note':if(e.target.closest('button'))return;openNoteId(D.id);break;
   case 'tila':var n3=data.muistio.filter(function(x){return x.id===D.n;})[0];if(n3){n3.tila=n3.tila||{};if(D.v)n3.tila[D.k]=D.v;else delete n3.tila[D.k];save();render();}break;
   case 'vie':vie();break;
   case 'tuoteksti':sheet={k:'tuoteksti'};renderSheet();break;
   case 'ttok':offerImport($('tt').value,'tuo2');break;
   case 'tuoperu':pending=null;var bx=b.closest('#tuo,#tuo2');if(bx)bx.innerHTML='';break;
   case 'tuook':if(pending){data=pending;pending=null;data.meta.mod=nowIso();data.meta.lastExport=nowIso();save();sheet=null;view={v:'asiakkaat'};render();toast('Tiedot tuotu');}break;
  }});
window.addEventListener('focus',function(){var t=MF.iso(new Date());if(t!==TODAY&&!sheet)render();});
window.addEventListener('pagehide',function(){if(view.v==='muistio')draftSave();sheetNoteSave();});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(view.v==='muistio')draftSave();sheetNoteSave();}});
var rzT=0,wasWide=wideCal();window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){if(view.v==='kalenteri'&&wideCal()!==wasWide){wasWide=wideCal();render();}},150);});
render();
})();
