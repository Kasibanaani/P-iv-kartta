<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mätsik Forest">
<meta name="theme-color" content="#1a1d22">
<title>Mätsik Forest</title>
<style>
/* Mätsik Forest 0.1 (2.11.2026). Värit ja muodot teeman muuttujista (asetetaan koodissa), järjestelmäfontit kuten Juuressa. */
:root{--bg:#1a1d22;--surface:#23272e;--soft:#33363f;--fg:#eceaea;--muted:#aaa9ae;--line:#363a43;--card-line:#363a43;--accent:#d0354f;--accent-ink:#f07a8c;--on-accent:#fff;
  --crit:#f07a8c;--warn:#e3ac62;--ok:#6cc0a3;--r:3px;--r-s:2px;--r-chip:2px;--mono-r:3px;--card-shadow:none;--gap:6px;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;--disp:var(--body);--disp-w:700;
  --barh:56px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px))}
.band{display:block;width:100%;height:120px;flex:none}
.band.kapea{height:52px}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.band+.hd{padding-top:10px}
.hd h1{margin:0;font-family:var(--disp);font-weight:var(--disp-w);font-size:20px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sub{color:var(--muted);font-size:13px;white-space:nowrap}
.back{background:none;border:0;padding:6px 4px 6px 0;color:var(--accent-ink);font-weight:600;font-size:15px}
.main{padding:0 max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--gap)}
.sum{color:var(--muted);font-size:13px;padding:0 4px 4px}
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r);box-shadow:var(--card-shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--card-line);
  border-radius:var(--r);box-shadow:var(--card-shadow);text-align:left;width:100%}
.mono{width:36px;height:36px;border-radius:var(--mono-r);display:grid;place-items:center;font-weight:700;background:var(--soft)}
.nm{font-weight:700;line-height:1.25}
.nm small{font-weight:400;color:var(--muted);font-size:13px}
.more{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.hj{display:flex;align-items:flex-start;gap:7px;font-size:14px;line-height:1.35;margin-top:3px;color:var(--fg)}
.hj .d{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);margin-top:5px}
.hs-pill .hj{background:color-mix(in srgb,var(--c) 18%,var(--surface));padding:4px 8px 4px 7px;border-radius:var(--r-chip);width:fit-content;max-width:100%}
.hs-stripe .hj{border-left:3px solid var(--c);padding-left:7px}
.hs-stripe .hj .d{display:none}
.crit{--c:var(--crit)}.warn{--c:var(--warn)}.ok{--c:var(--ok)}
.hjrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.hjrow .hj{flex:1 1 200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 12px;font-size:14px;font-weight:600;min-height:36px;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.link{border:0;background:none;color:var(--accent-ink);padding:6px 2px;min-height:0}
.btn.del{color:var(--crit)}
.btn.sm{font-size:13px;padding:4px 10px;min-height:30px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{padding:0;gap:0}
.sec>summary{list-style:none;display:flex;align-items:baseline;gap:8px;padding:11px 12px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary b{font-weight:700}
.sec>summary .pv{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>summary .n{font-size:12px;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-radius:var(--r-chip);padding:0 7px}
.sec>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);align-self:center;margin-left:auto;flex:none}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:13px;color:var(--muted);font-weight:600}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:16px;min-width:0}
textarea{resize:none;min-height:44px;line-height:1.4;overflow:hidden}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:6px 11px;font-size:14px;min-height:34px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:var(--r-chip);background:var(--soft);color:var(--fg)}
.chip.st{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.grp{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.goal{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.goal>.top{display:flex;gap:8px;align-items:flex-start}
.goal>.top .t{flex:1;min-width:0;font-weight:600}
.syy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.note{display:flex;flex-direction:column;gap:6px}
.note .txt{white-space:pre-wrap;word-break:break-word;font-size:15px}
.note .txt mark{background:none;color:var(--accent-ink);font-weight:600}
.ent{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.ent .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.ent .rv{font-size:14px;word-break:break-word}
.ent.peruttu .rv{text-decoration:line-through;color:var(--muted)}
.wkh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 0}
.wkh b{font-family:var(--disp);font-weight:var(--disp-w)}
.empty{color:var(--muted);text-align:center;padding:24px 12px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:4px}
.bar button{flex:1;background:none;border:0;padding:10px 4px;font-size:14px;color:var(--muted);border-radius:var(--r-s);min-height:44px}
.bar button[aria-current=true]{color:var(--fg);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.bar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crit);margin-left:4px;vertical-align:2px}
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet>.pn{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:var(--r) var(--r) 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pn h2{margin:0;font-family:var(--disp);font-weight:var(--disp-w);font-size:18px;display:flex;gap:8px;align-items:center}
.pn h2 span{flex:1}
.x{background:none;border:0;width:40px;height:40px;position:relative;flex:none}
.x::before,.x::after{content:'';position:absolute;left:11px;right:11px;top:19px;height:2px;background:var(--muted);transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.q{font-size:17px;font-weight:700;margin:0}
.path{font-size:13px;color:var(--muted);margin:0}
.party{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.res{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:var(--r);padding:10px 12px;font-weight:700}
.msg{font-size:14px;color:var(--muted)}
pre.out{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:200px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:8px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--r-s);font-size:14px;z-index:30;max-width:90%}
@media (min-width:900px){.main{padding-inline:20px}.band{height:150px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bar" id="bar" aria-label="Osiot"></nav>
<div id="sheet"></div>
<script id="engine">
/* Mätsik Forest – moottori (ei DOMia). Tallennus, säännöt ja herjat, aikasanat, arviointikierros. */
var MF=(function(){
var VER=1, KEY='matsik:v1', APP='matsik', FILE='Mätsik Forest.json';

/* ---------- päivämäärät (paikallinen YYYY-MM-DD) ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);}
function dow(s){return (parse(s).getDay()+6)%7;} /* ma=0 … su=6 */
function monday(s){return addDays(s,-dow(s));}
function week(s){var d=parse(s),t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7)),f=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-f)/864e5-3+((f.getDay()+6)%7))/7);}
function months(a,b){/* kokonaisia kuukausia a→b */var x=parse(a),y=parse(b);if(!x||!y)return 0;var m=(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth();if(y.getDate()<x.getDate())m--;return m;}
var VK=['ma','ti','ke','to','pe','la','su'];
function fi(s){var d=parse(s);return d?VK[dow(s)]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.':'';}
function fiShort(s){var d=parse(s);return d?d.getDate()+'.'+(d.getMonth()+1)+'.':'';}

/* ---------- tyhjä data ja korjaus ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function empty(){return {asiakkaat:[],muistio:[],asetukset:{teema:'puolukka',shape:'auto',hf:'auto',bf:'auto',kuvitus:'kaista',diagnoosit:[],
  valit:{esitiedot:6,koulu:6,sosiaali:6,tarve:6,toimet:6,tavoite:3,tilanne:12}},meta:{lastExport:'',mod:''}};}
var SEK=['tulosyy','diagnoosit','esitiedot','kehitys','tilanne','koulu','sosiaali','vahvuudet','tarve','toimet','seuranta'];
var MITAT=[['paino','Paino'],['pituus','Pituus'],['rr','Verenpaine'],['pulssi','Pulssi'],['neuro','Neurologiset oireet']];
function newClient(nimi,today){var a={id:uid(),nimi:String(nimi||'').trim(),luotu:today,syyt:[],tavoitteet:[]};SEK.forEach(function(k){a[k]={};});
  a.diagnoosit.v=[];a.toimet.muodot=[];MITAT.forEach(function(m){a.seuranta[m[0]]={vali:'',arvot:[]};});return a;}
function obj(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}
function arr(x){return Array.isArray(x)?x:[];}
function repair(d){var e=empty();d=obj(d);
  var o={asiakkaat:arr(d.asiakkaat).filter(function(a){return a&&typeof a.nimi==='string';}),muistio:arr(d.muistio).filter(function(n){return n&&typeof n.text==='string';}),
    asetukset:Object.assign({},e.asetukset,obj(d.asetukset)),meta:Object.assign({},e.meta,obj(d.meta))};
  o.asetukset.valit=Object.assign({},e.asetukset.valit,obj(o.asetukset.valit));o.asetukset.diagnoosit=arr(o.asetukset.diagnoosit).filter(function(x){return typeof x==='string';});
  o.asiakkaat.forEach(function(a){if(!a.id)a.id=uid();SEK.forEach(function(k){a[k]=obj(a[k]);});a.diagnoosit.v=arr(a.diagnoosit.v);a.toimet.muodot=arr(a.toimet.muodot);
    MITAT.forEach(function(m){var s=obj(a.seuranta[m[0]]);s.arvot=arr(s.arvot);if(s.vali==null)s.vali='';a.seuranta[m[0]]=s;});
    a.syyt=arr(a.syyt).filter(Boolean);a.tavoitteet=arr(a.tavoitteet).filter(Boolean);
    a.tavoitteet.forEach(function(t){if(!t.id)t.id=uid();t.arviot=arr(t.arviot);t.taso=[1,2,3].indexOf(+t.taso)>=0?+t.taso:3;});});
  o.muistio.forEach(function(n){if(!n.id)n.id=uid();n.tila=obj(n.tila);});
  return o;}
function wrap(d,now){return {app:APP,ver:VER,savedAt:now||new Date().toISOString(),data:d};}
function unwrap(o){/* hyväksyy tiedoston tai pelkän datan; palauttaa korjatun datan tai null */
  if(!o||typeof o!=='object')return null;if(o.app&&o.app!==APP)return null;var d=o.data||o;if(!Array.isArray(d.asiakkaat))return null;return repair(d);}

/* ---------- aikasanat muistiinpanosta ---------- */
var VKS=[['maanantai','ma'],['tiistai','ti'],['keskiviikko','ke'],['torstai','to'],['perjantai','pe'],['lauantai','la'],['sunnuntai','su']];
var KAYNTI=/(käyn|vastaanot|tapaami|puhel|soitto|soitan|neuvottel|verkostop|kotikäyn)/i, LAAK=/(lääkär|\blääk\b|\blk\b)/i;
var MUOTO=[['perhe',/perhe/i],['koti',/koti/i],['puhelu',/(puhel|soitto|soitan)/i],['verkosto',/verkosto/i],['yksilo',/yksilö/i]];
function nextDow(today,k){var n=(k-dow(today)+7)%7;return addDays(today,n);}
function lineDates(line,today){/* [{pos,date}] */var out=[],m,re;
  re=/(^|[^\d])(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})?/g;
  while((m=re.exec(line))){var dd=+m[2],mm=+m[3],yy=m[4]?(m[4].length===2?2000+(+m[4]):+m[4]):parse(today).getFullYear();
    if(dd<1||dd>31||mm<1||mm>12)continue;var s=yy+'-'+pad(mm)+'-'+pad(dd);if(!m[4]&&months(s,today)>=6)s=(yy+1)+'-'+pad(mm)+'-'+pad(dd);
    out.push({pos:m.index+m[1].length,date:s,exp:true});}
  var low=line.toLowerCase();
  [['ylihuomenna',2],['huomenna',1],['tänään',0]].forEach(function(w){var i=low.search(new RegExp('(^|[^a-zåäö])'+w[0]+'(?![a-zåäö])'));if(i>=0)out.push({pos:i,date:addDays(today,w[1])});});
  VKS.forEach(function(v,k){var r=new RegExp('(^|[^a-zåäö])('+v[0]+'(na|nä)?|'+v[1]+'(?=\\s+(klo\\s*)?\\d))(?![a-zåäö])','g'),q;
    while((q=r.exec(low)))out.push({pos:q.index+q[1].length,date:nextDow(today,k),wd:true});});
  out.sort(function(a,b){return a.pos-b.pos;});
  /* viikonpäivä + päiväys peräkkäin = sama ajankohta, päiväys voittaa */
  var res=[];out.forEach(function(x){var p=res[res.length-1];if(p&&x.pos-p.pos<16&&(p.wd&&x.exp||p.exp&&x.wd)){if(x.exp)res[res.length-1]=x;return;}res.push(x);});
  return res;}
function lineTimes(line){var out=[],m,re=/(?:klo\s*(\d{1,2})(?:[.:](\d{2}))?)|(?:(^|[^\d.])(\d{1,2}):(\d{2})(?!\d))/gi;
  while((m=re.exec(line))){var h=+(m[1]||m[4]),mi=+(m[2]||m[5]||0);if(h<24&&mi<60)out.push({pos:m.index,klo:pad(h)+':'+pad(mi)});}return out;}
function stems(a){var n=a.nimi.toLowerCase().trim();return n.length<=4?n:n.slice(0,Math.max(3,n.length-2));}
function mentions(text,asiakkaat){/* asiakkaat, joiden nimi esiintyy tekstissä sanana tai taivutettuna */
  var low=' '+text.toLowerCase()+' ';return asiakkaat.filter(function(a){if(!a.nimi)return false;var full=a.nimi.toLowerCase().trim(),st=stems(a);
    var r=new RegExp('[^a-zåäö0-9]('+esc(full)+'|'+esc(st)+'[a-zåäö]*)(?![a-zåäö0-9])');return r.test(low);});}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function entries(note,asiakkaat,today){/* kalenterimerkinnät yhdestä muistiinpanosta */
  var res=[],all=mentions(note.text,asiakkaat);note.text.split('\n').forEach(function(line,li){
    var ds=lineDates(line,note.day||today);if(!ds.length)return;var ts=lineTimes(line),who=mentions(line,asiakkaat);if(!who.length)who=all;
    ds.forEach(function(d,i){var nx=ds[i+1]?ds[i+1].pos:1e9,t=ts.filter(function(x){return x.pos>=d.pos-12&&x.pos<nx;})[0];
      var key=d.date+'|'+li,isK=KAYNTI.test(line);var muoto='';MUOTO.some(function(m){if(m[1].test(line)){muoto=m[0];return true;}return false;});
      res.push({note:note.id,key:key,date:d.date,klo:t?t.klo:'',as:who.map(function(a){return a.id;}),kaynti:isK&&who.length>0,laakari:LAAK.test(line),muoto:muoto,
        rivi:line.trim(),tila:(note.tila||{})[key]||''});});});
  return res;}
function allEntries(d,today){var r=[];d.muistio.forEach(function(n){if(!n.arch)r=r.concat(entries(n,d.asiakkaat,today));});
  r.sort(function(a,b){return (a.date+(a.klo||'99'))<(b.date+(b.klo||'99'))?-1:1;});return r;}

/* ---------- säännöt ja herjat ---------- */
var TIHEYS={'1/vk':{per:'vk',n:1},'2/vk':{per:'vk',n:2},'2/kk':{per:'ikk',n:1},'1/kk':{per:'seur'},'harv':{per:'seur'}};
var TIHN={'1/vk':'1/vk','2/vk':'2/vk','2/kk':'2/kk','1/kk':'1/kk','harv':'harvemmin'};
var VALIOSIO={esitiedot:'Esitiedot',koulu:'Koulu',sosiaali:'Sosiaalityö',tarve:'Hoidon tarve',toimet:'Hoitotoimet'};
function filled(o){return Object.keys(o||{}).some(function(k){var v=o[k];return k!=='u'&&(Array.isArray(v)?v.length:typeof v==='string'?v.trim():v);});}
function herjat(a,d,today,E){/* E = allEntries(d,today) valmiiksi laskettuna (valinnainen) */
  E=E||allEntries(d,today);var V=d.asetukset.valit,h=[];
  function add(sev,taso,laji,osio,teksti,x){h.push(Object.assign({sev:sev,taso:taso,laji:laji,osio:osio,teksti:teksti},x||{}));}
  if(!String(a.tulosyy.t||'').trim())add('warn',0,'puuttuu','tulosyy','Tulosyy puuttuu');

function shareFile(txt,name,done){function linkSave(){try{var url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);done('Tiedosto '+name+' annettu tallennettavaksi.');}catch(e){done('',true);}}
  try{var f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(function(){done('Tiedosto '+name+' annettu tallennettavaksi.');},
    function(err){if(err&&err.name==='AbortError')done('Vienti peruttiin.',false,true);else linkSave();});return;}}catch(e){}linkSave();}

  else if(pre.indexOf('mit:')===0)o=a.seuranta[pre.slice(4)];else{o=a[pre];if(o)o.u=TODAY;}
  if(!o)return;o[key]=val;if(pre.indexOf('tav:')===0)o.u=o.u||TODAY;save();}

   case 'abak':var hs=sheet.hist.pop();sheet.polku.pop();sheet.step=hs.step;sheet.res=hs.res;sheet.per=hs.per;renderSheet();break;
   case 'aok':var g=a.tavoitteet.filter(function(x){return x.id===sheet.t;})[0];MF.saveArvio(g,sheet.polku,sheet.res,$('alisa').value.trim(),TODAY);openGoal[g.id]=true;sheet=null;save();render();toast('Arvio kirjattu');break;
   case 'tehty':var g2=a.tavoitteet.filter(function(x){return x.id===D.t;})[0];if(g2&&g2.arviot[+D.i]){g2.arviot[+D.i].tehty=TODAY;save();render();toast('Merkitty tehdyksi');}break;
   case 'mitta':var ms=a.seuranta[D.m],mv=$('mv-'+D.m).value.trim();ms.arvot.push({pvm:TODAY,arvo:mv});save();render();toast('Kirjattu');break;
   case 'kaynti':sheet={k:'note',text:cl(D.id).nimi+' käynti '};renderSheet();var ta=$('nt');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}break;
   case 'note':if(e.target.closest('button'))return;sheet={k:'note',id:D.id};confirmDel='';renderSheet();break;
   case 'ntok':var tx=$('nt').value.replace(/\s+$/,'');if(sheet.id){var nn=data.muistio.filter(function(x){return x.id===sheet.id;})[0];if(nn){nn.text=tx;nn.edited=nowIso();}}
     else if(tx.trim())data.muistio.push({id:MF.uid(),created:nowIso(),edited:nowIso(),day:TODAY,text:tx,tila:{}});sheet=null;save();render();break;
   case 'notesave':var t2=$('newnote').value.replace(/\s+$/,'');if(!t2.trim())return;data.muistio.push({id:MF.uid(),created:nowIso(),edited:nowIso(),day:TODAY,text:t2,tila:{}});save();render();toast('Tallennettu');break;
   case 'tila':var n3=data.muistio.filter(function(x){return x.id===D.n;})[0];if(n3){n3.tila=n3.tila||{};if(D.v)n3.tila[D.k]=D.v;else delete n3.tila[D.k];save();render();}break;
   case 'vie':vie();break;
   case 'tuoteksti':sheet={k:'tuoteksti'};renderSheet();break;
   case 'ttok':offerImport($('tt').value,'tuo2');break;
   case 'tuoperu':pending=null;var bx=b.closest('#tuo,#tuo2');if(bx)bx.innerHTML='';break;
   case 'tuook':if(pending){data=pending;pending=null;data.meta.mod=nowIso();data.meta.lastExport=nowIso();save();sheet=null;view={v:'asiakkaat'};render();toast('Tiedot tuotu');}break;
  }});
window.addEventListener('focus',function(){var t=MF.iso(new Date());if(t!==TODAY&&!sheet)render();});
render();
})();
</script>
</body>
