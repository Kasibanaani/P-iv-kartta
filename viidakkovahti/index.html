<style>
/* Rakenne: yksi sarake puhelimelle. Aloitusnäkymä vierii: pelaaja, vaikeustaso, aloitus, ennätykset.
   Pelinäkymä on lukittu (main.lock): kenttä täyttää ruudun, alla neljä eläinpainiketta. Kenttä piirretään canvas-elementtiin. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --label:#000000; --label2:#6C6C70; --sep:#C6C6C8;
  --seg:rgba(118,118,128,.14); --red:#D70015; --ok:#1F7A37;
  --accent:#1F7A37; --solid:#1F7A37; --on-solid:#FFFFFF; --fill2:#AEDDB9;
  --jg:#2E6B3B; --jg2:#3B8049; --grass:#BDE39C; --grass2:#CDEBB2; --line:rgba(20,70,25,.45); --home:rgba(215,0,21,.14);
  --rock:#9A9AA2; --rock2:#6E6E78; --rock3:#C4C4CC; --dirt:#7A5230; --pit:#2A1B10;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding:0 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --sep:#38383A;
    --seg:rgba(118,118,128,.24); --red:#FF453A; --ok:#30D158;
    --accent:#30D158; --solid:#1F8A3E; --on-solid:#FFFFFF; --fill2:#1B5A2C;
    --jg:#0F2A17; --jg2:#17401F; --grass:#2F5E36; --grass2:#376B3E; --line:rgba(255,255,255,.4); --home:rgba(255,69,58,.2);
    --rock:#6B6B74; --rock2:#3F3F47; --rock3:#8E8E98; --dirt:#5E4026; --pit:#120B06;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --sep:#38383A;
  --seg:rgba(118,118,128,.24); --red:#FF453A; --ok:#30D158;
  --accent:#30D158; --solid:#1F8A3E; --on-solid:#FFFFFF; --fill2:#1B5A2C;
  --jg:#0F2A17; --jg2:#17401F; --grass:#2F5E36; --grass2:#376B3E; --line:rgba(255,255,255,.4); --home:rgba(255,69,58,.2);
  --rock:#6B6B74; --rock2:#3F3F47; --rock3:#8E8E98; --dirt:#5E4026; --pit:#120B06;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
input,textarea,button,dialog *{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--font);
  font-size:17px;line-height:1.35;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

/* ---- yläpalkki ---- */
.top{flex:none;display:flex;align-items:center;gap:10px;min-height:44px;padding:calc(env(safe-area-inset-top,0px) + 4px) 16px 6px;background:var(--bg);border-bottom:.5px solid var(--sep)}
.tn{flex:1;min-width:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn small{font-size:14px;font-weight:500;color:var(--label2)}
.hud{flex:none;display:inline-flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-radius:15px;background:var(--cell);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hud .lives{display:inline-flex;gap:3px}
.hud .lives svg{width:16px;height:16px;fill:var(--red)}
.hud .lives svg.off{fill:var(--sep)}
.pause{flex:none;height:30px;padding:0 12px;border:0;border-radius:15px;background:var(--seg);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}

/* ---- sisältö ---- */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 16px 40px}
h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin:28px 0 4px;text-wrap:balance}
.panel>h2:first-child{margin-top:4px}
h3{font-size:15px;font-weight:600;color:var(--label2);margin:20px 0 8px}
.lead{font-size:17px;margin:2px 0 12px;max-width:34em}
.sub{font-size:15px;color:var(--label2);margin:0 0 12px;max-width:36em}
.foot{font-size:13px;color:var(--label2);margin:18px 0 0;max-width:38em}
.msg{font-size:15px;color:var(--label2);margin:10px 0}
.msg:empty{display:none}
.msg.warn{color:var(--red)}
.rows{display:grid;gap:8px}
.card{background:var(--cell);border-radius:12px;padding:12px 16px;font-size:15px;margin:0 0 10px}
.card b{display:block;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:2px}
.card p{margin:0;overflow-wrap:anywhere}
.card p+p{margin-top:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:12px 16px;border:1.5px solid transparent;border-radius:12px;background:var(--cell);text-align:left;font-size:17px;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .tag{flex:none;font-size:13px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.sel{background:var(--solid);color:var(--on-solid);font-weight:600}
.row.sel .tag{color:var(--on-solid);opacity:.9}
.srow{display:grid;grid-template-columns:1fr 50px;gap:6px}
.edit{display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:var(--cell);color:var(--accent);cursor:pointer}
.edit svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:0;border-radius:12px;background:var(--seg);color:var(--accent);font-size:17px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--solid);color:var(--on-solid)}
.btn.danger{color:var(--red)}
.btn.wide{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--cell);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);font-weight:600}
input[type="text"],textarea{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--cell);font-size:17px}
textarea.mono{min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--label2);margin:16px 0 6px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
details.more{margin-top:14px}
details.more summary{font-size:15px;color:var(--accent);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--cell);border-radius:12px;padding:8px 14px 8px 10px;font-size:15px}
.how li svg{width:44px;height:44px}
.how li b{display:block}

/* ---- pelinäkymä: lukittu ---- */
main.lock{overflow:hidden;padding:8px 12px 8px;overscroll-behavior:none}
main.lock,main.lock *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#p-game{display:flex;flex-direction:column;gap:8px;height:100%}
.stage{position:relative;flex:1 1 0;min-height:0;border-radius:14px;overflow:hidden;background:var(--grass)}
#cv{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.42)}
.ov .box{width:100%;max-width:300px;background:var(--bg);border-radius:14px;padding:16px;text-align:center}
.ov h2{margin:0 0 4px}
.ov p{margin:0 0 4px;font-size:15px;color:var(--label2)}
.ov .big{font-size:34px;font-weight:700;letter-spacing:-0.02em;color:var(--label);font-variant-numeric:tabular-nums}
.ov .rec{color:var(--ok);font-weight:700}
.ov .btn{width:100%;margin-top:8px}
.ammo{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.am{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:clamp(64px,10vh,84px);padding:4px;border:2px solid transparent;border-radius:14px;background:var(--cell);font-size:13px;font-weight:600;cursor:pointer}
.am svg{width:auto;height:58%;aspect-ratio:1;pointer-events:none}
.am span{pointer-events:none}
.am[aria-pressed="true"]{border-color:var(--accent);background:var(--fill2)}
.am:disabled{opacity:.4;cursor:default}
.am::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:var(--seg);pointer-events:none}
.am .n{position:absolute;right:6px;top:4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--solid);color:var(--on-solid);font-size:13px;line-height:22px;font-variant-numeric:tabular-nums}

/* ---- alhaalta nouseva ikkuna ---- */
dialog{border:0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));margin:auto auto 0;width:100%;max-width:560px;max-height:88%;
  border-radius:14px 14px 0 0;background:var(--bg);color:var(--label);overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
dialog h2{margin:0 0 8px}
</style>

<body>
<div class="app">
  <header class="top" id="top">
    <span class="tn" id="tname">Viidakkovahti</span>
    <span class="hud" id="hud" hidden><span class="lives" id="lives" role="img"></span><span id="score">0</span></span>
    <button type="button" class="pause" id="pause" hidden>Tauko</button>
  </header>
  <main id="main">
    <div class="panel" id="p-start"></div>
    <div id="p-game" hidden>
      <div class="stage" id="stage">
        <canvas id="cv" role="img" aria-label="Pelikenttä"></canvas>
        <div class="ov" id="ov" hidden><div class="box" id="ovbox"></div></div>
      </div>
      <div class="ammo" id="ammo" role="group" aria-label="Eläin ja ammus"></div>
    </div>
  </main>
</div>

<dialog id="psheet" aria-labelledby="ps-h">
  <div class="grab"></div>
  <h2 id="ps-h">Muokkaa pelaajaa</h2>
  <label class="fl" for="ps-name">Nimi</label><input type="text" id="ps-name" autocomplete="off" enterkeyhint="done" maxlength="40">
  <p class="sub" style="margin:12px 0 0">Poistaminen hävittää tämän pelaajan pisteet ja ennätykset.</p>
  <div class="btnrow"><button type="button" class="btn solid" id="ps-ok">Valmis</button><button type="button" class="btn danger" id="ps-del">Poista pelaaja</button></div>
</dialog>

<script>
/* ===================== LOGIIKKA =====================
   Ei kosketa sivuun: sama koodi ajetaan testeissä Nodella.
   Kenttä on 100 yksikköä leveä ja G.H yksikköä korkea (riippuu näytön muodosta). Viholliset tulevat ylhäältä ja kulkevat alas.
   Eläin on alareunassa keskellä. Vihollinen, joka pääsee kotirajan (G.homeY) yli, vie yhden elämän. */
var W=100,H0=150;             // H0 = korkeus, jolle nopeudet on mitoitettu; muilla korkeuksilla nopeus skaalataan, jotta matka-aika pysyy samana
/* Pisteet: banaanilla kaadettu vihollinen antaa tyyppinsä pisteet (pts). Ohi mennyt banaani, eli sellainen joka ei osu yhteenkään viholliseen, vie yhden pisteen.
   Vesimelonilla yksi kaadettu antaa saman kuin banaanilla. Jos meloni kaataa monta kerralla, niiden pisteiden summa kerrotaan kaatuneiden määrällä
   (kaksi tavallista 4, kolme 9, neljä 16; nopea ja tavallinen yhdessä 2 x 3 = 6). Koloon pudonneesta ei saa pisteitä. Kivien siirrosta ei saa pisteitä. */
var TYPES={                   // spd = yksikköä sekunnissa, hp = montako banaania kestää, r = säde, pts = pisteet banaanilla kaadettuna
  perus:{spd:9.5,hp:1,r:4.6,pts:1},
  nopea:{spd:16,hp:1,r:4,pts:2},
  jarea:{spd:6.5,hp:3,r:5.6,pts:3}};
/* Vaikeustaso: spd = nopeuskerroin, gap0 = vihollisten väli sekunteina pelin alussa, ramp = sekunnit, joiden kuluttua vihollisia tulee kaksi kertaa
   niin tiheään kuin alussa (tahti kiihtyy samaa vauhtia koko pelin ajan, joten jokainen peli päättyy joskus), fast/tough = nopeiden ja järeiden osuus,
   group = kuinka usein tulee ryhmä. */
var LEVELS={
  helppo:{n:'Helppo',spd:0.8,gap0:2.6,ramp:150,fast:0.12,tough:0.10,group:0.12,d:'Vihollisia tulee harvakseltaan ja ne kulkevat hitaasti. Tahti kiihtyy rauhallisesti.'},
  tavallinen:{n:'Tavallinen',spd:1,gap0:1.9,ramp:110,fast:0.18,tough:0.15,group:0.16,d:'Vihollisia tulee tasaiseen tahtiin, ja tahti kiihtyy pelin edetessä.'},
  vaikea:{n:'Vaikea',spd:1.25,gap0:1.4,ramp:80,fast:0.24,tough:0.2,group:0.2,d:'Vihollisia tulee tiheään, ne ovat nopeita, ja järeitä on paljon. Tahti kiihtyy nopeasti.'}};
var LEVEL_IDS=['helppo','tavallinen','vaikea'];
var BAN={spd:150,r:2.2,cd:0.3};   // banaani: nopea, suora, pysähtyy esteeseen ja ensimmäiseen viholliseen
var MEL={r:12,cd:1.4};            // vesimeloni: lentää kaaressa napautettuun kohtaan, pläsähdyksen säde r, elefantin latausaika cd
var HOLE={r:5.2,n:3};             // myyrän kolo: säde ja kolojen määrä pelissä
var LIVES=3,MIN_GAP=13;           // esteiden väliin jää aina vähintään MIN_GAP, josta järeäkin (halkaisija 11,2) mahtuu
var ROCK={spd:300,pad:4,top:5};   // gorilla: kiven suurin siirtonopeus (yksikköä sekunnissa), tarttumisvara sormelle kiven reunan ulkopuolella, pienin väli yläreunaan

function rngOf(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function nm(x){return String(x===undefined||x===null?'':x).trim().replace(/\s+/g,' ');}

/* ---------- kartta: joka pelissä arvotaan uudet esteet ---------- */
/* Este on joko kiinni seinässä tai vähintään MIN_GAP päässä siitä, ja esteiden väliin jää vähintään MIN_GAP. Näin läpi pääsee aina. */
function makeMap(H,rng){var n=4+Math.floor(rng()*4),obst=[],tries=0;
  while(obst.length<n&&tries<600){tries++;var r=5+rng()*3.5,x=rng()*W,y=H*(0.18+rng()*0.5),ok=true,i;
    if(x-r<MIN_GAP)x=r*0.4;else if(W-(x+r)<MIN_GAP)x=W-r*0.4;
    for(i=0;i<obst.length;i++){var o=obst[i];if(Math.hypot(x-o.x,y-o.y)-r-o.r<MIN_GAP){ok=false;break;}}
    if(ok)obst.push({x:x,y:y,r:r});}
  return obst;}

/* ---------- peli ---------- */
function newGame(lv,H,rng){if(!LEVELS[lv])lv='tavallinen';H=clamp(H||H0,90,230);
  return {lv:lv,H:H,homeY:H-13,ax:W/2,ay:H-6.5,t:0,score:0,kills:0,misses:0,lives:LIVES,over:false,paused:false,sel:'ban',holesLeft:HOLE.n,drag:null,
    seq:0,spawnT:1.2,cdBan:0,cdMel:0,enemies:[],shots:[],holes:[],obst:makeMap(H,rng)};}
function spawnOne(G,rng,type,x,y){var T=TYPES[type],L=LEVELS[G.lv];G.seq++;
  var e={id:G.seq,type:type,x:x,y:y,hp:T.hp,r:T.r,spd:T.spd*L.spd*(1+0.25*Math.min(2,G.t/L.ramp)),amp:0.25+rng()*0.55,f:0.7+rng()*1.1,ph:rng()*6.283};
  G.enemies.push(e);return e;}
function spawnGap(G){var L=LEVELS[G.lv];return Math.max(0.22,L.gap0/(1+G.t/L.ramp));}
function spawnTick(G,dt,rng){G.spawnT-=dt;if(G.spawnT>0)return;var L=LEVELS[G.lv];
  G.spawnT=spawnGap(G)*(0.7+rng()*0.6);
  var u=rng(),type=u<L.fast?'nopea':u<L.fast+L.tough?'jarea':'perus',x=6+rng()*88;
  if(rng()<L.group){var n=2+Math.floor(rng()*3);for(var i=0;i<n;i++)spawnOne(G,rng,'perus',clamp(x+(rng()-0.5)*18,6,94),-5-rng()*10);} // ryhmä: hyvä kohde vesimelonille
  else spawnOne(G,rng,type,x,-5);}
/* Vihollinen kulkee alaspäin ja mutkittelee. Jos edessä on este, se kiertää lähimmän: sille puolelle, jolla se jo on, paitsi jos siellä ei ole tilaa
   seinän vieressä. Valittu puoli pysyy samana koko kierron ajan (e.oi, e.od), jottei vihollinen jää empimään esteen eteen. */
function moveEnemy(G,e,dt){var k=G.H/H0,spd=e.spd*k,vx=spd*e.amp*Math.sin(e.f*G.t+e.ph),vy=spd,i,o,best=-1,bd=1e9;
  for(i=0;i<G.obst.length;i++){o=G.obst[i];var dx=e.x-o.x,dy=o.y-e.y;
    if(dy>0&&dy<o.r+e.r+16&&Math.abs(dx)<o.r+e.r&&dy<bd){bd=dy;best=i;}}
  if(best>=0){o=G.obst[best];var bx=e.x-o.x,m0=o.r+e.r;
    if(e.oi!==best){e.oi=best;e.od=bx>0.3?1:bx<-0.3?-1:(e.id%2?1:-1);}
    if(e.od>0&&W-(o.x+o.r)<2*e.r+1)e.od=-1;else if(e.od<0&&o.x-o.r<2*e.r+1)e.od=1;   // tarkistetaan joka askeleella, koska gorilla voi siirtää kiven seinän viereen
    vx=e.od*spd*(1.1+1.5*(1-Math.min(1,Math.abs(bx)/m0)));
    if(bd<m0+3)vy*=0.6;}
  else e.oi=-1;
  e.x+=vx*dt;e.y+=vy*dt;
  for(i=0;i<G.obst.length;i++){o=G.obst[i];var ax=e.x-o.x,ay=e.y-o.y,d=Math.hypot(ax,ay),m=o.r+e.r;
    if(d<m){if(d<0.01){ax=e.id%2?1:-1;ay=0;d=1;}e.x=o.x+ax/d*m;e.y=o.y+ay/d*m;}}
  var cx=clamp(e.x,e.r,W-e.r);
  if(cx!==e.x){e.x=cx;   // seinä tuli vastaan: jos vihollinen jäi kiven ja seinän väliin, se väistää pystysuunnassa eikä painu kiven sisään
    for(i=0;i<G.obst.length;i++){o=G.obst[i];ax=e.x-o.x;ay=e.y-o.y;m=o.r+e.r;if(ax*ax+ay*ay<m*m)e.y=o.y+(ay<0?-1:1)*Math.sqrt(m*m-ax*ax);}}}
/* ---------- gorilla: kiven siirto raahaamalla ---------- */
/* Lähin sallittu paikka kivelle i kohdan (x,y) läheltä: kentän sisällä, kotirajan yläpuolella ja vähintään MIN_GAP päässä muista kivistä,
   jotta väleistä mahtuu aina läpi eikä kenttää voi muurata umpeen. Palauttaa null, jos sallittua paikkaa ei löydy läheltä. */
function rockFit(G,i,x,y){var o=G.obst[i],k,j,p,d,m,hit;
  for(k=0;k<8;k++){x=clamp(x,o.r*0.4,W-o.r*0.4);y=clamp(y,o.r+ROCK.top,G.homeY-o.r-1);hit=false;
    for(j=0;j<G.obst.length;j++){if(j===i)continue;p=G.obst[j];m=o.r+p.r+MIN_GAP;d=Math.hypot(x-p.x,y-p.y);
      if(d<m-1e-4){if(d<0.01)x=p.x+m+0.001;else{x=p.x+(x-p.x)/d*(m+0.001);y=p.y+(y-p.y)/d*(m+0.001);}hit=true;}}
    if(!hit)return {x:x,y:y};}
  return null;}
/* G.drag = siirrossa oleva kivi: i = kiven numero, ox/oy = tartuntakohdan ero kiven keskipisteeseen, tx/ty = minne sormi kiveä vie,
   gx/gy = lähin sallittu paikka sille (sinne kivi liukuu), rel = sormi on jo irti ja kivi liukuu vielä paikalleen. */
function settle(G){var D=G.drag;if(D&&G.obst[D.i]){G.obst[D.i].x=D.gx;G.obst[D.i].y=D.gy;}G.drag=null;}
/* Sormi tarttuu kiveen. Onnistuu vain, kun gorilla on valittuna. Kivi pitää saman kohdan sormen alla, josta siihen tartuttiin. */
function grab(G,x,y){if(G.over||G.paused||G.sel!=='gor')return {k:'none'};var best=-1,bd=1e9,i,o,d;
  if(G.drag){if(!G.drag.rel)return {k:'none'};settle(G);}
  for(i=0;i<G.obst.length;i++){o=G.obst[i];d=Math.hypot(x-o.x,y-o.y);if(d<o.r+ROCK.pad&&d<bd){bd=d;best=i;}}
  if(best<0)return {k:'none'};o=G.obst[best];G.drag={i:best,ox:o.x-x,oy:o.y-y,tx:o.x,ty:o.y,gx:o.x,gy:o.y,rel:false};return {k:'grab',i:best};}
function dragTo(G,x,y){var D=G.drag;if(!D||D.rel||G.over||G.paused)return false;D.tx=x+D.ox;D.ty=y+D.oy;return true;}
/* Sormi nousee. Jos kivi on vielä matkalla sallittuun paikkaansa, se liukuu sinne loppuun asti. */
function drop(G){var D=G.drag;if(!D||D.rel)return false;var o=G.obst[D.i],g=rockFit(G,D.i,D.tx,D.ty);if(g){D.gx=g.x;D.gy=g.y;}
  if(Math.hypot(D.gx-o.x,D.gy-o.y)<0.001)G.drag=null;else D.rel=true;return true;}
/* Vihollinen väistää siirtyvää kiveä sivulle: sille puolelle, jolla se jo on, tai toiselle, jos seinä on vastassa. Kivi ei kaada vihollista
   eikä työnnä sitä ylös- tai alaspäin, joten kivellä ei voi lakaista vihollisia takaisin. */
function dodge(G,o,i,e){var m=o.r+e.r,dx=e.x-o.x,dy=e.y-o.y;if(dx*dx+dy*dy>=m*m)return false;
  var w=Math.sqrt(m*m-dy*dy)+0.01,side=dx>0.01?1:dx<-0.01?-1:(e.od||(e.id%2?1:-1));
  if(side>0&&W-(o.x+o.r)<2*e.r+1)side=-1;else if(side<0&&o.x-o.r<2*e.r+1)side=1;
  e.x=clamp(o.x+side*w,e.r,W-e.r);e.oi=i;e.od=side;return true;}
/* Kivi liukuu kohti sormen alla olevaa lähintä sallittua paikkaa enintään nopeudella ROCK.spd. Lepopaikka on aina sallittu;
   matkalla kivi saa ylittää toisen kiven, jottei se jää jumiin toisen kiven ja seinän väliin. */
function moveRock(G,dt){var D=G.drag,o=G.obst[D.i],g,i;if(!o){G.drag=null;return;}
  if(!D.rel){g=rockFit(G,D.i,D.tx,D.ty);if(g){D.gx=g.x;D.gy=g.y;}}
  var dx=D.gx-o.x,dy=D.gy-o.y,d=Math.hypot(dx,dy),max=ROCK.spd*dt;
  if(d<=max){o.x=D.gx;o.y=D.gy;}else{o.x+=dx/d*max;o.y+=dy/d*max;}
  for(i=0;i<G.enemies.length;i++)dodge(G,o,D.i,G.enemies[i]);
  if(D.rel&&d<=max)G.drag=null;}
function kill(G,e,how,ev,pts){e.dead=how;G.kills++;G.score+=pts;ev.push({k:how,x:e.x,y:e.y,type:e.type,pts:pts});}
function missed(G,s,ev){G.score--;G.misses++;ev.push({k:'miss',x:clamp(s.x,4,W-4),y:clamp(s.y,8,G.homeY)});} // ohi mennyt banaani
/* Napautus kentälle. Palauttaa mitä tapahtui: 'ban', 'mel', 'hole', 'wait' (lataus kesken), 'blocked' (koloa ei voi kaivaa esteeseen) tai 'none'.
   Gorilla ei ammu: kun se on valittuna, napautus ei tee mitään (kiveen tartutaan grab-funktiolla). */
function fire(G,x,y){if(G.over||G.paused)return {k:'none'};x=clamp(x,0,W);y=clamp(y,0,G.homeY);
  if(G.sel==='ban'){if(G.cdBan>0)return {k:'wait'};var dx=x-G.ax,dy=y-G.ay,d=Math.hypot(dx,dy)||1;
    G.shots.push({k:'ban',x:G.ax,y:G.ay,dx:dx/d,dy:dy/d});G.cdBan=BAN.cd;return {k:'ban'};}
  if(G.sel==='mel'){if(G.cdMel>0)return {k:'wait'};var dist=Math.hypot(x-G.ax,y-G.ay);
    G.shots.push({k:'mel',x0:G.ax,y0:G.ay,x1:x,y1:y,t:0,dur:0.5+dist/120});G.cdMel=MEL.cd;return {k:'mel'};}
  if(G.sel==='mole'){if(G.holesLeft<=0)return {k:'none'};y=Math.min(y,G.homeY-HOLE.r);
    for(var i=0;i<G.obst.length;i++)if(Math.hypot(x-G.obst[i].x,y-G.obst[i].y)<G.obst[i].r+HOLE.r*0.5)return {k:'blocked'};
    G.holes.push({x:x,y:y,r:HOLE.r,t:G.t});G.holesLeft--;if(!G.holesLeft)G.sel='ban';return {k:'hole',x:x,y:y};}
  return {k:'none'};}
function select(G,a){if(G.over)return false;if(a==='mole'&&G.holesLeft<=0)return false;if(a!=='ban'&&a!=='mel'&&a!=='mole'&&a!=='gor')return false;if(a!==G.sel)drop(G);G.sel=a;return true;}
/* Yksi askel eteenpäin. Palauttaa tapahtumat piirtoa varten. */
function stepGame(G,dt,rng){var ev=[],i,j,e,s;if(G.over||G.paused)return ev;
  G.t+=dt;G.cdBan=Math.max(0,G.cdBan-dt);G.cdMel=Math.max(0,G.cdMel-dt);
  if(G.drag)moveRock(G,dt);
  spawnTick(G,dt,rng);
  for(i=0;i<G.enemies.length;i++){e=G.enemies[i];moveEnemy(G,e,dt);
    for(j=0;j<G.holes.length;j++)if(Math.hypot(e.x-G.holes[j].x,e.y-G.holes[j].y)<G.holes[j].r){kill(G,e,'hole',ev,0);break;}
    if(!e.dead&&e.y>=G.homeY){e.dead='home';G.lives--;ev.push({k:'life',x:e.x,y:e.y});}}
  for(i=0;i<G.shots.length;i++){s=G.shots[i];
    if(s.k==='ban'){var steps=Math.max(1,Math.ceil(BAN.spd*dt/2)),st=BAN.spd*dt/steps;
      for(var n=0;n<steps&&!s.dead;n++){s.x+=s.dx*st;s.y+=s.dy*st;
        if(s.y<-3||s.x<-3||s.x>W+3||s.y>G.H+3){s.dead=true;missed(G,s,ev);break;}
        for(j=0;j<G.obst.length;j++)if(Math.hypot(s.x-G.obst[j].x,s.y-G.obst[j].y)<G.obst[j].r){s.dead=true;ev.push({k:'poof',x:s.x,y:s.y});missed(G,s,ev);break;}
        if(s.dead)break;
        for(j=0;j<G.enemies.length;j++){e=G.enemies[j];if(e.dead||e.y<-e.r)continue;
          if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+BAN.r){s.dead=true;e.hp--;if(e.hp<=0)kill(G,e,'hit',ev,TYPES[e.type].pts);else ev.push({k:'dent',x:e.x,y:e.y});break;}}}}
    else{s.t+=dt;if(s.t>=s.dur){s.dead=true;var sp={k:'splat',x:s.x1,y:s.y1,n:0,pts:0},sum=0;ev.push(sp);
        for(j=0;j<G.enemies.length;j++){e=G.enemies[j];if(!e.dead&&Math.hypot(e.x-s.x1,e.y-s.y1)<MEL.r+e.r*0.5){kill(G,e,'splash',ev,0);sp.n++;sum+=TYPES[e.type].pts;}}
        sp.pts=sp.n*sum;G.score+=sp.pts;}}}
  G.enemies=G.enemies.filter(function(x){return !x.dead;});G.shots=G.shots.filter(function(x){return !x.dead;});
  if(G.lives<=0){G.lives=0;G.over=true;settle(G);ev.push({k:'over'});}
  return ev;}

/* ---------- pelaajat ja pisteet ---------- */
function newData(){return {v:1,pseq:0,players:[],cur:null,lv:'tavallinen'};}
function cleanPlayer(p){if(!p||typeof p!=='object')return null;var id=String(p.id),n=nm(p.name);if(!/^p\d+$/.test(id)||!n)return null;
  var b=p.best&&typeof p.best==='object'?p.best:{},o={id:id,name:n.slice(0,40),total:Math.max(0,p.total|0),games:Math.max(0,p.games|0),best:{}};
  LEVEL_IDS.forEach(function(l){o.best[l]=Math.max(0,b[l]|0);});return o;}
function normalize(o){if(!o||typeof o!=='object'||!Array.isArray(o.players))return null;var d=newData(),seen={};
  o.players.forEach(function(p){var c=cleanPlayer(p);if(!c||seen[c.id])return;seen[c.id]=1;d.players.push(c);d.pseq=Math.max(d.pseq,+c.id.slice(1));});
  d.pseq=Math.max(d.pseq,o.pseq|0);d.cur=seen[o.cur]?o.cur:(d.players[0]?d.players[0].id:null);if(LEVELS[o.lv])d.lv=o.lv;return d;}
/* Pelin tulos pelaajalle. Palauttaa true, jos tuli uusi ennätys tällä vaikeustasolla. Miinukselle jäänyt peli ei vähennä kokonaispisteitä. */
function recordGame(d,pid,lv,score){var p=null;d.players.forEach(function(x){if(x.id===pid)p=x;});if(!p||!LEVELS[lv])return false;
  score=score|0;p.games++;p.total+=Math.max(0,score);if(score>p.best[lv]){p.best[lv]=score;return true;}return false;}

function spr(i,x,y,size,rot,alpha){if(!i.c)return false;var s=size*view.s;ctx.save();ctx.translate(view.ox+x*view.s,view.oy+y*view.s);if(rot)ctx.rotate(rot);if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.drawImage(i.c,-s/2,-s/2,s,s);ctx.restore();return true;}
function circ(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(view.ox+x*view.s,view.oy+y*view.s,r*view.s,0,6.2832);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=(lw||0.5)*view.s;ctx.stroke();}}
function oval(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(view.ox+x*view.s,view.oy+y*view.s,rx*view.s,ry*view.s,0,0,6.2832);ctx.fillStyle=fill;ctx.fill();}

  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);ctx.clearRect(0,0,view.w,view.h);
  ctx.fillStyle=pal.grass;ctx.fillRect(0,0,view.w,view.h);
  for(i=0;i<7;i++)oval(8+i*14+(i%2?3:-2),G.H*(0.2+((i*37)%50)/100),7,4,pal.grass2);            // vaaleammat läikät nurmessa
  ctx.fillStyle=pal.jg;ctx.fillRect(0,0,view.w,oy+4*s);for(i=0;i<9;i++)circ(i*12.5,3.5,5.5,i%2?pal.jg2:pal.jg);   // viidakon reuna, josta viholliset tulevat
  ctx.fillStyle=pal.home;ctx.fillRect(0,oy+G.homeY*s,view.w,view.h);                               // kotialue
  ctx.strokeStyle=pal.line;ctx.lineWidth=Math.max(1,0.5*s);ctx.setLineDash([2.2*s,2.2*s]);ctx.beginPath();ctx.moveTo(ox,oy+G.homeY*s);ctx.lineTo(ox+W*s,oy+G.homeY*s);ctx.stroke();ctx.setLineDash([]);
  for(i=0;i<G.holes.length;i++){f=G.holes[i];oval(f.x,f.y,f.r*1.25,f.r*0.95,pal.dirt);oval(f.x,f.y,f.r*0.95,f.r*0.68,pal.pit);}
  var gor=G.sel==='gor',held=G.drag&&!G.drag.rel?G.drag.i:-1,pulse=0.5+0.5*Math.sin(G.t*5);
  for(i=0;i<G.obst.length;i++){f=G.obst[i];var up=i===held;   // gorillan vuorolla kivissä on vaalea rengas: niihin voi tarttua. Kädessä oleva kivi on koholla.
