<!doctype html>
<html lang="fi" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Katve">

<title>Katve – zombipako</title>
<style>
:root {
  color-scheme: dark;
  --bg:#151b18; --cell:#202922; --label:#eef1e9; --label2:#acb8ae;
  --sep:#3b473e; --accent:#a2c9b6; --fill:#2b4032; --tint:#1a251e;
  --amber:#f4c48a; --mint:#abdbba; --danger:#ff9a89;
  --left:max(12px,env(safe-area-inset-left)); --right:max(12px,env(safe-area-inset-right));
  --top:max(10px,env(safe-area-inset-top)); --bottom:max(10px,env(safe-area-inset-bottom));
  font: 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
}
[data-mode="light"] {color-scheme:light}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0;background:#121813;color:var(--label)}
#screen {position:fixed;inset:0;overflow:hidden}
#field {width:100%;height:100%;display:block;touch-action:none}
button,select {font:inherit;color:inherit;min-height:44px;border:1px solid var(--sep);border-radius:11px;background:var(--tint);padding:7px 12px}
button {cursor:pointer;font-weight:650}
button:focus-visible,select:focus-visible,textarea:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
button.primary {background:var(--accent);color:var(--bg);border-color:transparent}
button:disabled {opacity:.5;cursor:default}
.shade {position:absolute;inset:0;display:grid;place-items:center;background:#101511ad;padding:var(--top) var(--right) var(--bottom) var(--left)}
.card {width:min(100%,460px);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--cell);border:1px solid var(--sep);border-radius:24px;padding:clamp(15px,3.9vw,26px);box-shadow:0 20px 70px #0007}
.card h1,.card h2 {margin:0;line-height:1.04;letter-spacing:-.055em}
.card h1 {font-size:clamp(64px,14vw,102px);font-weight:860}
.card h2 {font-size:32px}
.card p {margin:9px 0 14px;color:var(--label2);font-size:14px}
.tag {display:block;margin:0 0 7px;font-size:11px;font-weight:780;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.menuhead {padding-bottom:10px;border-bottom:1px solid var(--sep);margin-bottom:11px}
.menuhead p {margin-bottom:3px}
.actions {display:grid;gap:8px}
.row {display:flex;gap:8px;flex-wrap:wrap}
.row>* {flex:1 1 auto}
.settings {display:grid;gap:7px;margin:10px 0}
.settings label {display:grid;grid-template-columns:1fr minmax(0,1.25fr);align-items:center;gap:8px;font-size:14px}
.menuhead .tag {font-size:12px}
.guide {display:grid;gap:10px;margin:13px 0}
.guide div {border-left:2px solid var(--accent);padding-left:10px;font-size:14px;color:var(--label2)}
.guide strong {display:block;color:var(--label)}
textarea {width:100%;min-height:75px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--label);padding:8px}
#hud {position:absolute;inset:0;pointer-events:none;color:#f5f4ea}
#mission {position:absolute;left:var(--left);top:var(--top);padding:8px 11px;background:#181e1a;border:1px solid #404b42;border-radius:11px;max-width:calc(100% - 190px)}
#sector {display:block;font-size:10px;font-weight:780;letter-spacing:.12em;color:#b5c3b8}
#objective {display:block;font-size:13px;color:var(--amber);font-weight:730}
#meters {position:absolute;top:var(--top);left:50%;transform:translateX(-50%);width:clamp(100px,19vw,166px);display:grid;gap:5px;padding:7px 9px;border:1px solid #404b42;border-radius:11px;background:#181e1a}
.meter {display:grid;grid-template-columns:13px 1fr;align-items:center;gap:5px;font-size:12px;line-height:1.15;color:var(--mint)}
.meter:first-child {color:var(--danger)}
.track {height:5px;border-radius:5px;background:#3d4940;overflow:hidden}
.fill {height:100%;background:currentColor;transform-origin:left}
#signal {font-size:10px;font-weight:740;line-height:1.15;color:#c4d0c5;text-align:center;white-space:nowrap}
#signal.danger {color:var(--danger)}
#signal.noise {color:var(--amber)}
#tools {position:absolute;right:var(--right);top:var(--top);display:flex;gap:6px;pointer-events:auto}
#tools button,#interact {background:#181e1a;color:#f5f4ea;border-color:#48564a}
#miniButton {padding:3px;min-width:71px;line-height:0}
#mini {width:66px;height:42px}
#pause {min-width:44px;padding:5px 8px;font-size:17px}
#interact {position:absolute;right:calc(var(--right) + 120px);bottom:calc(var(--bottom) + 16px);pointer-events:auto;color:var(--amber);max-width:calc(100% - 250px);white-space:nowrap}
#hint {position:absolute;left:50%;bottom:calc(var(--bottom) + 4px);transform:translateX(-50%);max-width:54%;text-align:center;background:#181e1a;color:#ecede1;border-radius:9px;padding:5px 8px;font-size:11px}
#hint.danger {color:var(--danger)}
.stick {position:absolute;bottom:var(--bottom);width:clamp(76px,27vh,110px);height:clamp(76px,27vh,110px);border:1px solid #a9bbab88;border-radius:50%;background:#131a1699;display:grid;place-items:center;color:var(--mint)}
#move {left:calc(var(--left) + 6px)}
#aim {right:calc(var(--right) + 6px);color:var(--amber);border-color:#d2a97691}
.stick i {display:grid;place-items:center;width:43%;height:43%;border-radius:50%;border:1px solid currentColor;background:#25332a;font-size:17px;font-style:normal;box-shadow:0 2px 8px #0004}
.stick b {position:absolute;bottom:8%;font-size:8px;letter-spacing:.12em;line-height:1}
.stick.active {border-color:currentColor}
#mapCanvas {display:block;width:100%;height:auto;aspect-ratio:20/13;border-radius:11px;background:#171f1a;border:1px solid var(--sep)}
.mapkey {font-size:12px;color:var(--label2);display:flex;justify-content:space-between;gap:6px;margin:6px 0 8px}
#rotate {display:none;z-index:3}
#rotate .card {text-align:center}
@media (orientation:portrait) and (pointer:coarse) {#screen[data-active="true"] #rotate {display:grid}}
@media (max-width:630px) and (orientation:landscape) {
  #meters {left:54%;width:98px}
  #mission {max-width:38%;padding:6px 8px}
  #objective {font-size:12px}
  #miniButton {min-width:55px}
  #mini {width:51px;height:34px}
  #interact {right:calc(var(--right) + 99px);bottom:calc(var(--bottom) + 14px)}
}
@media (max-height:460px) and (orientation:landscape) {
  #start .card {width:min(100%,620px);display:grid;grid-template-columns:1fr .95fr;align-items:center;gap:17px}
  #start .menuhead {margin:0;padding:0 13px 0 0;border:0;border-right:1px solid var(--sep)}
  #start h1 {font-size:clamp(58px,12vw,93px)}
  .card {padding:15px 18px;border-radius:18px}
  #mapPanel .card {width:min(100%,380px)}
  #mapCanvas {width:min(100%,calc((100dvh - var(--top) - var(--bottom) - 146px)*1.5384));margin-inline:auto}
}
@media (min-width:1000px) and (pointer:fine) {
  #start {place-items:center start;padding-left:max(8vw,var(--left))}
  #start .card {width:390px}
  #hint {font-size:12px}
}
</style>
</head>
<body>
<main id="screen">
  <canvas id="field" aria-label="Katveen pelialue"></canvas>
  <div id="hud" hidden>
    <div id="mission"><span id="sector"></span><span id="objective"></span></div>
    <div id="meters">
      <div class="meter" id="healthMeter" role="meter" aria-label="Terveys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span aria-hidden="true">♥</span><div class="track"><div class="fill" id="health"></div></div></div>
      <div class="meter" id="energyMeter" role="meter" aria-label="Voimat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span aria-hidden="true">ϟ</span><div class="track"><div class="fill" id="energy"></div></div></div>
      <div id="signal">Hiljaista</div>
    </div>
    <div id="tools"><button id="miniButton" aria-label="Avaa aluekartta"><canvas id="mini" width="132" height="84"></canvas></button><button id="pause" aria-label="Pysäytä peli">❚❚</button></div>
    <div id="move" class="stick" aria-hidden="true"><i>✥</i><b>LIIKU</b></div>
    <div id="aim" class="stick" aria-hidden="true"><i>⊹</i><b>AMMU</b></div>
    <button id="interact" hidden></button>
    <div id="hint" hidden role="status"></div>
  </div>
  <section class="shade" id="start" aria-labelledby="title">
    <div class="card">
      <div class="menuhead">
        <span class="tag">Selviytymispeli</span>
        <h1 id="title">Katve</h1>
        <p>Hae tarvikkeet tyhjentyneestä kaupunginosasta. Etsi reitti takaisin, ennen kuin lauma löytää sinut.</p>
      </div>
      <div class="actions">
        <button class="primary" id="resume" hidden>Jatka tarkistuspisteeltä</button>
        <button class="primary" id="play">Aloita pako</button>
        <label class="row"><select id="difficulty" aria-label="Vaikeustaso">
          <option value="quiet">Vaikeus · Hiljainen</option><option value="normal" selected>Vaikeus · Normaali</option><option value="horde">Vaikeus · Lauma</option>
        </select></label>
        <div class="row"><button id="help">Ohjaus</button><button id="settings">Asetukset</button></div>
      </div>
    </div>
  </section>
  <section class="shade" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden><div class="card" id="panelBody"></div></section>
  <section class="shade" id="mapPanel" role="dialog" aria-modal="true" aria-labelledby="mapTitle" hidden>
    <div class="card">
      <h2 id="mapTitle">Aluekartta</h2>
      <canvas id="mapCanvas" width="720" height="468" aria-label="Aluekartta, jossa näkyvät sijaintisi ja aktiivinen kohde"></canvas>
      <div class="mapkey"><span>● Sinä</span><span>◇ Kohde</span><span>▣ Turvapaikka</span></div>
      <div class="actions"><button class="primary" id="closeMap">Takaisin peliin</button></div>
    </div>
  </section>
  <div class="shade" id="rotate"><div class="card"><h2>Käännä puhelin</h2><p>Pidä puhelinta vaakasuorassa. Peli odottaa.</p></div></div>
</main>
<script id="engine">
'use strict';

const W = 2880, H = 1872, STEP = 24, COLS = W / STEP, ROWS = H / STEP;
const PLAYER_R = 10, WALK = 59, RUN = 167, SHOT_RANGE = 530;
const TAU = 2 * Math.PI;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  return () => {

}
const CHECKPOINTS = [

  {x:1228,y:1465,w:262,h:220,name:'VARASTO',floor:'cement',doors:{n:[125],s:[174]}}
];
const walls = [], doorFrames = [], props = [], trees = [];
const rect = (x,y,w,h,type) => ({x,y,w,h,type});
function wallLine(x,y,length,vertical,gaps=[],type='wall') {
  let previous = 0;
  for (const at of [...gaps,length + 30]) {
    const end = Math.min(length,at - 29);
    if (end > previous) walls.push(vertical ? rect(x-6,y+previous,12,end-previous,type) : rect(x+previous,y-6,end-previous,12,type));
    if (at < length) doorFrames.push({...vertical ? rect(x-5,y+at-29,10,58,type) : rect(x+at-29,y-5,58,10,type),vertical});
    previous = at + 29;
  }
}
for (const b of buildings) {
  wallLine(b.x,b.y,b.w,false,b.doors.n);
  wallLine(b.x,b.y+b.h,b.w,false,b.doors.s);
  wallLine(b.x,b.y,b.h,true,b.doors.w);
  wallLine(b.x+b.w,b.y,b.h,true,b.doors.e);
}
wallLine(816,580,204,true,[117],'partition');
wallLine(816,785,206,false,[103],'partition');
wallLine(1340,522,187,true,[98],'partition');
wallLine(1870,386,196,true,[120],'partition');
wallLine(2026,1341,247,false,[104,184],'partition');
wallLine(660,1379,175,true,[88],'partition');
function prop(x,y,w,h,type,color) {
  const item = {...rect(x,y,w,h,type),color};
  props.push(item);
  walls.push(item);
}
[
  [539,893,75,34,'car','#637778'],[907,965,72,33,'car','#82654f'],
  [1256,912,75,36,'car','#727366'],[1430,932,36,88,'car','#763b3c'],

barrier(1640,366,15,135);

  rect(2281,1162,479,56,'path'),rect(406,1030,97,637,'path'),

  rect(1740,1055,79,70,'path'),rect(2442,1216,70,333,'path')

  {x:1960,y:307,name:'VARIKKO'}, {x:2275,y:1089,name:'SÄHKÖLINJA'},
  {x:2400,y:1710,name:'RANTANIITTY'}
];
const grove = random(49);
for (let i=0;i<184;i++) {
  const x=between(grove,32,2778), y=between(grove,122,1815);
  const tree={x,y,r:between(grove,20,42),seed:grove()};
  if (buildings.some(b=>x>b.x-24&&x<b.x+b.w+24&&y>b.y-24&&y<b.y+b.h+24)) continue;
  if (roads.some(b=>x>b.x-12&&x<b.x+b.w+12&&y>b.y-12&&y<b.y+b.h+12)) continue;

function inRect(x,y,b,r=0) {
  const dx = x - clamp(x,b.x,b.x+b.w), dy = y - clamp(y,b.y,b.y+b.h);
  return dx*dx+dy*dy <= r*r;
}
function gridKey(x,y) {
  return clamp(Math.floor(y/STEP),0,ROWS-1)*COLS+clamp(Math.floor(x/STEP),0,COLS-1);
}
function gridCenter(key) {
  return {x:(key%COLS+.5)*STEP,y:(Math.floor(key/COLS)+.5)*STEP};
}
const buckets = Array.from({length:COLS*ROWS},()=>[]);
function indexRect(box) {
  for (let y=clamp(Math.floor((box.y-22)/STEP),0,ROWS-1);y<=Math.min(ROWS-1,Math.floor((box.y+box.h+22)/STEP));y++) {
    for (let x=clamp(Math.floor((box.x-22)/STEP),0,COLS-1);x<=Math.min(COLS-1,Math.floor((box.x+box.w+22)/STEP));x++) {
      buckets[y*COLS+x].push(box);
    }
  }
}
walls.forEach(indexRect);
doorFrames.forEach((d,i)=>{d.door=i;indexRect(d);});
function closed(box,g) {
  return box.door === undefined || !g.doors[box.door].open;
}
function solid(g,x,y,r=0) {
  if (x<r+1 || x>W-r-1 || y<r+1 || y>H-r-1) return true;
  return buckets[gridKey(x,y)].some(b=>closed(b,g)&&inRect(x,y,b,r));
}
function safeAt(stage,p) {
  const point = CHECKPOINTS[Math.min(stage,3)];
  return point.safe && dist(point,p)<36;
}
function moveBody(g,body,dx,dy,r,zombie=false) {
  const oldX=body.x, oldY=body.y;
  const blocked=(x,y)=>solid(g,x,y,r)||(zombie&&safeAt(g.stage,{x,y}));
  if (!blocked(body.x+dx,body.y)) body.x+=dx;
  if (!blocked(body.x,body.y+dy)) body.y+=dy;
  return Math.hypot(body.x-oldX,body.y-oldY);
}
function segmentBox(x,y,dx,dy,b,pad=0) {
  if ((dx===0&&(x<b.x-pad||x>b.x+b.w+pad)) || (dy===0&&(y<b.y-pad||y>b.y+b.h+pad))) return Infinity;

function newGame(stage,level,seed=Date.now()>>>0,populate=true) {

function movePlayer(g,input,dt) {

}
function wave(g) {
  g.waveCount++;

  const cap=LEVELS[g.level].initial+33;
  if (living>=cap) return;
  const options=spawnAreas.filter(([x,y])=>Math.hypot(x-g.player.x,y-g.player.y)>565);
  if (!options.length) return;
  const [x,y]=options[Math.floor(g.rng()*options.length)];
  const count=Math.min(cap-living,LEVELS[g.level].wave+Math.floor(g.rng()*4)-1);
  g.zombies=g.zombies.filter(z=>z.hp>0);

}
function interactable(g) {
  const p=g.player, target=targetFor(g);
  if (target && dist(p,target)<(g.carrying?41:33) &&
    ray(g,p.x,p.y,target.x-p.x,target.y-p.y)>=.999) {
    return {type:g.carrying?'checkpoint':'item',label:g.carrying?'Kuittaa tehtävä':'Ota '+MISSIONS[g.stage].name.toLowerCase()};
  }

}
function interact(g) {
  if (g.phase!=='play') return null;

  if (action.type==='door') {

  } else if (action.type==='item') {
    g.carrying=true;

  } else {
    g.stage++;
    g.carrying=false;
    g.noticeEnd=0;
    g.phase=g.stage===MISSIONS.length?'won':'checkpoint';

    g.player.energy=100;
    g.player.exhausted=false;
  }
  return action.type;
}
function tick(g,input,dt) {
  if (g.phase!=='play') return;
  g.time+=dt;
  movePlayer(g,input,dt);
  updateZombies(g,dt);
  for (const e of g.events) e.age+=dt;
  g.events=g.events.filter(e=>e.age<(e.kind==='shot'?1.18:e.kind==='step'?.87:.9));
  for (const t of g.traces) t.age+=dt;
  g.traces=g.traces.filter(t=>t.age<.17);

}

  if (document.hidden && playing && !modal && game?.phase==='play') {
    showPanel('pause',`<h2 id="panelTitle">Tauko</h2><div class="actions" style="margin-top:12px"><button class="primary" id="return">Jatka peliä</button></div>`);
    $('return').onclick=closePanel;
  }
});
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if (key==='tab' && modal) {
    const root=modal==='map'?$('mapPanel'):$('panel');
    const nodes=[...root.querySelectorAll('button,select,textarea')].filter(n=>!n.disabled);
    if (nodes.length && (e.shiftKey?document.activeElement===nodes[0]:document.activeElement===nodes.at(-1))) {
      e.preventDefault();
      (e.shiftKey?nodes.at(-1):nodes[0]).focus();
    }
  }
  if (key==='escape') {
    if (modal==='checkpoint'||modal==='dead') return;
    if (modal) closePanel();
    else if (playing) pause();
    return;
  }
  if (key==='m' && modal==='map') {e.preventDefault();closePanel();return;}
  if (!canPlay()) return;
  if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','shift','control','e','m',' '].includes(key)) {
    if (key===' ' && document.activeElement?.tagName==='BUTTON') return;
    e.preventDefault();
    if (!e.repeat && key==='e') activate();
    else if (!e.repeat && key==='m') toggleMap();
    else if (!e.repeat && key===' ') shoot(game.player.angle);
    else keys.add(key);
  }
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function updateHUD() {
  const g=game,p=g.player,action=interactable(g);
  const threat=g.zombies.some(z=>z.hp>0&&z.state==='chase'&&dist(z,p)<340);
  const targeting=g.events.some(e=>e.kind==='shot'&&e.age<.83);
  $('sector').textContent=g.stage<3?'TEHTÄVÄ '+(g.stage+1)+' / 3':'VAPAA TUTKIMINEN';
  $('objective').textContent=g.stage<3?g.carrying?MISSIONS[g.stage].deliver:MISSIONS[g.stage].pick:'Tutki aluetta';
  $('health').style.transform='scaleX('+p.hp/100+')';
  $('energy').style.transform='scaleX('+p.energy/100+')';
  $('healthMeter').setAttribute('aria-valuenow',Math.round(p.hp));
  $('energyMeter').setAttribute('aria-valuenow',Math.round(p.energy));
  $('signal').textContent=threat?'Jahti':targeting?'Laukaus':p.exhausted?'Väsynyt':p.speed>90?'Kuuluva liike':'Hiljaista';
  $('signal').className=threat?'danger':targeting||p.speed>90?'noise':'';
  const button=$('interact'),hint=$('hint');
  const showAction=!!action&&g.phase==='play';
  if (button.hidden===showAction) button.hidden=!showAction;
  if (showAction && button.textContent!==action.label) button.textContent=action.label;
  const activeNotice=g.time<g.noticeEnd;
  const message=activeNotice?g.notice:g.time<7?'Pieni liike on hiljainen.':g.time<13?'Avaa aluekartta yläkulmasta.':'';
  if (hint.textContent!==message) hint.textContent=message;
  hint.hidden=!message;
  hint.className=g.time-p.deal<0?'danger':'';
  drawMap($('mini'),g);
}

resize();
refreshMenu();
let last=performance.now(), leftover=0, redraw=true;
function frame(now) {
  requestAnimationFrame(frame);
  const elapsed=Math.min(.10,Math.max(0,(now-last)/1000));
  last=now;
  if (canPlay()) {
    const input=readInput();
    const damage=game.stats.damage;
    leftover+=elapsed;
    while (leftover>=1/60) {tick(game,input,1/60);leftover-=1/60;}
    if (game.stats.damage!==damage) playSound('hit');
    render(game,input.aim);
    if (now>=uiTime) {updateHUD();uiTime=now+100;}
    if (game.phase==='dead') gameOver();
    redraw=true;
  } else {
    leftover=0;
    if (playing && redraw) {render(game,null);redraw=false;}
    if (!playing && (now-demoTime>1000/23 || redraw)) {
      if (!document.hidden && !reduced.matches && demo.time<16) {
        tick(demo,{x:0,y:0,aim:null},Math.min(.05,(now-demoTime)/1000));
        demo.player.hp=100;
      }
      render(demo,null,true);
      demoTime=now;
      redraw=false;
    }
  }
}
window.addEventListener('resize',()=>{redraw=true;});
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
