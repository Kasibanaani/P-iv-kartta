<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kytköskartta</title>
<style>
:root{
  --bg:#F5F3EE;--cell:#FFFEFA;--tint:#F9F7F2;--label:#252B28;--label2:#5E685F;--label3:#8A938B;--sep:#DDE2D9;--sep2:#E9ECE5;
  --accent:#39775A;--accent2:#2F6449;--fill:#E7F0E7;--fill2:#CBDDD0;--on:#FFFFFF;--dot:#D6DBD2;--bar:rgba(245,243,238,.9);
  --shadow:0 1px 2px rgba(40,50,40,.06),0 6px 18px -6px rgba(40,50,40,.18);--shadow2:0 2px 6px rgba(40,50,40,.08),0 18px 44px -12px rgba(40,50,40,.28);
  --ok:#2F8A55;--okf:#E0F2E6;--no:#8A938B;--nof:#EEF0EC;--warn:#B4561E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --h0:#68716C;--s0:#EEF0EC;--h1:#C2453A;--s1:#FBE4E0;--h2:#C46A1E;--s2:#FCEBDB;--h3:#A8820E;--s3:#FBF1C7;
  --h4:#39775A;--s4:#E2EFE5;--h5:#1F7C80;--s5:#DCEFEE;--h6:#386EA2;--s6:#E1EBF6;--h7:#7B5A9E;--s7:#EEE6F6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151B18;--cell:#202922;--tint:#1A211D;--label:#EEF1E9;--label2:#ACB8AE;--label3:#7F8B82;--sep:#3B473E;--sep2:#2C352F;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#0F1A13;--dot:#2E3831;--bar:rgba(21,27,24,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.6);--shadow2:0 18px 44px -12px rgba(0,0,0,.7);
  --ok:#7FD39E;--okf:#1E3A28;--no:#7F8B82;--nof:#262E29;--warn:#F2A06A;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h2:#F5A25E;--s2:#3D2A1A;--h3:#E8C454;--s3:#3A3218;
  --h4:#8FD3AE;--s4:#1F3528;--h5:#6FD0D2;--s5:#163536;--h6:#8FBCEB;--s6:#1B2C3F;--h7:#C5A6EA;--s7:#2F2440;
}}
:root[data-theme="dark"]{
  --bg:#151B18;--cell:#202922;--tint:#1A211D;--label:#EEF1E9;--label2:#ACB8AE;--label3:#7F8B82;--sep:#3B473E;--sep2:#2C352F;
  --accent:#A2C9B6;--accent2:#BFDCCD;--fill:#2B4032;--fill2:#2F513E;--on:#0F1A13;--dot:#2E3831;--bar:rgba(21,27,24,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.6);--shadow2:0 18px 44px -12px rgba(0,0,0,.7);
  --ok:#7FD39E;--okf:#1E3A28;--no:#7F8B82;--nof:#262E29;--warn:#F2A06A;
  --h0:#A9B3AC;--s0:#2A312D;--h1:#FF8A7E;--s1:#3E221F;--h2:#F5A25E;--s2:#3D2A1A;--h3:#E8C454;--s3:#3A3218;
  --h4:#8FD3AE;--s4:#1F3528;--h5:#6FD0D2;--s5:#163536;--h6:#8FBCEB;--s6:#1B2C3F;--h7:#C5A6EA;--s7:#2F2440;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.h0{--hc:var(--h0);--hs:var(--s0)}.h1{--hc:var(--h1);--hs:var(--s1)}.h2{--hc:var(--h2);--hs:var(--s2)}.h3{--hc:var(--h3);--hs:var(--s3)}
.h4{--hc:var(--h4);--hs:var(--s4)}.h5{--hc:var(--h5);--hs:var(--s5)}.h6{--hc:var(--h6);--hs:var(--s6)}.h7{--hc:var(--h7);--hs:var(--s7)}

/* ---------- Yläpalkki ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--sep);z-index:30}
.tb{border:0;background:transparent;border-radius:9px;padding:7px 11px;font-weight:600;color:var(--label)}
.tb:hover{background:var(--sep2)}
.tb.pri{background:var(--accent);color:var(--on)}
.tb.pri:hover{background:var(--accent2)}
#projbtn{font-size:15px;font-weight:700;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#projbtn small{font-weight:500;color:var(--label3);margin-left:4px}
.seg{display:inline-flex;background:var(--sep2);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 16px;font-weight:600;color:var(--label2)}
.seg button.on{background:var(--cell);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
#lockbtn.locked{background:var(--fill);color:var(--accent)}

/* ---------- Runko ---------- */
#body{position:fixed;left:0;right:0;top:52px;bottom:0;display:flex}
#pal{width:232px;flex:none;border-right:1px solid var(--sep);background:var(--tint);overflow-y:auto;padding:12px 12px 40px}
#insp{width:320px;flex:none;border-left:1px solid var(--sep);background:var(--tint);overflow-y:auto;padding:14px 16px 60px}
#stage{flex:1;position:relative;overflow:hidden}
.hidepanels #pal,.hidepanels #insp{display:none}
.pt-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label3);margin:16px 2px 7px}
.pt-h:first-child{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sep);background:var(--cell);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:550;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.chip:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.chip .ci{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--hs);color:var(--hc)}
.chip.sym{min-width:38px;justify-content:center;font-size:16px;font-weight:700;padding:4px 8px}
.chip.on{border-color:var(--accent);background:var(--fill)}
.chip.wide{width:100%}
.plist{display:flex;flex-direction:column;gap:3px}
.plist .chip{width:100%;justify-content:flex-start}
.plist .chip small{margin-left:auto;color:var(--label3);font-weight:500;font-size:11px}
.psearch{width:100%;border:1px solid var(--sep);background:var(--cell);border-radius:9px;padding:6px 9px;margin-bottom:6px}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:var(--shadow2)}

/* ---------- Kanvaasi ---------- */
.vp{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.6px);touch-action:none;cursor:default}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}
.world.anim{transition:transform .5s cubic-bezier(.3,.8,.25,1)}
.vp svg.lay{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.zoomc{position:absolute;right:14px;bottom:14px;display:flex;gap:2px;background:var(--cell);border:1px solid var(--sep);border-radius:11px;padding:3px;box-shadow:var(--shadow);z-index:6}
.zoomc button{border:0;background:transparent;border-radius:8px;min-width:30px;height:28px;font-weight:700;color:var(--label2)}
.zoomc button:hover{background:var(--sep2)}
.coords{position:absolute;left:36px;bottom:14px;font:12px ui-monospace,Menlo,monospace;color:var(--label2);background:var(--cell);border:1px solid var(--sep);border-radius:8px;padding:4px 8px;z-index:6;box-shadow:var(--shadow)}
.ruler{position:absolute;z-index:5;background:var(--bar);overflow:hidden;font:10px ui-monospace,Menlo,monospace;color:var(--label3);pointer-events:none}
.ruler.rx{left:22px;right:0;top:40px;height:18px;border-bottom:1px solid var(--sep)}
.ruler.ry{left:0;top:58px;bottom:0;width:22px;border-right:1px solid var(--sep)}
.ruler span{position:absolute;white-space:nowrap}
.ruler.rx span{top:3px;border-left:1px solid var(--sep);padding-left:3px;height:15px}
.ruler.ry span{left:0;width:22px;border-top:1px solid var(--sep);padding-top:2px;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--label);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:7;box-shadow:var(--shadow2)}
.empty-c{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--label3);pointer-events:none;max-width:420px;line-height:1.5}
.empty-c b{display:block;color:var(--label2);font-size:16px;margin-bottom:4px}

/* Näkymien välilehdet */
#vtabs{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:4px;padding:0 10px;z-index:8;background:var(--bar);border-bottom:1px solid var(--sep);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto}
#vtabs .vt{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--label2);white-space:nowrap}
#vtabs .vt.on{background:var(--cell);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#vtabs .vt:hover{color:var(--label)}
#vtabs input{border:1px solid var(--accent);border-radius:7px;padding:4px 8px;width:150px;background:var(--cell)}
.locked-ui #vtabs.one{display:none}
.uvp{top:40px}
.locked-ui .uvp.one{top:0}

/* ---------- Näkymäpalikat ---------- */
.ue{position:absolute;display:flex;flex-direction:column}
.ue>.in{flex:1;min-height:0;display:flex;flex-direction:column}
.edit .ue{cursor:move}
.edit .ue .in{pointer-events:none}
.edit .ue.sel{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.edit .ue:hover:not(.sel){outline:1px dashed var(--label3);outline-offset:3px;border-radius:12px}
.ue .rh{display:none;position:absolute;right:-9px;bottom:-9px;width:14px;height:14px;border-radius:5px;background:var(--cell);border:2px solid var(--accent);cursor:nwse-resize;z-index:3}
.edit .ue.sel .rh{display:block}
.ue .nmtag{display:none;position:absolute;left:0;top:-22px;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:6px}
.edit .ue.sel .nmtag,.edit.shownames .ue .nmtag{display:block}
.ue.hid{display:none}
.edit .ue.hid{display:flex;opacity:.38;filter:grayscale(.7)}
.ue.dim{opacity:.4;filter:grayscale(1);pointer-events:none}
.edit .ue.dim{pointer-events:auto}
.locked-ui .ue.k-merkki{display:none}
.card{background:var(--cell);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--sep2)}
.wl{font-size:13px;font-weight:600;color:var(--label2);margin:0 2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.w-btn{flex:1;border:0;border-radius:12px;background:var(--hs);color:var(--hc);font-weight:650;font-size:15px;padding:0 14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 18%,transparent);transition:transform .08s,background .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-btn:active{transform:scale(.97)}
.w-btn.on{background:var(--hc);color:var(--cell);box-shadow:0 2px 10px -2px color-mix(in srgb,var(--hc) 60%,transparent)}
.w-chk,.w-sw{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--sep);background:var(--cell);display:grid;place-items:center;transition:all .15s}
.box.on{background:var(--hc);border-color:var(--hc)}
.box.on::after{content:"";width:6px;height:11px;border:solid var(--cell);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.w-sw span.t,.w-chk span.t{flex:1;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:46px;height:28px;border-radius:99px;background:var(--sep);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--hc)}
.sw.on i{transform:translateX(18px)}
.w-pad{flex:1;padding:11px 12px 10px;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:hidden}
.w-sl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.w-sl .row b{color:var(--hc);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--hc) var(--p,50%),var(--sep) var(--p,50%));outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.fld{width:100%;border:1px solid var(--sep);background:var(--tint);border-radius:10px;padding:8px 10px;outline:none;transition:border .15s,box-shadow .15s}
.fld:focus{border-color:var(--hc,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--hc,var(--accent)) 18%,transparent);background:var(--cell)}
textarea.fld{resize:none;flex:1}
.w-num{display:flex;gap:6px}
.w-num .fld{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sbtn{border:0;border-radius:10px;width:38px;flex:none;background:var(--hs);color:var(--hc);font-weight:800;font-size:17px}
.w-date{display:flex;gap:6px}
.w-date .sbtn{width:auto;padding:0 10px;font-size:12px;font-weight:700}
.dsub{font-size:12px;color:var(--label3);margin:6px 2px 0}
.w-txt{flex:1;display:flex;align-items:center;line-height:1.3;white-space:pre-wrap;word-break:break-word;color:var(--label);overflow:hidden}
.w-txt.c{justify-content:center;text-align:center}.w-txt.r{justify-content:flex-end;text-align:right}
.w-txt.s-s{font-size:12px;color:var(--label2)}.w-txt.s-m{font-size:15px}.w-txt.s-l{font-size:21px;letter-spacing:-.01em}.w-txt.s-xl{font-size:32px;letter-spacing:-.02em;font-weight:700}
.w-txt.b{font-weight:700}
.w-ilmo{flex:1;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--hs);color:var(--label);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent);font-weight:550;overflow:hidden}
.w-ilmo .ic{width:24px;height:24px;flex:none;border-radius:50%;background:var(--hc);color:var(--cell);display:grid;place-items:center;font-weight:800;font-size:13px}
.w-card{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 12px 10px}
.w-card .ttl{font-weight:700;font-size:14px;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.w-card .ttl small{margin-left:auto;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums}
.lrows{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.lr{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid var(--sep2)}
.lr .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lr.done .lt{color:var(--label3);text-decoration:line-through}
.lr .box{width:20px;height:20px;cursor:pointer}
.lr .ld{width:86px;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 5px;font-size:12px;color:var(--label2);text-align:right}
.lr .ld:hover,.lr .ld:focus{border-color:var(--sep);background:var(--tint);outline:none}
.lr .ld.late{color:var(--h1);font-weight:700}
.lr .x{border:0;background:transparent;color:var(--label3);font-size:16px;width:22px;opacity:0;border-radius:6px}
.lr:hover .x{opacity:1}
.lr .x:hover{background:var(--sep2);color:var(--h1)}
.ladd{margin-top:8px;border:1px dashed var(--sep);background:transparent;border-radius:9px;padding:7px 9px;width:100%;outline:none}
.ladd:focus{border-style:solid;border-color:var(--hc);background:var(--tint)}
.aes{flex:1;overflow-y:auto;min-height:0;padding-left:4px}
.ae{display:flex;gap:10px;position:relative;padding:0 0 12px}
.ae::before{content:"";position:absolute;left:5px;top:12px;bottom:-2px;width:2px;background:var(--sep2)}
.ae:last-child::before{display:none}
.ae i{width:12px;height:12px;border-radius:50%;background:var(--hc);flex:none;margin-top:3px;box-shadow:0 0 0 3px var(--hs)}
.ae b{display:block;font-weight:600;font-size:13px}
.ae span{font-size:12px;color:var(--label3)}
.muted{color:var(--label3);font-size:13px;padding:6px 2px}
.w-shape{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:600;color:var(--label);white-space:pre-wrap;overflow:hidden;background:var(--hs);border:1.5px solid color-mix(in srgb,var(--hc) 45%,transparent);border-radius:16px}
.w-shape.ympyra{border-radius:50%}
.w-shape.pilleri{border-radius:999px}
.w-shape.lappu{border:0;border-radius:3px 3px 18px 3px;background:color-mix(in srgb,var(--hs) 70%,var(--hc) 30%);box-shadow:0 10px 18px -12px rgba(0,0,0,.45);font-family:"Marker Felt","Bradley Hand",var(--font)}
.w-shape.kehys{background:transparent;border:2px dashed color-mix(in srgb,var(--hc) 60%,transparent)}
.w-mark{width:36px;height:36px;border-radius:50% 50% 50% 4px;background:var(--hc);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
.chart svg{width:100%;flex:1;min-height:0;overflow:visible}
.chart text{font-family:var(--font)}
.cal{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px}
.cal .ch{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal .ch b{flex:1;font-size:14px;text-transform:capitalize}
.cal .ch button{border:0;background:var(--sep2);border-radius:8px;width:28px;height:26px;font-weight:800;color:var(--label2)}
.cal .cg{flex:1;display:grid;grid-template-columns:28px repeat(7,1fr);grid-auto-rows:1fr;gap:2px;font-size:12px;font-variant-numeric:tabular-nums;min-height:0}
.cal .cg>div{display:flex;align-items:center;justify-content:center;border-radius:8px;position:relative}
.cal .cg .hd{font-weight:700;color:var(--label3);font-size:10.5px;text-transform:uppercase}
.cal .cg .wk{color:var(--label3);font-size:10.5px;font-weight:600}
.cal .cg .o{color:var(--label3);opacity:.5}
.cal .cg .td{background:var(--hc);color:var(--cell);font-weight:800}
.cal .cg .mk::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--h1)}
.cal .cg .td.mk::after{background:var(--cell)}
#udeco line,#udeco path{stroke-linecap:round}
#udeco .dl{pointer-events:stroke;cursor:pointer}
.ln-hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}

/* ---------- Logiikka ---------- */
.ln{position:absolute;min-width:84px;max-width:240px;background:var(--cell);border-radius:11px;border:1px solid var(--sep);box-shadow:var(--shadow);font-size:12.5px;cursor:grab;user-select:none;-webkit-user-select:none;z-index:2}
.ln::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gc)}
.ln.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.ln{display:flex;flex-direction:column;justify-content:center}
.ln .lb{display:flex;align-items:center;gap:7px;padding:7px 10px 7px 12px;min-height:34px}
.ln .lic{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--gc) 16%,transparent);color:var(--gc)}
.ln .lt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var BOOLK={ruutu:1,kytkin:1};
function isBoolKind(b){return !!b&&(BOOLK[b.k]||(b.k==='nappi'&&b.beh!=='kerta')||b.k==='muisti');}

function ports(b){
  var k=b.k,ins=[],outs=[];
  if(!K[k])return {ins:ins,outs:outs};
  if(K[k].g==='ui'){
    if(k!=='merkki')ins=[V('nk','näkyy kun'),V('tx','teksti'),V('vr','vaihtoväri kun')];
    if(k==='nappi')outs=[V('v',b.beh==='kerta'?'painalluksia':'on valittu'),E('e','painettu')];
    else if(k==='lista')outs=[V('v','rastitettuja'),V('n','rivejä'),V('all','kaikki rastitettu')];
    else if(k==='aika')outs=[V('v','merkintöjä'),V('last','viimeisin päivä')];

    else outs=[V('v','arvo')];

/* ---------- Arvot ---------- */
function p2(n){return (n<10?'0':'')+n;}
function iso(dt){return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());}
function ymd(s){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?[+m[1],+m[2],+m[3]]:null;}
function utc(s){var a=ymd(s);return a?Date.UTC(a[0],a[1]-1,a[2]):NaN;}
function okIso(s){var a=ymd(s);if(!a)return false;var d=new Date(Date.UTC(a[0],a[1]-1,a[2]));return d.getUTCFullYear()===a[0]&&d.getUTCMonth()===a[1]-1&&d.getUTCDate()===a[2];}
function addDays(s,n){var a=ymd(s);if(!a)return null;var d=new Date(Date.UTC(a[0],a[1]-1,a[2]+Math.round(n)));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());}
function diffDays(a,b){return Math.round((utc(a)-utc(b))/864e5);}
function weekday(s){var a=ymd(s);return a?new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay():null;}
function isoWeek(s){var a=ymd(s);if(!a)return null;var t=new Date(Date.UTC(a[0],a[1]-1,a[2]));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y0=Date.UTC(t.getUTCFullYear(),0,1);return Math.ceil(((t-y0)/864e5+1)/7);}
function fmtDate(s,df){var a=ymd(s);if(!a)return '';var y=String(a[0]);return p2(a[2])+'.'+p2(a[1])+'.'+(df==='pp.kk.vv'?y.slice(2):y);}
function parseDate(s,now){
  s=String(s==null?'':s).trim().toLowerCase();if(!s)return null;
  var t=iso(now||new Date()),m;
  if(s==='tänään'||s==='tanaan')return t;
  if(s==='huomenna')return addDays(t,1);
  if(s==='eilen')return addDays(t,-1);
  if((m=/^([+-])\s*(\d+)$/.exec(s)))return addDays(t,(m[1]==='-'?-1:1)*+m[2]);
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))){var r=m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);return okIso(r)?r:null;}
  if((m=/^(\d{1,2})\.(\d{1,2})\.?(\d{2}|\d{4})?$/.exec(s))){
    var y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+t.slice(0,4);
    var r2=y+'-'+p2(+m[2])+'-'+p2(+m[1]);return okIso(r2)?r2:null;
  }
  return null;
}
function D(s){return s?{d:s}:null;}
function isD(v){return !!v&&typeof v==='object'&&typeof v.d==='string';}
function parseNum(s){if(typeof s==='number')return s;var t=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t))return NaN;return parseFloat(t);}
function num(v){if(v==null||v==='')return 0;if(typeof v==='boolean')return v?1:0;if(typeof v==='number')return v;if(isD(v))return utc(v.d)/864e5;return parseNum(v);}
function truth(v){if(v==null)return false;if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0&&!isNaN(v);if(isD(v))return true;return String(v).trim()!=='';}
function fiNum(x){if(!isFinite(x))return '–';var r=Math.round(x*100)/100;return String(r).replace('.',',').replace('-','−');}
function fmt(v,df){if(v==null||(typeof v==='number'&&isNaN(v)))return '–';if(typeof v==='boolean')return v?'kyllä':'ei';if(typeof v==='number')return fiNum(v);if(isD(v))return fmtDate(v.d,df);return String(v);}
function parseLit(x,now){
  if(x==null||x==='')return null;
  if(typeof x==='number'||typeof x==='boolean')return x;
  if(isD(x))return x;
  var s=String(x);
  if(!isNaN(parseNum(s)))return parseNum(s);
  var t=s.trim().toLowerCase();
  if(t==='kyllä'||t==='on valittu')return true;
  if(t==='ei'||t==='ei ole valittu')return false;
  if(/^(\d{1,2}\.\d{1,2}\.(\d{2}|\d{4})?|\d{4}-\d{1,2}-\d{1,2}|tänään|huomenna|eilen)$/.test(t)){var d=parseDate(t,now);if(d)return D(d);}
  return s;
}
function textual(v){return typeof v==='string'&&v!==''&&isNaN(parseNum(v));}
function round9(x){return Math.round(x*1e9)/1e9;}
function calc(op,a,b){
  var da=isD(a),db=isD(b);
  if(op==='add'){
    if(da&&db)return null;
    if(da)return D(addDays(a.d,num(b)||0));
    if(db)return D(addDays(b.d,num(a)||0));
    if(textual(a)||textual(b))return fmt(a===null?'':a)+fmt(b===null?'':b);
  }
  if(op==='sub'){
    if(da&&db)return diffDays(a.d,b.d);
    if(da)return D(addDays(a.d,-(num(b)||0)));
    if(db)return null;
  }
  var x=num(a),y=num(b);if(isNaN(x)||isNaN(y))return null;
  if(op==='add')return round9(x+y);
  if(op==='sub')return round9(x-y);
  if(op==='mul')return round9(x*y);
  if(op==='div')return y===0?null:round9(x/y);
  return null;
}
function cmp(op,a,b,now){
  if(a==='')a=null;if(b==='')b=null;
  if(a===null||b===null){var both=a===null&&b===null;if(op==='eq')return both;if(op==='ne')return !both;return false;}
  if(isD(a)&&typeof b==='string'){var pb=parseDate(b,now);if(pb)b=D(pb);}
  if(isD(b)&&typeof a==='string'){var pa=parseDate(a,now);if(pa)a=D(pa);}
  var c;
  if(isD(a)&&isD(b))c=a.d<b.d?-1:a.d>b.d?1:0;
  else if(isD(a)||isD(b)){c=isD(a)?(b==null?1:NaN):(a==null?-1:NaN);if(isNaN(c))return op==='ne';}
  else{
    var x=num(a),y=num(b);
    if(!isNaN(x)&&!isNaN(y)&&!textual(a)&&!textual(b))c=x<y?-1:x>y?1:0;
    else{var s=fmt(a===null?'':a).trim().toLowerCase(),t=fmt(b===null?'':b).trim().toLowerCase();c=s<t?-1:s>t?1:0;}
  }
  switch(op){case 'eq':return c===0;case 'ne':return c!==0;case 'lt':return c<0;case 'le':return c<=0;case 'gt':return c>0;case 'ge':return c>=0;}
  return false;
}
function datePart(part,v,now){
  if(!isD(v))return null;var a=ymd(v.d);if(!a)return null;
  switch(part){
    case 'vk':return isoWeek(v.d);
    case 'vkp':return VKP[weekday(v.d)];
    case 'vkpn':return weekday(v.d)||7;
    case 'pv':return a[2];case 'kk':return a[1];case 'v':return a[0];
    case 'ero':return diffDays(v.d,iso(now||new Date()));
  }
  return null;
}

/* ---------- Projekti ---------- */

function uniqueName(P,base,except){

  if(!used[base])return base;
  for(var i=2;i<9999;i++)if(!used[base+' '+i])return base+' '+i;

function nodeOf(P,nid){for(var i=0;i<P.lg.n.length;i++)if(P.lg.n[i].id===nid)return P.lg.n[i];return null;}

function addLink(P,fn,fp,tn,tp){

  });

function removeNode(P,nid){

  P.lg.n.forEach(function(m){if(m.g===nid)m.g=n.g||'';});

function removeBlock(P,id){

    P.lg.n.forEach(function(m){if(m.g===n.id)m.g=n.g||'';});

function repairRef(P,x){if(x&&typeof x==='object'&&x.r&&!P.b[x.r])return '';return x;}
function repair(P){
  if(!P||typeof P!=='object')return P;

    if(b.vw&&!vids[b.vw])b.vw='';

    var b=P.b[n.p];if(!b)return false;

  P.deco=P.deco.filter(function(d){return P.b[d.a]&&P.b[d.b];});
  // lohkot, joilla ei ole solmua eikä näkymää, ovat turhia
  Object.keys(P.b).forEach(function(id){var b=P.b[id];if(K[b.k].g==='lg'&&!P.lg.n.some(function(n){return n.p===id;}))delete P.b[id];});
  return P;

function repairData(Dt){

  Dt.app='kytkoskartta';Dt.ver=VER;Dt.cfg=Dt.cfg||{};if(!Dt.cfg.df)Dt.cfg.df='pp.kk.vvvv';if(!Dt.cfg.teema)Dt.cfg.teema='auto';if(Dt.cfg.snap==null)Dt.cfg.snap=true;

/* ---------- Arviointi ---------- */
var CYC={};
function listRows(P,id){
  var st=P.st[id];if(st&&Array.isArray(st.rows))return st.rows;
  var b=P.b[id];var lines=String(b&&b.rivit||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  return lines.map(function(s,i){return {id:'r'+(i+1),tx:s,c:false,d:''};});
}
function Ev(P,ctx){
  ctx=ctx||{};var now=ctx.now?ctx.now():new Date();var df=ctx.df||'pp.kk.vvvv';
  var B=P.b,memo={},nid={},inl={},outl={};
  P.lg.n.forEach(function(n){nid[n.id]=n;});
  P.lg.l.forEach(function(l){var t=nid[l.t],f=nid[l.f];if(!t||!f)return;var k=t.p+'|'+l.tp;(inl[k]=inl[k]||[]).push(l);var k2=f.p+'|'+l.fp;(outl[k2]=outl[k2]||[]).push(l);});
  function srcVal(l){var f=nid[l.f];if(!f)return null;var v=val(f.p,l.fp);if(f.not){var po=port(B[f.p],'outs',l.fp);if(po&&po.t==='v')v=!truth(v);}return v;}
  function linked(id,p){return !!(inl[id+'|'+p]&&inl[id+'|'+p].length);}
  function lit(x){if(x&&typeof x==='object'&&!isD(x)&&x.r)return B[x.r]?val(x.r,'v'):null;if(typeof x==='string'&&x.indexOf('{#')>=0)return tpl(x);return parseLit(x,now);}
  function inp(id,p){var ls=inl[id+'|'+p];if(ls&&ls.length)return srcVal(ls[0]);var b=B[id];return b?lit(b[p]):null;}
  function has(id,p){if(linked(id,p))return true;var b=B[id];var x=b&&b[p];return !(x==null||x===''||(typeof x==='object'&&!isD(x)&&!x.r));}
  function tpl(s){return String(s==null?'':s).replace(/\{#([a-zA-Z0-9]+)\}/g,function(m,i){return B[i]?fmt(val(i,'v'),df):'';});}
  function val(id,p){
    p=p||'v';var key=id+'|'+p;
    if(memo.hasOwnProperty(key))return memo[key]===CYC?null:memo[key];
    memo[key]=CYC;var r=null;try{r=compute(id,p);}catch(e){r=null;}
    memo[key]=r;return r;
  }
  function stv(id,def){return P.st.hasOwnProperty(id)?P.st[id]:def;}
  function compute(id,p){
    var b=B[id];if(!b)return null;
    switch(b.k){
      case 'nappi':if(p!=='v')return null;return b.beh==='kerta'?num(stv(id,0)):!!stv(id,false);
      case 'ruutu':case 'kytkin':return !!stv(id,false);
      case 'saadin':return num(stv(id,num(lit(b.start))));
      case 'teksti':return String(stv(id,''));
      case 'luku':{var x=stv(id,null);return x===null?num(lit(b.start)):num(x);}
      case 'pvm':{var s=stv(id,null);if(s===null){var st=lit(b.start);return isD(st)?st:null;}return s?D(s):null;}
      case 'nayta':case 'muoto':return text(id);
      case 'ilmo':return visible(id);
      case 'lista':{var rows=listRows(P,id);var c=rows.filter(function(r){return r.c;}).length;if(p==='n')return rows.length;if(p==='all')return rows.length>0&&c===rows.length;return c;}
      case 'aika':{var e=stv(id,[]);if(!Array.isArray(e))e=[];if(p==='last'){if(!e.length)return null;return D(iso(new Date(e[e.length-1].t)));}return e.length;}
      case 'arvo':return lit(b.v);
      case 'muisti':return P.st.hasOwnProperty(id)?P.st[id]:lit(b.v);
      case 'lasku':return calc(b.op,inp(id,'a'),inp(id,'b'));
      case 'vert':return cmp(b.op,inp(id,'a'),inp(id,'b'),now);
      case 'tanaan':return D(iso(now));
      case 'pvmosa':return datePart(b.part,inp(id,'a'),now);
      case 'jos':{var c2=truth(inp(id,'c'));if(c2)return has(id,'a')?inp(id,'a'):true;return has(id,'b')?inp(id,'b'):false;}
      case 'kun':return has(id,'c')?truth(inp(id,'c')):true;
      case 'ikkuna':return win(id);
    }
    return null;
  }
  function members(id){
    var wn=null;for(var i=0;i<P.lg.n.length;i++)if(P.lg.n[i].p===id){wn=P.lg.n[i];break;}
    if(!wn)return [];
    var ms=P.lg.n.filter(function(n){return n.g===wn.id;});
    var inside={};ms.forEach(function(n){inside[n.id]=1;});
    return ms.filter(function(m){
      var mb=B[m.p];if(!mb||mb.k==='tee'||mb.k==='kun')return false;
      if(!port(mb,'outs','v'))return false;
      return !P.lg.l.some(function(l){return l.f===m.id&&l.fp==='v'&&inside[l.t];});
    });
  }
  function win(id){
    var b=B[id];var vals=members(id).map(function(m){var v=val(m.p,'v');return m.not?!truth(v):v;});
    (inl[id+'|in']||[]).forEach(function(l){vals.push(srcVal(l));});
    var t=vals.filter(truth).length,n=Math.max(0,Math.round(num(b.n)||0));
    switch(b.m){
      case 'and':return vals.length>0&&t===vals.length;
      case 'or':return t>0;
      case 'one':return t===1;
      case 'min':return t>=n;
      case 'max':return t<=n;
      case 'eq':return t===n;
      case 'not':return t===0;
      case 'cnt':return t;
      case 'sum':return round9(vals.reduce(function(s,v){var x=num(v);return s+(isNaN(x)?0:x);},0));
      case 'avg':{var xs=vals.map(num).filter(function(x){return !isNaN(x);});return xs.length?round9(xs.reduce(function(s,x){return s+x;},0)/xs.length):null;}
      case 'maxv':{var a=vals.map(num).filter(function(x){return !isNaN(x);});return a.length?Math.max.apply(null,a):null;}
      case 'minv':{var c=vals.map(num).filter(function(x){return !isNaN(x);});return c.length?Math.min.apply(null,c):null;}
    }
    return null;
  }
  function text(id){var b=B[id];if(!b)return '';if(linked(id,'tx'))return fmt(inp(id,'tx'),df);return tpl(b.tx);}
  function visible(id){
    var b=B[id];if(!b)return false;
    if(linked(id,'nk'))return truth(inp(id,'nk'));
    var nk=b.nk;if(!nk||nk.m==='aina'||!nk.r||!B[nk.r])return true;
    var v=truth(val(nk.r,'v'));return nk.m==='eikun'?!v:v;
  }
  function alt(id){
    var b=B[id];if(!b)return false;

  }
  function hue(id){var b=B[id];return alt(id)?b.hue2:b.hue;}
  return {val:val,inp:inp,has:has,tpl:tpl,text:text,visible:visible,alt:alt,hue:hue,linked:linked,srcVal:srcVal,members:members,
    fmt:function(v){return fmt(v,df);},now:now,df:df,outl:outl,inl:inl,nid:nid};
}

/* ---------- Tilan muutokset ja tapahtumat ---------- */
function stateOf(P,id){return P.st[id];}
function enforceOne(P,id){
  var mine=nodesOfBlock(P,id);
  mine.forEach(function(n){
    if(!n.g)return;var w=nodeOf(P,n.g);if(!w)return;var wb=P.b[w.p];
    if(!wb||wb.m!=='one'||!wb.pakota)return;
    P.lg.n.forEach(function(m){if(m.g===n.g&&m.p!==id&&isBoolKind(P.b[m.p]))P.st[m.p]=false;});
  });
}
function setVal(P,id,v,ctx){
  var b=P.b[id];if(!b)return;var now=ctx&&ctx.now?ctx.now():new Date();
  switch(b.k){
    case 'nappi':if(b.beh==='kerta')P.st[id]=num(v)||0;else P.st[id]=truth(v);break;
    case 'ruutu':case 'kytkin':P.st[id]=truth(v);break;
    case 'saadin':{var mn=num(parseLit(b.min)),mx=num(parseLit(b.max));var x=num(v);if(isNaN(x))x=mn;P.st[id]=Math.min(Math.max(x,Math.min(mn,mx)),Math.max(mn,mx));break;}
    case 'luku':{var y=num(v);P.st[id]=isNaN(y)?0:y;break;}
    case 'teksti':P.st[id]=v==null?'':(typeof v==='string'?v:fmt(v,ctx&&ctx.df));break;
    case 'pvm':P.st[id]=isD(v)?v.d:(v==null||v===''?'':(parseDate(v,now)||''));break;
    case 'muisti':P.st[id]=(typeof v==='number'&&isNaN(v))?null:v;break;
    default:return;
  }
  if(isBoolKind(b)&&P.st[id]===true)enforceOne(P,id);
}
function clearVal(P,id){
  var b=P.b[id];if(!b)return;delete P.st[id];
}
function handleLink(P,l,ctx,depth){
  var t=nodeOf(P,l.t);if(!t)return;var tb=P.b[t.p];if(!tb)return;
  if(tb.k==='tee'&&l.tp==='e')runAction(P,tb.id,ctx,depth+1);
  else if(tb.k==='kun'&&l.tp==='e'){var ev=Ev(P,ctx);if(!ev.has(tb.id,'c')||truth(ev.inp(tb.id,'c')))fire(P,tb.id,'e',ctx,depth+1);}
  else if(tb.k==='ikkuna'&&tb.j==='kun'&&l.tp==='e'){var e2=Ev(P,ctx);if(truth(e2.val(tb.id)))fire(P,tb.id,'e',ctx,depth+1);}
}
function fire(P,id,p,ctx,depth){
  depth=depth||0;if(depth>60)return;
  var ns={};P.lg.n.forEach(function(n){if(n.p===id)ns[n.id]=1;});
  P.lg.l.filter(function(l){return ns[l.f]&&l.fp===p;}).forEach(function(l){handleLink(P,l,ctx,depth);});
}
function runAction(P,id,ctx,depth){
  var b=P.b[id];if(!b||b.k!=='tee')return;ctx=ctx||{};
  var ev=Ev(P,ctx),o=b.o,tg=P.b[o],vv=ev.has(id,'v')?ev.inp(id,'v'):null;
  switch(b.do){
    case 'aseta':if(tg)setVal(P,o,vv,ctx);break;
    case 'lisaa':if(tg){var cur=ev.val(o);var d=vv===null?1:num(vv);if(isNaN(d))d=0;
      if(tg.k==='pvm'){var base=isD(cur)?cur.d:iso(ev.now);setVal(P,o,D(addDays(base,d)),ctx);}
      else setVal(P,o,round9(num(cur)+d),ctx);}break;
    case 'valitse':if(tg)setVal(P,o,tg.k==='nappi'&&tg.beh==='kerta'?num(ev.val(o))+1:true,ctx);break;
    case 'poista':if(tg)setVal(P,o,false,ctx);break;
    case 'vaihda':if(tg)setVal(P,o,!truth(ev.val(o)),ctx);break;
    case 'tyhjenna':if(tg)clearVal(P,o);break;
    case 'siirry':if(ctx.nav)ctx.nav({vw:b.vw,o:b.o,x:num(b.x)||0,y:num(b.y)||0});break;
    case 'kirjaa':if(tg&&tg.k==='aika'){var e=Array.isArray(P.st[o])?P.st[o].slice():[];var tx=ev.tpl(b.tx);if(!tx&&vv!==null)tx=ev.fmt(vv);e.push({t:ev.now.getTime(),tx:tx});P.st[o]=e;}break;
    case 'rivi':if(tg&&tg.k==='lista'){var rows=listRows(P,o).map(function(r){return {id:r.id,tx:r.tx,c:r.c,d:r.d};});var t2=ev.tpl(b.tx);if(!t2&&vv!==null&&!isD(vv))t2=ev.fmt(vv);rows.push({id:'r'+(++P.seq),tx:t2||'Uusi rivi',c:false,d:isD(vv)?vv.d:''});P.st[o]={rows:rows};}break;
    case 'ilmoita':if(ctx.toast)ctx.toast(ev.tpl(b.tx)||ev.fmt(vv));break;
  }
  fire(P,id,'e',ctx,(depth||0)+1);
}
function press(P,id,ctx){
  var b=P.b[id];if(!b||b.k!=='nappi')return;
  if(b.beh==='kerta')P.st[id]=num(P.st[id]||0)+1;
  else setVal(P,id,!P.st[id],ctx);
  fire(P,id,'e',ctx,0);
  tick(P,ctx);
}
function userSet(P,id,v,ctx){setVal(P,id,v,ctx);tick(P,ctx);}
function tick(P,ctx){
  P.mem=P.mem||{};var mem=P.mem;
  for(var iter=0;iter<12;iter++){
    var ev=Ev(P,ctx),fired=[];
    Object.keys(P.b).forEach(function(id){
      var b=P.b[id];
      if(b.k==='jos'||(b.k==='ikkuna'&&b.j==='jos')){
        var c=truth(b.k==='jos'?ev.inp(id,'c'):ev.val(id));var key='j'+id,prev=mem[key];mem[key]=c;
        if(prev!==undefined&&prev!==c)fired.push({id:id,p:c?'e':'m'});
      }
      if(b.k==='kun'&&!ev.linked(id,'e')&&ev.has(id,'c')){
        var c2=truth(ev.inp(id,'c'));var k2='k'+id,pv=mem[k2];mem[k2]=c2;
        if(pv===false&&c2)fired.push({id:id,p:'e'});
      }
    });
    P.lg.l.forEach(function(l){
      var f=ev.nid[l.f],t=ev.nid[l.t];if(!f||!t)return;
      var o=port(P.b[f.p],'outs',l.fp),i=port(P.b[t.p],'ins',l.tp);
      if(!o||!i||o.t!=='v'||i.t!=='e')return;
      var c=truth(ev.srcVal(l));var key='l'+l.id,prev=mem[key];mem[key]=c;
      if(prev===false&&c)fired.push({l:l});
    });
    Object.keys(mem).forEach(function(k){var id=k.slice(1);if((k[0]==='j'||k[0]==='k')&&!P.b[id])delete mem[k];});
    if(!fired.length)break;
    fired.forEach(function(f){if(f.l)handleLink(P,f.l,ctx,0);else fire(P,f.id,f.p,ctx,0);});
  }
}

return {VER:VER,K:K,OPS:OPS,CMPS:CMPS,WM:WM,PARTS:PARTS,DOS:DOS,VKP:VKP,KUUT:KUUT,
  ports:ports,port:port,newProject:newProject,addBlock:addBlock,addNode:addNode,addLink:addLink,canLink:canLink,
  removeNode:removeNode,removeBlock:removeBlock,nodeOf:nodeOf,nodesOfBlock:nodesOfBlock,uniqueName:uniqueName,baseName:baseName,
  repair:repair,repairData:repairData,Ev:Ev,setVal:setVal,userSet:userSet,press:press,fire:fire,tick:tick,runAction:runAction,clearVal:clearVal,
  listRows:listRows,toNames:toNames,toIds:toIds,refsIn:refsIn,isBoolKind:isBoolKind,
  iso:iso,addDays:addDays,diffDays:diffDays,isoWeek:isoWeek,weekday:weekday,fmtDate:fmtDate,parseDate:parseDate,
  fmt:fmt,num:num,truth:truth,isD:isD,D:D,parseLit:parseLit,calc:calc,cmp:cmp,datePart:datePart,clone:clone};
})();
if(typeof module!=='undefined')module.exports=KK;

function startLink(e,pin){
  var vp=$('#lvp'),c=camL();var nel=pin.closest('[data-nid]');var nid=nel.getAttribute('data-nid');var p=pin.getAttribute('data-p'),dir=pin.getAttribute('data-d');
  var from={nid:nid,p:p};
  if(dir==='i'){
    // tulokohdasta vetäminen irrottaa nuolen ja jatkaa sen lähteestä
    var ex=P.lg.l.filter(function(l){return l.t===nid&&l.tp===p;});
    if(!ex.length){toast('Vedä nuoli palikan oikeasta reunasta tähän kohtaan.');return;}
    pushUndo();var l=ex[ex.length-1];P.lg.l=P.lg.l.filter(function(x){return x!==l;});from={nid:l.f,p:l.fp};var detached=true;
  }
  var a=pinCenter(from.nid,'o',from.p);if(!a)return;
  document.body.classList.add('linking');vp.classList.add('linking');
  drag(e,function(m){S.tmpLink=[a,toWorld(vp,c,m.clientX,m.clientY)];
    $$('.pt.hot').forEach(function(x){x.classList.remove('hot');});var t=document.elementFromPoint(m.clientX,m.clientY);var tp=t&&t.closest('.pt[data-d="i"]');if(tp)tp.classList.add('hot');
    drawLinks();},
  function(m){
    S.tmpLink=null;document.body.classList.remove('linking');vp.classList.remove('linking');$$('.pt.hot').forEach(function(x){x.classList.remove('hot');});
    var t=document.elementFromPoint(m.clientX,m.clientY);
    var tp=t&&t.closest('.pt[data-d="i"]');var tn=t&&t.closest('[data-nid]');
    function done(){KK.tick(P,ctx());save();renderLogicStage();renderInsp();}
    if(tp){var tnid=tp.closest('[data-nid]').getAttribute('data-nid');if(!detached)pushUndo();if(!KK.addLink(P,from.nid,from.p,tnid,tp.getAttribute('data-p')))toast('Näitä kohtia ei voi yhdistää.');done();return;}
    if(tn&&tn.getAttribute('data-nid')!==from.nid){
      var tnode=KK.nodeOf(P,tn.getAttribute('data-nid'));var tb=P.b[tnode.p];
      var cands=KK.ports(tb).ins.filter(function(q){return KK.canLink(P,from.nid,from.p,tnode.id,q.p);});
      if(cands.length===1){if(!detached)pushUndo();KK.addLink(P,from.nid,from.p,tnode.id,cands[0].p);done();return;}
      if(cands.length>1){showMenu(m.clientX+8,m.clientY+8,[{h:'Mihin kohtaan?'}].concat(cands.map(function(q){return {t:q.n,f:function(){if(!detached)pushUndo();KK.addLink(P,from.nid,from.p,tnode.id,q.p);done();}};})));if(detached)done();return;}
      toast('Tähän palikkaan ei voi viedä tätä nuolta.');
    }
    if(detached){save();}
    renderLogicStage();renderInsp();
  });
}

function doAction(d,T){
  var b=T&&T.b;

    case 'clearst':pushUndo();KK.clearVal(P,b.id);break;
    case 'front':case 'back':{pushUndo();var zs=blocks(function(o){return isUI(o)&&o.v===b.v;}).map(function(o){return o.z||0;});b.z=d==='front'?Math.max.apply(null,zs)+1:Math.min.apply(null,zs)-1;break;}

document.addEventListener('keydown',function(e){
  if(!P)return;
  var inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
  if(e.code==='Space'&&!inField){S.space=true;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!inField){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if(inField)return;
  if(e.key==='Escape'){S.tool=null;S.sel=null;hideMenu();closeSheet();renderAll();return;}
  if(S.tab==='nakyma'&&locked())return;
  if((e.key==='Backspace'||e.key==='Delete')&&S.sel){e.preventDefault();
    if(S.sel.t==='b')doAction('delblock',{b:P.b[S.sel.id]});
    else if(S.sel.t==='n')doAction('delnode',{});
    else if(S.sel.t==='l')doAction('dellink',{});
    else if(S.sel.t==='d')doAction('deldeco',{});
    return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&S.sel){e.preventDefault();var b=selBlock();if(!b)return;
    if(S.sel.t==='b')doAction('dup',{b:b});else if(b.k!=='ikkuna')doAction('inst',{b:b});return;}
  if(S.sel&&S.sel.t==='b'&&/^Arrow/.test(e.key)){e.preventDefault();var bb=P.b[S.sel.id];if(!bb)return;var s=e.shiftKey?10:1;
    if(!S.nudging){pushUndo();S.nudging=true;}
    if(e.key==='ArrowLeft')bb.x-=s;if(e.key==='ArrowRight')bb.x+=s;if(e.key==='ArrowUp')bb.y-=s;if(e.key==='ArrowDown')bb.y+=s;save();renderUIStage();renderInsp();}
});
document.addEventListener('keyup',function(e){if(e.code==='Space')S.space=false;if(/^Arrow/.test(e.key))S.nudging=false;});

  Dt.projects.forEach(function(p){h+='<div class="plrow'+(P&&p.id===P.id?' cur':'')+'" data-open="'+p.id+'"><b>'+esc(p.name)+'</b><small>'+Object.keys(p.b).filter(function(i){return K[p.b[i].k].g==='ui';}).length+' palikkaa · '+p.views.length+' näkymää</small></div>';});
  h+='<div class="fs" style="margin-top:12px"><div class="row2"><input id="newpname" placeholder="Uuden projektin nimi" style="border:1px solid var(--sep);border-radius:9px;padding:8px 10px;background:var(--tint)"><button class="ib nf" data-x="new">Luo</button></div></div>';
  if(P)h+='<div class="fs"><h4>Tämä projekti: '+esc(P.name)+'</h4><div class="row2"><input id="renp" value="'+esc(P.name)+'" style="border:1px solid var(--sep);border-radius:9px;padding:8px 10px;background:var(--tint)"><button class="ib nf" data-x="rename">Nimeä</button></div><div class="ibs"><button class="ib" data-x="copy">Monista</button><button class="ib" data-x="export">Vie tiedostona</button><button class="ib" data-x="reset">Tyhjennä käyttötiedot</button><button class="ib del" data-x="delete">Poista projekti</button></div><div class="help">Käyttötiedot ovat kirjoitetut tekstit, valinnat, listojen rivit ja aikajanan merkinnät. Rakenne säilyy.</div></div>';
  h+='<div class="fs"><h4>Varmuuskopio ja tuonti</h4><div class="ibs"><button class="ib" data-x="exportall">Vie kaikki projektit</button><button class="ib" data-x="import">Tuo tiedostosta</button><button class="ib" data-x="example">Avaa esimerkkiprojekti</button></div><textarea id="imptext" placeholder="…tai liitä tähän viety teksti ja paina Tuo tekstistä" style="width:100%;margin-top:8px;border:1px solid var(--sep);border-radius:9px;padding:8px;background:var(--tint);min-height:70px"></textarea><div class="ibs"><button class="ib" data-x="importtext">Tuo tekstistä</button></div><div class="help">Tiedot ovat vain tämän selaimen muistissa. Vie varmuuskopio säännöllisesti.</div></div>';
  openSheet(h);
}
$('#sheet').addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');if(o){Dt.cur=o.getAttribute('data-open');P=curProject();S.sel=null;S.undo=[];S.redo=[];S.vw=P.views[0].id;KK.tick(P,ctx());save();closeSheet();$('#stage').innerHTML='';renderAll();return;}
  var x=e.target.closest('[data-x]');if(!x)return;var a=x.getAttribute('data-x');
  switch(a){
    case 'close':closeSheet();break;
    case 'new':{var nm=$('#newpname').value.trim()||'Uusi projekti';newProject(nm);closeSheet();break;}
    case 'rename':{var v=$('#renp').value.trim();if(v){P.name=v;save();renderAll();openProjects();}break;}
    case 'copy':{var c=KK.clone(P);c.id='p'+Date.now().toString(36);c.name=P.name+' (kopio)';Dt.projects.push(c);Dt.cur=c.id;P=c;save();closeSheet();$('#stage').innerHTML='';renderAll();break;}
    case 'export':download(P.name+'.kytkoskartta.json',JSON.stringify({app:'kytkoskartta',ver:KK.VER,projects:[P]},null,1));break;
    case 'exportall':download('kytkoskartta-varmuuskopio-'+KK.iso(new Date())+'.json',JSON.stringify(Dt,null,1));break;
    case 'reset':if(confirm('Tyhjennetäänkö projektin käyttötiedot? Rakenne säilyy.')){P.st={};P.mem={};KK.tick(P,ctx());save();closeSheet();renderAll();}break;
    case 'delete':if(confirm('Poistetaanko projekti ”'+P.name+'” pysyvästi?')){Dt.projects=Dt.projects.filter(function(p){return p!==P;});Dt.cur=Dt.projects.length?Dt.projects[0].id:'';P=curProject();S.undo=[];save();closeSheet();$('#stage').innerHTML='';renderAll();}break;
    case 'import':$('#filein').click();break;
    case 'importtext':importText($('#imptext').value);break;
    case 'example':openExample();closeSheet();break;
    case 'teema':case 'df':break;
  }
});
function newProject(name){var p=KK.newProject(name);Dt.projects.push(p);Dt.cur=p.id;P=p;S.vw=p.views[0].id;S.sel=null;S.undo=[];S.redo=[];S.tab='nakyma';save();$('#stage').innerHTML='';renderAll();}
function download(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast('Tiedosto ladattu');}
function importText(t){
  var o;try{o=JSON.parse(t);}catch(e){toast('Tekstiä ei voitu lukea. Tarkista, että se on kokonaan mukana.');return;}
  var list=Array.isArray(o.projects)?o.projects:(o&&o.b&&o.lg?[o]:null);if(!list||!list.length){toast('Tekstissä ei ole projekteja.');return;}
  list.forEach(function(p){p=KK.repair(KK.clone(p));if(Dt.projects.some(function(x){return x.id===p.id;}))p.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);Dt.projects.push(p);Dt.cur=p.id;});
  P=curProject();S.vw=P.views[0].id;S.sel=null;S.undo=[];KK.tick(P,ctx());save();closeSheet();$('#stage').innerHTML='';renderAll();toast('Tuotu: '+list.length+' projekti'+(list.length>1?'a':''));
}
$('#filein').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importText(String(r.result));};r.readAsText(f);e.target.value='';});
function openSettings(){
  var c=Dt.cfg;
  var h='<h2>Asetukset<button class="tb" data-x="close">Valmis</button></h2>'+
   '<div class="fs"><h4>Ulkoasu</h4>'+fSegsS('Teema','teema',c.teema,[['auto','Automaattinen'],['light','Vaalea'],['dark','Tumma']])+'</div>'+
   '<div class="fs"><h4>Päivämäärät</h4>'+fSegsS('Muoto','df',c.df,[['pp.kk.vvvv','14.10.2026'],['pp.kk.vv','14.10.26']])+'<div class="help">Viikkonumero on aina suomalainen (ISO 8601): viikko alkaa maanantaina.</div></div>'+
   '<div class="fs"><h4>Muokkaus</h4>'+fSegsS('Kohdista ruudukkoon','snap',c.snap?'1':'0',[['1','Kyllä'],['0','Ei']])+'<div class="help">Vaihto-näppäin (⇧) ohittaa kohdistuksen raahatessa.</div></div>'+
   '<div class="help">Kytköskartta · versio '+KK.VER+'. Tiedot ovat tämän selaimen muistissa.</div>';
  openSheet(h);
}
function fSegsS(label,k,v,opts){return '<div class="f"><label>'+label+'</label><div class="segs">'+opts.map(function(o){return '<button data-cfg="'+k+'" data-v="'+o[0]+'" class="'+(String(v)===String(o[0])?'on':'')+'">'+esc(o[1])+'</button>';}).join('')+'</div></div>';}
$('#sheet').addEventListener('click',function(e){var b=e.target.closest('[data-cfg]');if(!b)return;var k=b.getAttribute('data-cfg'),v=b.getAttribute('data-v');Dt.cfg[k]=k==='snap'?v==='1':v;save();renderAll();openSettings();});

/* Tervetuloa */
$('#wcreate').addEventListener('click',function(){newProject($('#wname').value.trim()||'Ensimmäinen projekti');});
$('#wname').addEventListener('keydown',function(e){if(e.key==='Enter')$('#wcreate').click();});
$('#wexample').addEventListener('click',openExample);
$('#wimport').addEventListener('click',function(){$('#filein').click();});

/* ---------- Esimerkkiprojekti (vain pyynnöstä) ---------- */
function openExample(){
  var p=KK.newProject('Esimerkki: viikon tehtävät');var vw='v1';
  p.views.push({id:'v2',n:'Yhteenveto'});p.vseq=2;
  function U(k,props,x,y,w,h){props=props||{};props.v=props.v||vw;var b=KK.addBlock(p,k,props);b.x=x;b.y=y;if(w)b.w=w;if(h)b.h=h;return b;}
  var ot=U('nayta',{tx:'Viikon tehtävät',koko:'xl'},40,30,420,50);
  var vk=U('nayta',{koko:'s',nm:'Viikkoteksti'},40,84,420,24);
  var lst=U('lista',{tx:'Tehtävät',rivit:'Siivoa työpöytä\nVastaa viesteihin\nTilaa tarvikkeet',pvmsar:true,nm:'Tehtävät'},40,120,360,260);
  var er=U('pvm',{tx:'Eräpäivä',nm:'Eräpäivä'},430,120,260,104);
  var kiire=U('ilmo',{tx:'Eräpäivään on alle 3 päivää!',hue:1,nm:'Kiireilmoitus'},430,230,300,56);
  var valm=U('ilmo',{tx:'Kaikki tehty 🎉',hue:4,nm:'Valmisilmoitus'},430,296,300,56);
  var tila=U('kytkin',{tx:'Tarkka tila',nm:'Tarkka tila',hue:7},430,366,240,44);
  var sl=U('saadin',{tx:'Jaksaminen',min:0,max:10,start:6,nm:'Jaksaminen'},40,400,360,76);
  var b1=U('nappi',{tx:'Kirjaa tauko',beh:'kerta',nm:'Taukonappi',hue:5},430,430,160,44);
  var aj=U('aika',{tx:'Tauot',nm:'Taukoaikajana'},40,500,360,220);
  var go=U('nappi',{tx:'Yhteenvetoon →',beh:'kerta',nm:'Yhteenvetoon',hue:6},430,500,180,44);
  var sh=U('muoto',{tx:'Tämä on esimerkki. Muokkaa vapaasti tai poista koko projekti.',laji:'lappu',hue:3},700,30,220,120);
  var mk=U('merkki',{v:'v2'},20,20);
  var yt=U('nayta',{tx:'Yhteenveto',koko:'xl',v:'v2'},60,60,400,50);
  var ch=U('kaavio',{tx:'Tilanne',laji:'pylvas',v:'v2'},60,130,380,240);
  var cal=U('kalenteri',{tx:'',v:'v2'},470,130,330,310);
  var back=U('nappi',{tx:'← Takaisin',beh:'kerta',nm:'Takaisin',hue:0,v:'v2'},60,390,160,44);
  ch.sarjat=[{r:lst.id,n:'Tehty'},{r:sl.id,n:'Jaksaminen'},{r:b1.id,n:'Tauot'}];
  cal.lahteet=[er.id,lst.id,aj.id];
  // logiikka
  function N(b,x,y,g){return KK.addNode(p,b.id,x,y,g||'');}
  var ta=KK.addBlock(p,'tanaan');var nta=N(ta,40,60);
  var po=KK.addBlock(p,'pvmosa',{part:'vk'});var npo=N(po,260,60);KK.addLink(p,nta.id,'v',npo.id,'a');
  vk.tx='Tänään {#'+ta.id+'} · viikko {#'+po.id+'}';
  var ner=N(er,40,170);
  var ero=KK.addBlock(p,'lasku',{op:'sub'});var nero=N(ero,260,170);KK.addLink(p,ner.id,'v',nero.id,'a');var nta2=N(ta,40,230);KK.addLink(p,nta2.id,'v',nero.id,'b');
  var w=KK.addBlock(p,'ikkuna',{m:'and',nm:'Kiire'});var nw=N(w,450,120);nw.w=300;nw.h=150;
  var lt=KK.addBlock(p,'vert',{op:'lt',b:3});var nlt=N(lt,470,170,nw.id);KK.addLink(p,nero.id,'v',nlt.id,'a');
  var nall=N(lst,250,270);nall.not=true;KK.addLink(p,nall.id,'all',nw.id,'in');
  var nk=N(kiire,830,170);KK.addLink(p,nw.id,'v',nk.id,'nk');
  var nl2=N(lst,450,320);var nv=N(valm,830,320);
  // "kaikki rastitettu" → valmisilmoitus näkyy
  KK.addLink(p,nl2.id,'all',nv.id,'nk');
  var ntb=N(b1,40,420);var kt=KK.addBlock(p,'tee',{do:'kirjaa',o:aj.id,tx:'Tauko · jaksaminen {#'+sl.id+'}'});var nkt=N(kt,260,420);KK.addLink(p,ntb.id,'e',nkt.id,'e');
  var ngo=N(go,40,520);var sg=KK.addBlock(p,'tee',{do:'siirry',o:mk.id});var nsg=N(sg,260,520);KK.addLink(p,ngo.id,'e',nsg.id,'e');

  var ntl=N(tila,700,640);var vs=KK.addBlock(p,'vert',{op:'le',b:3,nm:'Jaksaminen vähissä'});var nsl=N(sl,700,520);var nvs=N(vs,900,520);KK.addLink(p,nsl.id,'v',nvs.id,'a');
  sl.vr={r:vs.id,m:'kun'};sl.hue2=1;
  kiire.nkt='piilo';valm.nkt='piilo';

  b1.nk={m:'kun',r:tila.id};b1.nkt='harmaa';
  Dt.projects.push(KK.repair(p));Dt.cur=p.id;P=p;S.vw='v1';S.sel=null;S.undo=[];S.tab='nakyma';
  P.st[er.id]=KK.addDays(KK.iso(new Date()),2);
  KK.tick(P,ctx());save();$('#stage').innerHTML='';renderAll();toast('Esimerkki avattu. Lukitse 🔒 ja kokeile.');
}

/* ---------- Päivä vaihtuu ---------- */
var lastDay=KK.iso(new Date());
setInterval(function(){var d=KK.iso(new Date());if(d!==lastDay&&P){lastDay=d;KK.tick(P,ctx());save();renderStage();}},30000);
window.addEventListener('resize',function(){if(P&&S.tab==='nakyma')updRulers();});
window.addEventListener('beforeunload',saveNow);

/* ---------- Käynnistys ---------- */
load();
if(P){S.vw=P.views[0].id;KK.tick(P,ctx());}
renderAll();
return {get data(){return Dt;},get P(){return P;},S:S,renderAll:renderAll,openExample:openExample,saveNow:saveNow,ev:ev,ctx:ctx};
})();
</script>
