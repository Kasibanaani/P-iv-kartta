<style>
/* Rakenne: yksi sarake puhelimelle. Kiinteä yläpalkki (kartan nimi ja polku), vieritettävä lista, alapalkissa kaksi välilehteä. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --label:#000000; --label2:#6C6C70; --sep:#C6C6C8;
  --seg:rgba(118,118,128,.14); --bar:rgba(249,249,249,.8); --red:#D70015;
  --accent:#1F7A37; --solid:#1F7A37; --on-solid:#FFFFFF; --fill:#D8EEDD; --fill2:#AEDDB9;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --sep:#38383A;
    --seg:rgba(118,118,128,.24); --bar:rgba(22,22,24,.8); --red:#FF453A;
    --accent:#30D158; --solid:#1F8A3E; --on-solid:#FFFFFF; --fill:#0F3319; --fill2:#1B5A2C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --sep:#38383A;
  --seg:rgba(118,118,128,.24); --bar:rgba(22,22,24,.8); --red:#FF453A;
  --accent:#30D158; --solid:#1F8A3E; --on-solid:#FFFFFF; --fill:#0F3319; --fill2:#1B5A2C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
button,dialog *{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
  font-size:17px;line-height:1.35;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

/* ---- yläosa: aina samankokoinen ---- */
.top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 4px) 16px 6px;background:var(--bg);border-bottom:.5px solid var(--sep)}
.bar1{display:flex;align-items:center;gap:10px;height:32px}
.title{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:32px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.title:disabled{cursor:default;opacity:1}
.title .tn{font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title svg{flex:none;width:14px;height:14px;color:var(--accent)}
.brand{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--seg);color:var(--label2)}
.stat{flex:none;font-size:12px;font-weight:700;color:var(--red)}
.ctx{display:flex;align-items:center;gap:10px;height:34px;margin-top:2px}
.ctx .path{flex:1;min-width:0;height:34px;margin:0 -16px;padding:0 16px}
.clabel{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label2)}
.path{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:220px;height:30px;padding:0 12px;border:0;border-radius:15px;background:var(--cell);font-size:15px;cursor:pointer}
.pchip b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.reset{background:none;color:var(--accent);padding:0 6px}

/* ---- sisältö ---- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 104px}
h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin:28px 0 4px;text-wrap:balance}
.panel>h2:first-child{margin-top:4px}
h3{font-size:15px;font-weight:600;color:var(--label2);margin:20px 0 8px}
.lead{font-size:17px;margin:2px 0 6px;max-width:34em}
.sub{font-size:15px;color:var(--label2);margin:0 0 12px;max-width:36em}
#use-end,#use-hidden{margin-top:12px}
.foot{font-size:13px;color:var(--label2);margin:18px 0 0;max-width:38em}
.link{background:none;border:0;padding:6px 0;font-size:15px;color:var(--accent);cursor:pointer;text-align:left}
.msg{font-size:15px;color:var(--label2);margin:10px 0}
.msg:empty{display:none}
.msg.warn{color:var(--red)}
.msgrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin:10px 0}
.msgrow .msg{margin:0}
.rows{display:grid;gap:8px}

.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:12px 16px;
  border:1.5px solid transparent;border-radius:12px;background:var(--cell);text-align:left;font-size:17px;cursor:pointer;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  transition:background-color .2s,color .2s,border-color .2s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .34s cubic-bezier(.2,.8,.2,1)}
.row>span{position:relative}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;margin-top:3px;font-size:14px;line-height:1.35;font-weight:400;color:var(--label2)}
.row .tag{flex:none;font-size:13px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.sel,.row.pick{background:var(--solid);color:var(--on-solid);font-weight:600}
.row.sel::before,.row.pick::before{width:0}
.row.sel .t small,.row.pick .t small{color:var(--on-solid);opacity:.88}
.row.sel .tag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(255,255,255,.24);color:var(--on-solid);font-weight:600}
.row.pick .tag{color:var(--on-solid);opacity:.88}
.row.rec{border-color:var(--accent);font-weight:600}
.row.rec::before{background:var(--fill2)}
.row.rec .t small{color:var(--label)}
.row.rec .tag{color:var(--label);font-weight:600}
.row.lock{background:transparent;color:var(--label2)}
.row.excl{background:transparent;color:var(--label2);border:1.5px dashed var(--sep)}
.row.excl .t{text-decoration:line-through}
.row.excl .t small,.row.lock .t small{display:none}

/* ---- ohjaimet ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:0;border-radius:12px;background:var(--seg);color:var(--accent);font-size:17px;font-weight:600;cursor:pointer}
.btn.danger{color:var(--red)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--cell);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);font-weight:600}
.sw{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px var(--cell)}

/* ---- välilehdet ---- */
nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(2,1fr);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;background:none;font-size:11px;font-weight:500;color:var(--label2);cursor:pointer}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

/* ---- alhaalta nouseva ikkuna ---- */
dialog{border:0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));margin:auto auto 0;width:100%;max-width:560px;max-height:88%;
  border-radius:14px 14px 0 0;background:var(--bg);color:var(--label);overflow-y:auto;-webkit-overflow-scrolling:touch}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
dialog h2{margin:0 0 10px}
@media (prefers-reduced-motion: reduce){.row,.row::before{transition:none}}

/* Appipajan yhteinen pintojen ja muotojen viimeistely */
:root{--app-shadow:rgba(39,61,34,.055)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
button:not(.round),input,textarea,select{font-family:inherit}
button:not(.round),.btn,.chip{border-radius:11px}
input,textarea,select{border-radius:10px}
.card,.panel,.box,.tree-card{border-radius:18px;box-shadow:0 6px 22px var(--app-shadow)}

<script>
/* ===================== LOGIIKKA =====================
   Sääntömoottori on sama kuin Päätöskartassa (versio 12). Kartta = tekijät ja kolme sääntölajia:
   1) Ei sovi yhteen (kaksisuuntainen): voittaa aina.
   2) Näkyvyys: tekijä näkyy, kun kaikki sen vaaditut on valittu tai täyttynyt ja lisäksi vähintään yksi riittävistä, jos niitä on.
   3) Suositus: korostaa vaihtoehdon, jos se muutenkin näkyy.
   Näkymätön ehto täyttyy itsestään. Pullonkaula vaaditaan kaikilta sen jälkeen listassa olevilta. */
function has(m,a,b){return !!(m&&m[a]&&m[a].indexOf(b)>=0);}
function lst(m,x){return (m&&m[x])||[];}
function kindMap(T){var k={};T.opts.forEach(function(o){k[o.id]=o.c?'c':'';});return k;}
function drop(m,a,b){if(m&&m[a]){var k=m[a].indexOf(b);if(k>=0)m[a].splice(k,1);}}
function put(m,a,b){var l=m[a]||(m[a]=[]);if(l.indexOf(b)<0)l.push(b);}
function ensure(T){['suf','req','rec','close'].forEach(function(f){if(!T[f]||typeof T[f]!=='object')T[f]={};});if(!Array.isArray(T.sel))T.sel=[];}
/* Pullonkaulat: palauttaa jokaiselle tekijälle sitä listassa edeltävät pullonkaulat */
function implied(T){var m={},acc=[];T.opts.forEach(function(o){m[o.id]=acc.slice();if(o.b)acc.push(o.id);});return m;}
/* Tekijän kaikki vaaditut: itse merkityt ja edeltävät pullonkaulat */
function reqAll(T,id,imp){var r=lst(T.req,id),e=(imp||implied(T))[id]||[];return e.length?r.concat(e.filter(function(x){return r.indexOf(x)<0;})):r;}
/* Täyttyneet ehdot. Lasketaan toistamalla, koska ehto voi täyttyä toisen ehdon kautta. */
function condMet(T,sel){var act={},met={},cs=T.opts.filter(function(o){return o.c;}),ch=true,imp=implied(T);
  sel.forEach(function(x){act[x]=1;});
  while(ch){ch=false;cs.forEach(function(o){if(met[o.id])return;var l=lst(T.suf,o.id),r=lst(T.req,o.id);if(!l.length&&!r.length)return;
    r=reqAll(T,o.id,imp);
    if(r.every(function(x){return act[x];})&&(!l.length||l.some(function(x){return act[x];}))){met[o.id]=1;act[o.id]=1;ch=true;}});}
  return met;}
function activeSet(sel,met){var a={};sel.forEach(function(x){a[x]=1;});Object.keys(met).forEach(function(c){a[c]=1;});return a;}
/* Mitä tekijän näkymisestä vielä puuttuu: vaaditut, joita ei ole, ja riittävät, jos yksikään niistä ei ole voimassa */
function missing(T,id,act,imp){var r=reqAll(T,id,imp).filter(function(x){return !act[x];}),l=lst(T.suf,id),s=(l.length&&!l.some(function(x){return act[x];}))?l.slice():[];
  return {req:r,suf:s,ok:!r.length&&!s.length};}
function evaluate(T,sel){var st={},met=condMet(T,sel),act=activeSet(sel,met),actIds=Object.keys(act),imp=implied(T);
  T.opts.forEach(function(o){var id=o.id,k=sel.indexOf(id);
    if(o.c){st[id]={s:'cond',met:!!met[id]};return;}
    if(k>=0){st[id]={s:'sel',n:k+1};return;}
    var mi=missing(T,id,act,imp),by=sel.filter(function(x){return has(T.close,x,id);});
    if(by.length){st[id]={s:'excl',by:by,vis:mi.ok};return;}
    var rc=actIds.some(function(x){return has(T.rec,x,id);});
    if(mi.ok){st[id]={s:'open',start:!reqAll(T,id,imp).length&&!lst(T.suf,id).length,rec:rc};return;}
    st[id]={s:'lock',need:mi,rec:rc};});
  return st;}
/* Siivoaa valinnat ristiriidattomiksi. Uusin valinta voittaa: jos se sulkee pois aiemman, aiempi poistuu.
   Sen jälkeen poistuvat valinnat, joiden ehdot eivät enää täyty (palataan puussa taaksepäin). */
function settle(T,sel){var kd=kindMap(T),keep=[],removed=[],i,imp=implied(T);
  for(i=sel.length-1;i>=0;i--){var x0=sel[i];if(kd[x0]!==''||keep.indexOf(x0)>=0)continue;var clash=null;
    keep.forEach(function(k){if(has(T.close,k,x0)||has(T.close,x0,k))clash=k;});
    if(clash)removed.push({id:x0,why:'excl',by:clash});else keep.unshift(x0);}
  var changed=true;
  while(changed){changed=false;var act=activeSet(keep,condMet(T,keep));
    for(i=0;i<keep.length;i++){if(!missing(T,keep[i],act,imp).ok){removed.push({id:keep[i],why:'lost'});keep.splice(i,1);changed=true;break;}}}
  return {sel:keep,removed:removed};}
/* Tekijät, joita ei voi saada näkyviin tai täyttymään millään valinnoilla (optimistinen arvio) */
function unreachable(T){var kd=kindMap(T),seen={},ch=true,imp=implied(T);
  function ex(l){return l.filter(function(x){return kd[x]!==undefined;});}
  function clash(l){for(var i=0;i<l.length;i++)for(var j=i+1;j<l.length;j++)if(has(T.close,l[i],l[j]))return true;return false;}
  function fits(x,r){return !r.some(function(y){return has(T.close,x,y);});}
  while(ch){ch=false;T.opts.forEach(function(o){if(seen[o.id])return;var l=ex(lst(T.suf,o.id)),r=ex(lst(T.req,o.id)),own=l.length+r.length;r=ex(reqAll(T,o.id,imp));
    var ok=(!o.c||own>0)&&r.every(function(x){return seen[x];})&&!clash(r)&&(!l.length||l.some(function(x){return seen[x]&&fits(x,r);}));
    if(ok){seen[o.id]=1;ch=true;}});}
  return T.opts.filter(function(o){return !seen[o.id];}).map(function(o){return o.id;});}
/* Tekee poissuluista kaksisuuntaisia ja poistaa muut säännöt pareilta, jotka eivät sovi yhteen */
function symmetrize(T){var ch=false;
  Object.keys(T.close).forEach(function(a){(T.close[a]||[]).slice().forEach(function(b){if(!has(T.close,b,a)){put(T.close,b,a);ch=true;}});});
  Object.keys(T.close).forEach(function(a){T.close[a].forEach(function(b){['suf','req','rec'].forEach(function(f){if(has(T[f],a,b)){drop(T[f],a,b);ch=true;}});});});
  return ch;}
/* Täydentää puuttuvat kentät, muuntaa vanhat tallennusmuodot ja poistaa säännöt, jotka eivät sovi tekijän lajiin.
   Vanhat muodot: T.open (a avaa ja suosittelee b:n) -> a riittää b:lle ja a suosittelee b:tä;
   T.gate (ehto vaaditaan b:lle) -> ehto on b:n vaadittu; T.cond (ehdon täyttäjät) -> ehdon riittävät, tai vaaditut jos ehto oli lajia 'all'.
   Palauttaa true, jos jotain muuttui. */
function repair(T){var ch=false;
  ['suf','req','rec','close'].forEach(function(f){if(!T[f]||typeof T[f]!=='object'){T[f]={};ch=true;}});
  if(!Array.isArray(T.sel)){T.sel=[];ch=true;}
  var old={};T.opts.forEach(function(o){old[o.id]=o.c;});
  function each(m,fn){Object.keys(m).forEach(function(a){if(Array.isArray(m[a]))m[a].forEach(function(b){fn(a,b);});});}
  if(T.cond&&typeof T.cond==='object'){each(T.cond,function(c,b){put(old[c]==='all'?T.req:T.suf,c,b);});}
  if(T.open&&typeof T.open==='object'){each(T.open,function(a,b){put(T.suf,b,a);if(!has(T.close,a,b)&&!has(T.close,b,a))put(T.rec,a,b);});}
  if(T.gate&&typeof T.gate==='object'){each(T.gate,function(c,b){put(T.req,b,c);});}
  ['cond','open','gate'].forEach(function(f){if(f in T){delete T[f];ch=true;}});
  T.opts.forEach(function(o){if(o.c&&o.c!=='any'){o.c='any';ch=true;}});
  var k=kindMap(T);
  function strip(m,valOk,keyOk){Object.keys(m).forEach(function(a){if(k[a]===undefined||(keyOk&&!keyOk(k[a]))||!Array.isArray(m[a])){delete m[a];ch=true;return;}
    var l=m[a].filter(function(b,i,ar){return b!==a&&k[b]!==undefined&&(!valOk||valOk(k[b]))&&ar.indexOf(b)===i;});if(l.length!==m[a].length){m[a]=l;ch=true;}});}
  function norm(c){return !c;}
  strip(T.suf);strip(T.req);strip(T.rec,norm);strip(T.close,norm,norm);
  Object.keys(T.req).forEach(function(x){T.req[x].forEach(function(y){if(has(T.suf,x,y)){drop(T.suf,x,y);ch=true;}});}); // sama ehto ei ole yhtä aikaa vaadittu ja riittävä
  if(symmetrize(T))ch=true;
  var n=T.sel.length;T.sel=T.sel.filter(function(x){return k[x]==='';});if(T.sel.length!==n)ch=true;
  return ch;}
function looseJson(txt){var s=String(txt||''),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<=a)return null;s=s.slice(a,b+1);
  function tryParse(x){try{return JSON.parse(x);}catch(e){return null;}}
  var o=tryParse(s);if(o)return o;
  var t=s.replace(/[“”„‟«»]/g,'"').replace(/ /g,' ');o=tryParse(t);if(o)return o; // kaarevat lainausmerkit, jos teksti on kulkenut muotoilun läpi
  return tryParse(t.replace(/,\s*([}\]])/g,'$1'));} // ylimääräinen pilkku listan lopussa
function parseTreeText(txt){var res={ok:false,kind:'',error:'',warnings:[],tree:null,stats:null},o=looseJson(txt);
  function pick(obj,keys){for(var i=0;i<keys.length;i++)if(obj[keys[i]]!==undefined&&obj[keys[i]]!==null)return obj[keys[i]];return undefined;}
  function nm(x){return String(x===undefined||x===null?'':x).trim().replace(/\s+/g,' ');}
  function arr(x){return Array.isArray(x)?x:(x===undefined||x===null||x===''?[]:[x]);}
  if(!o||typeof o!=='object'||Array.isArray(o)){res.error='Tekstistä ei löytynyt päätöspuuta. Kopioi koko koodilohko alkavasta aaltosulkeesta päättävään.';return res;}
  if(o.app==='paatoskartta'&&Array.isArray(o.trees)){res.kind='backup';res.error='Tämä on Päätöskartan koko varmuuskopio ('+o.trees.length+' päätöspuuta), ei yksittäinen kartta.';return res;}
  if(o.puu&&typeof o.puu==='object')o=o.puu;
  var items=pick(o,['tekijat','tekijät','vaihtoehdot','items']),name=nm(pick(o,['nimi','name']));
  if(!Array.isArray(items)||!items.length){res.error='Päätöspuusta puuttuu tekijöiden lista ("tekijat").';return res;}
  var T={id:'',name:(name||'Tuotu päätöspuu').slice(0,120),oseq:0,opts:[],suf:{},req:{},rec:{},close:{},sel:[]},byName={},src=[],dup=[];
  items.forEach(function(it){if(typeof it==='string')it={nimi:it};if(!it||typeof it!=='object')return;var n=nm(pick(it,['nimi','name'])).slice(0,200);
    if(!n){res.warnings.push('Tekijä ilman nimeä ohitettiin.');return;}
    var k=n.toLowerCase();if(byName[k]){if(dup.indexOf(n)<0)dup.push(n);return;}
    T.oseq++;var nt=pick(it,['huomio','note']),op={id:'o'+T.oseq,n:n,note:typeof nt==='string'?nt.trim().slice(0,2000):''};
    if(pick(it,['nakymaton','näkymätön','ehto','hidden'])===true)op.c='any';if(pick(it,['pullonkaula','bottleneck'])===true)op.b=true;
    byName[k]=op;T.opts.push(op);src.push(it);});
  if(dup.length){res.error='Sama nimi on tekijöissä kahdesti: '+dup.join(', ')+'. Jokaisella tekijällä pitää olla oma nimensä, koska säännöt viittaavat nimiin.';return res;}
  if(!T.opts.length){res.error='Päätöspuussa ei ole yhtään nimettyä tekijää.';return res;}
  function refs(own,list,label){var out=[];arr(list).forEach(function(x){var n=nm(x),t=byName[n.toLowerCase()];
      if(!t){res.warnings.push('”'+own.n+'”: kohdassa '+label+' on tuntematon nimi ”'+n+'”. Se ohitettiin.');return;}
      if(t===own){res.warnings.push('”'+own.n+'” viittaa itseensä kohdassa '+label+'. Se ohitettiin.');return;}
      if(out.indexOf(t.id)<0)out.push(t.id);});return out;}
  T.opts.forEach(function(op,i){var it=src[i],r=refs(op,pick(it,['vaatii','vaaditaan','requires']),'vaatii'),l=refs(op,pick(it,['riittaa','riittää','any']),'riittaa'),q=refs(op,pick(it,['suosittelijat','suosittelija','recommendedBy']),'suosittelijat');
    l=l.filter(function(x){if(r.indexOf(x)>=0){res.warnings.push('”'+op.n+'”: sama tekijä on sekä vaadittu että riittävä. Se jätettiin vaadituksi.');return false;}return true;});
    if(r.length)T.req[op.id]=r;if(l.length)T.suf[op.id]=l;
    if(q.length&&op.c)res.warnings.push('”'+op.n+'” on näkymätön ehto, eikä sitä voi suositella. Suosittelijat ohitettiin.');
    else q.forEach(function(x){put(T.rec,x,op.id);});});

    updateUse('Vaihdettu. Poistui: '+nm(r.removed.map(function(x){return x.id;})).join(', ')+'.');return;}
  if(st.s==='sel')r=settle(T,T.sel.filter(function(x){return x!==id;}));
  else r=settle(T,T.sel.concat([id]));
  T.sel=r.sel;undo=r.removed.length?{name:X.name,sel:prev}:null;keep(X);
  updateUse(r.removed.length?'Poistui myös: '+nm(r.removed.map(function(x){return x.id;})).join(', ')+'.':'');}
function updateUse(msg){var X=cur();if(!X)return;var T=X.T,st=evaluate(T,T.sel),hiddenN=0,openN=0;
  T.opts.forEach(function(o){var b=useBtn[o.id],s=st[o.id];if(!b)return;var tag=b.querySelector('.tag'),cls='row',f=0,t='',hide=false;
    if(s.s==='sel'){cls+=' sel';t=String(s.n);}
    else if(s.s==='open'){openN++;f=1;if(s.rec){cls+=' rec';t='suositus';}}
    else if(s.s==='lock'){cls+=' lock';t='ei vielä';hide=!showAll;}
    else{cls+=' excl';t='pois';hide=!s.vis&&!showAll;}
    b.className=cls;b.style.setProperty('--f',f);tag.textContent=t;
    b.setAttribute('aria-pressed',s.s==='sel'?'true':'false');b.hidden=hide;if(hide)hiddenN++;});
  var cx=$('ctx');cx.textContent='';
  if(T.sel.length){var strip=el('div','path');
    T.sel.forEach(function(id,k){var c=el('button','pchip');c.type='button';c.dataset.k=k;c.setAttribute('aria-label','Palaa kohtaan '+(k+1)+': '+nameOf(T,id));
      c.appendChild(el('b','',String(k+1)));c.appendChild(el('span','',nameOf(T,id)));strip.appendChild(c);});
    var rs=el('button','pchip reset','Alusta');rs.type='button';rs.dataset.reset='1';strip.appendChild(rs);cx.appendChild(strip);
    try{strip.scrollLeft=strip.scrollWidth;}catch(e){}}
  else cx.appendChild(el('span','clabel','Ei valintoja vielä'));
  var ib=$('introbox');if(ib){ib.textContent='';
    if(!T.sel.length){if(X.desc)ib.appendChild(el('p','lead',X.desc));
      ib.appendChild(el('p','sub','Valitse tilannettasi kuvaava vaihtoehto. Valinnat tuovat esiin lisää vaihtoehtoja, ja tilanteeseen suositellut korostuvat.'));}}
  var m=$('use-msg'),ub=$('use-undo'),mr=$('use-msgrow'),canUndo=!!(undo&&undo.name===X.name);
  if(m)m.textContent=msg||'';if(ub)ub.hidden=!canUndo;if(mr)mr.hidden=!(msg||canUndo);
  var eb=$('use-end');if(eb){var end=T.sel.length>0&&openN===0;eb.hidden=!end;eb.textContent=end?'Enempää valittavaa ei ole. Polun kohtaa napauttamalla voit palata taaksepäin.':'';}
  var hm=$('use-hidden'),hl=$('use-showall');
  if(hm){hm.hidden=!hiddenN;hm.textContent=hiddenN?(hiddenN===1?'1 vaihtoehto ei ole vielä näkyvissä. Se tulee esiin valintojen myötä.':hiddenN+' vaihtoehtoa ei ole vielä näkyvissä. Ne tulevat esiin valintojen myötä.'):'';}
  if(hl){hl.hidden=!(hiddenN>0||showAll);hl.textContent=showAll?'Näytä vain valittavissa olevat':'Näytä kaikki';}
}

/* ---- asetukset ja tiedot ---- */
var settingsBuilt=false,clearArmed=false;
function syncCfg(){Array.prototype.forEach.call(panels.set.querySelectorAll('[data-k]'),function(b){b.setAttribute('aria-pressed',data.cfg[b.dataset.k]===b.dataset.v?'true':'false');});}
function renderSettings(){var p=panels.set;ctxLabel('Asetukset ja tiedot');
  if(!settingsBuilt){settingsBuilt=true;
    p.appendChild(el('h2','','Ulkoasu'));
    var group=function(title,id){p.appendChild(el('h3','',title));var g=el('div','chips');g.id=id;p.appendChild(g);return g;};
    var gt=group('Teema','set-tint');TINTS.forEach(function(x){var b=el('button','chip');b.type='button';b.dataset.k='tint';b.dataset.v=x[0];var sw=el('i','sw');sw.style.background=x[2].a;b.appendChild(sw);b.appendChild(el('span','',x[1]));gt.appendChild(b);});
    var gm=group('Vaalea vai tumma','set-mode');MODES.forEach(function(x){var b=el('button','chip',x[1]);b.type='button';b.dataset.k='mode';b.dataset.v=x[0];gm.appendChild(b);});
    p.appendChild(el('h2','','Omat valintasi'));
    p.appendChild(el('p','sub','Valintasi tallentuvat vain tämän laitteen selaimeen. Mitään ei lähetetä minnekään, eivätkä muut samaa linkkiä käyttävät näe niitä.'));
    var br=el('div','btnrow');br.style.marginTop='0';var bc=el('button','btn danger','Tyhjennä valintani');bc.type='button';bc.id='clear';br.appendChild(bc);p.appendChild(br);
    var cm=el('p','msg');cm.id='clearmsg';cm.setAttribute('aria-live','polite');p.appendChild(cm);
    p.appendChild(el('h2','','Sisältö'));
    var ci=el('p','sub');ci.id='contentinfo';p.appendChild(ci);
    var ce=el('p','msg warn');ce.id='contenterr';p.appendChild(ce);
    p.appendChild(el('p','foot','Kokeiluversio. Sisältö on yleisluontoista eikä ole hoito-ohje. Hätätilanteessa soita 112.'));
    p.addEventListener('click',function(ev){var b=ev.target.closest('[data-k]');if(!b)return;data.cfg[b.dataset.k]=b.dataset.v;save();applyCfg();syncCfg();});
    bc.addEventListener('click',function(){if(!clearArmed){clearArmed=true;bc.textContent='Vahvista: tyhjennä';setTimeout(function(){clearArmed=false;bc.textContent='Tyhjennä valintani';},4000);return;}
      clearArmed=false;bc.textContent='Tyhjennä valintani';TR.forEach(function(X){X.T.sel=[];});data.sel={};undo=null;save();$('clearmsg').textContent='Valinnat tyhjennetty kaikista kartoista.';});
  }
  $('clearmsg').textContent='';
  var n=TR.length;$('contentinfo').textContent='Sisältö on kaikille sama, ja se päivittyy, kun appi avataan uudelleen. '+(n===1?'Karttoja on yksi':'Karttoja on '+n)+(CONTENT.versio?'. Sisällön versio: '+CONTENT.versio+'.':'.');
  $('contenterr').textContent=CONTENT.errors.join(' ');
  syncCfg();
}

renderHead();renderStatus();showTab('use');
})();
