<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master</title>
<meta name="theme-color" content="#FFFFFF">
<style id="mastercss">
:root{--bg:#F2F2F7;--cell:#FFFFFF;--label:#000;--label2:#6C6C70;--sep:#C6C6C8;--seg:rgba(118,118,128,.14);--seg-on:#FFFFFF;--red:#D70015;--green:#1F7A37;
  --accent:#0066E0;--solid:#0066E0;--on-solid:#fff;--fill:#D9E8FC;--hover:rgba(0,102,224,.08);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:#98989F;--sep:#38383A;--seg:rgba(118,118,128,.24);--seg-on:#636366;--red:#FF453A;--green:#30D158;
  --accent:#409CFF;--solid:#0A6FE0;--fill:#10294A;--hover:rgba(64,156,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:#98989F;--sep:#38383A;--seg:rgba(118,118,128,.24);--seg-on:#636366;--red:#FF453A;--green:#30D158;--accent:#409CFF;--solid:#0A6FE0;--fill:#10294A;--hover:rgba(64,156,255,.12);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{display:flex;flex-direction:column;height:100%;min-width:900px}
/* yläpalkki */
.mh{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;min-width:0;border-bottom:1px solid var(--sep);background:var(--cell)}
.brand{font-size:17px;font-weight:800;letter-spacing:-0.02em;margin-right:4px}
.mh select{height:32px;max-width:220px;min-width:90px;flex:0 1 auto;padding:0 8px;border:1px solid var(--sep);border-radius:8px;background:var(--bg);font-weight:600}
.mtabs{flex:none;display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--seg);margin-left:6px}
.mtabs button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:500;cursor:pointer}
.mtabs button[aria-selected="true"]{background:var(--seg-on);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mstat{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;color:var(--label2)}
.mh>.mb{flex:none;white-space:nowrap}
.mstat.dirty{color:var(--red);font-weight:600}
/* painikkeet */
.mb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap}
.mb:hover{background:var(--hover)}
.mb:active:not(:disabled){transform:scale(.96);opacity:.75}
.mb.solid{background:var(--solid);color:var(--on-solid);box-shadow:none}
.mb.danger{color:var(--red)}
.mb.small{min-height:26px;padding:0 8px;font-size:12.5px}
.mb:disabled{opacity:.4;cursor:default}
.mb.on{background:var(--solid);color:var(--on-solid);box-shadow:none}
/* runko */
.mbody{flex:1;min-height:0;display:flex}
.phonecol{flex:none;width:440px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;border-right:1px solid var(--sep);overflow-y:auto}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:9px;background:var(--seg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.phone{flex:none;width:392px;height:min(780px,calc(100vh - 190px));min-height:520px;padding:10px;border-radius:44px;background:#1d1d1f;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 2px #3a3a3c}
.pscreen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);position:relative}
.pscreen.picking [data-oid]{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:2px}
.pscreen.picking input{pointer-events:none}
.pointbar{max-width:392px;padding:8px 12px;border-radius:10px;background:var(--solid);color:var(--on-solid);font-size:13px;display:flex;gap:10px;align-items:center}
.pointbar .mb{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.ptools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.phint{max-width:392px;font-size:12px;color:var(--label2);text-align:center;margin:0}
.mpanel{flex:1;min-width:0;overflow:auto;padding:16px 20px 40px}
#v-build{display:flex;gap:16px;padding:0;overflow:hidden}
#v-build[hidden]{display:none}
.olist{flex:none;width:330px;overflow-y:auto;padding:14px 4px 40px 16px}
.insp{flex:1;min-width:0;overflow-y:auto;padding:14px 20px 60px 4px}
.addbar{display:flex;flex-wrap:wrap;gap:6px;margin:-14px -4px 12px -16px;padding:14px 4px 10px 16px;position:sticky;top:-14px;z-index:3;background:var(--bg);border-bottom:1px solid var(--sep)}
.chip .bin{font-size:11px;font-weight:700;margin-left:4px;padding:1px 6px;border-radius:6px;border:1px solid var(--sep);color:var(--label2);background:none;cursor:pointer}.chip .bin.on{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.oped{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.filled{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#v-kartta{display:flex;gap:16px;padding:0;overflow:hidden}#v-kartta[hidden]{display:none}
#v-maps{display:flex;gap:16px;padding:0;overflow:hidden}#v-maps[hidden]{display:none}
.wgrid{flex:1;min-width:0;overflow-y:auto;padding:14px 4px 40px 16px}.winfo .fld{grid-template-columns:84px 1fr}.winfo .seg{display:grid;width:100%}.winfo .seg button{white-space:normal;line-height:1.2;padding:5px 6px}.winfo{flex:none;width:370px;overflow-y:auto;padding:14px 20px 60px 4px}.winfo h2{margin:4px 0 2px}
.wcanvas{overflow:auto;max-height:calc(100vh - 280px);border-radius:10px;box-shadow:inset 0 0 0 1px var(--sep);background:var(--bg);margin-top:6px}
.wcanvas canvas{display:block;touch-action:none;cursor:crosshair}
.wpal{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.wb{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:0;border-radius:15px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);color:var(--label);cursor:pointer;font-size:13px}
.wb[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--hover);font-weight:600}.wb.add{color:var(--accent);font-weight:600}
.wb i{flex:none;width:14px;height:14px;border-radius:3px;box-sizing:border-box}.wb i.zone{border:2px solid}.wb i.hid{border:2px dashed;background:transparent!important}
.wcoord{font-size:12px;color:var(--label2);min-height:18px;margin-top:4px}
.kgrid{flex:1;min-width:0;overflow-y:auto;padding:14px 4px 40px 16px;transition:background .2s}.kgrid.editing{background:var(--hover)}
.khead{position:sticky;top:-14px;z-index:3;margin:-14px -4px 0 -16px;padding:14px 4px 10px 16px;background:var(--bg);border-bottom:1px solid var(--sep)}
.kgrid.editing .khead{background:var(--bg);border-bottom:2px solid var(--accent)}
.khead .lead{margin:0;font-size:13px;color:var(--label2)}.khead .ptitle{margin:0 0 4px}
.kbar{display:flex;align-items:center;gap:12px;margin:0 0 8px;padding:10px 12px;border-radius:12px;background:var(--solid);color:var(--on-solid)}
.kbt{flex:1;min-width:0;display:flex;flex-direction:column}.kbt small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.kbt b{font-size:17px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.kbt .badge{background:rgba(255,255,255,.22);color:var(--on-solid);border-color:var(--on-solid)}
.kbar .kstop{flex:none;background:var(--on-solid);color:var(--solid);font-weight:700;box-shadow:none}
.kinfo{flex:none;width:340px;overflow-y:auto;padding:14px 20px 60px 4px}.kinfo h2{margin:4px 0 2px}.kinfo ul{padding-left:18px;margin:6px 0}.kinfo li{margin:4px 0}
.kscr{margin:16px 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--label2);cursor:pointer}.kscr.cur{color:var(--accent)}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ktile{position:relative;border-radius:12px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep)}
.kmain{display:flex;flex-direction:column;gap:4px;width:100%;min-height:78px;padding:9px 30px 9px 10px;border:0;background:none;text-align:left;cursor:pointer;border-radius:12px}
.kmain:hover{background:var(--hover)}
.kh{display:flex;gap:7px;align-items:flex-start}.kn{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.kv{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr{margin-top:auto;font-size:12px;font-weight:700;color:var(--label2)}.kr:empty{display:none}.kr.soft{font-weight:500;font-style:italic}
.kpick{position:absolute;top:6px;right:6px;width:22px;height:22px;border:0;border-radius:6px;background:var(--seg);color:var(--label2);font-size:12px;cursor:pointer;opacity:.6}.ktile:hover .kpick,.kpick:focus-visible{opacity:1}
.ktile.target{background:var(--fill);box-shadow:inset 0 0 0 3px var(--accent)}.ktile.target .kr{color:var(--accent)}
.ktile.k-in{box-shadow:inset 0 0 0 2px var(--accent)}.ktile.k-in .kr{color:var(--accent)}
.ktile.k-out{box-shadow:inset 0 0 0 2px var(--green)}.ktile.k-out .kr{color:var(--green)}
.ktile.k-ex{box-shadow:inset 0 0 0 2px var(--red)}.ktile.k-ex .kr{color:var(--red)}
.ktile.k-agg{box-shadow:inset 0 0 0 2px #8E5BD6}.ktile.k-agg .kr{color:#8E5BD6}
.ktile.k-dim{opacity:.45}.ktile.last{outline:2px dashed var(--label2);outline-offset:2px}
.ksent{margin:6px 0;font-size:13px}.ksent.click{cursor:pointer}.ksent.click:hover{color:var(--accent)}.ksent.soft{color:var(--label2)}
.klast .row2{margin-top:4px}
.addbar .sep{flex-basis:100%;height:1px;margin:4px 0 2px;background:var(--sep)}
.mb.newscr{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--hover)}
.addbar .lbl{flex-basis:100%;font-size:12px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
.scr{margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.scr b{flex:1;min-width:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr.cur b{color:var(--accent)}
.orow{display:grid;grid-template-columns:1fr 26px 26px;gap:4px;margin-bottom:4px}
.oname{display:flex;align-items:center;gap:8px;min-height:36px;padding:5px 10px;border:0;border-radius:9px;background:var(--cell);text-align:left;cursor:pointer;min-width:0}
.oname:hover{background:var(--hover)}
.oname.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.oname .on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname .ov{flex:none;font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname .ov.err{color:var(--red);font-weight:700}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;background:var(--seg);color:var(--label2)}
.badge.choice{background:var(--fill);color:var(--accent)}
.badge.slider{background:#E6F4EA;color:#1F7A37}
.badge.text{background:#F1ECE2;color:#7A5B1F}
.badge.calc{background:#EEE6F8;color:#5B2E9C}
.badge.input{background:#E3F1F5;color:#0B6A80}
.badge.counter{background:#FCEBDD;color:#A3480A}
.badge.cond{background:transparent;color:var(--accent);border:1.5px dashed var(--accent)}
:root[data-theme="dark"] .badge.slider,.dark .badge.slider{background:#0F3319;color:#30D158}
@media (prefers-color-scheme: dark){.badge.input{background:#0D3440;color:#64D2FF}.badge.counter{background:#3D2408;color:#FF9F0A}.badge.slider{background:#0F3319;color:#30D158}.badge.text{background:#3A2E14;color:#E5C07B}.badge.calc{background:#2C1E45;color:#C8A6FF}}
.dot{flex:none;width:8px;height:8px;border-radius:4px;background:var(--sep)}
.dot.show{background:var(--green)}.dot.sel{background:var(--accent)}.dot.err{background:var(--red)}
.mv{border:0;border-radius:7px;background:var(--cell);color:var(--accent);cursor:pointer;font-size:14px}
.mv:disabled{opacity:.3;cursor:default}
/* ominaisuudet */
.insp h2{font-size:20px;margin:0 0 2px;letter-spacing:-0.02em}
.insp .kind{font-size:12px;color:var(--label2);margin:0 0 12px}
.card{background:var(--cell);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card>h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--label2)}
.fld{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:6px 0}
.fld>label{font-size:13px;color:var(--label2)}
.fld.top{align-items:start}.fld.top>label{padding-top:6px}
.fld2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.fld2 label{display:block;font-size:12px;color:var(--label2);margin-bottom:3px}
input[type=text],input[type=password],input[type=number],textarea,select.inp{width:100%;min-height:32px;padding:5px 9px;border:1px solid var(--sep);border-radius:8px;background:var(--bg);color:var(--label)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
textarea.code{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:64px}
.hint{font-size:12.5px;color:var(--label2);margin:4px 0 0}
.status{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--fill);margin:0 0 12px}
.status.bad{background:rgba(215,0,21,.1);color:var(--red)}
.status b{font-weight:700}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0;padding:6px;border-radius:9px;background:var(--bg)}
.rule select,.rule input{width:auto;min-height:28px;padding:2px 6px}
.rule input[type=number],.rule input.val{width:80px}
.rule .x{border:0;background:none;color:var(--red);font-size:16px;cursor:pointer;margin-left:auto;padding:0 6px}
.rlabel{font-size:13px;font-weight:600;margin:10px 0 2px}
.rlabel small{font-weight:400;color:var(--label2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--sep);font-size:13px}
.chip button{border:0;background:none;color:var(--red);cursor:pointer;padding:0;font-size:14px}
.fnbar{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.fnbar .mb{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:26px;padding:0 8px}
.res{font-size:14px;margin-top:6px}.res b{font-size:16px}
.res.bad{color:var(--red)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px}
.empty{color:var(--label2);font-size:14px;padding:30px 0;text-align:center}
.uses{font-size:12.5px;color:var(--label2);margin-top:6px}
.uses button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 2px;font-weight:600}
/* taulukko */
table.vt{border-collapse:separate;border-spacing:0;width:100%;background:var(--cell);border-radius:12px;overflow:hidden;font-size:13.5px}
.vt th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--label2);background:var(--cell);padding:8px 10px;border-bottom:1px solid var(--sep)}
.vt td{padding:7px 10px;border-bottom:1px solid var(--sep);vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt tr.click{cursor:pointer}.vt tr.click:hover td{background:var(--hover)}
.vt td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:600}
.vt td.f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--label2)}
.vt .err{color:var(--red);font-weight:600}
.vt tr.flash td{animation:fl .6s}
@keyframes fl{from{background:var(--fill)}to{background:transparent}}
.st-show{color:var(--green);font-weight:600}.st-hide{color:var(--label2)}.st-sel{color:var(--accent);font-weight:700}
/* seuranta */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.scard{background:var(--cell);border-radius:12px;padding:10px 14px}
.scard b{display:block;font-size:14px}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--label2);margin-top:6px}
.mrow span:last-child{color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:6px;border-radius:3px;background:var(--seg);margin-top:4px;overflow:hidden}.mbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.spark{display:block;width:100%;height:40px;margin-top:6px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent);stroke:var(--cell);stroke-width:2}
.spark .hit{fill:transparent;stroke:none}
.spark .hit:hover{fill:var(--accent);opacity:.25}
.sec{font-size:15px;font-weight:700;margin:20px 0 8px}
.ptitle{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0 0 4px}
.lead{color:var(--label2);margin:0 0 14px;max-width:60em}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.msg{font-size:13px;color:var(--label2);margin:6px 0}.msg.bad{color:var(--red)}.msg:empty{display:none}
/* tervetuloa */
.welcome{max-width:640px;margin:40px auto;padding:0 20px}
.welcome h1{font-size:30px;letter-spacing:-0.03em;margin:0 0 8px}
/* ikkuna */
dialog{border:0;border-radius:14px;padding:18px 20px;max-width:520px;width:calc(100% - 40px);background:var(--cell);color:var(--label);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 8px;font-size:17px}
dialog p{margin:0 0 12px;white-space:pre-wrap}
@media (max-width:1180px){.olist{width:280px}.fld{grid-template-columns:120px 1fr}}
.help{background:var(--cell);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.5}
.card .help{background:var(--bg);margin:12px 0 0}
.help summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-solid);font-size:12px;font-weight:800}
.help p{margin:8px 0 0;max-width:62em}
.help ul{margin:6px 0 0;padding-left:20px;max-width:62em}.help li{margin:3px 0}
.case{border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.case .rule{background:var(--cell)}
.casehd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.outrow .olbl{font-size:13px;font-weight:600}
.asf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:12.5px;color:var(--label2)}
.asf code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--label);background:var(--bg);padding:3px 6px;border-radius:6px;overflow-wrap:anywhere}
.x:disabled{opacity:.3}
.badge.wish{background:#FFE98A;color:#5C4A00}
.mb.wishb{background:#FFF4B8;color:#5C4A00;box-shadow:inset 0 0 0 1px #E5CF5E}
.ghchip{font-size:12.5px}.ghchip.bad{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.wishcard{box-shadow:inset 4px 0 0 #E5CF5E}
.wcard .wh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

</style>
<style id="uacss">
/* ===== käyttäjä-appi: sama tyyli master-esikatselussa ja julkaistussa apissa =====
   Värit, muodot, pinta, fontti ja tiheys tulevat tyylistä (STYLE.apply asettaa muuttujat). Alla olevat arvot ovat Perus-tyylin varalla. */
.ua-app{--bg:#F2F2F7;--cell:#FFFFFF;--tint:#F5F9FF;--label:#000;--label2:#636366;--sep:#C6C6C8;--line:#7C7C80;--seg:rgba(118,118,128,.14);--bar:rgba(249,249,249,.86);--red:#D70015;
  --accent:#0062D6;--solid:#0062D6;--on:#fff;--fill:#E3EEFD;--fill2:#C9DDFA;--acc2:#0062D6;
  --card:var(--cell);--ring:0 0 0 0 transparent;--shadow:0 0 0 0 transparent;
  --rr:12px;--rc:12px;--rm:15px;--ri:10px;--rb:12px;--rs:14px;--rt:3px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;--fk:1;--ls:-0.01em;--hw:700;
  --fs:17px;--rowh:50px;--rp:12px 16px;--gap:8px;--mp:10px 16px 24px;--cp:10px 16px;
  position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;background-color:var(--bg);color:var(--label);
  background-image:var(--bgimg,none);background-size:var(--bgsize,auto);background-position:var(--bgpos,0 0);background-repeat:var(--bgrep,repeat);
  font-family:var(--font);font-size:calc(var(--fs) * var(--fk));line-height:1.35;letter-spacing:var(--ls);-webkit-font-smoothing:antialiased;text-align:left}
.ua-app.dark{--bg:#000;--cell:#1C1C1E;--tint:#0E1622;--label:#fff;--label2:#9C9CA3;--sep:#38383A;--line:#7C7C82;--seg:rgba(118,118,128,.24);--bar:rgba(22,22,24,.86);--red:#FF453A}
.ua-app *,.ua-app *::before,.ua-app *::after{box-sizing:border-box}
.ua-app [hidden]{display:none!important}
.ua-app button,.ua-app input,.ua-app textarea{font:inherit;color:inherit;letter-spacing:inherit}
.ua-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px;border-bottom:.5px solid var(--sep);background:var(--bg)}
.ua-r1{display:flex;align-items:center;gap:10px;height:32px}
.ua-name{flex:1;min-width:0;font-size:19px;font-weight:var(--hw);letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ua-r2{display:flex;align-items:center;height:34px;margin-top:2px}

.ua-dnav button{border:0;background:none;height:30px;min-width:30px;padding:0 6px;font-size:18px;color:var(--accent);cursor:pointer}
.ua-dnav .ua-dl{min-width:76px;font-size:14px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.ua-dnav.past{background:var(--solid)}.ua-dnav.past button,.ua-dnav.past .ua-dl{color:var(--on)}
.ua-info{display:flex;align-items:center;gap:8px;height:36px;margin-top:4px}
.ua-itext{flex:1;min-width:0;max-height:34px;overflow:hidden;font-size:13px;line-height:17px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ua-itext b{font-weight:700}.ua-itext .ua-im{font-weight:600}
.ua-mini{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:30px;height:30px;padding:0 11px;border:0;border-radius:var(--rm);background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.ua-more{width:34px;padding:0;font-size:18px}
.ua-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--mp)}
.ua-list{position:relative;display:grid;gap:var(--gap)}
.ua-list>[data-lay="free"]{position:absolute;z-index:2;margin:0}
.ua-map.ua-mapbg{position:absolute;left:0;right:0;z-index:0;width:auto!important;border-radius:0}
.ua-main.hasbg{position:relative;z-index:1;pointer-events:none}.ua-main.hasbg .ua-list>*{pointer-events:auto}
.ua-map.noframe{box-shadow:none;background:transparent;border-radius:0}
.ua-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--rowh);padding:var(--rp);border:1.5px solid transparent;border-radius:var(--rr);background:var(--card);box-shadow:var(--ring),var(--shadow);text-align:left;font-size:1em;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background-color .2s,color .2s,border-color .2s}
.ua-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .34s cubic-bezier(.2,.8,.2,1)}
.ua-row>span{position:relative}
.ua-row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ua-row .tag{flex:none;font-size:13px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ua-row.sel{background:var(--solid);color:var(--on);font-weight:600}.ua-row.sel::before{width:0}
.ua-row.sel .tag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(255,255,255,.24);color:var(--on);font-weight:600}
.ua-row.rec{border-color:var(--accent);font-weight:600}.ua-row.rec::before{background:var(--fill2)}.ua-row.rec .tag{color:var(--label);font-weight:600}
.ua-row.lock{background:var(--seg);color:var(--label2);box-shadow:none}
.ua-row.excl{background:transparent;color:var(--label2);border:1.5px dashed var(--sep);box-shadow:none}.ua-row.excl .t{text-decoration:line-through}
.ua-row.hold{justify-content:center;text-align:center;font-weight:600}.ua-row.hold .t{flex:none}.ua-row.hold .tag:empty{display:none}
.ua-row.hold.done .tag{color:var(--accent);font-weight:700}
.ua-row{-webkit-touch-callout:none}
.ua-in{padding:var(--cp);border-radius:var(--rc);background:var(--card);box-shadow:var(--ring),var(--shadow)}
.ua-in label{display:block;margin-bottom:6px}
.ua-in input,.ua-in textarea{display:block;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--sep);border-radius:var(--ri);background:var(--bg);color:var(--label);font-size:1em;line-height:1.35}
.ua-in textarea{min-height:90px;resize:vertical}
.ua-wish{padding:8px 12px;border-radius:4px;background:#FFF4B8;color:#3D3300;font-family:-apple-system,system-ui,sans-serif;font-size:13.5px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:pointer;white-space:pre-wrap;transform:rotate(-.4deg)}
.ua-wish small{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.ua-wish.done{background:#DDF3DD;color:#103D10}
.ua-tbox{padding:9px 14px 10px;border:1px solid var(--sep);border-left:4px solid var(--accent);border-radius:var(--rt);font-size:.9em;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ua-tbox b{display:block;font-weight:600}.ua-tbox b+span{display:block;margin-top:3px}
.ua-sl{padding:var(--cp);border-radius:var(--rc);background:var(--card);box-shadow:var(--ring),var(--shadow)}
.ua-slh{display:flex;align-items:baseline;gap:10px}.ua-slh span{flex:1;min-width:0;overflow-wrap:anywhere}
.ua-slh b{flex:none;min-width:36px;padding:2px 8px;border-radius:min(8px,var(--rm));background:var(--fill);color:var(--label);text-align:center;font-variant-numeric:tabular-nums}
.ua-sl input[type=range]{display:block;width:100%;height:32px;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.ua-sle{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--label2)}
.ua-num{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:var(--cp);border-radius:var(--rc);background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.ua-num span{flex:1;min-width:0;color:var(--label2);font-size:.88em}.ua-num b{font-size:1.18em;font-variant-numeric:tabular-nums}
.ua-bar{flex-basis:100%;height:8px;border-radius:4px;background:var(--seg);overflow:hidden}.ua-bar i{display:block;height:100%;border-radius:4px;background:var(--acc2);transition:width .25s}
.ua-tabs{flex:none;display:flex;background:var(--bar);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.ua-tabs button{flex:1;min-width:0;border:0;background:none;padding:12px 4px 14px;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ua-tabs button[aria-selected="true"]{color:var(--accent)}
.ua-sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:rgba(0,0,0,.4)}
.ua-sheetbox{width:100%;max-height:85%;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:var(--rs) var(--rs) 0 0;background:var(--bg)}
.ua-sheetbox h3{margin:0 0 8px;font-size:20px;font-weight:var(--hw)}.ua-sheetbox p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.ua-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:0;border-radius:var(--rb);background:var(--solid);color:var(--on);font-size:17px;font-weight:600;cursor:pointer}
.ua-empty{color:var(--label2);font-size:15px;margin:8px 0}
@media (prefers-reduced-motion: reduce){.ua-row,.ua-row::before,.ua-bar i{transition:none}}

/* kirjaus */
.ua-log{padding:var(--cp);border-radius:var(--rc);background:var(--card);box-shadow:var(--ring),var(--shadow)}
.ua-logh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ua-logh b{font-size:1.18em;font-variant-numeric:tabular-nums}
.ua-logs{font-size:13px;color:var(--label2);margin-top:2px}
.ua-chart{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}
.ua-chart i{flex:1;max-width:18px;border-radius:3px 3px 1px 1px;background:var(--fill2)}.ua-chart i.now{background:var(--acc2)}

/* painikkeet: pehmeä (vaalea korostuspohja, ei täyttä väriä) */
.ua-app[data-nap="pehmea"] .ua-row.sel{background:var(--fill2);color:var(--label);box-shadow:inset 5px 0 0 var(--solid),var(--shadow)}
.ua-app[data-nap="pehmea"] .ua-row.sel .tag{background:var(--solid);color:var(--on)}
.ua-app[data-nap="pehmea"] .ua-row.rec::before{background:var(--fill)}
.ua-app[data-nap="pehmea"] .ua-btn{background:var(--fill);color:var(--accent)}
.ua-app[data-nap="pehmea"] .ua-mini{background:var(--fill);box-shadow:none}
.ua-app[data-nap="pehmea"] .ua-dnav{background:var(--fill)}
.ua-app[data-nap="pehmea"] .ua-dnav.past{background:var(--fill2)}
.ua-app[data-nap="pehmea"] .ua-dnav.past button,.ua-app[data-nap="pehmea"] .ua-dnav.past .ua-dl{color:var(--label)}
/* painikkeet: ääriviiva (läpinäkyvä, värillinen reuna) */
.ua-app[data-nap="aariviiva"] .ua-row:not(.rec)::before{width:0}
.ua-app[data-nap="aariviiva"] .ua-row{box-shadow:inset 0 0 0 1.5px var(--line),var(--shadow)}
.ua-app[data-nap="aariviiva"] .ua-row.sel{background:var(--card);color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent),var(--shadow)}
.ua-app[data-nap="aariviiva"] .ua-row.sel .tag{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ua-app[data-nap="aariviiva"] .ua-row.rec{border-style:dashed;box-shadow:var(--shadow)}
.ua-app[data-nap="aariviiva"] .ua-row.lock,.ua-app[data-nap="aariviiva"] .ua-row.excl{box-shadow:none}
.ua-app[data-nap="aariviiva"] .ua-btn{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.ua-app[data-nap="aariviiva"] .ua-mini{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.ua-app[data-nap="aariviiva"] .ua-dnav{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ua-app[data-nap="aariviiva"] .ua-dnav.past{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.ua-app[data-nap="aariviiva"] .ua-dnav.past button,.ua-app[data-nap="aariviiva"] .ua-dnav.past .ua-dl{color:var(--accent)}

/* palikan korostus: korostettu (iso kortti liukuvärillä) ja hiljainen (taustateksti) */
.ua-hero.ua-sl,.ua-hero.ua-in,.ua-hero.ua-log,.ua-hero.ua-num,.ua-hero.ua-tbox{background:linear-gradient(135deg,var(--fill2),var(--fill));box-shadow:var(--shadow);border:0;padding:calc(var(--gap) + 10px) 18px;font-size:1.06em}
.ua-hero.ua-tbox{border-radius:var(--rc);font-size:1em}.ua-hero.ua-tbox b{font-size:1.15em;font-weight:var(--hw)}
.ua-hero.ua-num span{color:var(--label);font-weight:600}.ua-hero.ua-num b{font-size:1.7em;font-weight:var(--hw)}.ua-hero .ua-bar{background:rgba(255,255,255,.45)}
.ua-hero .ua-logh b{font-size:1.5em}.ua-hero .ua-logs{color:var(--label)}.ua-hero.ua-sl .ua-slh span{font-weight:600}.ua-hero .ua-slh b{background:var(--cell)}
.ua-row.ua-hero{min-height:calc(var(--rowh) * 1.4);font-size:1.12em;font-weight:var(--hw)}
.ua-row.ua-hero::before{background:linear-gradient(135deg,var(--fill2),var(--fill))}
.ua-quiet.ua-sl,.ua-quiet.ua-in,.ua-quiet.ua-log,.ua-quiet.ua-num{background:transparent;box-shadow:none}
.ua-quiet.ua-num{box-shadow:none;padding-top:4px;padding-bottom:4px}
.ua-map{position:relative;overflow:hidden;border-radius:var(--rc);background:var(--bg);box-shadow:inset 0 0 0 1px var(--sep);justify-self:center;width:100%}
.ua-map canvas{display:block;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ua-quiet{font-size:.9em}.ua-quiet.ua-tbox{border:0;padding-left:2px;color:var(--label2)}.ua-quiet.ua-tbox b{color:var(--label)}
.ua-row.ua-quiet{min-height:calc(var(--rowh) * .8);font-size:.92em}.ua-row.ua-quiet:not(.sel){box-shadow:none}.ua-row.ua-quiet::before{opacity:.55}

/* liike: kevyt (oletus), eloisa ja ei liikettä */
.ua-row{transition:background-color .2s,color .2s,border-color .2s,transform .14s ease}
.ua-row:active{transform:scale(.985)}
.ua-bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ua-list.ua-enter>*{animation:ua-in .26s ease both}
.ua-sheet:not([hidden]) .ua-sheetbox{animation:ua-up .26s cubic-bezier(.2,.8,.2,1)}
.ua-sheet:not([hidden]){animation:ua-fade .2s ease}
.ua-chart i.now{animation:ua-grow .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ua-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ua-up{from{transform:translateY(40%)}to{transform:none}}
@keyframes ua-fade{from{opacity:0}to{opacity:1}}
@keyframes ua-grow{from{transform:scaleY(.2);transform-origin:bottom}to{transform:none;transform-origin:bottom}}
.ua-app[data-liike="eloisa"] .ua-row{transition:background-color .25s,color .25s,border-color .25s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.ua-app[data-liike="eloisa"] .ua-row:active{transform:scale(.95)}
.ua-app[data-liike="eloisa"] .ua-list.ua-enter>*{animation-duration:.42s;animation-delay:calc(var(--i,0) * 35ms)}
.ua-app[data-liike="eloisa"] .ua-bar i{transition:width .8s cubic-bezier(.34,1.3,.64,1)}
.ua-app[data-liike="ei"] *,.ua-app[data-liike="ei"] *::before{animation:none!important;transition:none!important}
.ua-app[data-liike="ei"] .ua-row:active{transform:none}
@media (prefers-reduced-motion: reduce){.ua-app *,.ua-app *::before{animation:none!important;transition:none!important}.ua-app .ua-row:active{transform:none}}
</style>

<body>
<div class="m">
  <header class="mh">
    <span class="brand">Master</span>
    <select id="psel" aria-label="Projekti"></select>
    <button type="button" class="mb" id="pnew" title="Uusi projekti">+ Uusi</button>
    <nav class="mtabs" id="mtabs" aria-label="Näkymät">
      <button type="button" data-v="build">Rakenne</button><button type="button" data-v="kartta">Kartta</button><button type="button" data-v="maps">Maailmat</button><button type="button" data-v="table">Arvot</button><button type="button" data-v="style">Tyyli</button><button type="button" data-v="wish">Toiveet</button><button type="button" data-v="stats">Seuranta</button><button type="button" data-v="proj">Projekti</button>
    </nav>
    <span class="mstat" id="mstat"></span>
    <button type="button" class="mb ghchip" id="mgh" hidden></button>
    <button type="button" class="mb" id="mundo" disabled>Kumoa</button>
    <button type="button" class="mb" id="mbackup" title="Vie kaikki projektit varmuuskopiotiedostoksi">Varmuuskopio</button>
  </header>
  <div class="mbody" id="mbody">
    <section class="phonecol" aria-label="Puhelinesikatselu">
      <div class="seg" id="pmode" role="group" aria-label="Puhelimen tila"><button type="button" data-m="use" aria-pressed="true">Käytä</button><button type="button" data-m="pick">Valitse muokattavaksi</button></div>
      <div class="pointbar" id="pointbar" hidden><span>Osoita kaavaan: napauta puhelimessa objektia, jonka arvo lisätään kaavaan.</span><button type="button" class="mb" id="pointdone">Valmis</button></div>
      <div class="phone"><div class="pscreen" id="pscreen"></div></div>
      <div class="ptools"><button type="button" class="mb" id="prand">Täytä satunnaisesti</button><button type="button" class="mb" id="pclear">Tyhjennä valinnat</button><button type="button" class="mb" id="pwish" aria-pressed="true">Toiveet näkyvissä</button></div>
    </section>

<script id="stylefn">
/* ===================== TYYLIT =====================
   Tyyli = kahdeksan toisistaan riippumatonta akselia: paletti, muoto, pinta, tausta, fontti, tiheys, painikkeet ja liike.
   Projektin valinta on P.cfg.style = {preset, paletti, muoto, pinta, tausta, fontti, tiheys, painikkeet, liike, oma}.
   paletti 'oma' = paletti lasketaan yhdestä väristä (oma = '#rrggbb').
   Palikan oma sävy (o.hue = 0–6) lasketaan paletista: sävyjen värit haetaan niin, että luettavuus täyttyy.
   Vanhat projektit ilman tyyliä: Perus-tyyli ja paletiksi entinen korostusväri (P.cfg.tint).
   Puuttuvat akselit (esim. vaiheen 1 tyylit ilman taustaa) täytetään tyylin oman valmiin tyylin arvoilla.
   Tiedot ovat lohkossa UA_STYLE_DATA. Viety appi saa siitä vain valitun tyylin. */
var STYLE=(function(){
'use strict';
var AX=['paletti','muoto','pinta','tausta','fontti','tiheys','painikkeet','liike'];
var AXN={paletti:'Paletti',muoto:'Muoto',pinta:'Pinta',tausta:'Tausta',fontti:'Fontti',tiheys:'Tiheys',painikkeet:'Painikkeet',liike:'Liike'};
var HUES=[[6,'Punainen'],[26,'Oranssi'],[46,'Keltainen'],[135,'Vihreä'],[176,'Turkoosi'],[212,'Sininen'],[268,'Violetti']];
function D(){return typeof UA_STYLE_DATA!=='undefined'?UA_STYLE_DATA:{pal:{},ax:{},pre:[]};}

/* ---- värit ---- */
function col(s){s=String(s||'').trim();var m;
  if(s[0]==='#'){var h=s.slice(1);if(h.length===3)h=h.replace(/./g,function(c){return c+c;});return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),1];}
  if((m=/^rgba?\(([^)]+)\)$/.exec(s))){var a=m[1].split(',').map(function(x){return parseFloat(x);});return [a[0],a[1],a[2],a.length>3?a[3]:1];}
  return [0,0,0,0];}
function hex(c){return '#'+[0,1,2].map(function(i){var v=Math.max(0,Math.min(255,Math.round(c[i])));return (v<16?'0':'')+v.toString(16);}).join('').toUpperCase();}
function over(f,b){var a=f[3];return [f[0]*a+b[0]*(1-a),f[1]*a+b[1]*(1-a),f[2]*a+b[2]*(1-a),1];}
function mix(a,b,t){var x=over(col(a),[255,255,255,1]),y=over(col(b),[255,255,255,1]);return hex([x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t]);}
function lum(c){return [0,1,2].map(function(i){var v=c[i]/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[0.2126,0.7152,0.0722][i];},0);}
function ratio(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function hsl(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l/100));var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r,g,b;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return hex([(r+m)*255,(g+m)*255,(b+m)*255]);}
function toHsl(s){var c=col(s),r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,sa=0;
  if(d){sa=d/(1-Math.abs(2*l-1));if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);}return [(h+360)%360,sa,l*100];}
/* vaaleus haetaan askel kerrallaan, kunnes kontrasti kaikkia taustoja vasten riittää */
function seek(h,s,L,dir,bgs,min){for(var i=0;i<=100;i++){var c=hsl(h,s,L),cc=col(c);if(bgs.every(function(b){return ratio(cc,b)>=min;}))return c;L+=dir;if(L<0||L>100)break;}return dir<0?'#000000':'#FFFFFF';}

/* Laskee yhden valintajoukon arvot, näkyvyydet ja ehdot. Kaikki lasketaan tarvittaessa ja muistetaan;

  function on(id){var o=C.by[id];if(!o)return false;if(o.t==='choice')return !!sset[id]||pressed(id);if(o.t==='cond')return met(id);if(FILLT[o.t])return holds(fillClause(o));return truthy(value(id));}

/* ---------- satunnainen kokeilutila ---------- */

/* ---------- päivät ja seuranta ----------

  Object.keys(days||{}).sort().forEach(function(d){if((from&&d<from)||(to&&d>to))return;var D=days[d];if(!D||(!lst(D.sel).length&&!Object.keys(D.vals||{}).length))return;

/* Yhteydet: kun A on päällä (valittu tai täyttynyt) verrattuna päiviin, joina se ei ole */

  C.P.objs.forEach(function(o){res.items[o.id]={a:{sel:0,poss:0,sum:0,cnt:0},b:{sel:0,poss:0,sum:0,cnt:0}};});
  Object.keys(days||{}).sort().forEach(function(d){if((from&&d<from)||(to&&d>to))return;var D=days[d];if(!D||(!lst(D.sel).length&&!Object.keys(D.vals||{}).length))return;
    var E=evaluate(C,D),A=E.R.on(aId)&&(C.by[aId].t!=='choice'||E.sel.indexOf(aId)>=0||E.R.pressed(aId)),k=A?'a':'b';if(A)res.withA++;else res.without++;
