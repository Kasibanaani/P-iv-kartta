<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master</title>
<meta name="theme-color" content="#FFFFFF">
<style id="mastercss">
:root{--bg:#F2F2F7;--cell:#FFFFFF;--label:#000;--label2:#6C6C70;--sep:#C6C6C8;--seg:rgba(118,118,128,.14);--seg-on:#FFFFFF;--red:#D70015;--green:#1F7A37;
  --accent:#0066E0;--solid:#0066E0;--on-solid:#fff;--fill:#D9E8FC;--hover:rgba(0,102,224,.08);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:#98989F;--sep:#38383A;--seg:rgba(118,118,128,.24);--seg-on:#636366;--red:#FF453A;--green:#30D158;
  --accent:#409CFF;--solid:#0A6FE0;--fill:#10294A;--hover:rgba(64,156,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:#98989F;--sep:#38383A;--seg:rgba(118,118,128,.24);--seg-on:#636366;--red:#FF453A;--green:#30D158;--accent:#409CFF;--solid:#0A6FE0;--fill:#10294A;--hover:rgba(64,156,255,.12);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{display:flex;flex-direction:column;height:100%;min-width:900px}
/* yläpalkki */
.mh{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;min-width:0;border-bottom:1px solid var(--sep);background:var(--cell)}
.brand{font-size:17px;font-weight:800;letter-spacing:-0.02em;margin-right:4px}
.mh select{height:32px;max-width:220px;min-width:90px;flex:0 1 auto;padding:0 8px;border:1px solid var(--sep);border-radius:8px;background:var(--bg);font-weight:600}
.mtabs{flex:none;display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--seg);margin-left:6px}
.mtabs button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:500;cursor:pointer}
.mtabs button[aria-selected="true"]{background:var(--seg-on);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mstat{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;color:var(--label2)}
.mh>.mb{flex:none;white-space:nowrap}
.mstat.dirty{color:var(--red);font-weight:600}
/* painikkeet */
.mb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 12px;border:0;border-radius:8px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap}
.mb:hover{background:var(--hover)}
.mb:active:not(:disabled){transform:scale(.96);opacity:.75}
.mb.solid{background:var(--solid);color:var(--on-solid);box-shadow:none}
.mb.danger{color:var(--red)}
.mb.small{min-height:26px;padding:0 8px;font-size:12.5px}
.mb:disabled{opacity:.4;cursor:default}
.mb.on{background:var(--solid);color:var(--on-solid);box-shadow:none}
/* runko */
.mbody{flex:1;min-height:0;display:flex}
.phonecol{flex:none;width:440px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;border-right:1px solid var(--sep);overflow-y:auto}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:9px;background:var(--seg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.phone{flex:none;width:392px;height:min(780px,calc(100vh - 190px));min-height:520px;padding:10px;border-radius:44px;background:#1d1d1f;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 2px #3a3a3c}
.pscreen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);position:relative}
.pscreen.picking [data-oid]{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:2px}
.pscreen.picking input{pointer-events:none}
.pointbar{max-width:392px;padding:8px 12px;border-radius:10px;background:var(--solid);color:var(--on-solid);font-size:13px;display:flex;gap:10px;align-items:center}
.pointbar .mb{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.ptools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.phint{max-width:392px;font-size:12px;color:var(--label2);text-align:center;margin:0}
.mpanel{flex:1;min-width:0;overflow:auto;padding:16px 20px 40px}
#v-build{display:flex;gap:16px;padding:0;overflow:hidden}
#v-build[hidden]{display:none}
.olist{flex:none;width:330px;overflow-y:auto;padding:14px 4px 40px 16px}
.insp{flex:1;min-width:0;overflow-y:auto;padding:14px 20px 60px 4px}
.addbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.addbar .lbl{flex-basis:100%;font-size:12px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
.scr{margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.scr b{flex:1;min-width:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr.cur b{color:var(--accent)}
.orow{display:grid;grid-template-columns:1fr 26px 26px;gap:4px;margin-bottom:4px}
.oname{display:flex;align-items:center;gap:8px;min-height:36px;padding:5px 10px;border:0;border-radius:9px;background:var(--cell);text-align:left;cursor:pointer;min-width:0}
.oname:hover{background:var(--hover)}
.oname.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.oname .on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname .ov{flex:none;font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname .ov.err{color:var(--red);font-weight:700}
.badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;background:var(--seg);color:var(--label2)}
.badge.choice{background:var(--fill);color:var(--accent)}
.badge.slider{background:#E6F4EA;color:#1F7A37}
.badge.text{background:#F1ECE2;color:#7A5B1F}
.badge.calc{background:#EEE6F8;color:#5B2E9C}
.badge.input{background:#E3F1F5;color:#0B6A80}
.badge.counter{background:#FCEBDD;color:#A3480A}
.badge.cond{background:transparent;color:var(--accent);border:1.5px dashed var(--accent)}
:root[data-theme="dark"] .badge.slider,.dark .badge.slider{background:#0F3319;color:#30D158}
@media (prefers-color-scheme: dark){.badge.input{background:#0D3440;color:#64D2FF}.badge.counter{background:#3D2408;color:#FF9F0A}.badge.slider{background:#0F3319;color:#30D158}.badge.text{background:#3A2E14;color:#E5C07B}.badge.calc{background:#2C1E45;color:#C8A6FF}}
.dot{flex:none;width:8px;height:8px;border-radius:4px;background:var(--sep)}
.dot.show{background:var(--green)}.dot.sel{background:var(--accent)}.dot.err{background:var(--red)}
.mv{border:0;border-radius:7px;background:var(--cell);color:var(--accent);cursor:pointer;font-size:14px}
.mv:disabled{opacity:.3;cursor:default}
/* ominaisuudet */
.insp h2{font-size:20px;margin:0 0 2px;letter-spacing:-0.02em}
.insp .kind{font-size:12px;color:var(--label2);margin:0 0 12px}
.card{background:var(--cell);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card>h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--label2)}
.fld{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:6px 0}
.fld>label{font-size:13px;color:var(--label2)}
.fld.top{align-items:start}.fld.top>label{padding-top:6px}
.fld2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.fld2 label{display:block;font-size:12px;color:var(--label2);margin-bottom:3px}
input[type=text],input[type=password],input[type=number],textarea,select.inp{width:100%;min-height:32px;padding:5px 9px;border:1px solid var(--sep);border-radius:8px;background:var(--bg);color:var(--label)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
textarea.code{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:64px}
.hint{font-size:12.5px;color:var(--label2);margin:4px 0 0}
.status{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--fill);margin:0 0 12px}
.status.bad{background:rgba(215,0,21,.1);color:var(--red)}
.status b{font-weight:700}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0;padding:6px;border-radius:9px;background:var(--bg)}
.rule select,.rule input{width:auto;min-height:28px;padding:2px 6px}
.rule input[type=number],.rule input.val{width:80px}
.rule .x{border:0;background:none;color:var(--red);font-size:16px;cursor:pointer;margin-left:auto;padding:0 6px}
.rlabel{font-size:13px;font-weight:600;margin:10px 0 2px}
.rlabel small{font-weight:400;color:var(--label2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--sep);font-size:13px}
.chip button{border:0;background:none;color:var(--red);cursor:pointer;padding:0;font-size:14px}
.fnbar{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.fnbar .mb{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:26px;padding:0 8px}
.res{font-size:14px;margin-top:6px}.res b{font-size:16px}
.res.bad{color:var(--red)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px}
.empty{color:var(--label2);font-size:14px;padding:30px 0;text-align:center}
.uses{font-size:12.5px;color:var(--label2);margin-top:6px}
.uses button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 2px;font-weight:600}
/* taulukko */
table.vt{border-collapse:separate;border-spacing:0;width:100%;background:var(--cell);border-radius:12px;overflow:hidden;font-size:13.5px}
.vt th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--label2);background:var(--cell);padding:8px 10px;border-bottom:1px solid var(--sep)}
.vt td{padding:7px 10px;border-bottom:1px solid var(--sep);vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt tr.click{cursor:pointer}.vt tr.click:hover td{background:var(--hover)}
.vt td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:600}
.vt td.f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--label2)}
.vt .err{color:var(--red);font-weight:600}
.vt tr.flash td{animation:fl .6s}
@keyframes fl{from{background:var(--fill)}to{background:transparent}}
.st-show{color:var(--green);font-weight:600}.st-hide{color:var(--label2)}.st-sel{color:var(--accent);font-weight:700}
/* seuranta */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.scard{background:var(--cell);border-radius:12px;padding:10px 14px}
.scard b{display:block;font-size:14px}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--label2);margin-top:6px}
.mrow span:last-child{color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:6px;border-radius:3px;background:var(--seg);margin-top:4px;overflow:hidden}.mbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.spark{display:block;width:100%;height:40px;margin-top:6px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent);stroke:var(--cell);stroke-width:2}
.spark .hit{fill:transparent;stroke:none}
.spark .hit:hover{fill:var(--accent);opacity:.25}
.sec{font-size:15px;font-weight:700;margin:20px 0 8px}
.ptitle{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0 0 4px}
.lead{color:var(--label2);margin:0 0 14px;max-width:60em}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.msg{font-size:13px;color:var(--label2);margin:6px 0}.msg.bad{color:var(--red)}.msg:empty{display:none}
/* tervetuloa */
.welcome{max-width:640px;margin:40px auto;padding:0 20px}
.welcome h1{font-size:30px;letter-spacing:-0.03em;margin:0 0 8px}
/* ikkuna */
dialog{border:0;border-radius:14px;padding:18px 20px;max-width:520px;width:calc(100% - 40px);background:var(--cell);color:var(--label);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 8px;font-size:17px}
dialog p{margin:0 0 12px;white-space:pre-wrap}
@media (max-width:1180px){.olist{width:280px}.fld{grid-template-columns:120px 1fr}}
.help{background:var(--cell);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13.5px;line-height:1.5}
.card .help{background:var(--bg);margin:12px 0 0}
.help summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-solid);font-size:12px;font-weight:800}
.help p{margin:8px 0 0;max-width:62em}
.help ul{margin:6px 0 0;padding-left:20px;max-width:62em}.help li{margin:3px 0}
.case{border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.case .rule{background:var(--cell)}
.casehd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.outrow .olbl{font-size:13px;font-weight:600}
.asf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:12.5px;color:var(--label2)}
.asf code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--label);background:var(--bg);padding:3px 6px;border-radius:6px;overflow-wrap:anywhere}
.x:disabled{opacity:.3}
.badge.wish{background:#FFE98A;color:#5C4A00}
.mb.wishb{background:#FFF4B8;color:#5C4A00;box-shadow:inset 0 0 0 1px #E5CF5E}
.ghchip{font-size:12.5px}.ghchip.bad{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.wishcard{box-shadow:inset 4px 0 0 #E5CF5E}
.wcard .wh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wcard .wst{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:8px;background:#FFE98A;color:#5C4A00}
.wcard.done .wst{background:#DDF3DD;color:#103D10}
.wcard .wb{margin:8px 0 0;white-space:pre-wrap;font-size:13.5px}
.wcard .wr{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--fill);font-size:13px;white-space:pre-wrap}
.wcard:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.loglist{max-height:260px;overflow:auto;margin-top:6px}
.scard .mb.small{margin-top:10px}
</style>
<style id="uacss">
/* ===== käyttäjä-appi: sama tyyli master-esikatselussa ja julkaistussa apissa ===== */
.ua-app{--bg:#F2F2F7;--cell:#FFFFFF;--label:#000;--label2:#6C6C70;--sep:#C6C6C8;--seg:rgba(118,118,128,.14);--bar:rgba(249,249,249,.86);--red:#D70015;
  --accent:#0066E0;--solid:#0066E0;--on-solid:#fff;--fill:#D9E8FC;--fill2:#AFCFFA;
  position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;text-align:left}
.ua-app.dark{--bg:#000;--cell:#1C1C1E;--label:#fff;--label2:#98989F;--sep:#38383A;--seg:rgba(118,118,128,.24);--bar:rgba(22,22,24,.86);--red:#FF453A}
.ua-app *,.ua-app *::before,.ua-app *::after{box-sizing:border-box}
.ua-app [hidden]{display:none!important}
.ua-app button,.ua-app input{font:inherit;color:inherit;letter-spacing:inherit}
.ua-top{flex:none;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px;border-bottom:.5px solid var(--sep);background:var(--bg)}
.ua-r1{display:flex;align-items:center;gap:10px;height:32px}
.ua-name{flex:1;min-width:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ua-r2{display:flex;align-items:center;height:34px;margin-top:2px}
.ua-dnav{display:inline-flex;align-items:center;height:30px;border-radius:15px;background:var(--cell);overflow:hidden}
.ua-dnav button{border:0;background:none;height:30px;min-width:30px;padding:0 6px;font-size:18px;color:var(--accent);cursor:pointer}
.ua-dnav .ua-dl{min-width:76px;font-size:14px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.ua-dnav.past{background:var(--solid)}.ua-dnav.past button,.ua-dnav.past .ua-dl{color:var(--on-solid)}
.ua-info{display:flex;align-items:center;gap:8px;height:36px;margin-top:4px}
.ua-itext{flex:1;min-width:0;max-height:34px;overflow:hidden;font-size:13px;line-height:17px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ua-itext b{font-weight:700}.ua-itext .ua-im{font-weight:600}
.ua-mini{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:30px;height:30px;padding:0 11px;border:0;border-radius:15px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--sep);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.ua-more{width:34px;padding:0;font-size:18px}
.ua-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 24px}
.ua-list{display:grid;gap:8px}
.ua-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:12px 16px;border:1.5px solid transparent;border-radius:12px;background:var(--cell);text-align:left;font-size:17px;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background-color .2s,color .2s,border-color .2s}
.ua-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:var(--fill);transition:width .34s cubic-bezier(.2,.8,.2,1)}
.ua-row>span{position:relative}
.ua-row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ua-row .tag{flex:none;font-size:13px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ua-row.sel{background:var(--solid);color:var(--on-solid);font-weight:600}.ua-row.sel::before{width:0}
.ua-row.sel .tag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(255,255,255,.24);color:var(--on-solid);font-weight:600}
.ua-row.rec{border-color:var(--accent);font-weight:600}.ua-row.rec::before{background:var(--fill2)}.ua-row.rec .tag{color:var(--label);font-weight:600}
.ua-row.lock{background:var(--seg);color:var(--label2)}
.ua-row.excl{background:transparent;color:var(--label2);border:1.5px dashed var(--sep)}.ua-row.excl .t{text-decoration:line-through}
.ua-row.hold{justify-content:center;text-align:center;font-weight:600}.ua-row.hold .t{flex:none}.ua-row.hold .tag:empty{display:none}
.ua-row{-webkit-touch-callout:none}
.ua-in{padding:10px 16px 12px;border-radius:12px;background:var(--cell)}
.ua-in label{display:block;margin-bottom:6px}
.ua-in input,.ua-in textarea{display:block;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--label);font-size:17px;line-height:1.35}
.ua-in textarea{min-height:90px;resize:vertical}
.ua-wish{padding:8px 12px;border-radius:4px;background:#FFF4B8;color:#3D3300;font-size:13.5px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:pointer;white-space:pre-wrap;transform:rotate(-.4deg)}
.ua-wish small{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.ua-wish.done{background:#DDF3DD;color:#103D10}
.ua-tbox{padding:9px 14px 10px;border:1px solid var(--sep);border-left:4px solid var(--accent);border-radius:3px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ua-tbox b{display:block;font-weight:600}.ua-tbox b+span{display:block;margin-top:3px}
.ua-sl{padding:10px 16px 8px;border-radius:12px;background:var(--cell)}
.ua-slh{display:flex;align-items:baseline;gap:10px}.ua-slh span{flex:1;min-width:0;overflow-wrap:anywhere}
.ua-slh b{flex:none;min-width:36px;padding:2px 8px;border-radius:8px;background:var(--fill);color:var(--label);text-align:center;font-variant-numeric:tabular-nums}
.ua-sl input[type=range]{display:block;width:100%;height:32px;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.ua-sle{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--label2)}
.ua-num{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:12px 16px;border-radius:12px;background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}

.ua-bar{flex-basis:100%;height:8px;border-radius:4px;background:var(--seg);overflow:hidden}.ua-bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .25s}

.ua-tabs button{flex:1;min-width:0;border:0;background:none;padding:12px 4px 14px;font-size:13px;font-weight:600;color:var(--label2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ua-tabs button[aria-selected="true"]{color:var(--accent)}
.ua-sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:rgba(0,0,0,.4)}

.ua-sheetbox h3{margin:0 0 8px;font-size:20px}.ua-sheetbox p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}

.ua-empty{color:var(--label2);font-size:15px;margin:8px 0}
@media (prefers-reduced-motion: reduce){.ua-row,.ua-row::before,.ua-bar i{transition:none}}

/* kirjaus */
.ua-log{padding:12px 16px;border-radius:14px;background:var(--cell)}

.ua-logs{font-size:13px;color:var(--label2);margin-top:2px}
.ua-chart{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}
.ua-chart i{flex:1;max-width:18px;border-radius:3px 3px 1px 1px;background:var(--fill2)}.ua-chart i.now{background:var(--accent)}

<script id="engine">
/* ===================== MOOTTORI =====================
   Projekti = ruudut ja objektit. Jokaisella objektilla on nimi ja arvo:
   - choice (valinta): arvo on o.v (oletus 1), kun valittu, muuten 0
   - slider (liukusäädin): käyttäjän asettama luku; piilossa ollessaan tyhjä (null)
   - text (teksti): luettava ruutu, jonka sisällä voi näyttää arvoja muodossa {Nimi}; ei omaa arvoa
   - calc (laskettu arvo): kaava, esim. SUMMA([Energia];[Mieliala]); voi olla piilossa tai näkyä lukuna tai palkkina
   - cond (ehto): näkymätön kyllä/ei, joka täyttyy omista ehdoistaan (1 tai 0)
   Säännöt ovat ehtolauseita {o: objekti, op: vertailu, v: luku}:
   req = kaikkien pitää päteä, suf = vähintään yhden pitää päteä (jos niitä on), hl = korostuu, kun jokin pätee.
   ex = valinnat, jotka eivät sovi yhteen (kaksisuuntainen). b = pullonkaula: kaikki sen jälkeen samassa ruudussa vaativat sen.
   Päätöskartan säännöt ovat tämän erikoistapaus: vaatii = req 'on', riittää = suf 'on', suosittelija = hl 'on'. */
var ENG=(function(){
'use strict';
var TYPES={choice:'Valinta',slider:'Liukusäädin',input:'Tekstikenttä',text:'Teksti',calc:'Laskettu arvo',counter:'Laskuri',log:'Kirjaus',cond:'Ehto',wish:'Toive tekoälylle'};
var NOTE_MAX=5000;
function lst(x){return Array.isArray(x)?x:[];}
function norm(s){return String(s===undefined||s===null?'':s).trim().replace(/\s+/g,' ').toLowerCase();}
function clean(s){return String(s===undefined||s===null?'':s).trim().replace(/\s+/g,' ');}
function byId(P){var m={};P.objs.forEach(function(o){m[o.id]=o;});return m;}
function byName(P){var m={};P.objs.forEach(function(o){m[norm(o.n)]=o;});return m;}
function num(x,d){var n=typeof x==='number'?x:parseFloat(String(x).replace(',','.'));return isFinite(n)?n:d;}

/* ---------- kaavat ---------- */
var FN={
  SUMMA:function(a){var s=0;flat(a).forEach(function(x){if(typeof x==='number')s+=x;});return s;},
  KESKIARVO:function(a){var l=flat(a).filter(function(x){return typeof x==='number';});return l.length?l.reduce(function(s,x){return s+x;},0)/l.length:null;},
  MIN:function(a){var l=flat(a).filter(function(x){return typeof x==='number';});return l.length?Math.min.apply(null,l):null;},
  MAKS:function(a){var l=flat(a).filter(function(x){return typeof x==='number';});return l.length?Math.max.apply(null,l):null;},
  JOS:function(a){return truthy(a[0])?(a.length>1?a[1]:1):(a.length>2?a[2]:null);},
  'PYÖRISTÄ':function(a){var x=nv(a[0]),d=Math.max(0,Math.min(6,Math.round(nv(a[1]))));if(x===null)return null;var p=Math.pow(10,d);return Math.round(x*p)/p;},
  ITSEISARVO:function(a){var x=nv(a[0]);return x===null?null:Math.abs(x);},
  JA:function(a){return a.length&&a.every(truthy)?1:0;},
  TAI:function(a){return a.some(truthy)?1:0;},
  EI:function(a){return truthy(a[0])?0:1;},
  'LUKUMÄÄRÄ':function(a){return flat(a).filter(truthy).length;},
  RAJAA:function(a){var x=nv(a[0]),lo=nv(a[1]),hi=nv(a[2]);if(x===null)return null;if(lo!==null&&x<lo)x=lo;if(hi!==null&&x>hi)x=hi;return x;}
};
var ALIAS={SUM:'SUMMA',AVERAGE:'KESKIARVO',KA:'KESKIARVO',MAX:'MAKS',IF:'JOS',ROUND:'PYÖRISTÄ',PYORISTA:'PYÖRISTÄ',ABS:'ITSEISARVO',AND:'JA',OR:'TAI',NOT:'EI',COUNT:'LUKUMÄÄRÄ',LUKUMAARA:'LUKUMÄÄRÄ',CLAMP:'RAJAA'};
function flat(a){var o=[];a.forEach(function(x){if(Array.isArray(x))o=o.concat(x);else o.push(x);});return o;}
function truthy(x){return typeof x==='number'?x!==0:(typeof x==='string'?x!=='':false);}
function nv(x){if(x===null||x===undefined)return null;if(typeof x==='number')return x;var n=parseFloat(String(x).replace(',','.'));return isFinite(n)?n:null;}
function n0(x){var n=nv(x);return n===null?0:n;}
function tokenize(src){var s=String(src),i=0,out=[];
  while(i<s.length){var c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9]/.test(c)){var m=/^[0-9]+(?:[.,][0-9]+)?/.exec(s.slice(i));out.push({t:'num',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue;}
    if(c==='"'||c==='”'||c==='“'){var j=i+1;while(j<s.length&&s[j]!=='"'&&s[j]!=='”'&&s[j]!=='“')j++;if(j>=s.length)throw new Error('Lainausmerkki jäi sulkematta.');out.push({t:'str',v:s.slice(i+1,j)});i=j+1;continue;}
    if(c==='['){var k=s.indexOf(']',i);if(k<0)throw new Error('Hakasulje [ jäi sulkematta.');out.push({t:'ref',v:clean(s.slice(i+1,k))});i=k+1;continue;}
    if(/[A-Za-zÅÄÖåäöÜü_]/.test(c)){var w=/^[A-Za-zÅÄÖåäöÜü_][A-Za-zÅÄÖåäöÜü_0-9]*/.exec(s.slice(i))[0];out.push({t:'id',v:w.toUpperCase()});i+=w.length;continue;}
    var two=s.slice(i,i+2);if(two==='<='||two==='>='||two==='<>'||two==='!='){out.push({t:'op',v:two==='!='?'<>':two});i+=2;continue;}
    if('+-*/^()<>=;,&'.indexOf(c)>=0){out.push({t:'op',v:c===','?';':c});i++;continue;}
    if(c==='×'||c==='·'){out.push({t:'op',v:'*'});i++;continue;}
    if(c==='÷'){out.push({t:'op',v:'/'});i++;continue;}
    if(c==='−'||c==='–'){out.push({t:'op',v:'-'});i++;continue;}
    throw new Error('Tuntematon merkki: '+c);}
  return out;}
function parse(src){var T=tokenize(src),p=0;
  if(!T.length)return null;
  function peek(v){return p<T.length&&T[p].t==='op'&&T[p].v===v;}
  function take(v){if(!peek(v))throw new Error(p<T.length?'Odotin merkkiä '+v+'.':'Kaava loppui kesken.');p++;}
  function cmp(){var l=add();while(p<T.length&&T[p].t==='op'&&['=','<>','<','>','<=','>='].indexOf(T[p].v)>=0){var o=T[p++].v;l={k:'bin',o:o,l:l,r:add()};}return l;}
  function add(){var l=mul();while(peek('+')||peek('-')||peek('&')){var o=T[p++].v;l={k:'bin',o:o,l:l,r:mul()};}return l;}
  function mul(){var l=pow();while(peek('*')||peek('/')){var o=T[p++].v;l={k:'bin',o:o,l:l,r:pow()};}return l;}
  function pow(){var l=un();if(peek('^')){p++;l={k:'bin',o:'^',l:l,r:un()};}return l;}
  function un(){if(peek('-')){p++;return {k:'neg',x:un()};}if(peek('+')){p++;return un();}return prim();}
  function prim(){if(p>=T.length)throw new Error('Kaava loppui kesken.');var t=T[p];
    if(t.t==='num'){p++;return {k:'num',v:t.v};}
    if(t.t==='str'){p++;return {k:'str',v:t.v};}
    if(t.t==='ref'){p++;return {k:'ref',n:t.v};}
    if(t.t==='id'){p++;var f=ALIAS[t.v]||t.v;if(!FN[f])throw new Error((peek('(')?'Tuntematon funktio: ':'Tuntematon sana: ')+t.v+'. Viittaukset kirjoitetaan hakasulkeisiin, esim. [Energia].');
      take('(');var a=[];if(!peek(')')){a.push(cmp());while(peek(';')){p++;a.push(cmp());}}take(')');return {k:'fn',f:f,a:a};}
    if(peek('(')){p++;var e=cmp();take(')');return e;}
    throw new Error('Odottamaton merkki: '+t.v);}
  var e=cmp();if(p<T.length)throw new Error('Ylimääräinen merkki kaavan lopussa: '+(T[p].v===undefined?'':T[p].v));return e;}
function refs(ast){var out=[];(function w(n){if(!n)return;if(n.k==='ref'){if(out.indexOf(n.n)<0)out.push(n.n);}else if(n.k==='fn')n.a.forEach(w);else if(n.k==='bin'){w(n.l);w(n.r);}else if(n.k==='neg')w(n.x);})(ast);return out;}
function evalAst(n,get){
  if(!n)return null;
  switch(n.k){
    case 'num':return n.v;
    case 'str':return n.v;
    case 'ref':return get(n.n);
    case 'neg':var x=nv(evalAst(n.x,get));return x===null?null:-x;
    case 'fn':return FN[n.f](n.a.map(function(a){return evalAst(a,get);}));
    case 'bin':var l=evalAst(n.l,get),r=evalAst(n.r,get);
      if(n.o==='&')return fmt(l)+fmt(r);
      if(['=','<>','<','>','<=','>='].indexOf(n.o)>=0){var c;
        if(typeof l==='string'||typeof r==='string'){var a1=norm(l===null?'':l),b1=norm(r===null?'':r);c=a1<b1?-1:(a1>b1?1:0);}
        else{var a2=n0(l),b2=n0(r);c=Math.abs(a2-b2)<1e-9?0:(a2<b2?-1:1);}
        return ({'=':c===0,'<>':c!==0,'<':c<0,'>':c>0,'<=':c<=0,'>=':c>=0})[n.o]?1:0;}
      var A=n0(l),B=n0(r);
      if(n.o==='+')return A+B;if(n.o==='-')return A-B;if(n.o==='*')return A*B;
      if(n.o==='/')return B===0?null:A/B;if(n.o==='^'){var pw=Math.pow(A,B);return isFinite(pw)?pw:null;}}
  return null;}
/* luvun näyttö suomalaisittain: desimaalipilkku, oletuksena enintään kaksi desimaalia */
function fmt(v,dec){if(v===null||v===undefined)return '–';if(typeof v==='string')return v;if(!isFinite(v))return '–';
  var d=(dec===undefined||dec===null||dec==='')?null:Math.max(0,Math.min(6,+dec));
  var s=d===null?String(Math.round(v*100)/100):v.toFixed(d);return s.replace('.',',').replace(/^-0(,0+)?$/,'0$1');}

/* ---------- laskenta ---------- */
/* Valmistelee projektin: tunnisteet, nimet, edeltävät pullonkaulat ruuduittain ja kaavojen jäsennys. */
function compile(P){var C={P:P,by:byId(P),name:byName(P),imp:{},ast:{},ferr:{},order:{}};
  var acc={};P.objs.forEach(function(o,i){C.order[o.id]=i;var s=o.s||'';if(!acc[s])acc[s]=[];C.imp[o.id]=acc[s].slice();if(o.b&&(o.t==='choice'||o.t==='cond'))acc[s].push(o.id);});
  P.objs.forEach(function(o){if(o.t!=='calc'||(o.mode&&o.mode!=='f'))return;try{C.ast[o.id]=parse(o.f||'');}catch(e){C.ferr[o.id]=e.message;C.ast[o.id]=null;}
    if(C.ast[o.id]){var miss=refs(C.ast[o.id]).filter(function(n){var t=C.name[norm(n)];return !t||t.t==='text';});
      if(miss.length)C.ferr[o.id]='Tuntematon nimi: '+miss.map(function(x){return '['+x+']';}).join(', ')+'.';}});
  return C;}
/* Laskee yhden valintajoukon arvot, näkyvyydet ja ehdot. Kaikki lasketaan tarvittaessa ja muistetaan;
   kehä (arvo riippuu itsestään) merkitään virheeksi ja sen arvo on tyhjä. */
function run(C,sel,vals){var memo={},busy={},cyc={},sset={},stack=[];vals=vals||{};
  sel.forEach(function(x){sset[x]=1;});
  function guard(key,fn,dflt){if(key in memo)return memo[key];
    if(busy[key]){for(var i=stack.indexOf(key);i<stack.length;i++)if(stack[i].charAt(0)==='v')cyc[stack[i].slice(2)]=1;return dflt;} // kaikki kehän jäsenet
    busy[key]=1;stack.push(key);var r=fn();stack.pop();busy[key]=0;memo[key]=r;return r;}
  function value(id){return guard('v:'+id,function(){var o=C.by[id];if(!o)return null;
    if(o.t==='choice')return sset[id]?num(o.v,1):0;
    if(o.t==='slider'){if(!ok(id))return null;var v=vals[id];return sliderVal(o,v);}
    if(o.t==='cond')return met(id)?1:0;
    if(o.t==='input'){if(!ok(id))return null;var tv=vals[id];return typeof tv==='string'?tv:'';}
    if(o.t==='counter')return counterVal(o,vals[id]);
    if(o.t==='log'){var lg=logList(vals[id]);return lg.length?lg[lg.length-1].v:null;}
    if(o.t==='calc'&&o.mode&&o.mode!=='f')return built(o);
    if(o.t==='calc'){if(C.ferr[id]||!C.ast[id])return null;
      return evalAst(C.ast[id],function(n){var t=C.name[norm(n)];return t?value(t.id):null;});}
    return null;},null);}
  /* valikoista koottu laskettu arvo: yhdistelmä tai jos–niin-rivit */
  function built(o){if(o.mode==='agg'){var a=o.agg||{},ids=lst(a.ids).filter(function(x){return C.by[x];}),vs=ids.map(value),ns=vs.map(nv).filter(function(x){return x!==null;});
      switch(a.op){case 'sum':return ns.reduce(function(s,x){return s+x;},0);case 'avg':return ns.length?ns.reduce(function(s,x){return s+x;},0)/ns.length:null;
        case 'min':return ns.length?Math.min.apply(null,ns):null;case 'max':return ns.length?Math.max.apply(null,ns):null;case 'count':return vs.filter(truthy).length;
        case 'diff':return ids.length<2?null:n0(vs[0])-n0(vs[1]);case 'mul':return ids.length?vs.reduce(function(s,x){return s*n0(x);},1):null;
        case 'div':if(ids.length<2)return null;var B=n0(vs[1]);return B===0?null:n0(vs[0])/B;}return null;}
    if(o.mode==='if'){var cs=lst(o.cases);for(var i=0;i<cs.length;i++){var w=lst(cs[i].when);if(w.length&&w.every(holds))return outv(cs[i].out);}return outv(o.els);}
    return null;}
  function outv(x){if(!x)return null;if(x.k==='num')return num(x.v,0);if(x.k==='txt')return String(x.v===undefined?'':x.v);if(x.k==='ref')return C.by[x.v]?value(x.v):null;return null;}
  function on(id){var o=C.by[id];if(!o)return false;if(o.t==='choice')return !!sset[id];if(o.t==='cond')return met(id);if(o.t==='slider'&&!ok(id))return false;return truthy(value(id));}
  function holds(c){if(!c||!C.by[c.o])return false;
    if(c.op==='on')return on(c.o);if(c.op==='off')return !on(c.o);
    if(c.op==='empty'||c.op==='filled'){var tx=value(c.o),e=tx===null||tx===undefined||String(tx).trim()==='';return c.op==='empty'?e:!e;}
    if(c.op==='has'){var hx=value(c.o),q=norm(c.v);return hx!==null&&q!==''&&norm(hx).indexOf(q)>=0;}
    var v=value(c.o);if(v===null||v===undefined)return false;
    if(typeof v==='string'||(typeof c.v==='string'&&nv(c.v)===null)){var s=norm(v),t=norm(c.v);return c.op==='eq'?s===t:(c.op==='ne'?s!==t:false);}
    var a=n0(c.v),b=n0(c.v2);
    switch(c.op){case 'ge':return v>=a-1e-9;case 'le':return v<=a+1e-9;case 'gt':return v>a+1e-9;case 'lt':return v<a-1e-9;

  box.appendChild(el('p','lead','Toive on muistiinpano tekoälylle: mitä haluat johonkin kohtaan, ruutuun tai koko projektiin. Toiveet näkyvät vain masterissa, eivät valmiissa apissa. Kun GitHub-tallennus on käytössä, pyydä keskustelussa ”käy masterin toiveet läpi”. Tekoäly lukee toiveet ja koko projektin, tekee muutokset ja kirjoittaa vastauksen toiveen alle.'));
  var r=el('div','row2');r.appendChild(segm([['auki','Avoimet'],['kaikki','Kaikki']],wishFilter,function(v){wishFilter=v;renderWishes();}));
  r.appendChild(btn('+ Toive koko projektille','mb wishb',function(){addObj('wish');}));
  if(!ghOn())r.appendChild(btn('Ota GitHub-tallennus käyttöön','mb',function(){showView('proj');var g=$('sec-gh');if(g)g.scrollIntoView({block:'start'});}));
  box.appendChild(r);
  var l=P.objs.filter(function(o){return o.t==='wish'&&(wishFilter==='kaikki'||o.status!=='tehty');});
  if(!l.length){box.appendChild(el('p','empty',wishFilter==='auki'?'Ei avoimia toiveita. Lisää toive Rakenne-välilehdeltä tai tästä.':'Ei vielä toiveita.'));return;}
  var g=el('div','sgrid');l.forEach(function(o){var c=el('div','scard wcard'+(o.status==='tehty'?' done':''));c.dataset.id=o.id;c.style.cursor='pointer';
    var h=el('div','wh');h.appendChild(el('b','',o.n));h.appendChild(el('span','wst',o.status==='tehty'?'tehty':'auki'));c.appendChild(h);
    c.appendChild(el('div','mrow',aboutText(P,o)+(o.about==='screen'?'':' · ruudulla ”'+((P.screens.filter(function(x){return x.id===o.s;})[0]||{}).n||'')+'”')));
    c.appendChild(el('p','wb',o.body||'(tyhjä)'));if(o.reply){var rp=el('p','wr');rp.appendChild(el('b','','Tekoäly: '));rp.appendChild(document.createTextNode(o.reply));c.appendChild(rp);}
    c.addEventListener('click',function(){select(o.id);});g.appendChild(c);});box.appendChild(g);}

function renderWelcome(){var b=$('mempty');b.textContent='';var w=el('div','welcome');w.appendChild(el('h1','','Master'));
  w.appendChild(el('p','lead','Rakennusympäristö omille apeille. Projektissa on ruutuja ja niillä valintoja, liukusäätimiä, tekstejä, laskettuja arvoja ja näkymättömiä ehtoja. Säännöt ja kaavat kytkevät ne toisiinsa, ja puhelinsimulaatio näyttää heti, miltä appi toimii. Valmiin projektin voi viedä omaksi käyttäjä-apikseen.'));
  var r=el('div','row2'),i=el('input');i.type='text';i.placeholder='Projektin nimi';i.style.maxWidth='320px';i.setAttribute('aria-label','Projektin nimi');r.appendChild(i);
  function mk(){addProject(E.newProject(E.clean(i.value)||'Uusi projekti'));}
  r.appendChild(btn('Luo projekti','mb solid',mk));i.addEventListener('keydown',function(ev){if(ev.key==='Enter')mk();});w.appendChild(r);
  w.appendChild(el('p','hint','Haluatko ensin katsoa, miten mekaniikat toimivat?'));var r2=el('div','row2');r2.appendChild(btn('Luo esimerkkiprojekti','mb',function(){addProject(example());}));w.appendChild(r2);
  w.appendChild(el('p','hint','Päätöskartan puun voi tuoda projektiksi, kun ensimmäinen projekti on luotu: Projekti → Tekstinä ja tuonti.'));b.appendChild(w);}

/* ---- käynnistys ---- */
$('mtabs').addEventListener('click',function(ev){var b=ev.target.closest('[data-v]');if(b)showView(b.dataset.v);});
$('psel').addEventListener('change',function(){data.cur=$('psel').value;selId=null;persist();renderAll();ghCheck(proj());});
$('pnew').addEventListener('click',function(){ask('Uusi projekti','',[['Luo','solid'],['Luo esimerkkiprojekti',''],['Peru','']],'').then(function(r){if(!r||r.b==='Peru')return;if(r.b==='Luo esimerkkiprojekti')addProject(example());else addProject(E.newProject(E.clean(r.v)||'Uusi projekti'));});});
$('mbackup').addEventListener('click',exportAll);
$('mundo').addEventListener('click',undo);
document.addEventListener('keydown',function(ev){if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&(ev.key==='z'||ev.key==='Z')){var t=ev.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;ev.preventDefault();undo();}});
$('pmode').addEventListener('click',function(ev){var b=ev.target.closest('[data-m]');if(b)setMode(b.dataset.m);});
$('pointdone').addEventListener('click',function(){setMode('use');var t=pointTarget;pointTarget=null;if(t&&document.body.contains(t))t.focus();});
$('prand').addEventListener('click',function(){var P=proj();if(!P)return;var C=E.compile(P),s=E.randomState(C);if(P.cfg.days){var d=ua.day();P.days[d]=s;}else P.state=s;dirty();phone();});
$('pwish').addEventListener('click',function(){showWishes=!showWishes;try{localStorage.setItem('master:toiveet',showWishes?'1':'0');}catch(e){}syncWishBtn();phone();});
function syncWishBtn(){var b=$('pwish');b.textContent=showWishes?'Toiveet näkyvissä':'Toiveet piilossa';b.setAttribute('aria-pressed',showWishes?'true':'false');}syncWishBtn();
$('mgh').addEventListener('click',function(){var P=proj(),g=P?ghMeta(P):null;if(g&&g.remote){ask('GitHubissa on uudempi versio','Siellä on todennäköisesti tekoälyn tekemiä muutoksia. Haetaanko GitHubin versio? Tämän projektin tallentamattomat muutokset korvautuvat (Kumoa palauttaa ne). Voit myös tallentaa oman versiosi sen päälle.',[['Hae GitHubin versio','solid'],['Tallenna omani päälle','danger'],['Peru','']]).then(function(r){if(!r)return;if(r.b==='Hae GitHubin versio')ghPull(P);else if(r.b==='Tallenna omani päälle')ghPush(P,true);});return;}
  showView('proj');var s=$('sec-gh');if(s)s.scrollIntoView({block:'start'});});
document.addEventListener('visibilitychange',function(){if(!document.hidden)ghCheck(proj());});
$('pclear').addEventListener('click',
function(){var P=proj();if(!P)return;if(P.cfg.days)delete P.days[ua.day()];else P.state={sel:[],vals:{}};dirty();phone();});
renderAll();renderUndo();if(ghOn()){ghCheck(proj()).then(ghNew);}
window.MASTER={data:data,gh:gh,ghPush:function(){return ghPush(proj());},ghCheck:function(){return ghCheck(proj());},ghNew:function(){return ghNew();},appHtml:function(){return appHtml(proj());},example:example};
})();
</script>
